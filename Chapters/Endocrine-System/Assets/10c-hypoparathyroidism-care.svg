<svg xmlns="http://www.w3.org/2000/svg" width="780" height="440" viewBox="0 0 780 440" role="img" aria-labelledby="t d"><title id="t">Chronic hypoparathyroidism care map</title><desc id="d">PTH deficiency affects calcium, phosphate and kidney handling. Conventional treatment and selected PTH replacement require biochemical monitoring.</desc><rect width="780" height="440" rx="16" fill="#f5f8fc"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#183248"><text x="390" y="35" font-size="23" font-weight="bold">Chronic hypoparathyroidism: balance and safety</text><rect x="240" y="55" width="300" height="54" rx="9" fill="#dce7f5" stroke="#52749a"/><text x="390" y="87" font-size="19">Inadequate PTH action</text><path d="M390 109 V138 M135 138 H645 M135 138 V160 M390 138 V160 M645 138 V160" fill="none" stroke="#52749a" stroke-width="3"/><g font-size="15"><rect x="15" y="160" width="240" height="80" rx="10" fill="#f4e5da" stroke="#a76d4b"/><text x="135" y="190" font-weight="bold">Calcium</text><text x="135" y="214">Low blood calcium risk</text><rect x="270" y="160" width="240" height="80" rx="10" fill="#e1e9f6" stroke="#52749a"/><text x="390" y="190" font-weight="bold">Phosphate</text><text x="390" y="214">Reduced renal excretion</text><rect x="525" y="160" width="240" height="80" rx="10" fill="#dcefe1" stroke="#528567"/><text x="645" y="190" font-weight="bold">Kidney</text><text x="645" y="214">Urinary calcium loss risk</text></g><path d="M135 240 V267 H645 V240 M390 240 V292" fill="none" stroke="#52749a" stroke-width="3"/><rect x="100" y="292" width="580" height="60" rx="10" fill="#fff" stroke="#52749a"/><text x="390" y="318" font-size="18" font-weight="bold">Individualized prescribed replacement</text><text x="390" y="340" font-size="15">Control symptoms and avoid excess calcium exposure</text><path d="M390 352 V374" stroke="#52749a" stroke-width="3"/><rect x="90" y="374" width="600" height="46" rx="9" fill="#e9e0f5" stroke="#80659f"/><text x="390" y="402" font-size="16" font-weight="bold">Monitor calcium, phosphate, magnesium, kidney and urine</text></g></svg>
