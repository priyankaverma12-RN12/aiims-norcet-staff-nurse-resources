<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" role="img" aria-labelledby="t d"><title id="t">Cushing disease evaluation and care map</title><desc id="d">Establish endogenous cortisol excess, classify by ACTH, localize source, monitor complications, treatment response and recurrence.</desc><rect width="760" height="440" rx="14" fill="#f7f8fb"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#20344b"><text x="380" y="34" font-size="24" font-weight="bold">Cushing disease: source to follow-up</text><rect x="180" y="55" width="400" height="55" rx="9" fill="#dce6f4" stroke="#57739b"/><text x="380" y="88" font-size="18">Confirmed endogenous cortisol excess</text><path d="M380 110 V140 M190 140 H570 M190 140 V162 M570 140 V162" stroke="#57739b" stroke-width="3" fill="none"/><rect x="25" y="162" width="330" height="80" rx="9" fill="#e1f0e6" stroke="#528567"/><text x="190" y="191" font-size="18" font-weight="bold">ACTH-dependent</text><text x="190" y="216" font-size="16">Pituitary versus ectopic source</text><rect x="405" y="162" width="330" height="80" rx="9" fill="#f4e5da" stroke="#ab7950"/><text x="570" y="191" font-size="18" font-weight="bold">ACTH-independent</text><text x="570" y="216" font-size="16">Evaluate adrenal source</text><path d="M190 242 V267 H380 M570 242 V267 H380 M380 267 V292" stroke="#57739b" stroke-width="3" fill="none"/><rect x="85" y="292" width="590" height="120" rx="9" fill="#fff" stroke="#57739b"/><text x="380" y="324" font-size="19" font-weight="bold">Individualized treatment and nursing surveillance</text><text x="380" y="354" font-size="16">Thrombosis, infection, glucose, BP, electrolytes</text><text x="380" y="381" font-size="16">Replacement safety, recovery and recurrence testing</text></g></svg>
