<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img" aria-labelledby="t d"><title id="t">Medullary and anaplastic thyroid cancer care</title><desc id="d">Histology guides separate assessment pathways, biomarkers, treatment decisions and supportive care.</desc><rect width="760" height="400" rx="14" fill="#f5f8fc"/><g text-anchor="middle" font-family="Arial,sans-serif" fill="#173047"><text x="380" y="35" font-size="23" font-weight="bold">Two distinct thyroid malignancy pathways</text><rect x="130" y="55" width="500" height="55" rx="9" fill="#dce7f5" stroke="#52749a"/><text x="380" y="88" font-size="18">Specialist diagnosis and histology</text><path d="M380 110 V138 M190 138 H570 M190 138 V160 M570 138 V160" fill="none" stroke="#52749a" stroke-width="3"/><rect x="20" y="160" width="340" height="100" rx="9" fill="#dcefe1" stroke="#528567"/><text x="190" y="189" font-size="18" font-weight="bold">Medullary carcinoma</text><text x="190" y="214" font-size="15">Calcitonin, CEA, RET assessment</text><text x="190" y="239" font-size="15">No conventional RAI for MTC</text><rect x="400" y="160" width="340" height="100" rx="9" fill="#f4e5da" stroke="#a76d4b"/><text x="570" y="189" font-size="18" font-weight="bold">Anaplastic carcinoma</text><text x="570" y="214" font-size="15">Urgent staging and airway review</text><text x="570" y="239" font-size="15">Expedited molecular testing</text><path d="M190 260 V285 H570 V260 M380 285 V305" fill="none" stroke="#52749a" stroke-width="3"/><rect x="90" y="305" width="580" height="70" rx="9" fill="#fff" stroke="#52749a"/><text x="380" y="333" font-size="18" font-weight="bold">Individualized multidisciplinary care</text><text x="380" y="356" font-size="15">Symptoms, clinical response and patient priorities</text></g></svg>
