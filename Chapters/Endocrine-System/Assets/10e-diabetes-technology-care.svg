<svg xmlns="http://www.w3.org/2000/svg" width="780" height="450" viewBox="0 0 780 450" role="img" aria-labelledby="t d"><title id="t">Insulin-device safety pathway</title><desc id="d">Assess delivery and monitoring, coordinate backup coverage and review glucose patterns and alerts.</desc><rect width="780" height="450" rx="16" fill="#f5f8fc"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#183248"><text x="390" y="34" font-size="23" font-weight="bold">Diabetes technology: safety checks</text><rect x="210" y="55" width="360" height="54" rx="9" fill="#dce7f5" stroke="#52749a"/><text x="390" y="88" font-size="18">Pump + CGM + individual care plan</text><path d="M390 109 V140 M135 140 H645 M135 140 V163 M390 140 V163 M645 140 V163" fill="none" stroke="#52749a" stroke-width="3"/><g font-size="15"><rect x="15" y="163" width="240" height="105" rx="10" fill="#f4d9d5" stroke="#a35a54"/><text x="135" y="190" font-weight="bold">Delivery failure?</text><text x="135" y="214">Check set and insulin</text><text x="135" y="240">Glucose / ketone plan</text><rect x="270" y="163" width="240" height="105" rx="10" fill="#e1e9f6" stroke="#52749a"/><text x="390" y="190" font-weight="bold">Sensor or alert issue?</text><text x="390" y="214">Verify device mode</text><text x="390" y="240">Backup monitoring</text><rect x="525" y="163" width="240" height="105" rx="10" fill="#dcefe1" stroke="#528567"/><text x="645" y="190" font-weight="bold">Procedure / admission?</text><text x="645" y="214">Check safe device use</text><text x="645" y="240">Plan insulin coverage</text></g><path d="M135 268 V294 H645 V268 M390 294 V316" fill="none" stroke="#52749a" stroke-width="3"/><rect x="80" y="316" width="620" height="58" rx="9" fill="#fff" stroke="#52749a"/><text x="390" y="340" font-size="17" font-weight="bold">Coordinate prescribed backup and follow-up</text><text x="390" y="361" font-size="15">Avoid insulin gaps and unintended overlap</text><path d="M390 374 V396" stroke="#52749a" stroke-width="3"/><rect x="100" y="396" width="580" height="35" rx="9" fill="#f4d9d5" stroke="#a35a54"/><text x="390" y="418" font-size="15" font-weight="bold">Escalate elevated ketones and acute deterioration</text></g></svg>
