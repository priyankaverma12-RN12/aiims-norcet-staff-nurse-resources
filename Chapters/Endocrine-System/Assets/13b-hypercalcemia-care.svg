<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" role="img" aria-labelledby="t d"><title id="t">Hypercalcemia nursing pathway</title><desc id="d">Determine the cause, assess acute severity, coordinate hydration and mechanism-specific treatment, and monitor response.</desc><rect width="760" height="380" rx="12" fill="#f5f8fc"/><g text-anchor="middle" font-family="Arial,sans-serif" fill="#183248"><text x="380" y="34" font-size="23" font-weight="bold">Hypercalcemia: clinical care</text><rect x="105" y="54" width="550" height="54" rx="8" fill="#dce7f5" stroke="#52749a"/><text x="380" y="77" font-size="18">Confirm calcium and evaluate PTH</text><text x="380" y="97" font-size="15">Assess symptoms, volume and renal function</text><path d="M380 108 V134 M190 134 H570 M190 134 V155 M570 134 V155" fill="none" stroke="#52749a" stroke-width="3"/><rect x="20" y="155" width="340" height="104" rx="9" fill="#f4e5da" stroke="#a76d4b"/><text x="190" y="184" font-size="18" font-weight="bold">Urgent supportive care</text><text x="190" y="210" font-size="15">Individualized fluid replacement</text><text x="190" y="235" font-size="15">ECG and organ-function monitoring</text><rect x="400" y="155" width="340" height="104" rx="9" fill="#dcefe1" stroke="#528567"/><text x="570" y="184" font-size="18" font-weight="bold">Mechanism-specific care</text><text x="570" y="210" font-size="15">Antiresorptive or other therapy</text><text x="570" y="235" font-size="15">Address underlying cause</text><path d="M190 259 V282 H570 V259 M380 282 V301" fill="none" stroke="#52749a" stroke-width="3"/><rect x="100" y="301" width="560" height="58" rx="8" fill="#fff" stroke="#52749a"/><text x="380" y="326" font-size="18" font-weight="bold">Reassess response and prevent recurrence</text><text x="380" y="347" font-size="15">Calcium trends, adverse effects and follow-up</text></g></svg>
