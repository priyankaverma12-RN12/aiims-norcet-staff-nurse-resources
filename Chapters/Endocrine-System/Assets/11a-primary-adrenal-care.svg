<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img" aria-labelledby="t d"><title id="t">Primary adrenal insufficiency care</title><desc id="d">Adrenal cortical failure causes glucocorticoid and mineralocorticoid deficiencies. Assess and replace both when indicated, with emergency and long-term planning.</desc><rect width="760" height="400" rx="14" fill="#f5f8fc"/><g text-anchor="middle" font-family="Arial,sans-serif" fill="#183248"><text x="380" y="35" font-size="23" font-weight="bold">Primary adrenal insufficiency</text><rect x="225" y="55" width="310" height="50" rx="9" fill="#dce7f5" stroke="#52749a"/><text x="380" y="86" font-size="18">Adrenal cortical dysfunction</text><path d="M380 105 V135 M190 135 H570 M190 135 V155 M570 135 V155" fill="none" stroke="#52749a" stroke-width="3"/><rect x="20" y="155" width="340" height="105" rx="9" fill="#f4e5da" stroke="#a76d4b"/><text x="190" y="185" font-size="18" font-weight="bold">Cortisol deficiency</text><text x="190" y="213" font-size="16">Prescribed glucocorticoid</text><text x="190" y="239" font-size="16">Stress coverage and symptoms</text><rect x="400" y="155" width="340" height="105" rx="9" fill="#dcefe1" stroke="#528567"/><text x="570" y="185" font-size="18" font-weight="bold">Aldosterone deficiency</text><text x="570" y="213" font-size="16">Mineralocorticoid when indicated</text><text x="570" y="239" font-size="16">BP, electrolytes and volume</text><path d="M190 260 V285 H570 V260 M380 285 V305" fill="none" stroke="#52749a" stroke-width="3"/><rect x="100" y="305" width="560" height="70" rx="9" fill="#fff" stroke="#52749a"/><text x="380" y="334" font-size="18" font-weight="bold">Long-term safety and emergency plan</text><text x="380" y="358" font-size="15">Kit skills, supplies, follow-up and timely escalation</text></g></svg>
