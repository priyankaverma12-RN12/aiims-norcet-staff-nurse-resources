<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img" aria-labelledby="t d"><title id="t">Graves disease care map</title><desc id="d">Confirm etiology, assess hormone control and eye disease separately, then coordinate treatment and surveillance.</desc><rect width="760" height="400" rx="14" fill="#f5f8fc"/><g text-anchor="middle" font-family="Arial,sans-serif" fill="#173047"><text x="380" y="35" font-size="24" font-weight="bold">Graves disease: integrated care</text><rect x="130" y="55" width="500" height="55" rx="9" fill="#dce7f5" stroke="#52749a"/><text x="380" y="88" font-size="18">Confirm thyroid function and autoimmune cause</text><path d="M380 110 V138 M190 138 H570 M190 138 V160 M570 138 V160" fill="none" stroke="#52749a" stroke-width="3"/><rect x="20" y="160" width="340" height="100" rx="9" fill="#dcefe1" stroke="#528567"/><text x="190" y="189" font-size="18" font-weight="bold">Thyroid management</text><text x="190" y="214" font-size="15">Drug safety and biochemical response</text><text x="190" y="239" font-size="15">Remission or definitive treatment</text><rect x="400" y="160" width="340" height="100" rx="9" fill="#f4e5da" stroke="#a76d4b"/><text x="570" y="189" font-size="18" font-weight="bold">Eye disease assessment</text><text x="570" y="214" font-size="15">Activity, severity and vision risk</text><text x="570" y="239" font-size="15">Smoking cessation and protection</text><path d="M190 260 V285 H570 V260 M380 285 V305" fill="none" stroke="#52749a" stroke-width="3"/><rect x="90" y="305" width="580" height="70" rx="9" fill="#fff" stroke="#52749a"/><text x="380" y="333" font-size="18" font-weight="bold">Coordinate treatment and follow-up</text><text x="380" y="356" font-size="15">Escalate serious drug effects or visual deterioration</text></g></svg>
