<svg xmlns="http://www.w3.org/2000/svg" width="780" height="450" viewBox="0 0 780 450" role="img" aria-labelledby="t d"><title id="t">Thyroiditis and amiodarone dysfunction pathway</title><desc id="d">Differentiate infection, destructive release and increased synthesis. Tailor treatment and monitor endocrine and cardiac status.</desc><rect width="780" height="450" rx="16" fill="#f5f8fc"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#183248"><text x="390" y="34" font-size="23" font-weight="bold">Thyroiditis: identify the mechanism</text><rect x="230" y="55" width="320" height="54" rx="9" fill="#dce7f5" stroke="#52749a"/><text x="390" y="88" font-size="18">Symptoms + thyroid tests + context</text><path d="M390 109 V140 M135 140 H645 M135 140 V163 M390 140 V163 M645 140 V163" fill="none" stroke="#52749a" stroke-width="3"/><g font-size="15"><rect x="15" y="163" width="240" height="105" rx="10" fill="#f4d9d5" stroke="#a35a54"/><text x="135" y="190" font-weight="bold">Suspected infection</text><text x="135" y="214">Toxicity / focal collection</text><text x="135" y="240">Urgent assessment</text><rect x="270" y="163" width="240" height="105" rx="10" fill="#e1e9f6" stroke="#52749a"/><text x="390" y="190" font-weight="bold">Destructive release</text><text x="390" y="214">Subacute / AIT type 2</text><text x="390" y="240">Phase-specific care</text><rect x="525" y="163" width="240" height="105" rx="10" fill="#dcefe1" stroke="#528567"/><text x="645" y="190" font-weight="bold">Increased synthesis</text><text x="645" y="214">AIT type 1</text><text x="645" y="240">Specialist treatment</text></g><path d="M135 268 V294 H645 V268 M390 268 V316" fill="none" stroke="#52749a" stroke-width="3"/><rect x="80" y="316" width="620" height="58" rx="9" fill="#fff" stroke="#52749a"/><text x="390" y="340" font-size="17" font-weight="bold">Reassess hormone phase and symptoms</text><text x="390" y="361" font-size="15">Cardiac status, medicine safety and follow-up</text><path d="M390 374 V396" stroke="#52749a" stroke-width="3"/><rect x="100" y="396" width="580" height="35" rx="9" fill="#f4e5da" stroke="#a76d4b"/><text x="390" y="418" font-size="15" font-weight="bold">Escalate systemic toxicity or cardiac deterioration</text></g></svg>
