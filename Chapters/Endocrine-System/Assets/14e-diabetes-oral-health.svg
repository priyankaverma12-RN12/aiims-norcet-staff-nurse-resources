<svg xmlns="http://www.w3.org/2000/svg" width="760" height="445" viewBox="0 0 760 445" role="img" aria-labelledby="t d"><title id="t">Diabetes oral health care</title><desc id="d">Diagram connecting oral assessment, routine prevention and procedure coordination.</desc><rect width="760" height="445" fill="#f8fafc"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#142b3b"><text x="380" y="33" font-size="23" font-weight="bold">Diabetes and oral health</text><rect x="210" y="54" width="340" height="70" rx="10" fill="#dbeafe" stroke="#2563eb"/><text x="380" y="80" font-size="17">Glucose and saliva changes</text><text x="380" y="104" font-size="15">can affect oral tissues and healing</text><path d="M380 124 V148 H130 V172 M380 148 V172 M380 148 H630 V172" stroke="#64748b" stroke-width="2" fill="none"/><g font-size="15"><rect x="18" y="172" width="224" height="120" rx="10" fill="#fef3c7" stroke="#b45309"/><text x="130" y="198" font-weight="bold">Assess</text><text x="130" y="224">Gum bleeding / recession</text><text x="130" y="247">Dry mouth / white patches</text><text x="130" y="270">Chewing difficulties</text><rect x="268" y="172" width="224" height="120" rx="10" fill="#dcfce7" stroke="#15803d"/><text x="380" y="198" font-weight="bold">Prevent and refer</text><text x="380" y="224">Oral hygiene</text><text x="380" y="247">Regular dental visits</text><text x="380" y="270">Glucose / tobacco care</text><rect x="518" y="172" width="224" height="120" rx="10" fill="#fee2e2" stroke="#b91c1c"/><text x="630" y="198" font-weight="bold">Dental procedures</text><text x="630" y="224">Coordinate fasting plan</text><text x="630" y="247">Medication / glucose plan</text><text x="630" y="270">Review recovery intake</text></g><rect x="60" y="325" width="640" height="76" rx="12" fill="#e2e8f0"/><text x="380" y="353" font-size="17">Coordinate diabetes, dental and nutrition care</text><text x="380" y="378" font-size="15">Treat oral disease without replacing diabetes treatment</text></g></svg>
