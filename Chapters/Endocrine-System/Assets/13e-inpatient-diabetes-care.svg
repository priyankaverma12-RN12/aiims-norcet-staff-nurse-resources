<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" role="img" aria-labelledby="t d"><title id="t">Inpatient diabetes care</title><desc id="d">Assess baseline and targets, select insulin strategy, monitor changing needs and plan transition and discharge.</desc><rect width="760" height="380" rx="12" fill="#f5f8fc"/><g text-anchor="middle" font-family="Arial,sans-serif" fill="#183248"><text x="380" y="34" font-size="23" font-weight="bold">Inpatient glycemic care</text><rect x="105" y="54" width="550" height="54" rx="8" fill="#dce7f5" stroke="#52749a"/><text x="380" y="77" font-size="18">Assess prior glycemia and current illness</text><text x="380" y="97" font-size="15">Choose safe individualized glucose goals</text><path d="M380 108 V134 M190 134 H570 M190 134 V155 M570 134 V155" fill="none" stroke="#52749a" stroke-width="3"/><rect x="20" y="155" width="340" height="104" rx="9" fill="#f4e5da" stroke="#a76d4b"/><text x="190" y="184" font-size="18" font-weight="bold">Prescribed insulin strategy</text><text x="190" y="210" font-size="15">Basal, nutritional and correction</text><text x="190" y="235" font-size="15">IV protocol when indicated</text><rect x="400" y="155" width="340" height="104" rx="9" fill="#dcefe1" stroke="#528567"/><text x="570" y="184" font-size="18" font-weight="bold">Monitor changing risks</text><text x="570" y="210" font-size="15">Feeds, steroids and organ function</text><text x="570" y="235" font-size="15">Recognize and document low glucose</text><path d="M190 259 V282 H570 V259 M380 282 V301" fill="none" stroke="#52749a" stroke-width="3"/><rect x="100" y="301" width="560" height="58" rx="8" fill="#fff" stroke="#52749a"/><text x="380" y="326" font-size="18" font-weight="bold">Safe transition and discharge</text><text x="380" y="347" font-size="15">Medication reconciliation and timely follow-up</text></g></svg>
