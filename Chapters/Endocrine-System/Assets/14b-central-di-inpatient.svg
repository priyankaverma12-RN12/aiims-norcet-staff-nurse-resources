<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="t d"><title id="t">Established central DI inpatient care</title><desc id="d">Admission medication review followed by monitoring according to ability to drink and clinical stability.</desc><rect width="800" height="500" fill="#f8fafc"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#142b3b"><text x="400" y="35" font-size="23" font-weight="bold">Established central DI: adult inpatient care</text><rect x="160" y="55" width="480" height="70" rx="12" fill="#dbeafe" stroke="#2563eb"/><text x="400" y="83" font-size="17">Identify DI and contact endocrine team</text><text x="400" y="107" font-size="16">Verify dose, route, timing and water access</text><path d="M400 125 V155 H137 V180 M400 155 V180 M400 155 H663 V180" fill="none" stroke="#475569" stroke-width="3"/><g font-size="16"><rect x="18" y="180" width="238" height="150" rx="12" fill="#dcfce7" stroke="#15803d"/><text x="137" y="208" font-weight="bold">Stable, drinks safely</text><text x="137" y="237">Water within reach</text><text x="137" y="263">If IV fluids: sodium</text><text x="137" y="286">at least every 24 h</text><rect x="281" y="180" width="238" height="150" rx="12" fill="#fef3c7" stroke="#b45309"/><text x="400" y="208" font-weight="bold">Needs help with fluids</text><text x="400" y="237">Prescribed fluid and dose</text><text x="400" y="263">Intake / output, sodium</text><text x="400" y="286">at least every 12 h*</text><rect x="544" y="180" width="238" height="150" rx="12" fill="#fee2e2" stroke="#b91c1c"/><text x="663" y="208" font-weight="bold">Decompensated DI</text><text x="663" y="237">Urgent clinical escalation</text><text x="663" y="263">Resuscitation: sodium</text><text x="663" y="286">approximately every 4 h</text></g><rect x="75" y="355" width="650" height="76" rx="12" fill="#e2e8f0"/><text x="400" y="384" font-size="16">Reassess fluid prescription when urine losses change</text><text x="400" y="409" font-size="16">Escalate new neurological symptoms immediately</text><text x="400" y="459" font-size="13">*Until clinically stable or able to manage own intake. Follow individualized orders.</text></g></svg>
