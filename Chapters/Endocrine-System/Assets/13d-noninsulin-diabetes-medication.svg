<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" role="img" aria-labelledby="t d"><title id="t">Noninsulin diabetes medication safety</title><desc id="d">Identify medication mechanism and individual risks, verify administration and interactions, then monitor and reassess.</desc><rect width="760" height="380" rx="12" fill="#f5f8fc"/><g text-anchor="middle" font-family="Arial,sans-serif" fill="#183248"><text x="380" y="34" font-size="23" font-weight="bold">Noninsulin diabetes medicines</text><rect x="105" y="54" width="550" height="54" rx="8" fill="#dce7f5" stroke="#52749a"/><text x="380" y="77" font-size="18">Identify class, indication and treatment goals</text><text x="380" y="97" font-size="15">Review organ function and other medicines</text><path d="M380 108 V134 M190 134 H570 M190 134 V155 M570 134 V155" fill="none" stroke="#52749a" stroke-width="3"/><rect x="20" y="155" width="340" height="104" rx="9" fill="#f4e5da" stroke="#a76d4b"/><text x="190" y="184" font-size="18" font-weight="bold">Administration and interactions</text><text x="190" y="210" font-size="15">Meal timing and product instructions</text><text x="190" y="235" font-size="15">Check contraindications</text><rect x="400" y="155" width="340" height="104" rx="9" fill="#dcefe1" stroke="#528567"/><text x="570" y="184" font-size="18" font-weight="bold">Adverse-effect surveillance</text><text x="570" y="210" font-size="15">Glucose, GI symptoms and infections</text><text x="570" y="235" font-size="15">Escalate serious findings</text><path d="M190 259 V282 H570 V259 M380 282 V301" fill="none" stroke="#52749a" stroke-width="3"/><rect x="100" y="301" width="560" height="58" rx="8" fill="#fff" stroke="#52749a"/><text x="380" y="326" font-size="18" font-weight="bold">Individualize benefit, risk and access</text><text x="380" y="347" font-size="15">Review the complete regimen with the care team</text></g></svg>
