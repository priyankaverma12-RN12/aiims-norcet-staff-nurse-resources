<svg xmlns="http://www.w3.org/2000/svg" width="780" height="440" viewBox="0 0 780 440" role="img" aria-labelledby="t d"><title id="t">Risk-based thyroid nodule care</title><desc id="d">History, thyroid function and ultrasound guide sampling and follow-up. Coordinate procedure safety, cytology and clinical review.</desc><rect width="780" height="440" rx="16" fill="#f5f8fc"/><g text-anchor="middle" font-family="Arial,sans-serif" fill="#173047"><text x="390" y="35" font-size="24" font-weight="bold">Thyroid nodule: risk-based care</text><rect x="225" y="55" width="330" height="55" rx="10" fill="#dce7f5" stroke="#5a709b"/><text x="390" y="88" font-size="18">Clinical assessment + TSH + ultrasound</text><path d="M390 110 V138 M135 138 H645 M135 138 V165 M390 138 V165 M645 138 V165" stroke="#5a709b" stroke-width="3" fill="none"/><g font-size="16"><rect x="15" y="165" width="240" height="78" rx="9" fill="#dcefe1" stroke="#528567"/><text x="135" y="194" font-weight="bold">Risk stratification</text><text x="135" y="219">Pattern and dimensions</text><rect x="270" y="165" width="240" height="78" rx="9" fill="#e2e9f5" stroke="#5a709b"/><text x="390" y="194" font-weight="bold">Functional assessment</text><text x="390" y="219">Scan if indicated</text><rect x="525" y="165" width="240" height="78" rx="9" fill="#f4e5da" stroke="#a76d4b"/><text x="645" y="194" font-weight="bold">FNA if indicated</text><text x="645" y="219">Target and safety checks</text></g><path d="M135 243 V270 H645 V243 M390 243 V292" stroke="#5a709b" stroke-width="3" fill="none"/><rect x="90" y="292" width="600" height="65" rx="9" fill="#fff" stroke="#5a709b"/><text x="390" y="320" font-size="19" font-weight="bold">Integrate imaging and cytology</text><text x="390" y="344" font-size="15">Repeat sampling, surveillance or treatment as appropriate</text><path d="M390 357 V380" stroke="#5a709b" stroke-width="3"/><rect x="100" y="380" width="580" height="42" rx="9" fill="#f4d9d5" stroke="#a35a54"/><text x="390" y="406" 