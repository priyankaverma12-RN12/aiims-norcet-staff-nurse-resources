<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="t d"><title id="t">Adrenal incidentaloma assessment</title><desc id="d">Assess lesion imaging and hormone activity separately, then choose individualized follow-up or intervention.</desc><rect width="760" height="420" rx="14" fill="#f5f8fc"/><g text-anchor="middle" font-family="Arial,sans-serif" fill="#173047"><text x="380" y="34" font-size="24" font-weight="bold">Adrenal incidentaloma: two assessment axes</text><rect x="220" y="55" width="320" height="52" rx="9" fill="#dce7f5" stroke="#52749a"/><text x="380" y="87" font-size="18">Unexpected adrenal mass</text><path d="M380 107 V137 M190 137 H570 M190 137 V157 M570 137 V157" fill="none" stroke="#52749a" stroke-width="3"/><rect x="20" y="157" width="340" height="110" rx="9" fill="#e1e9f6" stroke="#52749a"/><text x="190" y="185" font-size="18" font-weight="bold">Imaging risk</text><text x="190" y="210" font-size="15">Unenhanced HU and homogeneity</text><text x="190" y="234" font-size="15">Size, growth, clinical context</text><rect x="400" y="157" width="340" height="110" rx="9" fill="#dcefe1" stroke="#528567"/><text x="570" y="185" font-size="18" font-weight="bold">Hormonal activity</text><text x="570" y="210" font-size="15">Clinical assessment and tests</text><text x="570" y="234" font-size="15">Comorbidity assessment</text><path d="M190 267 V292 H570 V267 M380 292 V316" fill="none" stroke="#52749a" stroke-width="3"/><rect x="75" y="316" width="610" height="78" rx="9" fill="#fff" stroke="#52749a"/><text x="380" y="343" font-size="18" font-weight="bold">Individualized multidisciplinary care</text><text x="380" y="367" font-size="15">No imaging follow-up, surveillance or surgery as indicated</text><text x="380" y="386" font-size="14">Treat associated comorbidities and coordinate hormone safety</text></g></svg>
