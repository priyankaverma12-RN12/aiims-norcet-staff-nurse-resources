<svg xmlns="http://www.w3.org/2000/svg" width="760" height="445" viewBox="0 0 760 445" role="img" aria-labelledby="t d"><title id="t">Incidental pituitary lesion assessment and care</title><desc id="d">Assess structure, hormone function and visual pathways. Choose individualized surveillance or intervention, then track function over time.</desc><rect width="760" height="445" rx="14" fill="#f4f7fa"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#173047"><text x="380" y="35" font-size="24" font-weight="bold">Pituitary incidentaloma: care pathway</text><rect x="230" y="55" width="300" height="55" rx="9" fill="#dce7f5" stroke="#5a709b"/><text x="380" y="89" font-size="19">Incidentally found sellar lesion</text><path d="M380 110 V141 M135 141 H625 M135 141 V164 M380 141 V164 M625 141 V164" stroke="#5a709b" stroke-width="3" fill="none"/><g font-size="16"><rect x="18" y="164" width="234" height="76" rx="9" fill="#e1e9f6" stroke="#5a709b"/><text x="135" y="194" font-weight="bold">Anatomy</text><text x="135" y="219">Size, location, growth</text><rect x="263" y="164" width="234" height="76" rx="9" fill="#dcefe1" stroke="#528567"/><text x="380" y="194" font-weight="bold">Hormonal function</text><text x="380" y="219">Excess and deficiency</text><rect x="508" y="164" width="234" height="76" rx="9" fill="#f4dfd4" stroke="#a76d4b"/><text x="625" y="194" font-weight="bold">Visual pathways</text><text x="625" y="219">Field, acuity, symptoms</text></g><path d="M135 240 V267 H625 V240 M380 240 V287" stroke="#5a709b" stroke-width="3" fill="none"/><rect x="100" y="287" width="560" height="65" rx="9" fill="#fff" stroke="#5a709b"/><text x="380" y="314" font-size="19" font-weight="bold">Individualized surveillance or treatment</text><text x="380" y="339" font-size="15">Escalate new deficits and acute deterioration</text><path d="M380 352 V372" stroke="#5a709b" stroke-width="3"/><rect x="105" y="372" width="550" height="53" rx="9" fill="#e6e1f2" stroke="#80659f"/><text x="380" y="404" font-size="17" font-weight="bold">Follow-up: vision, hormones, imaging, daily function</text></g></svg>
