<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" role="img" aria-labelledby="t d"><title id="t">Glucocorticoid withdrawal care</title><desc id="d">Review exposure, control underlying disease, plan taper and monitor recovery and stress coverage.</desc><rect width="760" height="390" rx="14" fill="#f5f8fc"/><g text-anchor="middle" font-family="Arial,sans-serif" fill="#173047"><text x="380" y="34" font-size="23" font-weight="bold">Glucocorticoid withdrawal: safety pathway</text><rect x="95" y="54" width="570" height="57" rx="9" fill="#dce7f5" stroke="#52749a"/><text x="380" y="78" font-size="18" font-weight="bold">Review duration, potency and all routes</text><text x="380" y="99" font-size="15">Confirm underlying disease control</text><path d="M380 111 V135" stroke="#52749a" stroke-width="3"/><rect x="95" y="135" width="570" height="57" rx="9" fill="#f4e5da" stroke="#a76d4b"/><text x="380" y="159" font-size="18" font-weight="bold">Prescriber-directed taper when indicated</text><text x="380" y="180" font-size="15">Monitor disease activity and withdrawal symptoms</text><path d="M380 192 V216" stroke="#52749a" stroke-width="3"/><rect x="95" y="216" width="570" height="57" rx="9" fill="#dcefe1" stroke="#528567"/><text x="380" y="240" font-size="18" font-weight="bold">Assess recovery at physiological dose</text><text x="380" y="261" font-size="15">Clinical monitoring or appropriate morning cortisol</text><path d="M380 273 V297" stroke="#52749a" stroke-width="3"/><rect x="95" y="297" width="570" height="62" rx="9" fill="#fff" stroke="#52749a"/><text x="380" y="323" font-size="18" font-weight="bold">Maintain stress plan until recovery established</text><text x="380" y="346" font-size="15">Escalate acute instability and prolonged lack of recovery</text></g></svg>
