<svg xmlns="http://www.w3.org/2000/svg" width="780" height="460" viewBox="0 0 780 460" role="img" aria-labelledby="t d"><title id="t">Primary aldosteronism: assessment and care</title><desc id="d">Hypertension prompts hormone screening, clinical interpretation and individualized medical or surgical treatment with monitoring.</desc><rect width="780" height="460" rx="16" fill="#f5f8fc"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#193247"><text x="390" y="35" font-size="23" font-weight="bold">Primary aldosteronism pathway</text><rect x="135" y="55" width="510" height="60" rx="10" fill="#dce7f5" stroke="#53769c"/><text x="390" y="79" font-size="17" font-weight="bold">Hypertension: consider PA screening</text><text x="390" y="101" font-size="15">Aldosterone + renin + potassium</text><path d="M390 115 V140" stroke="#52728a" stroke-width="3"/><rect x="100" y="140" width="580" height="62" rx="10" fill="#f5e9d5" stroke="#a77c43"/><text x="390" y="165" font-size="17" font-weight="bold">Interpret with sample and medication context</text><text x="390" y="188" font-size="15">Correct hypokalemia and repeat when clinically indicated</text><path d="M390 202 V225 M195 225 H585 M195 225 V250 M585 225 V250" fill="none" stroke="#52728a" stroke-width="3"/><rect x="25" y="250" width="340" height="90" rx="10" fill="#dcefe1" stroke="#528567"/><text x="195" y="278" font-size="18" font-weight="bold">Medical pathway</text><text x="195" y="301" font-size="15">Prescribed receptor antagonist</text><text x="195" y="323" font-size="15">BP, potassium, renal function</text><rect x="415" y="250" width="340" height="90" rx="10" fill="#e2e9f5" stroke="#53769c"/><text x="585" y="278" font-size="18" font-weight="bold">Surgical pathway</text><text x="585" y="301" font-size="15">CT + functional lateralization as indicated</text><text x="585" y="323" font-size="15">Adrenalectomy in suitable patients</text><path d="M195 340 V365 H585 V340 M390 365 V388" fill="none" stroke="#52728a" stroke-width="3"/><rect x="95" y="388" width="590" height="52" rx="10" fill="#fff" stroke="#53769c"/><text x="390" y="409" font-size="16" font-weight="bold">Follow clinical and biochemical response</text><text x="390" y="429" font-size="15">Adjust treatment safely with the clinical team</text></g></svg>
