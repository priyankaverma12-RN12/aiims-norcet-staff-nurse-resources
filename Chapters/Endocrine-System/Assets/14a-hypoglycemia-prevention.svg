<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" role="img" aria-labelledby="title desc"><title id="title">Hypoglycemia prevention and rescue readiness</title><desc id="desc">Prepare rescue resources, recognize low glucose, choose response by swallowing safety, and review recurrence risk.</desc><rect width="720" height="440" rx="18" fill="#f4f8fc"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#17324d"><text x="360" y="32" font-size="21" font-weight="bold">Hypoglycemia: prepare, respond, review</text><g stroke="#287a89" stroke-width="2" fill="#e0f4f2"><rect x="90" y="53" width="540" height="60" rx="10"/><rect x="90" y="140" width="540" height="56" rx="10"/><rect x="28" y="230" width="315" height="93" rx="10"/><rect x="377" y="230" width="315" height="93" rx="10"/><rect x="90" y="354" width="540" height="63" rx="10"/></g><g font-size="16"><text x="360" y="76" font-weight="bold">Prepare</text><text x="360" y="98">Glucose supply • prescribed glucagon • trained contact</text><text x="360" y="163" font-weight="bold">Recognize and assess</text><text x="360" y="184">Check glucose when feasible and assess swallowing</text><text x="185" y="252" font-weight="bold">Alert and can swallow</text><text x="185" y="275">Fast glucose per plan</text><text x="185" y="299">Recheck and monitor</text><text x="534" y="252" font-weight="bold">Cannot safely swallow</text><text x="534" y="275">No oral food or fluid</text><text x="534" y="299">Emergency help and rescue plan</text><text x="360" y="377" font-weight="bold">Review after recovery</text><text x="360" y="399">Recurrence risk • access barriers • regimen review</text></g></g><g stroke="#287a89" stroke-width="3" fill="none"><path d="M360 113v27m-6-8 6 8 6-8M360 196v15H185v19m-6-8 6 8 6-8M360 211h174v19m-6-8 6 8 6-8M185 323v16h175v15m-6-8 6 8 6-8M534 323v16H360"/></g></svg>
