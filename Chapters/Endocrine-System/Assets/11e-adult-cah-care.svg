<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="t d"><title id="t">Adult CAH treatment and follow-up</title><desc id="d">Impaired steroid synthesis may reduce cortisol and increase ACTH-driven adrenal androgens. Treatment balances hormone replacement and androgen control.</desc><rect width="760" height="420" rx="14" fill="#f5f8fc"/><g text-anchor="middle" font-family="Arial,sans-serif" fill="#173047"><text x="380" y="34" font-size="24" font-weight="bold">Adult CAH: balance two treatment goals</text><rect x="200" y="55" width="360" height="52" rx="9" fill="#dce7f5" stroke="#52749a"/><text x="380" y="87" font-size="18">Inherited steroid synthesis defect</text><path d="M380 107 V137 M190 137 H570 M190 137 V157 M570 137 V157" fill="none" stroke="#52749a" stroke-width="3"/><rect x="20" y="157" width="340" height="110" rx="9" fill="#f4e5da" stroke="#a76d4b"/><text x="190" y="184" font-size="18" font-weight="bold">Cortisol replacement</text><text x="190" y="211" font-size="15">Adequate prescribed glucocorticoid</text><text x="190" y="237" font-size="15">Mineralocorticoid if indicated</text><rect x="400" y="157" width="340" height="110" rx="9" fill="#dcefe1" stroke="#528567"/><text x="570" y="184" font-size="18" font-weight="bold">Androgen control</text><text x="570" y="211" font-size="15">Avoid excessive steroid suppression</text><text x="570" y="237" font-size="15">Selected adjuncts where approved</text><path d="M190 267 V292 H570 V267 M380 292 V316" fill="none" stroke="#52749a" stroke-width="3"/><rect x="75" y="316" width="610" height="78" rx="9" fill="#fff" stroke="#52749a"/><text x="380" y="343" font-size="18" font-weight="bold">Longitudinal adult care</text><text x="380" y="367" font-size="15">Timed labs, clinical safety, reproductive and genetic counseling</text><text x="380" y="386" font-size="14">Stress coverage as indicated by phenotype and reserve</text></g></svg>
