<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" role="img" aria-labelledby="t d"><title id="t">Primary hyperparathyroidism care</title><desc id="d">Confirm biochemical disease and exclude mimics, assess surgical criteria and plan individualized follow-up.</desc><rect width="760" height="380" rx="12" fill="#f5f8fc"/><g text-anchor="middle" font-family="Arial,sans-serif" fill="#183248"><text x="380" y="34" font-size="23" font-weight="bold">Primary hyperparathyroidism</text><rect x="100" y="55" width="560" height="58" rx="9" fill="#dce7f5" stroke="#52749a"/><text x="380" y="79" font-size="18">Confirm calcium and PTH pattern</text><text x="380" y="100" font-size="15">Exclude secondary causes and familial mimics</text><path d="M380 113 V138 M190 138 H570 M190 138 V158 M570 138 V158" fill="none" stroke="#52749a" stroke-width="3"/><rect x="20" y="158" width="340" height="100" rx="9" fill="#dcefe1" stroke="#528567"/><text x="190" y="187" font-size="18" font-weight="bold">Surgical assessment</text><text x="190" y="212" font-size="15">Calcium, age, bone and renal risk</text><text x="190" y="237" font-size="15">Localization for operative planning</text><rect x="400" y="158" width="340" height="100" rx="9" fill="#f4e5da" stroke="#a76d4b"/><text x="570" y="187" font-size="18" font-weight="bold">Nonoperative care</text><text x="570" y="212" font-size="15">Monitor calcium and skeletal health</text><text x="570" y="237" font-size="15">Selected medical treatment</text><path d="M190 258 V282 H570 V258 M380 282 V301" fill="none" stroke="#52749a" stroke-width="3"/><rect x="100" y="301" width="560" height="58" rx="9" fill="#fff" stroke="#52749a"/><text x="380" y="326" font-size="18" font-weight="bold">Individualized follow-up</text><text x="380" y="347" font-size="15">Assess biochemical response and new indications</text></g></svg>
