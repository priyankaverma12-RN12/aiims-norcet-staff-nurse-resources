<svg xmlns="http://www.w3.org/2000/svg" width="780" height="356" viewBox="0 0 780 356" role="img" aria-label="Insulin and glucagon"><rect width="780" height="356" rx="20" fill="#f8fafc"/><text x="390" y="38" font-family="Arial,sans-serif" font-size="25" font-weight="bold" text-anchor="middle" fill="#172554">Insulin and glucagon</text><rect x="35" y="60" width="710" height="58" rx="12" fill="#dbeafe" stroke="#64748b"/><text x="55" y="83" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#172554">After meal: glucose rises</text><text x="55" y="105" font-family="Arial,sans-serif" font-size="15" fill="#334155">Beta cells release insulin</text><rect x="35" y="130" width="710" height="58" rx="12" fill="#dcfce7" stroke="#64748b"/><text x="55" y="153" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#172554">Insulin</text><text x="55" y="175" font-family="Arial,sans-serif" font-size="15" fill="#334155">Uptake / storage, glucose falls</text><rect x="35" y="200" width="710" height="58" rx="12" fill="#fef3c7" stroke="#64748b"/><text x="55" y="223" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#172554">Fasting: glucose falls</text><text x="55" y="245" font-family="Arial,sans-serif" font-size="15" fill="#334155">Alpha cells release glucagon</text><rect x="35" y="270" width="710" height="58" rx="12" fill="#fce7f3" stroke="#64748b"/><text x="55" y="293" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#172554">Glucagon</text><text x="55" y="315" font-family="Arial,sans-serif" font-size="15" fill="#334155">Liver releases glucose</text></svg>