<svg xmlns="http://www.w3.org/2000/svg" width="740" height="440" viewBox="0 0 740 440" role="img" aria-labelledby="t d"><title id="t">Peripheral neuropathy assessment and care</title><desc id="d">Three assessment areas lead to tailored care and review.</desc><rect width="740" height="440" fill="#f8fafc"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#142b3b"><text x="370" y="33" font-size="23" font-weight="bold">Diabetic peripheral neuropathy</text><rect x="240" y="55" width="260" height="64" rx="10" fill="#dbeafe" stroke="#2563eb"/><text x="370" y="81" font-size="17">History and symptoms</text><text x="370" y="102" font-size="15">Pain, numbness, function</text><path d="M370 119 V145 H125 V167 M370 145 V167 M370 145 H615 V167" stroke="#64748b" stroke-width="2" fill="none"/><g font-size="16"><rect x="14" y="167" width="222" height="110" rx="10" fill="#dcfce7" stroke="#15803d"/><text x="125" y="194" font-weight="bold">Small fibers</text><text x="125" y="221">Pinprick / temperature</text><text x="125" y="247">Burning, allodynia</text><rect x="259" y="167" width="222" height="110" rx="10" fill="#fef3c7" stroke="#b45309"/><text x="370" y="194" font-weight="bold">Large fibers</text><text x="370" y="221">128-Hz vibration</text><text x="370" y="247">Position / balance</text><rect x="504" y="167" width="222" height="110" rx="10" fill="#fee2e2" stroke="#b91c1c"/><text x="615" y="194" font-weight="bold">Safety</text><text x="615" y="221">Protective sensation</text><text x="615" y="247">Gait and fall risk</text></g><rect x="58" y="315" width="624" height="87" rx="12" fill="#e2e8f0"/><text x="370" y="342" font-size="17">Review alternative causes and atypical weakness</text><text x="370" y="367" font-size="16">Manage pain, function and adverse effects</text><text x="370" y="389" font-size="14">Pain relief does not prove sensory recovery</text></g></svg>
