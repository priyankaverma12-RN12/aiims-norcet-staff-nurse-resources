<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img" aria-labelledby="t d"><title id="t">Primary hypothyroidism treatment map</title><desc id="d">Assess thyroid status, choose individualized replacement or surveillance and monitor response and medication safety.</desc><rect width="760" height="400" rx="14" fill="#f5f8fc"/><g text-anchor="middle" font-family="Arial,sans-serif" fill="#173047"><text x="380" y="35" font-size="23" font-weight="bold">Primary hypothyroidism: treatment and review</text><rect x="130" y="55" width="500" height="55" rx="9" fill="#dce7f5" stroke="#52749a"/><text x="380" y="88" font-size="18">Clinical context + TSH + FT4 when indicated</text><path d="M380 110 V138 M190 138 H570 M190 138 V160 M570 138 V160" fill="none" stroke="#52749a" stroke-width="3"/><rect x="20" y="160" width="340" height="100" rx="9" fill="#dcefe1" stroke="#528567"/><text x="190" y="189" font-size="18" font-weight="bold">Overt primary deficiency</text><text x="190" y="214" font-size="15">Individualized replacement</text><text x="190" y="239" font-size="15">Age, weight and cardiac status</text><rect x="400" y="160" width="340" height="100" rx="9" fill="#f4e5da" stroke="#a76d4b"/><text x="570" y="189" font-size="18" font-weight="bold">Subclinical disease</text><text x="570" y="214" font-size="15">Persistence, symptoms and risk</text><text x="570" y="239" font-size="15">Treatment trial or surveillance</text><path d="M190 260 V285 H570 V260 M380 285 V305" fill="none" stroke="#52749a" stroke-width="3"/><rect x="90" y="305" width="580" height="70" rx="9" fill="#fff" stroke="#52749a"/><text x="380" y="333" font-size="18" font-weight="bold">Monitor clinical and biochemical response</text><text x="380" y="356" font-size="15">Review interactions, absorption and excess symptoms</text></g></svg>
