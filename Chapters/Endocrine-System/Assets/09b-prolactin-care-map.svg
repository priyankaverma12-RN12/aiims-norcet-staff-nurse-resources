<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="t d"><title id="t">Prolactin cause and care map</title><desc id="d">High prolactin can result from physiological factors, medicines, systemic illness, stalk compression or prolactinoma. Evaluate and follow treatment.</desc><rect width="760" height="420" rx="14" fill="#f3f7fb"/><g text-anchor="middle" font-family="Arial,sans-serif" fill="#173047"><text x="380" y="36" font-size="24" font-weight="bold">High prolactin: assess the cause</text><rect x="275" y="58" width="210" height="52" rx="8" fill="#f4dbba" stroke="#a97631"/><text x="380" y="90" font-size="19">High prolactin</text><path d="M380 110 V138 M130 138 H630 M130 138 V160 M380 138 V160 M630 138 V160" stroke="#466981" stroke-width="3" fill="none"/><g font-size="16"><rect x="15" y="160" width="230" height="76" rx="9" fill="#fff" stroke="#466981"/><text x="130" y="190" font-weight="bold">Physiological</text><text x="130" y="215">Pregnancy, stress</text><rect x="265" y="160" width="230" height="76" rx="9" fill="#fff" stroke="#466981"/><text x="380" y="190" font-weight="bold">Secondary causes</text><text x="380" y="215">Medicines, thyroid, renal</text><rect x="515" y="160" width="230" height="76" rx="9" fill="#fff" stroke="#466981"/><text x="630" y="190" font-weight="bold">Pituitary causes</text><text x="630" y="215">Adenoma or stalk effect</text></g><path d="M130 236 V263 H630 V236 M380 236 V285" stroke="#466981" stroke-width="3" fill="none"/><rect x="105" y="285" width="550" height="108" rx="10" fill="#d9efdf" stroke="#528567"/><text x="380" y="316" font-size="19" font-weight="bold">Clinical and laboratory evaluation</text><text x="380" y="344" font-size="16">Review causes, assay interference and imaging as indicated</text><text x="380" y="371" font-size="16">Treatment safety, fertility and follow-up</text></g></svg>
