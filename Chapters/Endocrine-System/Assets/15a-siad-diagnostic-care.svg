<svg xmlns="http://www.w3.org/2000/svg" width="760" height="450" viewBox="0 0 760 450" role="img" aria-labelledby="t d"><title id="t">SIAD diagnostic and care pathway</title><desc id="d">Hypotonic hyponatremia requires assessment of urine findings, volume, causes, and severity before individualized treatment.</desc><rect width="760" height="450" fill="#f8fafc"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#142b3b"><text x="380" y="33" font-size="22" font-weight="bold">SIAD: assess before treating</text><rect x="190" y="55" width="380" height="64" rx="10" fill="#dbeafe" stroke="#2563eb"/><text x="380" y="82" font-size="17">Hypotonic hyponatremia</text><text x="380" y="103" font-size="14">Assess symptoms and urgency first</text><path d="M380 119 V145 H130 V169 M380 145 V169 M380 145 H630 V169" fill="none" stroke="#64748b" stroke-width="2"/><g font-size="15"><rect x="18" y="169" width="224" height="130" rx="10" fill="#fef3c7" stroke="#b45309"/><text x="130" y="196" font-weight="bold">Diagnostic workup</text><text x="130" y="221">Paired blood and urine</text><text x="130" y="246">Volume and medicines</text><text x="130" y="271">Exclude other causes</text><rect x="268" y="169" width="224" height="130" rx="10" fill="#dcfce7" stroke="#15803d"/><text x="380" y="196" font-weight="bold">Stable confirmed SIAD</text><text x="380" y="221">Treat the trigger</text><text x="380" y="246">Prescribed restriction</text><text x="380" y="271">Document response</text><rect x="518" y="169" width="224" height="130" rx="10" fill="#fee2e2" stroke="#b91c1c"/><text x="630" y="196" font-weight="bold">Poor response</text><text x="630" y="221">Specialist reassessment</text><text x="630" y="246">Consider alternatives</text><text x="630" y="271">Monitor sodium closely</text></g><rect x="52" y="330" width="656" height="78" rx="12" fill="#e2e8f0"/><text x="380" y="359" font-size="16">Severe neurological symptoms require emergency care</text><text x="380" y="384" font-size="15">Unexpected water diuresis requires prompt reassessment</text></g></svg>
