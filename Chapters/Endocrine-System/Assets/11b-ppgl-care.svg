<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" role="img" aria-labelledby="t d"><title id="t">PPGL nursing pathway</title><desc id="d">Assess biochemical evidence, coordinate specialist preparation, monitor postoperative blood pressure and glucose, and maintain long-term follow-up.</desc><rect width="760" height="390" rx="14" fill="#f4f7fa"/><g text-anchor="middle" font-family="Arial,sans-serif" fill="#173047"><text x="380" y="34" font-size="24" font-weight="bold">PPGL: diagnosis to follow-up</text><rect x="170" y="55" width="420" height="52" rx="9" fill="#dce7f5" stroke="#52749a"/><text x="380" y="87" font-size="18">Biochemical and anatomical assessment</text><path d="M380 107 V133" stroke="#52749a" stroke-width="3"/><rect x="100" y="133" width="560" height="60" rx="9" fill="#f4e5da" stroke="#a76d4b"/><text x="380" y="158" font-size="18" font-weight="bold">Specialist preoperative preparation</text><text x="380" y="180" font-size="15">Blockade, BP and individualized volume plan</text><path d="M380 193 V220" stroke="#52749a" stroke-width="3"/><rect x="100" y="220" width="560" height="60" rx="9" fill="#dcefe1" stroke="#528567"/><text x="380" y="245" font-size="18" font-weight="bold">Postoperative monitoring</text><text x="380" y="267" font-size="15">Hemodynamics, glucose, adrenal function as indicated</text><path d="M380 280 V307" stroke="#52749a" stroke-width="3"/><rect x="100" y="307" width="560" height="58" rx="9" fill="#fff" stroke="#52749a"/><text x="380" y="331" font-size="18" font-weight="bold">Long-term follow-up</text><text x="380" y="353" font-size="15">Biochemistry, genetics and risk-based imaging</text></g></svg>
