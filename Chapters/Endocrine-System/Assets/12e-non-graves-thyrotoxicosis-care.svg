<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img" aria-labelledby="t d"><title id="t">Non-Graves thyroid hormone excess</title><desc id="d">Distinguish autonomous synthesis, iodine exposure and exogenous hormone intake. Match monitoring and treatment to the cause.</desc><rect width="760" height="400" rx="14" fill="#f5f8fc"/><g text-anchor="middle" font-family="Arial,sans-serif" fill="#173047"><text x="380" y="35" font-size="23" font-weight="bold">Thyroid hormone excess: identify the source</text><rect x="130" y="55" width="500" height="55" rx="9" fill="#dce7f5" stroke="#52749a"/><text x="380" y="88" font-size="18">History + TSH + FT4 and FT3</text><path d="M380 110 V138 M130 138 H630 M130 138 V160 M380 138 V160 M630 138 V160" fill="none" stroke="#52749a" stroke-width="3"/><rect x="10" y="160" width="240" height="100" rx="9" fill="#dcefe1" stroke="#528567"/><text x="130" y="189" font-size="17" font-weight="bold">Nodular autonomy</text><text x="130" y="214" font-size="14">Increased synthesis</text><text x="130" y="239" font-size="14">Cause-specific treatment</text><rect x="260" y="160" width="240" height="100" rx="9" fill="#f4e5da" stroke="#a76d4b"/><text x="380" y="189" font-size="17" font-weight="bold">Iodine load</text><text x="380" y="214" font-size="14">Susceptibility and timing</text><text x="380" y="239" font-size="14">Risk-based monitoring</text><rect x="510" y="160" width="240" height="100" rx="9" fill="#e8e1f4" stroke="#8070a5"/><text x="630" y="189" font-size="17" font-weight="bold">External hormone</text><text x="630" y="214" font-size="14">Exposure assessment</text><text x="630" y="239" font-size="14">Clinician-directed care</text><path d="M130 260 V285 H630 V260 M380 260 V305" fill="none" stroke="#52749a" stroke-width="3"/><rect x="90" y="305" width="580" height="70" rx="9" fill="#fff" stroke="#52749a"/><text x="380" y="333" font-size="18" font-weight="bold">Integrate biochemical and clinical risk</text><text x="380" y="356" font-size="15">Choose appropriate follow-up and safe treatment</text></g></svg>
