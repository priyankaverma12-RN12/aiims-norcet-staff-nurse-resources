<svg xmlns="http://www.w3.org/2000/svg" width="760" height="580" viewBox="0 0 760 580" role="img" aria-labelledby="t d">
<title id="t">Acute liver failure: clinical pathways</title><desc id="d">Acute hepatocyte injury leads to impaired synthetic and metabolic functions and ammonia clearance. Urgent nursing assessment and specialist escalation address neurologic, metabolic, circulatory and bleeding risks.</desc>
<rect width="760" height="580" fill="#f7fafc" rx="18"/>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker></defs>
<g font-family="Arial,sans-serif" text-anchor="middle" fill="#172554">
<text x="380" y="39" font-size="24" font-weight="bold">Acute liver failure</text>
<rect x="185" y="62" width="390" height="62" rx="12" fill="#dbeafe" stroke="#2563eb"/><text x="380" y="88" font-size="18" font-weight="bold">Severe acute hepatocyte injury</text><text x="380" y="109" font-size="14">Loss of liver function</text>
<g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M380 124 V145 H130 V170"/><path d="M380 124 V170"/><path d="M380 145 H630 V170"/></g>
<rect x="20" y="176" width="220" height="80" rx="10" fill="#fef3c7" stroke="#a16207"/><text x="130" y="202" font-size="16" font-weight="bold">Impaired synthesis</text><text x="130" y="226" font-size="14">INR may rise</text><text x="130" y="244" font-size="13">Assess actual bleeding</text>
<rect x="270" y="176" width="220" height="80" rx="10" fill="#dcfce7" stroke="#15803d"/><text x="380" y="202" font-size="16" font-weight="bold">Impaired metabolism</text><text x="380" y="226" font-size="14">Hypoglycemia risk</text><text x="380" y="244" font-size="13">Monitor glucose</text>
<rect x="520" y="176" width="220" height="80" rx="10" fill="#fee2e2" stroke="#b91c1c"/><text x="630" y="202" font-size="16" font-weight="bold">Ammonia accumulation</text><text x="630" y="226" font-size="14">Astrocyte swelling</text><text x="630" y="244" font-size="13">Encephalopathy / ICP risk</text>
<g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M130 256 V278 H380 V300"/><path d="M380 256 V300"/><path d="M630 256 V278 H380 V300"/></g>
<rect x="90" y="306" width="580" height="92" rx="12" fill="#e0e7ff" stroke="#4338ca"/><text x="380" y="334" font-size="18" font-weight="bold">Urgent nursing and critical care assessment</text><text x="380" y="357" font-size="14">Airway, oxygenation, perfusion, pupils and consciousness</text><text x="380" y="379" font-size="14">Serial glucose, INR, lactate, urine output and infection signs</text>
<path d="M380 398 V430" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<rect x="90" y="436" width="580" height="80" rx="12" fill="#dbeafe" stroke="#2563eb"/><text x="380" y="462" font-size="17" font-weight="bold">Cause-directed treatment and early specialist referral</text><text x="380" y="486" font-size="14">ICU and transplant-centre consultation when indicated</text><text x="380" y="504" font-size="13">Do not wait for an isolated prognostic score</text>
<text x="380" y="550" font-size="12" fill="#475569">Original teaching schematic · Not a standalone treatment algorithm</text>
</g></svg>
