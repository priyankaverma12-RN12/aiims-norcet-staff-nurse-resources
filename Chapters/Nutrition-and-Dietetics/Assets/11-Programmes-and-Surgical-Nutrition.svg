<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d"><title id="t">Programme and surgical nutrition</title><desc id="d">Two independent educational pathways for programme monitoring and perioperative nutrition.</desc><rect width="960" height="420" rx="14" fill="#f8fafc"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#18344a"><text x="480" y="36" font-size="23" font-weight="bold">Programme and surgical nutrition</text><text x="240" y="75" font-size="18" font-weight="bold">Public nutrition programmes</text><rect x="32" y="92" width="416" height="65" rx="10" stroke="#96adbe" fill="#e6f2ff"/><text x="240" y="118" font-size="15" font-weight="bold">Identify eligibility</text><text x="240" y="140" font-size="13">Age, programme and local registration</text><path d="M240 158v16m-5 -5 5 6 5 -6" fill="none" stroke="#456078" stroke-width="2"/><rect x="32" y="176" width="416" height="65" rx="10" stroke="#96adbe" fill="#e6f2ff"/><text x="240" y="202" font-size="15" font-weight="bold">Check the service norm</text><text x="240" y="224" font-size="13">Named document, food contribution, delivery</text><path d="M240 242v16m-5 -5 5 6 5 -6" fill="none" stroke="#456078" stroke-width="2"/><rect x="32" y="260" width="416" height="65" rx="10" stroke="#96adbe" fill="#e6f2ff"/><text x="240" y="286" font-size="15" font-weight="bold">Monitor and coordinate</text><text x="240" y="308" font-size="13">Coverage, clinical referral, accountability</text><text x="720" y="75" font-size="18" font-weight="bold">Perioperative nutrition</text><rect x="512" y="92" width="416" height="65" rx="10" stroke="#96adbe" fill="#eaf5ec"/><text x="720" y="118" font-size="15" font-weight="bold">Assess nutritional risk</text><text x="720" y="140" font-size="13">Intake, planned surgery, clinical condition</text><path d="M720 158v16m-5 -5 5 6 5 -6" fill="none" stroke="#456078" stroke-width="2"/><rect x="512" y="176" width="416" height="65" rx="10" stroke="#96adbe" fill="#eaf5ec"/><text x="720" y="202" font-size="15" font-weight="bold">Plan appropriate support</text><text x="720" y="224" font-size="13">Timing, route, tolerance, nutrition team</text><path d="M720 242v16m-5 -5 5 6 5 -6" fill="none" stroke="#456078" stroke-width="2"/><rect x="512" y="260" width="416" height="65" rx="10" stroke="#96adbe" fill="#eaf5ec"/><text x="720" y="286" font-size="15" font-weight="bold">Reassess through recovery</text><text x="720" y="308" font-size="13">Actual intake, deficits and discharge follow-up</text><text x="480" y="385" font-size="13">Original study schematic. Verify current local policy and individual clinical orders.</text></g></svg>