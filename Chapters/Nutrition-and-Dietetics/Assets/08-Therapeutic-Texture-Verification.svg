<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 410" role="img" aria-labelledby="t d"><title id="t">Therapeutic texture verification</title><desc id="d">Original workflow linking patient prescription to food testing and intake follow-up.</desc><rect width="940" height="410" rx="16" fill="#f8fafc"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#19344a"><text x="470" y="34" font-size="22" font-weight="bold">Therapeutic texture verification</text><text x="235" y="73" font-size="18" font-weight="bold">Before meal release</text><rect x="40" y="90" width="390" height="66" rx="10" fill="#e6f2ff" stroke="#91a9bc"/><text x="235" y="116" font-size="15" font-weight="bold">Confirm the prescribed levels</text><text x="235" y="139" font-size="13">Food and drink categories separately</text><path d="M235 157v16m-5 -5 5 6 5 -6" fill="none" stroke="#456078" stroke-width="2"/><rect x="40" y="176" width="390" height="66" rx="10" fill="#e6f2ff" stroke="#91a9bc"/><text x="235" y="202" font-size="15" font-weight="bold">Prepare and test the sample</text><text x="235" y="225" font-size="13">Correct method, size, softness and temperature</text><path d="M235 243v16m-5 -5 5 6 5 -6" fill="none" stroke="#456078" stroke-width="2"/><rect x="40" y="262" width="390" height="66" rx="10" fill="#e6f2ff" stroke="#91a9bc"/><text x="235" y="288" font-size="15" font-weight="bold">Resolve test failures</text><text x="235" y="311" font-size="13">Reprocess and retest or provide verified alternative</text><text x="705" y="73" font-size="18" font-weight="bold">During ongoing care</text><rect x="510" y="90" width="390" height="66" rx="10" fill="#e6f5eb" stroke="#91a9bc"/><text x="705" y="116" font-size="15" font-weight="bold">Check actual intake</text><text x="705" y="139" font-size="13">Hydration, energy and protein adequacy</text><path d="M705 157v16m-5 -5 5 6 5 -6" fill="none" stroke="#456078" stroke-width="2"/><rect x="510" y="176" width="390" height="66" rx="10" fill="#e6f5eb" stroke="#91a9bc"/><text x="705" y="202" font-size="15" font-weight="bold">Identify tolerance or acceptance barriers</text><text x="705" y="225" font-size="13">Changes in swallowing or clinical condition</text><path d="M705 243v16m-5 -5 5 6 5 -6" fill="none" stroke="#456078" stroke-width="2"/><rect x="510" y="262" width="390" height="66" rx="10" fill="#e6f5eb" stroke="#91a9bc"/><text x="705" y="288" font-size="15" font-weight="bold">Coordinate reassessment</text><text x="705" y="311" font-size="13">Swallowing clinician and nutrition team</text><text x="470" y="380" font-size="13">Original study schematic — individualized prescriptions and clinical assessment take precedence.</text></g></svg>