<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d"><title id="t">Enteral and parenteral formulation</title><desc id="d">Separate review pathways for enteral formulas and parenteral admixtures.</desc><rect width="960" height="420" rx="14" fill="#f8fafc"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#18344a"><text x="480" y="36" font-size="23" font-weight="bold">Enteral and parenteral formulation</text><text x="240" y="75" font-size="18" font-weight="bold">Enteral formula review</text><rect x="32" y="92" width="416" height="65" rx="10" stroke="#96adbe" fill="#e6f2ff"/><text x="240" y="118" font-size="15" font-weight="bold">Read actual composition</text><text x="240" y="140" font-size="13">Protein form, kcal/mL, water and nutrients</text><path d="M240 158v16m-5 -5 5 6 5 -6" fill="none" stroke="#456078" stroke-width="2"/><rect x="32" y="176" width="416" height="65" rx="10" stroke="#96adbe" fill="#e6f2ff"/><text x="240" y="202" font-size="15" font-weight="bold">Match the approved plan</text><text x="240" y="224" font-size="13">Volume, protein, hydration and tolerance</text><path d="M240 242v16m-5 -5 5 6 5 -6" fill="none" stroke="#456078" stroke-width="2"/><rect x="32" y="260" width="416" height="65" rx="10" stroke="#96adbe" fill="#e6f2ff"/><text x="240" y="286" font-size="15" font-weight="bold">Evaluate delivery</text><text x="240" y="308" font-size="13">Actual hours, intake and clinical outcomes</text><text x="720" y="75" font-size="18" font-weight="bold">Parenteral admixture review</text><rect x="512" y="92" width="416" height="65" rx="10" stroke="#96adbe" fill="#eaf5ec"/><text x="720" y="118" font-size="15" font-weight="bold">Confirm authorized composition</text><text x="720" y="140" font-size="13">Dextrose, amino acids, lipid, micronutrients</text><path d="M720 158v16m-5 -5 5 6 5 -6" fill="none" stroke="#456078" stroke-width="2"/><rect x="512" y="176" width="416" height="65" rx="10" stroke="#96adbe" fill="#eaf5ec"/><text x="720" y="202" font-size="15" font-weight="bold">Check pharmaceutical integrity</text><text x="720" y="224" font-size="13">Compatibility, label, storage and access</text><path d="M720 242v16m-5 -5 5 6 5 -6" fill="none" stroke="#456078" stroke-width="2"/><rect x="512" y="260" width="416" height="65" rx="10" stroke="#96adbe" fill="#eaf5ec"/><text x="720" y="286" font-size="15" font-weight="bold">Monitor and reassess</text><text x="720" y="308" font-size="13">Glucose, fluid, electrolytes and tolerance</text><text x="480" y="385" font-size="13">Original study schematic. Verify current local policy and individual clinical orders.</text></g></svg>