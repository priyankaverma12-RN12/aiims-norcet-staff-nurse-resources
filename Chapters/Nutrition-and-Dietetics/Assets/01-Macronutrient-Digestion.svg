<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">Macronutrient digestion and absorption</title><desc id="desc">Three columns show carbohydrate, protein and fat digestion and initial transport. Simplified educational schematic.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#42566a"/></marker></defs><rect width="900" height="420" rx="16" fill="#f8fafc"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#172d43"><text x="450" y="30" font-size="23" font-weight="bold">Macronutrient digestion</text><text x="450" y="54" font-size="14">Simplified sequence — small intestine is the major absorption site</text><g font-size="16" font-weight="bold"><text x="155" y="88">Carbohydrates</text><text x="450" y="88">Proteins</text><text x="745" y="88">Fats</text></g><g stroke="#9eb4c8" stroke-width="1.5"><rect x="25" y="104" width="260" height="68" rx="12" fill="#e6f2ff"/><rect x="320" y="104" width="260" height="68" rx="12" fill="#e3f4e9"/><rect x="615" y="104" width="260" height="68" rx="12" fill="#fff1db"/><rect x="25" y="204" width="260" height="65" rx="12" fill="#e6f2ff"/><rect x="320" y="204" width="260" height="65" rx="12" fill="#e3f4e9"/><rect x="615" y="204" width="260" height="65" rx="12" fill="#fff1db"/><rect x="25" y="302" width="260" height="73" rx="12" fill="#e6f2ff"/><rect x="320" y="302" width="260" height="73" rx="12" fill="#e3f4e9"/><rect x="615" y="302" width="260" height="73" rx="12" fill="#fff1db"/></g><g font-size="15"><text x="155" y="128">Amylase + brush-border</text><text x="155" y="150">enzymes</text><text x="450" y="128">Pepsin + pancreatic</text><text x="450" y="150">proteases</text><text x="745" y="128">Bile salts + pancreatic</text><text x="745" y="150">lipase</text><text x="155" y="231">Monosaccharides</text><text x="155" y="251">Glucose, galactose, fructose</text><text x="450" y="231">Amino acids</text><text x="450" y="251">and small peptides</text><text x="745" y="231">Fatty acids and</text><text x="745" y="251">monoglycerides</text><text x="155" y="330">Portal blood</text><text x="155" y="352">Energy / glycogen</text><text x="450" y="330">Portal blood</text><text x="450" y="352">Tissue protein synthesis</text><text x="745" y="326">Most long-chain fats:</text><text x="745" y="346">chylomicrons → lymph</text><text x="745" y="363">then blood</text></g><g stroke="#42566a" stroke-width="2" marker-end="url(#a)"><path d="M155 174V199"/><path d="M450 174V199"/><path d="M745 174V199"/><path d="M155 271V298"/><path d="M450 271V298"/><path d="M745 271V298"/></g></g><text x="450" y="404" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#42566a">Original educational diagram — not a complete biochemical pathway</text></svg>