<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 410" role="img" aria-labelledby="t d"><title id="t">Therapeutic meal planning</title><desc id="d">Two paths for diet planning and reassessment, not a clinical prescription.</desc><rect width="940" height="410" rx="16" fill="#f8fafc"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#19344a"><text x="470" y="34" font-size="22" font-weight="bold">Therapeutic meal planning</text><text x="235" y="73" font-size="18" font-weight="bold">Diabetes meal planning</text><rect x="40" y="90" width="390" height="66" rx="10" fill="#e6f2ff" stroke="#91a9bc"/><text x="235" y="116" font-size="15" font-weight="bold">Assess actual meal</text><text x="235" y="139" font-size="13">Carbohydrate amount, timing and food quality</text><path d="M235 157v16m-5 -5 5 6 5 -6" fill="none" stroke="#456078" stroke-width="2"/><rect x="40" y="176" width="390" height="66" rx="10" fill="#e6f2ff" stroke="#91a9bc"/><text x="235" y="202" font-size="15" font-weight="bold">Match the individualized plan</text><text x="235" y="225" font-size="13">Prescribed insulin and medication safety</text><path d="M235 243v16m-5 -5 5 6 5 -6" fill="none" stroke="#456078" stroke-width="2"/><rect x="40" y="262" width="390" height="66" rx="10" fill="#e6f2ff" stroke="#91a9bc"/><text x="235" y="288" font-size="15" font-weight="bold">Evaluate response</text><text x="235" y="311" font-size="13">Meal record, glucose trend and tolerance</text><text x="705" y="73" font-size="18" font-weight="bold">DASH and weight management</text><rect x="510" y="90" width="390" height="66" rx="10" fill="#e6f5eb" stroke="#91a9bc"/><text x="705" y="116" font-size="15" font-weight="bold">Identify goals and constraints</text><text x="705" y="139" font-size="13">Blood pressure, food access, nutrition risk</text><path d="M705 157v16m-5 -5 5 6 5 -6" fill="none" stroke="#456078" stroke-width="2"/><rect x="510" y="176" width="390" height="66" rx="10" fill="#e6f5eb" stroke="#91a9bc"/><text x="705" y="202" font-size="15" font-weight="bold">Plan suitable food choices</text><text x="705" y="225" font-size="13">Sodium, diversity, portions and preferences</text><path d="M705 243v16m-5 -5 5 6 5 -6" fill="none" stroke="#456078" stroke-width="2"/><rect x="510" y="262" width="390" height="66" rx="10" fill="#e6f5eb" stroke="#91a9bc"/><text x="705" y="288" font-size="15" font-weight="bold">Review outcomes</text><text x="705" y="311" font-size="13">Clinical markers, adequacy and function</text><text x="470" y="380" font-size="13">Original study schematic — individualized prescriptions and clinical assessment take precedence.</text></g></svg>