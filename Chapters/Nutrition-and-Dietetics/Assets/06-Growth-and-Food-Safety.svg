<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 410" role="img" aria-labelledby="t d"><title id="t">Child growth assessment and food hygiene</title><desc id="d">Two columns show accurate measurements and food safety practices.</desc><rect width="920" height="410" rx="15" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#19344a" text-anchor="middle"><text x="460" y="34" font-size="22" font-weight="bold">Child growth assessment and food hygiene</text><text x="230" y="72" font-size="18" font-weight="bold">Growth assessment</text><text x="690" y="72" font-size="18" font-weight="bold">Food hygiene</text><rect x="35" y="90" width="390" height="66" rx="12" fill="#e6f2ff" stroke="#93a9ba"/><text x="230" y="117" font-size="15">Measure accurately</text><text x="230" y="139" font-size="14">Weight, length/height, MUAC</text><path d="M230 157v17" stroke="#496479" stroke-width="2"/><path d="M225 170l5 6 5 -6" fill="none" stroke="#496479" stroke-width="2"/><rect x="35" y="177" width="390" height="66" rx="12" fill="#e6f2ff" stroke="#93a9ba"/><text x="230" y="204" font-size="15">Use age-appropriate standards</text><text x="230" y="226" font-size="14">Interpret indicator and trajectory</text><path d="M230 244v17" stroke="#496479" stroke-width="2"/><path d="M225 257l5 6 5 -6" fill="none" stroke="#496479" stroke-width="2"/><rect x="35" y="264" width="390" height="66" rx="12" fill="#e6f2ff" stroke="#93a9ba"/><text x="230" y="291" font-size="15">Assess and refer when indicated</text><text x="230" y="313" font-size="14">Clinical findings and nutritional context</text><rect x="495" y="90" width="390" height="66" rx="12" fill="#fff1dc" stroke="#93a9ba"/><text x="690" y="117" font-size="15">Prevent contamination</text><text x="690" y="139" font-size="14">Clean and separate raw/cooked</text><path d="M690 157v17" stroke="#496479" stroke-width="2"/><path d="M685 170l5 6 5 -6" fill="none" stroke="#496479" stroke-width="2"/><rect x="495" y="177" width="390" height="66" rx="12" fill="#fff1dc" stroke="#93a9ba"/><text x="690" y="204" font-size="15">Cook and hold safely</text><text x="690" y="226" font-size="14">Verify applicable temperature</text><path d="M690 244v17" stroke="#496479" stroke-width="2"/><path d="M685 257l5 6 5 -6" fill="none" stroke="#496479" stroke-width="2"/><rect x="495" y="264" width="390" height="66" rx="12" fill="#fff1dc" stroke="#93a9ba"/><text x="690" y="291" font-size="15">Store safely and reassess</text><text x="690" y="313" font-size="14">Cold chain, traceability, safe water</text><text x="460" y="382" font-size="13">Original educational schematic. Follow current age-specific and local clinical guidance.</text></g></svg>