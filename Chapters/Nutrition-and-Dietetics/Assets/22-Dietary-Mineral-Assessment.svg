<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img" aria-labelledby="title desc">
<title id="title">Dietary mineral assessment</title><desc id="desc">Separate sodium, potassium and magnesium food-source and assessment checks, followed by an individualized review.</desc>
<rect width="900" height="460" rx="16" fill="#f8fafc"/>
<g font-family="Arial,sans-serif" fill="#17334c">
<text x="450" y="38" text-anchor="middle" font-size="24" font-weight="bold">Dietary mineral assessment</text>
<rect x="20" y="66" width="280" height="256" rx="12" fill="#e0f2fe" stroke="#0369a1"/>
<rect x="310" y="66" width="280" height="256" rx="12" fill="#dcfce7" stroke="#15803d"/>
<rect x="600" y="66" width="280" height="256" rx="12" fill="#f3e8ff" stroke="#7e22ce"/>
<g text-anchor="middle"><text x="160" y="100" font-size="21" font-weight="bold">Sodium (Na)</text><text x="450" y="100" font-size="21" font-weight="bold">Potassium (K)</text><text x="740" y="100" font-size="21" font-weight="bold">Magnesium (Mg)</text></g>
<g font-size="15">
<text x="36" y="136" font-weight="bold">Sources</text><text x="36" y="157">Salt, sodium-containing additives</text>
<text x="36" y="192" font-weight="bold">Assessment</text><text x="36" y="213">Food intake and complete urine</text><text x="36" y="234">collections in population surveys</text>
<text x="36" y="270" font-weight="bold">Context</text><text x="36" y="291">Age, energy needs, sweat losses</text>
<text x="326" y="136" font-weight="bold">Sources</text><text x="326" y="157">Pulses, vegetables, dairy, fruit</text>
<text x="326" y="192" font-weight="bold">Assessment</text><text x="326" y="213">Food variety, composition,</text><text x="326" y="234">dietary sodium-to-potassium ratio</text>
<text x="326" y="270" font-weight="bold">Context</text><text x="326" y="291">Renal function and medicines</text>
<text x="616" y="136" font-weight="bold">Sources</text><text x="616" y="157">Whole grains, nuts, water, pulses</text>
<text x="616" y="192" font-weight="bold">Assessment</text><text x="616" y="213">Elemental amount, dietary history,</text><text x="616" y="234">laboratory and clinical findings</text>
<text x="616" y="270" font-weight="bold">Context</text><text x="616" y="291">Absorption, drug interactions</text>
</g>
<path d="M160 322 V343 H450 M450 322 V366 M740 322 V343 H450" stroke="#52687c" stroke-width="2" fill="none"/>
<path d="M444 358 L450 367 L456 358" stroke="#52687c" stroke-width="2" fill="none"/>
<rect x="98" y="370" width="704" height="64" rx="10" fill="#17334c"/>
<text x="450" y="397" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff">Review intake, clinical context and individual care plan</text>
<text x="450" y="417" text-anchor="middle" font-size="13" fill="#fff">General food guidance is not an independent electrolyte treatment order.</text>
</g></svg>
