<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440" role="img" aria-labelledby="title desc">
<title id="title">School meal nursing assessment</title>
<desc id="desc">Check meal access, nutritional quality, safety and actual intake before reassessing.</desc>
<rect width="800" height="440" rx="18" fill="#f4f8fc"/>
<g font-family="Arial,sans-serif" text-anchor="middle" fill="#15324d">
<text x="400" y="42" font-size="25" font-weight="bold">School meal nursing assessment</text>
<rect x="32" y="76" width="350" height="102" rx="12" fill="#e0f2fe" stroke="#0369a1"/>
<text x="207" y="108" font-size="20" font-weight="bold">1. Access</text>
<text x="207" y="136" font-size="16">Timing, packaging, seat time</text>
<text x="207" y="157" font-size="16">Dignity and inclusion</text>
<rect x="418" y="76" width="350" height="102" rx="12" fill="#dcfce7" stroke="#15803d"/>
<text x="593" y="108" font-size="20" font-weight="bold">2. Quality</text>
<text x="593" y="136" font-size="16">Age-appropriate varied meals</text>
<text x="593" y="157" font-size="16">Local foods and standards</text>
<rect x="32" y="206" width="350" height="102" rx="12" fill="#fef3c7" stroke="#a16207"/>
<text x="207" y="238" font-size="20" font-weight="bold">3. Safety</text>
<text x="207" y="266" font-size="16">Safe water, allergen controls</text>
<text x="207" y="287" font-size="16">Individual emergency plans</text>
<rect x="418" y="206" width="350" height="102" rx="12" fill="#f3e8ff" stroke="#7e22ce"/>
<text x="593" y="238" font-size="20" font-weight="bold">4. Actual intake</text>
<text x="593" y="266" font-size="16">Acceptance, leftovers, symptoms</text>
<text x="593" y="287" font-size="16">Confidential referral if needed</text>
<path d="M207 308 V325 H400 M593 308 V325 H400 V341" fill="none" stroke="#334155" stroke-width="3"/>
<path d="M394 334 L400 344 L406 334" fill="#334155"/>
<rect x="140" y="348" width="520" height="62" rx="12" fill="#15324d"/>
<text x="400" y="375" fill="white" font-size="18" font-weight="bold">Coordinate, document and reassess</text>
<text x="400" y="396" fill="white" font-size="15">Nurse + child + family + school team</text>
</g></svg>
