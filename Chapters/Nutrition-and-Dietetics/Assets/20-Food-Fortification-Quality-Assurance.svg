<svg xmlns="http://www.w3.org/2000/svg" width="900" height="550" viewBox="0 0 900 550" role="img" aria-labelledby="title desc">
<title id="title">Food fortification: public health and quality assurance</title>
<desc id="desc">Identify nutrient needs and choose a food vehicle, check applicable standards, verify production and packaging, monitor exposure and outcomes, and revise the programme.</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#334155"/></marker></defs>
<rect width="900" height="550" rx="16" fill="#f8fafc"/>
<g font-family="Arial,sans-serif" text-anchor="middle" fill="#0f172a">
<text x="450" y="36" font-weight="bold" font-size="24">Food fortification: from need to verified benefit</text>
<rect x="65" y="56" width="770" height="65" rx="10" fill="#dbeafe" stroke="#1d4ed8"/>
<text x="450" y="80" font-size="18" font-weight="bold">1. Identify the public health need</text>
<text x="450" y="103" font-size="15">Target group • consumption distribution • other nutrient sources</text>
<path d="M450 121 V143" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="65" y="148" width="770" height="65" rx="10" fill="#e0f2fe" stroke="#0369a1"/>
<text x="450" y="173" font-size="18" font-weight="bold">2. Choose an appropriate vehicle and standard</text>
<text x="450" y="195" font-size="15">Fortificant form • food category • dated schedule and amendments</text>
<path d="M450 213 V235" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="65" y="240" width="770" height="65" rx="10" fill="#dcfce7" stroke="#15803d"/>
<text x="450" y="265" font-size="18" font-weight="bold">3. Verify product and process quality</text>
<text x="450" y="287" font-size="15">Notified laboratory • procurement records • monitoring • audits</text>
<path d="M450 305 V327" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="65" y="332" width="770" height="65" rx="10" fill="#fff7ed" stroke="#c2410c"/>
<text x="450" y="357" font-size="18" font-weight="bold">4. Protect safe delivery and correct use</text>
<text x="450" y="379" font-size="15">Suitable packaging • storage • label instructions • safe preparation</text>
<path d="M450 397 V419" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="65" y="424" width="770" height="65" rx="10" fill="#ede9fe" stroke="#6d28d9"/>
<text x="450" y="449" font-size="18" font-weight="bold">5. Monitor exposure and outcomes</text>
<text x="450" y="471" font-size="15">Assess combined sources and actual intake; revise as evidence changes</text>
<path d="M835 456 H863 V88 H841" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<text x="450" y="522" font-size="13" fill="#475569">Original learning diagram — not a manufacturing protocol or individual treatment plan.</text>
</g>
</svg>
