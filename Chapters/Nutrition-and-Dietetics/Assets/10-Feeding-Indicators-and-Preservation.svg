<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d"><title id="t">Feeding indicators and nutrient preservation</title><desc id="d">Distinct survey conditions and food preparation principles.</desc><rect width="960" height="420" rx="14" fill="#f8fafc"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#17344b"><text x="480" y="34" font-size="23" font-weight="bold">Feeding indicators and nutrient preservation</text><text x="240" y="74" font-size="18" font-weight="bold">Complementary feeding indicators</text><rect x="32" y="92" width="416" height="65" rx="10" stroke="#9aafbd" fill="#e7f2ff"/><text x="240" y="118" font-size="15" font-weight="bold">MDD</text><text x="240" y="140" font-size="13">At least five of eight food groups</text><path d="M240 158v16m-5 -5 5 6 5 -6" fill="none" stroke="#456078" stroke-width="2"/><rect x="32" y="176" width="416" height="65" rx="10" stroke="#9aafbd" fill="#e7f2ff"/><text x="240" y="202" font-size="15" font-weight="bold">MMF</text><text x="240" y="224" font-size="13">Age and breastfeeding-specific feed counts</text><path d="M240 242v16m-5 -5 5 6 5 -6" fill="none" stroke="#456078" stroke-width="2"/><rect x="32" y="260" width="416" height="65" rx="10" stroke="#9aafbd" fill="#e7f2ff"/><text x="240" y="286" font-size="15" font-weight="bold">MAD</text><text x="240" y="308" font-size="13">MDD + MMF, extra milk criterion if non-breastfed</text><text x="720" y="74" font-size="18" font-weight="bold">Nutrient preservation</text><rect x="512" y="92" width="416" height="65" rx="10" stroke="#9aafbd" fill="#eaf5ec"/><text x="720" y="118" font-size="15" font-weight="bold">Prepare carefully</text><text x="720" y="140" font-size="13">Wash before cutting, avoid excessive soaking</text><path d="M720 158v16m-5 -5 5 6 5 -6" fill="none" stroke="#456078" stroke-width="2"/><rect x="512" y="176" width="416" height="65" rx="10" stroke="#9aafbd" fill="#eaf5ec"/><text x="720" y="202" font-size="15" font-weight="bold">Cook appropriately</text><text x="720" y="224" font-size="13">Minimize avoidable leaching and heat losses</text><path d="M720 242v16m-5 -5 5 6 5 -6" fill="none" stroke="#456078" stroke-width="2"/><rect x="512" y="260" width="416" height="65" rx="10" stroke="#9aafbd" fill="#eaf5ec"/><text x="720" y="286" font-size="15" font-weight="bold">Preserve safely</text><text x="720" y="308" font-size="13">Validated processing and correct storage</text><text x="480" y="385" font-size="13">Original educational schematic. Use applicable clinical and programme guidance.</text></g></svg>