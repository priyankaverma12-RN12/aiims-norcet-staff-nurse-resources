<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-labelledby="title desc">
<title id="title">Lipid-specific dietary care</title><desc id="desc">Assessment separates LDL-focused care from triglyceride-specific care, followed by monitoring and individualized nutrition review.</desc>
<rect width="900" height="400" rx="16" fill="#f8fafc"/>
<g font-family="Arial,sans-serif" fill="#172e43" text-anchor="middle">
<text x="450" y="34" font-size="23" font-weight="bold">Lipid-specific dietary care</text>
<rect x="100" y="55" width="700" height="58" rx="12" fill="#e0eaf5" stroke="#56789a"/>
<text x="450" y="79" font-size="17" font-weight="bold">Assess fasting lipids, secondary causes and usual intake</text><text x="450" y="99" font-size="13">Identify the clinical priority and existing prescribed therapy</text>
<path d="M450 113 V131 H225 V148 M450 131 H675 V148" fill="none" stroke="#475569" stroke-width="2"/>
<rect x="35" y="148" width="380" height="130" rx="12" fill="#e8f4e9" stroke="#47856a"/>
<text x="225" y="173" font-size="18" font-weight="bold">LDL-focused care</text><text x="225" y="199" font-size="14">Favour appropriate unsaturated fat sources</text><text x="225" y="221" font-size="14">Plant protein and viscous fibre</text><text x="225" y="243" font-size="14">Consider food quality and clinical suitability</text><text x="225" y="265" font-size="12">Goal: lower atherogenic lipid burden</text>
<rect x="485" y="148" width="380" height="130" rx="12" fill="#fff1df" stroke="#b47a37"/>
<text x="675" y="173" font-size="18" font-weight="bold">TG-focused care</text><text x="675" y="199" font-size="14">Review added sugar and refined carbohydrate</text><text x="675" y="221" font-size="14">500–999: individualize fat limitation</text><text x="675" y="243" font-size="14">≥1000: specialist very-low-fat care</text><text x="675" y="265" font-size="12">Severe elevation: pancreatitis prevention</text>
<path d="M225 278 V297 H450 M675 278 V297 H450 V315" fill="none" stroke="#475569" stroke-width="2"/>
<rect x="80" y="315" width="740" height="65" rx="12" fill="#203d58"/><text x="450" y="340" fill="white" font-size="17" font-weight="bold">Monitor and tailor the plan</text><text x="450" y="363" fill="white" font-size="13">Review both lipid markers, nutrient adequacy, feasibility and prescribed care</text>
</g></svg>
