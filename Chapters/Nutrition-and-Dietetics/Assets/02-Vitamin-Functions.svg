<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="t d"><title id="t">Water-soluble and fat-soluble vitamin functions</title><desc id="d">Two groups of vitamins with high-yield functions and monitoring cautions.</desc><rect width="900" height="470" rx="16" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#142f45"><text x="450" y="34" text-anchor="middle" font-size="24" font-weight="bold">Vitamins: functions and clinical clues</text><rect x="24" y="58" width="414" height="371" rx="14" fill="#e7f3ff" stroke="#94b4cf"/><rect x="462" y="58" width="414" height="371" rx="14" fill="#fff0d9" stroke="#d6b077"/><g font-size="19" font-weight="bold"><text x="44" y="87">Water-soluble</text><text x="482" y="87">Fat-soluble</text></g><g font-size="15"><text x="44" y="121">B1 — energy metabolism and nerves</text><text x="44" y="155">B2 / B3 — redox coenzymes</text><text x="44" y="189">B5 — coenzyme A</text><text x="44" y="223">B6 — amino acid metabolism</text><text x="44" y="257">B9 / B12 — DNA and blood cells</text><text x="44" y="291">B12 — neurological function</text><text x="44" y="325">C — collagen and iron absorption</text><text x="44" y="365" font-weight="bold">Clinical clue:</text><text x="44" y="387">Many have limited stores, but B12 differs.</text><text x="44" y="407">Excess supplements can still cause harm.</text><text x="482" y="121">A — dim-light vision and epithelium</text><text x="482" y="171">D — calcium and phosphate balance</text><text x="482" y="221">E — membrane antioxidant protection</text><text x="482" y="271">K — clotting protein activation</text><text x="482" y="365" font-weight="bold">Clinical clue:</text><text x="482" y="387">Fat malabsorption can reduce uptake.</text><text x="482" y="407">Storage and toxicity risks differ.</text></g><text x="450" y="453" text-anchor="middle" font-size="13" fill="#42566a">Original study schematic — assessment and treatment follow clinical guidance</text></g></svg>