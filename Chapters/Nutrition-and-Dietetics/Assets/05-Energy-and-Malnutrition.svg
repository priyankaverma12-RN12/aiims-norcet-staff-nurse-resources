<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 410" role="img" aria-labelledby="t d"><title id="t">Energy expenditure and malnutrition care</title><desc id="d">Two columns describe energy components and severe malnutrition care phases.</desc><rect width="920" height="410" rx="15" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#19344a" text-anchor="middle"><text x="460" y="34" font-size="22" font-weight="bold">Energy expenditure and malnutrition care</text><text x="230" y="72" font-size="18" font-weight="bold">Daily energy expenditure</text><text x="690" y="72" font-size="18" font-weight="bold">Clinical malnutrition pathway</text><rect x="35" y="90" width="390" height="66" rx="12" fill="#e6f2ff" stroke="#93a9ba"/><text x="230" y="117" font-size="15">Resting expenditure</text><text x="230" y="139" font-size="14">Essential body functions</text><path d="M230 157v17" stroke="#496479" stroke-width="2"/><path d="M225 170l5 6 5 -6" fill="none" stroke="#496479" stroke-width="2"/><rect x="35" y="177" width="390" height="66" rx="12" fill="#e6f2ff" stroke="#93a9ba"/><text x="230" y="204" font-size="15">Thermic effect of food</text><text x="230" y="226" font-size="14">Processing and absorption</text><path d="M230 244v17" stroke="#496479" stroke-width="2"/><path d="M225 257l5 6 5 -6" fill="none" stroke="#496479" stroke-width="2"/><rect x="35" y="264" width="390" height="66" rx="12" fill="#e6f2ff" stroke="#93a9ba"/><text x="230" y="291" font-size="15">Physical activity</text><text x="230" y="313" font-size="14">Movement and exercise</text><rect x="495" y="90" width="390" height="66" rx="12" fill="#fff1dc" stroke="#93a9ba"/><text x="690" y="117" font-size="15">Assess risk and complications</text><text x="690" y="139" font-size="14">Appetite, oedema, danger signs</text><path d="M690 157v17" stroke="#496479" stroke-width="2"/><path d="M685 170l5 6 5 -6" fill="none" stroke="#496479" stroke-width="2"/><rect x="495" y="177" width="390" height="66" rx="12" fill="#fff1dc" stroke="#93a9ba"/><text x="690" y="204" font-size="15">Stabilize when indicated</text><text x="690" y="226" font-size="14">Glucose, warmth, fluids, infection</text><path d="M690 244v17" stroke="#496479" stroke-width="2"/><path d="M685 257l5 6 5 -6" fill="none" stroke="#496479" stroke-width="2"/><rect x="495" y="264" width="390" height="66" rx="12" fill="#fff1dc" stroke="#93a9ba"/><text x="690" y="291" font-size="15">Rehabilitation and follow-up</text><text x="690" y="313" font-size="14">Therapeutic nutrition and monitoring</text><text x="460" y="382" font-size="13">Original educational schematic. Follow current age-specific and local clinical guidance.</text></g></svg>