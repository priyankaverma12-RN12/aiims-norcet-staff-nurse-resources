<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img" aria-labelledby="title desc">
<title id="title">Cookery methods and food changes</title><desc id="desc">Three groups of cooking methods with heat transfer examples and four common chemical or physical food changes.</desc>
<rect width="900" height="460" rx="14" fill="#f8fafc"/>
<g font-family="Arial,sans-serif" fill="#18324b" text-anchor="middle">
<text x="450" y="36" font-size="24" font-weight="bold">Cookery methods and food changes</text>
<rect x="24" y="61" width="276" height="155" rx="12" fill="#e1edf8" stroke="#527aa2"/>
<rect x="312" y="61" width="276" height="155" rx="12" fill="#f9ead7" stroke="#af7a39"/>
<rect x="600" y="61" width="276" height="155" rx="12" fill="#e2f0e8" stroke="#4d8865"/>
<text x="162" y="90" font-size="18" font-weight="bold">Moist heat</text><text x="162" y="116" font-size="15">Water or steam</text><text x="162" y="143" font-size="14">Simmering, poaching</text><text x="162" y="166" font-size="14">Steaming, pressure cooking</text><text x="162" y="191" font-size="13">Useful for softening foods</text>
<text x="450" y="90" font-size="18" font-weight="bold">Dry heat / hot fat</text><text x="450" y="116" font-size="15">Hot surfaces, air or oil</text><text x="450" y="143" font-size="14">Baking, grilling, roasting</text><text x="450" y="166" font-size="14">Sauteing, frying</text><text x="450" y="191" font-size="13">Texture, flavour and browning</text>
<text x="738" y="90" font-size="18" font-weight="bold">Combination</text><text x="738" y="116" font-size="15">Dry then moist heat</text><text x="738" y="143" font-size="14">Braising</text><text x="738" y="166" font-size="14">Brown, cover, cook with liquid</text><text x="738" y="191" font-size="13">Tenderness and flavour</text>
<text x="450" y="246" font-size="15" font-weight="bold">Heat transfer: direct contact • moving fluid • radiation</text>
<rect x="24" y="264" width="420" height="65" rx="10" fill="#edf2f7" stroke="#8aa0b6"/>
<rect x="456" y="264" width="420" height="65" rx="10" fill="#edf2f7" stroke="#8aa0b6"/>
<rect x="24" y="341" width="420" height="65" rx="10" fill="#edf2f7" stroke="#8aa0b6"/>
<rect x="456" y="341" width="420" height="65" rx="10" fill="#edf2f7" stroke="#8aa0b6"/>
<text x="234" y="288" font-size="16" font-weight="bold">Gelatinization</text><text x="234" y="311" font-size="14">Starch + water + heat → swelling</text>
<text x="666" y="288" font-size="16" font-weight="bold">Protein coagulation</text><text x="666" y="311" font-size="14">Heat → protein structure and texture change</text>
<text x="234" y="365" font-size="16" font-weight="bold">Maillard browning</text><text x="234" y="388" font-size="14">Reducing sugar + amino groups</text>
<text x="666" y="365" font-size="16" font-weight="bold">Caramelization</text><text x="666" y="388" font-size="14">Thermal reactions of sugars</text>
<text x="450" y="438" font-size="13">Choose the method according to food, therapeutic needs, equipment and safety.</text>
</g></svg>
