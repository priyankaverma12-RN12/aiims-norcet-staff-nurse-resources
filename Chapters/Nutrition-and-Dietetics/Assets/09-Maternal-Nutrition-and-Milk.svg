<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d"><title id="t">Maternal nutrition and milk safety</title><desc id="d">Two separate study paths for maternal dietary assessment and safe expressed milk handling.</desc><rect width="960" height="420" rx="14" fill="#f8fafc"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#17344b"><text x="480" y="34" font-size="23" font-weight="bold">Maternal nutrition and milk safety</text><text x="240" y="74" font-size="18" font-weight="bold">Maternal nutrition</text><rect x="32" y="92" width="416" height="65" rx="10" stroke="#9aafbd" fill="#e7f2ff"/><text x="240" y="118" font-size="15" font-weight="bold">Assess needs</text><text x="240" y="140" font-size="13">Pregnancy stage, diet, food access, clinical risk</text><path d="M240 158v16m-5 -5 5 6 5 -6" fill="none" stroke="#456078" stroke-width="2"/><rect x="32" y="176" width="416" height="65" rx="10" stroke="#9aafbd" fill="#e7f2ff"/><text x="240" y="202" font-size="15" font-weight="bold">Plan and support</text><text x="240" y="224" font-size="13">Suitable foods, prescribed supplements, family support</text><path d="M240 242v16m-5 -5 5 6 5 -6" fill="none" stroke="#456078" stroke-width="2"/><rect x="32" y="260" width="416" height="65" rx="10" stroke="#9aafbd" fill="#e7f2ff"/><text x="240" y="286" font-size="15" font-weight="bold">Review</text><text x="240" y="308" font-size="13">Intake, symptoms, clinical and nutritional follow-up</text><text x="720" y="74" font-size="18" font-weight="bold">Expressed milk handling</text><rect x="512" y="92" width="416" height="65" rx="10" stroke="#9aafbd" fill="#eaf5ec"/><text x="720" y="118" font-size="15" font-weight="bold">Identify context</text><text x="720" y="140" font-size="13">Healthy-term home guidance or hospital policy</text><path d="M720 158v16m-5 -5 5 6 5 -6" fill="none" stroke="#456078" stroke-width="2"/><rect x="512" y="176" width="416" height="65" rx="10" stroke="#9aafbd" fill="#eaf5ec"/><text x="720" y="202" font-size="15" font-weight="bold">Verify collection and storage</text><text x="720" y="224" font-size="13">Temperature, oldest collection, thaw time</text><path d="M720 242v16m-5 -5 5 6 5 -6" fill="none" stroke="#456078" stroke-width="2"/><rect x="512" y="260" width="416" height="65" rx="10" stroke="#9aafbd" fill="#eaf5ec"/><text x="720" y="286" font-size="15" font-weight="bold">Use or discard appropriately</text><text x="720" y="308" font-size="13">Follow applicable time limits and identity checks</text><text x="480" y="385" font-size="13">Original educational schematic. Use applicable clinical and programme guidance.</text></g></svg>