<svg xmlns="http://www.w3.org/2000/svg" width="900" height="610" viewBox="0 0 900 610" role="img" aria-labelledby="title desc">
<title id="title">Nutrition education planning and evaluation cycle</title>
<desc id="desc">Assess audience and resources, select a practical objective and teaching method, deliver and support action, evaluate reach and outcomes, and adapt after feedback. Independent evidence and accessibility apply throughout.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#334155"/></marker></defs>
<rect width="900" height="610" rx="16" fill="#f8fafc"/>
<g font-family="Arial, sans-serif" fill="#0f172a">
<text x="450" y="37" font-size="25" font-weight="bold" text-anchor="middle">Nutrition education: from learning to action</text>
<rect x="70" y="61" width="760" height="64" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="450" y="86" font-size="18" font-weight="bold" text-anchor="middle">1. Assess audience and resources</text>
<text x="450" y="108" font-size="15" text-anchor="middle">Food access • local practices • language • skills • available materials</text>
<path d="M450 125 V150" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="70" y="155" width="760" height="72" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
<text x="450" y="179" font-size="18" font-weight="bold" text-anchor="middle">2. Select a method for the learning objective</text>
<text x="450" y="201" font-size="15" text-anchor="middle">Awareness: mass media • skill: demonstration • dialogue: group discussion</text>
<text x="450" y="218" font-size="14" text-anchor="middle">Role play for interpersonal practice • discovery for active learning</text>
<path d="M450 227 V252" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="70" y="257" width="760" height="64" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="450" y="282" font-size="18" font-weight="bold" text-anchor="middle">3. Deliver and support feasible action</text>
<text x="450" y="304" font-size="15" text-anchor="middle">Pretest materials • practise skills • address access barriers • keep teaching independent</text>
<path d="M450 321 V346" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="70" y="351" width="760" height="104" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
<text x="450" y="376" font-size="18" font-weight="bold" text-anchor="middle">4. Evaluate at the right level</text>
<text x="450" y="399" font-size="15" text-anchor="middle">Input: resources • process: reach, delivery and fidelity</text>
<text x="450" y="421" font-size="15" text-anchor="middle">Outcome: knowledge, skills and food practices</text>
<text x="450" y="442" font-size="15" text-anchor="middle">Impact: attributable change, with external influences considered</text>
<path d="M450 455 V480" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="70" y="485" width="760" height="64" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
<text x="450" y="510" font-size="18" font-weight="bold" text-anchor="middle">5. Follow up, adapt and reinforce</text>
<text x="450" y="532" font-size="15" text-anchor="middle">Review barriers and choose realistic alternatives with participants</text>
<path d="M830 517 H858 V93 H837" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="450" y="580" text-anchor="middle" font-size="14" fill="#475569">Original study schematic based on FAO nutrition education and evaluation resources</text>
</g></svg>
