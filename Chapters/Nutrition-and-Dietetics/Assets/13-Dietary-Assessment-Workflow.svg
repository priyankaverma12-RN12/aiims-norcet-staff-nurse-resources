<svg xmlns="http://www.w3.org/2000/svg" width="920" height="580" viewBox="0 0 920 580" role="img" aria-labelledby="title desc">
<title id="title">Dietary assessment workflow: choose the method by the assessment question</title>
<desc id="desc">A long-term food pattern leads to a food frequency questionnaire. A current detailed intake leads to a food record. Both methods need portion and food coding checks, then interpretation with clinical assessment and explicit uncertainty.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#334155"/></marker></defs>
<rect width="920" height="580" rx="20" fill="#f8fafc"/>
<g font-family="Arial, sans-serif" fill="#0f172a">
<text x="460" y="40" text-anchor="middle" font-size="25" font-weight="bold">Choose dietary assessment by purpose</text>
<rect x="285" y="64" width="350" height="66" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="460" y="90" text-anchor="middle" font-size="18" font-weight="bold">What do we need to know?</text>
<text x="460" y="112" text-anchor="middle" font-size="15">Match the time period and goal</text>
<g stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arrow)"><path d="M460 130 V150 H240 V180"/><path d="M460 150 H680 V180"/></g>
<rect x="40" y="180" width="400" height="132" rx="12" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
<text x="240" y="207" text-anchor="middle" font-weight="bold" font-size="19">FFQ: usual pattern</text>
<text x="62" y="233" font-size="16">Defined past period, e.g. six months</text>
<text x="62" y="256" font-size="16">Food list + frequency + optional portion</text>
<text x="62" y="279" font-size="16">Check local foods and seasonal intake</text>
<text x="62" y="299" font-size="14" fill="#334155">Not an exact individual nutrient measure</text>
<rect x="480" y="180" width="400" height="132" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="680" y="207" text-anchor="middle" font-weight="bold" font-size="19">Food record: current intake</text>
<text x="502" y="233" font-size="16">Record at the time of consumption</text>
<text x="502" y="256" font-size="16">Weigh or estimate actual portions</text>
<text x="502" y="279" font-size="16">Check drinks, oils, leftovers and recipes</text>
<text x="502" y="299" font-size="14" fill="#334155">Burden and reactivity can affect reporting</text>
<g stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arrow)"><path d="M240 312 V338 H460 V365"/><path d="M680 312 V338 H460 V365"/></g>
<rect x="156" y="365" width="608" height="72" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
<text x="460" y="392" text-anchor="middle" font-size="18" font-weight="bold">Convert only with sufficient data</text>
<text x="460" y="416" text-anchor="middle" font-size="15">Portion units • raw / cooked food code • supplements • missing data</text>
<path d="M460 437 V467" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="105" y="467" width="710" height="72" rx="12" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
<text x="460" y="494" text-anchor="middle" font-size="18" font-weight="bold">Interpret with clinical findings and uncertainty</text>
<text x="460" y="518" text-anchor="middle" font-size="15">Estimated intake ≠ exact absorption or confirmed deficiency</text>
<text x="460" y="561" text-anchor="middle" font-size="13" fill="#475569">Original study schematic • Based on NCI Dietary Assessment Primer and FAO/WHO GIFT</text>
</g>
</svg>
