<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="t d"><title id="t">Nutrition risk to reassessment</title><desc id="d">Adult nutrition screening, clinical assessment, individualized intervention and reassessment. This original schematic is not the MUST form.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#365a72"/></marker></defs><rect width="900" height="420" rx="14" fill="#f8fafc"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#18334a"><text x="450" y="33" font-size="23" font-weight="bold">Nutrition screening to care planning</text><g stroke="#91afc7" stroke-width="1.5"><rect x="25" y="75" width="200" height="165" rx="12" fill="#e6f2ff"/><rect x="242" y="75" width="200" height="165" rx="12" fill="#e8f5eb"/><rect x="459" y="75" width="200" height="165" rx="12" fill="#fff0da"/><rect x="676" y="75" width="200" height="165" rx="12" fill="#ede8ff"/></g><g font-size="16" font-weight="bold"><text x="125" y="105">1. Screen</text><text x="342" y="105">2. Assess</text><text x="559" y="105">3. Plan</text><text x="776" y="105">4. Reassess</text></g><g font-size="14"><text x="125" y="135">Weight / BMI</text><text x="125" y="160">Recent loss</text><text x="125" y="185">Intake and illness</text><text x="342" y="135">Food history</text><text x="342" y="160">Clinical findings</text><text x="342" y="185">Barriers and context</text><text x="559" y="135">Individual goals</text><text x="559" y="160">Dietitian / team</text><text x="559" y="185">Safety checks</text><text x="776" y="135">Actual intake</text><text x="776" y="160">Weight trend</text><text x="776" y="185">Adjust care</text></g><g stroke="#365a72" stroke-width="2" marker-end="url(#a)"><path d="M225 215H239"/><path d="M442 215H456"/><path d="M659 215H673"/><path d="M776 242V284H342V246" fill="none"/></g><text x="559" y="305" font-size="14">Reassess when intake or clinical condition changes</text><rect x="55" y="325" width="790" height="50" rx="10" fill="#fff7e6" stroke="#d5b56e"/><text x="450" y="355" font-size="14" font-weight="bold">High risk or prolonged minimal intake → clinical review before rapid nutrition increases</text><text x="450" y="400" font-size="12">Original workflow, not the MUST form. Use validated local age-appropriate screening tools.</text></g></svg>