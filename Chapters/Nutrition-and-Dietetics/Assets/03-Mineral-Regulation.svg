<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" role="img" aria-labelledby="t d"><title id="t">Calcium feedback and intestinal iron transport</title><desc id="d">Left: low ionized calcium stimulates parathyroid hormone, which supports calcium conservation and phosphate excretion. Right: non-haem iron enters enterocytes via DMT1 and exits via ferroportin, with transferrin transporting it in blood.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#41566e"/></marker></defs><rect width="920" height="440" rx="15" fill="#f8fafc"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#18334a"><text x="460" y="33" font-size="23" font-weight="bold">Mineral regulation and absorption</text><text x="230" y="68" font-size="18" font-weight="bold">Calcium feedback</text><text x="690" y="68" font-size="18" font-weight="bold">Non-haem iron transport</text><g stroke="#93aac0" stroke-width="1.5" fill="#e7f2ff"><rect x="35" y="85" width="390" height="63" rx="10"/><rect x="35" y="180" width="390" height="63" rx="10"/><rect x="35" y="275" width="390" height="88" rx="10"/></g><g stroke="#bb9867" stroke-width="1.5" fill="#fff0d9"><rect x="495" y="85" width="390" height="63" rx="10"/><rect x="495" y="180" width="390" height="63" rx="10"/><rect x="495" y="275" width="390" height="88" rx="10"/></g><g font-size="16"><text x="230" y="123">Low ionized calcium</text><text x="230" y="218">Parathyroid hormone response</text><text x="230" y="310">Kidney conserves calcium</text><text x="230" y="332">and increases phosphate excretion</text><text x="690" y="123">Luminal ferrous iron (Fe²⁺)</text><text x="690" y="207">DMT1 uptake into enterocyte</text><text x="690" y="229">storage in ferritin or export</text><text x="690" y="307">Ferroportin exports iron</text><text x="690" y="330">Transferrin carries iron in blood</text></g><g stroke="#41566e" stroke-width="2" marker-end="url(#a)"><path d="M230 149V175"/><path d="M230 244V270"/><path d="M690 149V175"/><path d="M690 244V270"/></g><text x="460" y="397" font-size="13">Simplified mechanisms. Vitamin D, kidney function, iron regulation and illness also influence balance.</text><text x="460" y="419" font-size="12">Original educational schematic — not a treatment algorithm.</text></g></svg>