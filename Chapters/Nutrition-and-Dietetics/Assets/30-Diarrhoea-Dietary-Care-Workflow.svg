<svg xmlns="http://www.w3.org/2000/svg" width="900" height="580" viewBox="0 0 900 580" role="img" aria-labelledby="title desc">
<title id="title">Diarrhoea nutrition care workflow</title><desc id="desc">Assess clinical severity, then review dietary triggers and nutrient adequacy, use supervised pediatric protocols if indicated, and monitor response.</desc>
<rect width="900" height="580" rx="16" fill="#f8fafc"/>
<g font-family="Arial,sans-serif" text-anchor="middle" fill="#162437">
<text x="450" y="38" font-size="26" font-weight="bold">Diarrhoea: nutrition within clinical care</text>
<rect x="40" y="60" width="820" height="80" rx="12" fill="#dbeafe" stroke="#2563eb"/><text x="450" y="88" font-size="19" font-weight="bold">1. Assess severity, hydration and nutrition</text><text x="450" y="113" font-size="15">Escalate danger signs, persistent symptoms, severe illness or malnutrition</text>
<path d="M450 140 V166 l-6 -8 m6 8 l6 -8" fill="none" stroke="#334155" stroke-width="2"/>
<rect x="40" y="170" width="820" height="80" rx="12" fill="#e0f2fe" stroke="#0284c7"/><text x="450" y="198" font-size="19" font-weight="bold">2. Review intake and targeted dietary triggers</text><text x="450" y="223" font-size="15">Preserve tolerated nutrition; avoid unnecessary long-term exclusions</text>
<path d="M450 250 V276 l-6 -8 m6 8 l6 -8" fill="none" stroke="#334155" stroke-width="2"/>
<rect x="40" y="280" width="820" height="80" rx="12" fill="#dcfce7" stroke="#15803d"/><text x="450" y="308" font-size="19" font-weight="bold">3. Address specific nutritional needs</text><text x="450" y="333" font-size="15">Lactose tolerance, renal restrictions, oncology plan, calcium and vitamin D</text>
<path d="M450 360 V386 l-6 -8 m6 8 l6 -8" fill="none" stroke="#334155" stroke-width="2"/>
<rect x="40" y="390" width="820" height="80" rx="12" fill="#fff7ed" stroke="#c2410c"/><text x="450" y="418" font-size="19" font-weight="bold">4. Persistent diarrhoea in children: clinical protocol</text><text x="450" y="443" font-size="15">Named 2023 F-IMNCI diets A/B/C are supervised, not universal recipes</text>
<path d="M450 470 V496 l-6 -8 m6 8 l6 -8" fill="none" stroke="#334155" stroke-width="2"/>
<rect x="40" y="500" width="820" height="60" rx="12" fill="#ede9fe" stroke="#7c3aed"/><text x="450" y="524" font-size="19" font-weight="bold">5. Monitor intake, stool pattern and clinical response</text><text x="450" y="546" font-size="14">Review with treating team before changing or withdrawing dietary support</text>
</g></svg>
