<svg xmlns="http://www.w3.org/2000/svg" width="820" height="450" viewBox="0 0 820 450" role="img" aria-labelledby="t"><title id="t">GLIM adult malnutrition diagnostic logic</title><rect width="820" height="450" rx="16" fill="#f7fafc"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#17334b"><text x="410" y="34" font-size="24" font-weight="bold">GLIM 2025: diagnostic logic</text><rect x="200" y="53" width="420" height="48" rx="10" fill="#dceaf9" stroke="#52769b"/><text x="410" y="83" font-size="17">Validated nutrition risk screening</text><path d="M410 101 V121 H215 V137 M410 121 H605 V137" fill="none" stroke="#52677b" stroke-width="2"/><rect x="25" y="137" width="380" height="116" rx="10" fill="#e5f2e9" stroke="#528368"/><rect x="415" y="137" width="380" height="116" rx="10" fill="#f9ecd8" stroke="#ae8047"/><text x="215" y="161" font-size="17" font-weight="bold">Phenotypic findings</text><text x="215" y="187" font-size="14">Unintentional weight loss</text><text x="215" y="209" font-size="14">Low BMI</text><text x="215" y="231" font-size="14">Low muscle mass</text><text x="605" y="161" font-size="17" font-weight="bold">Etiologic findings</text><text x="605" y="190" font-size="14">Reduced intake or assimilation</text><text x="605" y="218" font-size="14">Inflammatory disease burden</text><path d="M215 253 V269 H410 M605 253 V269 H410 V286" fill="none" stroke="#52677b" stroke-width="2"/><rect x="105" y="286" width="610" height="58" rx="10" fill="#203d58"/><text x="410" y="309" font-size="17" font-weight="bold" fill="white">Confirm: at least one from each domain</text><text x="410" y="329" font-size="14" fill="white">Grade severity using supported phenotypic findings</text><text x="410" y="373" font-size="15">Assess all five to exclude the diagnosis.</text><text x="410" y="397" font-size="14">Document missing measurements and limitations.</text><text x="410" y="422" font-size="14">Confirmed diagnosis → comprehensive assessment and care plan</text></g></svg>
