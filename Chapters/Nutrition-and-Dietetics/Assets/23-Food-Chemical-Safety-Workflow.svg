<svg xmlns="http://www.w3.org/2000/svg" width="900" height="550" viewBox="0 0 900 550" role="img" aria-labelledby="title desc">
<title id="title">Food chemical safety: concentration, exposure and regulatory decisions</title>
<desc id="desc">Identify the substance and food category, check applicable conditions and date, estimate dietary exposure, distinguish regulatory compliance from clinical diagnosis and use source control and qualified testing.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#334155"/></marker></defs>
<rect width="900" height="550" rx="16" fill="#f8fafc"/>
<g font-family="Arial,sans-serif" fill="#0f172a" text-anchor="middle">
<text x="450" y="36" font-size="24" font-weight="bold">Food chemical safety: two different measures</text>
<rect x="55" y="60" width="790" height="65" rx="10" fill="#dbeafe" stroke="#1d4ed8"/>
<text x="450" y="85" font-size="18" font-weight="bold">Identify substance, food category and applicable rule</text>
<text x="450" y="107" font-size="15">Additive, processing aid, contaminant or residue? Check effective date.</text>
<path d="M450 125 V143 H235 V162" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M450 143 H665 V162" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="55" y="167" width="360" height="112" rx="10" fill="#e0f2fe" stroke="#0369a1"/>
<text x="235" y="194" font-size="18" font-weight="bold">Commodity concentration</text>
<text x="235" y="218" font-size="15">mg or micrograms per kg food</text>
<text x="235" y="241" font-size="15">Compare with applicable ML or MRL</text>
<text x="235" y="263" font-size="14">Use qualified sampling and testing</text>
<rect x="485" y="167" width="360" height="112" rx="10" fill="#dcfce7" stroke="#15803d"/>
<text x="665" y="194" font-size="18" font-weight="bold">Dietary exposure</text>
<text x="665" y="218" font-size="15">Concentration × food amount</text>
<text x="665" y="241" font-size="15">Sum sources; divide by body weight</text>
<text x="665" y="263" font-size="14">Compare with appropriate risk reference</text>
<path d="M235 279 V300 H450 V323" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M665 279 V300 H450" fill="none" stroke="#334155" stroke-width="2"/>
<rect x="115" y="328" width="670" height="75" rx="10" fill="#fff7ed" stroke="#c2410c"/>
<text x="450" y="355" font-size="18" font-weight="bold">Interpret without overclaiming</text>
<text x="450" y="380" font-size="15">Compliance, exposure and clinical diagnosis are not interchangeable.</text>
<path d="M450 403 V429" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="115" y="434" width="670" height="70" rx="10" fill="#ede9fe" stroke="#6d28d9"/>
<text x="450" y="460" font-size="18" font-weight="bold">Prevent exposure and escalate concerns appropriately</text>
<text x="450" y="482" font-size="15">Safe sourcing, storage, official investigation and clinical assessment</text>
<text x="450" y="533" font-size="13" fill="#475569">Original educational schematic based on WHO and Codex guidance.</text>
</g></svg>
