<svg xmlns="http://www.w3.org/2000/svg" width="780" height="650" viewBox="0 0 780 650" role="img" aria-labelledby="title desc"><title id="title">Geriatric rehabilitation</title><desc id="desc">Assess function and patient goals. Choose realistic measurable outcomes. Match training and assistive products. Practise safely with the care team. Reassess participation and adapt plan</desc><rect width="780" height="650" fill="#f4f8fb"/><text x="390" y="45" font-size="25" font-family="Arial" text-anchor="middle" fill="#18374a" font-weight="bold">Geriatric rehabilitation</text><rect x="95" y="75" width="590" height="65" rx="12" fill="#e1ecf8" stroke="#315d77" stroke-width="2"/><text x="390" y="115" text-anchor="middle" font-size="19" font-family="Arial" fill="#17394c">Assess function and patient goals</text><path d="M390 140 v28" stroke="#315d77" stroke-width="3"/><path d="M383 161 l7 9 7 -9" fill="none" stroke="#315d77" stroke-width="3"/><rect x="95" y="178" width="590" height="65" rx="12" fill="#dceee7" stroke="#315d77" stroke-width="2"/><text x="390" y="218" text-anchor="middle" font-size="19" font-family="Arial" fill="#17394c">Choose realistic measurable outcomes</text><path d="M390 243 v28" stroke="#315d77" stroke-width="3"/><path d="M383 264 l7 9 7 -9" fill="none" stroke="#315d77" stroke-width="3"/><rect x="95" y="281" width="590" height="65" rx="12" fill="#e1ecf8" stroke="#315d77" stroke-width="2"/><text x="390" y="321" text-anchor="middle" font-size="19" font-family="Arial" fill="#17394c">Match training and assistive products</text><path d="M390 346 v28" stroke="#315d77" stroke-width="3"/><path d="M383 367 l7 9 7 -9" fill="none" stroke="#315d77" stroke-width="3"/><rect x="95" y="384" width="590" height="65" rx="12" fill="#dceee7" stroke="#315d77" stroke-width="2"/><text x="390" y="424" text-anchor="middle" font-size="19" font-family="Arial" fill="#17394c">Practise safely with the care team</text><path d="M390 449 v28" stroke="#315d77" stroke-width="3"/><path d="M383 470 l7 9 7 -9" fill="none" stroke="#315d77" stroke-width="3"/><rect x="95" y="487" width="590" height="65" rx="12" fill="#e1ecf8" stroke="#315d77" stroke-width="2"/><text x="390" y="527" text-anchor="middle" font-size="19" font-family="Arial" fill="#17394c">Reassess participation and adapt plan</text><text x="390" y="620" text-anchor="middle" font-size="16" font-family="Arial" fill="#344f61">Individual assessment and local care pathways apply.</text></svg>
