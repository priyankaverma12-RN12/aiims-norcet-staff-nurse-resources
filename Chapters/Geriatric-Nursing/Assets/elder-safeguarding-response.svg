<svg xmlns="http://www.w3.org/2000/svg" width="700" height="440" viewBox="0 0 700 440" role="img" aria-labelledby="t d"><title id="t">Safeguarding nursing response</title><desc id="d">Recognize a concern, ensure safety, listen and document, escalate and plan follow-up.</desc><rect width="700" height="440" rx="12" fill="#f8fafc"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#183153"><text x="350" y="30" font-size="22" font-weight="bold">Elder safeguarding: nursing response</text><rect x="95" y="52" width="510" height="49" rx="10" fill="#e4edf6" stroke="#627f9e"/><text x="350" y="83" font-size="17" font-weight="bold">Recognize concern</text><path d="M350 101v20l-6-8m6 8l6-8" fill="none" stroke="#627f9e" stroke-width="2"/><rect x="95" y="126" width="510" height="49" rx="10" fill="#ffe4df" stroke="#627f9e"/><text x="350" y="157" font-size="17" font-weight="bold">Ensure safety and urgent care</text><path d="M350 175v20l-6-8m6 8l6-8" fill="none" stroke="#627f9e" stroke-width="2"/><rect x="95" y="200" width="510" height="49" rx="10" fill="#e4edf6" stroke="#627f9e"/><text x="350" y="231" font-size="17" font-weight="bold">Listen privately and document facts</text><path d="M350 249v20l-6-8m6 8l6-8" fill="none" stroke="#627f9e" stroke-width="2"/><rect x="95" y="274" width="510" height="49" rx="10" fill="#e4edf6" stroke="#627f9e"/><text x="350" y="305" font-size="17" font-weight="bold">Use authorized safeguarding pathway</text><path d="M350 323v20l-6-8m6 8l6-8" fill="none" stroke="#627f9e" stroke-width="2"/><rect x="95" y="348" width="510" height="49" rx="10" fill="#e4edf6" stroke="#627f9e"/><text x="350" y="379" font-size="17" font-weight="bold">Plan safe follow-up with the person</text><text x="350" y="424" font-size="13">Emergency care must not wait for routine reporting.</text></g></svg>
