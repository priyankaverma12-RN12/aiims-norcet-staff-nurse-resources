<svg xmlns="http://www.w3.org/2000/svg" width="720" height="510" viewBox="0 0 720 510" role="img" aria-labelledby="title desc"><title id="title">NPHCE care and referral pathway</title><desc id="desc">Four connected levels from home and community through primary and district to specialist tertiary care. Emergency care bypasses routine referrals.</desc><rect width="720" height="510" rx="14" fill="#f7fafc"/><text x="360" y="34" font-family="Arial,sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#183153">NPHCE: care close to home</text><g font-family="Arial,sans-serif" text-anchor="middle" fill="#183153"><rect x="125" y="60" width="470" height="70" rx="12" fill="#dcefe8" stroke="#427b6a"/><text x="360" y="87" font-size="18" font-weight="bold">Home and community</text><text x="360" y="111" font-size="15">Home visits, needs assessment, support</text><path d="M360 130 V155 l-7 -9 m7 9 l7 -9" fill="none" stroke="#427b6a" stroke-width="3"/><rect x="125" y="160" width="470" height="70" rx="12" fill="#e2edf9" stroke="#557da8"/><text x="360" y="187" font-size="18" font-weight="bold">Primary care: HWC, PHC, CHC</text><text x="360" y="211" font-size="15">Available care and appropriate referral</text><path d="M360 230 V255 l-7 -9 m7 9 l7 -9" fill="none" stroke="#557da8" stroke-width="3"/><rect x="125" y="260" width="470" height="70" rx="12" fill="#fff1d9" stroke="#b88a3f"/><text x="360" y="287" font-size="18" font-weight="bold">District hospital</text><text x="360" y="311" font-size="15">Dedicated geriatric services and inpatient care</text><path d="M360 330 V355 l-7 -9 m7 9 l7 -9" fill="none" stroke="#b88a3f" stroke-width="3"/><rect x="125" y="360" width="470" height="70" rx="12" fill="#eee5f7" stroke="#8f6bac"/><text x="360" y="387" font-size="18" font-weight="bold">Regional and national geriatric centres</text><text x="360" y="411" font-size="15">Specialist tertiary assessment and treatment</text><text x="360" y="460" font-size="15" font-weight="bold" fill="#a13232">Emergency signs: activate urgent referral immediately.</text><text x="360" y="484" font-size="14">Follow-up returns to the local care team. Services vary by facility.</text></g></svg>
