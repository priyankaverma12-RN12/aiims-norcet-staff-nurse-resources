<svg xmlns="http://www.w3.org/2000/svg" width="760" height="410" viewBox="0 0 760 410" role="img" aria-labelledby="t d"><title id="t">Continence assessment patterns</title><desc id="d">Four common urine leakage patterns plus reassessment of overlapping and reversible causes.</desc><rect width="760" height="410" rx="14" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#183153" text-anchor="middle"><text x="380" y="34" font-size="23" font-weight="bold">Urinary leakage: identify the pattern</text><rect x="32" y="62" width="336" height="82" rx="12" fill="#dcefe8" stroke="#66839b"/><text x="200" y="92" font-size="19" font-weight="bold">Stress</text><text x="200" y="118" font-size="14">Cough or pressure rise</text><rect x="382" y="62" width="336" height="82" rx="12" fill="#e3edf9" stroke="#66839b"/><text x="550" y="92" font-size="19" font-weight="bold">Urgency</text><text x="550" y="118" font-size="14">Strong urge before leakage</text><rect x="32" y="165" width="336" height="82" rx="12" fill="#fff1d9" stroke="#66839b"/><text x="200" y="195" font-size="19" font-weight="bold">Overflow</text><text x="200" y="221" font-size="14">Overfilled bladder / poor emptying</text><rect x="382" y="165" width="336" height="82" rx="12" fill="#eee5f7" stroke="#66839b"/><text x="550" y="195" font-size="19" font-weight="bold">Functional</text><text x="550" y="221" font-size="14">Mobility, cognition or access barrier</text><rect x="60" y="280" width="640" height="80" rx="12" fill="#e8edf2" stroke="#66839b"/><text x="380" y="308" font-size="18" font-weight="bold">Patterns may overlap</text><text x="380" y="335" font-size="15">Check reversible causes, baseline, medicines and bowel function.</text><text x="380" y="392" font-size="14">New or severe symptoms require appropriate clinical assessment.</text></g></svg>
