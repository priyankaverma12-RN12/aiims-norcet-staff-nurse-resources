<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440" role="img" aria-labelledby="t"><title id="t">Gestational age and birth-weight classification are independent</title><rect width="800" height="440" rx="14" fill="#f1f5f9"/><g font-family="Arial,sans-serif" fill="#17324b" text-anchor="middle"><text x="400" y="34" font-size="23" font-weight="bold">Two independent neonatal classifications</text><rect x="30" y="56" width="360" height="320" rx="12" fill="#e0f2fe" stroke="#0369a1"/><text x="210" y="85" font-size="19" font-weight="bold">Gestational age</text><text x="210" y="113" font-size="14">Preterm: before 37 completed weeks</text><rect x="53" y="135" width="314" height="44" rx="6" fill="#fee2e2"/><text x="210" y="162" font-size="14">Extremely preterm: below 28 weeks</text><rect x="53" y="187" width="314" height="44" rx="6" fill="#ffedd5"/><text x="210" y="214" font-size="14">Very preterm: 28 to 31 weeks + 6 days</text><rect x="53" y="239" width="314" height="44" rx="6" fill="#fef3c7"/><text x="210" y="266" font-size="14">Moderate: 32 to 33 weeks + 6 days</text><rect x="53" y="291" width="314" height="44" rx="6" fill="#dcfce7"/><text x="210" y="318" font-size="14">Late: 34 to 36 weeks + 6 days</text><rect x="410" y="56" width="360" height="320" rx="12" fill="#ecfdf5" stroke="#047857"/><text x="590" y="85" font-size="19" font-weight="bold">Birth weight</text><text x="590" y="113" font-size="14">Nested thresholds</text><rect x="440" y="134" width="300" height="205" rx="9" fill="#bbf7d0" stroke="#15803d"/><text x="590" y="159" font-size="15">LBW: below 2500 g</text><rect x="465" y="179" width="250" height="137" rx="9" fill="#fde68a" stroke="#a16207"/><text x="590" y="205" font-size="15">VLBW: below 1500 g</text><rect x="488" y="224" width="204" height="69" rx="9" fill="#fecaca" stroke="#b91c1c"/><text x="590" y="263" font-size="15">ELBW: below 1000 g</text><text x="400" y="409" font-size="14">A term infant can also have low birth weight. Clinical risk assessment needs both.</text></g></svg>