<svg xmlns="http://www.w3.org/2000/svg" width="820" height="345" viewBox="0 0 820 345" role="img" aria-labelledby="t"><title id="t">Newborn screening follow-up</title><rect width="820" height="345" rx="12" fill="#f4f8fc"/><g font-family="Arial" text-anchor="middle" fill="#17324b"><text x="410" y="32" font-size="22" font-weight="bold">Screening is not a diagnosis</text><rect x="185" y="55" width="450" height="59" rx="9" fill="#dbeafe"/><text x="410" y="79" font-size="16">Verify identity and perform indicated screen</text><text x="410" y="99" font-size="14">Document actual result</text><path d="M410 114V139H205V158 M410 139H615V158" stroke="#456" stroke-width="3" fill="none"/><rect x="25" y="158" width="360" height="70" rx="9" fill="#dcfce7"/><text x="205" y="184" font-size="16">Pass</text><text x="205" y="207" font-size="14">Routine care and ongoing surveillance</text><rect x="435" y="158" width="360" height="70" rx="9" fill="#fef3c7"/><text x="615" y="184" font-size="16">Nonpass or abnormal</text><text x="615" y="207" font-size="14">Programme-specific repeat or urgent referral</text><rect x="110" y="256" width="600" height="60" rx="9" fill="#e0e7ff"/><text x="410" y="281" font-size="16">Track diagnostic completion and clinical concerns</text><text x="410" y="302" font-size="14">Clinical danger signs require assessment regardless of prior pass.</text></g></svg>