<svg xmlns="http://www.w3.org/2000/svg" width="820" height="350" viewBox="0 0 820 350" role="img" aria-labelledby="t"><title id="t">Congenital bowel obstruction mechanisms</title><rect width="820" height="350" rx="12" fill="#f4f8fc"/><g font-family="Arial" text-anchor="middle" fill="#17324b"><text x="410" y="32" font-size="22" font-weight="bold">Neonatal proximal bowel obstruction</text><rect x="25" y="55" width="370" height="150" rx="9" fill="#dbeafe"/><text x="210" y="83" font-size="18" font-weight="bold">Duodenal obstruction</text><ellipse cx="160" cy="125" rx="56" ry="29" fill="#fff" stroke="#527d9b" stroke-width="4"/><ellipse cx="261" cy="125" rx="31" ry="25" fill="#fff" stroke="#527d9b" stroke-width="4"/><path d="M216 125H230M294 110V140" stroke="#b91c1c" stroke-width="5"/><text x="210" y="176" font-size="14">Stomach + proximal duodenum: double bubble</text><rect x="425" y="55" width="370" height="150" rx="9" fill="#fee2e2"/><text x="610" y="83" font-size="18" font-weight="bold">Malrotation with volvulus</text><path d="M610 100C550 105 550 165 610 165S670 105 610 105S550 145 610 145" stroke="#a16207" stroke-width="9" fill="none"/><path d="M610 99V167" stroke="#b91c1c" stroke-width="3" stroke-dasharray="5 3"/><text x="610" y="190" font-size="14">Twisting threatens mesenteric blood flow</text><path d="M210 205V225H410 M610 205V225H410V245" stroke="#456" stroke-width="3" fill="none"/><rect x="105" y="245" width="610" height="71" rx="9" fill="#fef3c7"/><text x="410" y="271" font-size="16">Urgent neonatal and surgical assessment</text><text x="410" y="294" font-size="14">Normal plain film does not exclude volvulus</text><text x="410" y="336" font-size="13">Conceptual schematic; not diagnostic imaging.</text></g></svg>