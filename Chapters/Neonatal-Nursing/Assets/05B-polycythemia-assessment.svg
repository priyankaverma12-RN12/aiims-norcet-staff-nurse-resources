<svg xmlns="http://www.w3.org/2000/svg" width="820" height="350" viewBox="0 0 820 350" role="img" aria-labelledby="t"><title id="t">Polycythemia assessment pathway</title><rect width="820" height="350" rx="12" fill="#f4f8fc"/><g font-family="Arial" text-anchor="middle" fill="#18324b"><text x="410" y="32" font-size="22" font-weight="bold">UCSF local consensus: neonatal polycythemia</text><rect x="180" y="55" width="460" height="55" rx="9" fill="#dbeafe"/><text x="410" y="79" font-size="16">Symptoms and venous Hct assessment</text><text x="410" y="98" font-size="13">Scope: infants at least 34 weeks</text><path d="M410 110V135H205V155 M410 135H615V155" stroke="#456" stroke-width="3" fill="none"/><rect x="25" y="155" width="360" height="88" rx="9" fill="#fee2e2"/><text x="205" y="181" font-size="16">Symptoms + venous Hct above 65%</text><text x="205" y="204" font-size="14">Specialist PET consideration</text><text x="205" y="223" font-size="14">Evaluate other causes concurrently</text><rect x="435" y="155" width="360" height="88" rx="9" fill="#dcfce7"/><text x="615" y="181" font-size="16">Asymptomatic</text><text x="615" y="204" font-size="14">At or below 75%: no PET</text><text x="615" y="223" font-size="14">Above 75%: limited-evidence consideration</text><rect x="110" y="270" width="600" height="53" rx="9" fill="#fef3c7"/><text x="410" y="293" font-size="16">Clinical monitoring and individualized specialist decision</text><text x="410" y="312" font-size="13">Not a universal treatment protocol.</text></g></svg>