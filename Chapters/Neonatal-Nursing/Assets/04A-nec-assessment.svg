<svg xmlns="http://www.w3.org/2000/svg" width="800" height="330" viewBox="0 0 800 330" role="img" aria-labelledby="t"><title id="t">NEC assessment and escalation</title><rect width="800" height="330" rx="12" fill="#f4f8fc"/><g font-family="Arial" text-anchor="middle" fill="#18324b"><text x="400" y="32" font-size="22" font-weight="bold">Suspected neonatal NEC</text><rect x="200" y="50" width="400" height="60" rx="10" fill="#fef3c7"/><text x="400" y="76" font-size="16">New bowel signs or systemic deterioration</text><text x="400" y="95" font-size="14">Distension, tenderness, blood in stool</text><path d="M400 110V135" stroke="#456" stroke-width="3"/><rect x="200" y="135" width="400" height="65" rx="10" fill="#dbeafe"/><text x="400" y="160" font-size="16">Hold feeds, escalate, assess stability</text><text x="400" y="182" font-size="14">Prescribed decompression and investigations</text><path d="M400 200V225H200V245 M400 225H600V245" stroke="#456" fill="none" stroke-width="3"/><rect x="25" y="245" width="350" height="60" rx="10" fill="#dcfce7"/><text x="200" y="270" font-size="16">Serial clinical and imaging review</text><text x="200" y="290" font-size="14">Fluids, nutrition and prescribed treatment</text><rect x="425" y="245" width="350" height="60" rx="10" fill="#fee2e2"/><text x="600" y="270" font-size="16">Perforation or deterioration</text><text x="600" y="290" font-size="14">Urgent stabilization and surgical review</text></g></svg>