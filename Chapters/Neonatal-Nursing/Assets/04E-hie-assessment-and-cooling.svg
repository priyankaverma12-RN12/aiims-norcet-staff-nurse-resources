<svg xmlns="http://www.w3.org/2000/svg" width="820" height="380" viewBox="0 0 820 380" role="img" aria-labelledby="t"><title id="t">HIE recognition and specialist-directed treatment pathway</title><rect width="820" height="380" rx="12" fill="#f4f8fc"/><g font-family="Arial" text-anchor="middle" fill="#17324b"><text x="410" y="32" font-size="22" font-weight="bold">Neonatal encephalopathy: assess early</text><rect x="160" y="52" width="500" height="63" rx="9" fill="#fee2e2"/><text x="410" y="77" font-size="16">Stabilize and evaluate possible cause</text><text x="410" y="99" font-size="14">Perinatal history, serial neurological assessment</text><path d="M410 115V135" stroke="#456" stroke-width="3"/><rect x="160" y="135" width="500" height="64" rx="9" fill="#fef3c7"/><text x="410" y="160" font-size="16">Urgent specialist eligibility review</text><text x="410" y="182" font-size="14">Guideline, gestation, severity, time and facility capability</text><path d="M410 199V220H205V239 M410 220H615V239" stroke="#456" stroke-width="3" fill="none"/><rect x="25" y="239" width="360" height="74" rx="9" fill="#dbeafe"/><text x="205" y="264" font-size="16">If prescribed: controlled cooling</text><text x="205" y="286" font-size="14">Core monitoring and controlled rewarming</text><rect x="435" y="239" width="360" height="74" rx="9" fill="#dcfce7"/><text x="615" y="264" font-size="16">All infants: appropriate supportive care</text><text x="615" y="286" font-size="14">Multiorgan monitoring and follow-up</text><text x="410" y="345" font-size="14">Not a treatment algorithm. Use a defined specialist protocol.</text><text x="410" y="365" font-size="13">No uncontrolled cooling or blanket eligibility assumption.</text></g></svg>