<svg xmlns="http://www.w3.org/2000/svg" width="820" height="420" viewBox="0 0 820 420" role="img" aria-labelledby="t"><title id="t">Bilirubin production and elimination</title><rect width="820" height="420" rx="12" fill="#f4f8fc"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#17324b"><text x="410" y="32" font-size="22" font-weight="bold">Neonatal bilirubin pathway</text><rect x="245" y="55" width="330" height="52" rx="8" fill="#fee2e2" stroke="#b91c1c"/><text x="410" y="86" font-size="16">Red cell breakdown</text><path d="M410 107V130" stroke="#456" stroke-width="3"/><rect x="245" y="130" width="330" height="62" rx="8" fill="#fef3c7" stroke="#a16207"/><text x="410" y="155" font-size="16">Unconjugated bilirubin</text><text x="410" y="177" font-size="14">Albumin carries it in blood</text><path d="M410 192V220H195V240 M410 220H625V240" stroke="#456" fill="none" stroke-width="3"/><rect x="30" y="240" width="330" height="80" rx="9" fill="#dbeafe" stroke="#34669b"/><text x="195" y="266" font-size="16" font-weight="bold">Liver conjugation</text><text x="195" y="289" font-size="14">Water-soluble bilirubin</text><text x="195" y="308" font-size="14">Bile and intestinal elimination</text><rect x="460" y="240" width="330" height="80" rx="9" fill="#dcfce7" stroke="#15803d"/><text x="625" y="266" font-size="16" font-weight="bold">Prescribed phototherapy</text><text x="625" y="289" font-size="14">Light-induced bilirubin isomers</text><text x="625" y="308" font-size="14">Facilitated elimination</text><text x="410" y="365" font-size="14">Investigate hemolysis or cholestasis when indicated.</text><text x="410" y="389" font-size="14">Use the correct age, gestation and risk-specific treatment chart.</text></g></svg>
