<svg xmlns="http://www.w3.org/2000/svg" width="820" height="430" viewBox="0 0 820 430" role="img" aria-labelledby="t"><title id="t">Risk-based neonatal glucose assessment</title><rect width="820" height="430" rx="12" fill="#f4f8fc"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#17324b"><text x="410" y="32" font-size="22" font-weight="bold">Neonatal glucose assessment</text><rect x="225" y="54" width="370" height="65" rx="9" fill="#dbeafe" stroke="#34669b"/><text x="410" y="79" font-size="16" font-weight="bold">Identify risk and clinical symptoms</text><text x="410" y="101" font-size="14">Measure glucose using an appropriate method</text><path d="M410 119V145H205V165 M410 145H615V165" fill="none" stroke="#456" stroke-width="3"/><rect x="30" y="165" width="350" height="80" rx="9" fill="#dcfce7" stroke="#15803d"/><text x="205" y="190" font-weight="bold">Well, at-risk infant</text><text x="205" y="213" font-size="14">Age-specific protocol, feeds, eligible gel</text><text x="205" y="231" font-size="14">Repeat glucose as directed</text><rect x="440" y="165" width="350" height="80" rx="9" fill="#fee2e2" stroke="#b91c1c"/><text x="615" y="190" font-weight="bold">Symptomatic or unstable</text><text x="615" y="213" font-size="14">Urgent treatment and clinical review</text><text x="615" y="231" font-size="14">Do not delay for lab confirmation</text><path d="M205 245V270H410 M615 245V270H410V290" fill="none" stroke="#456" stroke-width="3"/><rect x="205" y="290" width="410" height="76" rx="9" fill="#fef3c7" stroke="#a16207"/><text x="410" y="316" font-weight="bold">Reassess and investigate if persistent</text><text x="410" y="339" font-size="14">Verify treatment response, feeding and causes</text><text x="410" y="356" font-size="14">Individualize the discharge safety plan</text><text x="410" y="404" font-size="13">Learning schematic only. Use the current local protocol.</text></g></svg>
