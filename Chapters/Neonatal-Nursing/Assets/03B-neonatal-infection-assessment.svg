<svg xmlns="http://www.w3.org/2000/svg" width="820" height="420" viewBox="0 0 820 420" role="img" aria-labelledby="t"><title id="t">Neonatal infection nursing assessment</title><rect width="820" height="420" rx="12" fill="#f4f8fc"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#18324b"><text x="410" y="32" font-size="22" font-weight="bold">Suspected neonatal infection</text><rect x="225" y="55" width="370" height="60" rx="9" fill="#dbeafe" stroke="#34669b"/><text x="410" y="80" font-size="16" font-weight="bold">Assess risk and clinical signs</text><text x="410" y="101" font-size="14">Breathing, perfusion, temperature, activity</text><path d="M410 115V140H205V160 M410 140H615V160" fill="none" stroke="#456" stroke-width="3"/><rect x="30" y="160" width="350" height="75" rx="9" fill="#fee2e2" stroke="#b91c1c"/><text x="205" y="187" font-size="16" font-weight="bold">Unstable infant</text><text x="205" y="211" font-size="14">Urgent stabilization and escalation</text><rect x="440" y="160" width="350" height="75" rx="9" fill="#fef3c7" stroke="#a16207"/><text x="615" y="187" font-size="16" font-weight="bold">Indicated infection workup</text><text x="615" y="211" font-size="14">Culture, CRP, CSF when safe</text><path d="M205 235V260H410 M615 235V260H410V280" fill="none" stroke="#456" stroke-width="3"/><rect x="205" y="280" width="410" height="77" rx="9" fill="#dcfce7" stroke="#15803d"/><text x="410" y="306" font-size="16" font-weight="bold">Prompt prescribed antibiotics</text><text x="410" y="329" font-size="14">Reassess clinical status and results</text><text x="410" y="348" font-size="14">Review therapy with the neonatal team</text><text x="410" y="393" font-size="13">Never delay urgent care for an unsafe procedure.</text></g></svg>
