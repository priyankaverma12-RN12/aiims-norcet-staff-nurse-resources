<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560" role="img" aria-labelledby="title desc">
<title id="title">Newborn assessment sequence</title><desc id="desc">First assess stability, escalate instability immediately, or proceed to systematic examination and documentation for a stable infant.</desc>
<rect width="800" height="560" fill="#f4f8fc" rx="12"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#102b46">
<text x="400" y="34" font-size="24" font-weight="bold">Newborn assessment</text>
<rect x="230" y="55" width="340" height="72" rx="12" fill="#dbeafe" stroke="#34669b" stroke-width="2"/><text x="400" y="84" font-size="18" font-weight="bold">Check clinical stability</text><text x="400" y="109" font-size="14">Breathing, circulation, activity, warmth</text>
<path d="M400 127V153H185V180 M400 153H615V180" fill="none" stroke="#456078" stroke-width="3"/><path d="M179 169L185 181L191 169 M609 169L615 181L621 169" fill="#456078"/>
<rect x="35" y="183" width="300" height="85" rx="12" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="185" y="212" font-size="18" font-weight="bold">Unstable or danger sign</text><text x="185" y="236" font-size="14">Escalate and support immediately</text><text x="185" y="255" font-size="14">Do not wait for routine assessment</text>
<rect x="465" y="183" width="300" height="85" rx="12" fill="#d1fae5" stroke="#047857" stroke-width="2"/><text x="615" y="211" font-size="18" font-weight="bold">Stable newborn</text><text x="615" y="236" font-size="14">Keep warm and examine</text><text x="615" y="255" font-size="14">Heart, lungs and peripheral pulses</text>
<path d="M615 268V295" stroke="#456078" stroke-width="3"/><path d="M609 286L615 298L621 286" fill="#456078"/>
<rect x="465" y="298" width="300" height="93" rx="12" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/><text x="615" y="325" font-size="17" font-weight="bold">Head-to-toe examination</text><text x="615" y="348" font-size="14">Scalp, eyes, abdomen, spine, hips</text><text x="615" y="370" font-size="14">Movement, tone, reflexes and skin</text>
<path d="M615 391V420" stroke="#456078" stroke-width="3"/><path d="M609 411L615 423L621 411" fill="#456078"/>
<rect x="465" y="423" width="300" height="70" rx="12" fill="#fef3c7" stroke="#a16207" stroke-width="2"/><text x="615" y="451" font-size="17" font-weight="bold">Record and act on findings</text><text x="615" y="475" font-size="14">Refer abnormalities as indicated</text>
<rect x="35" y="312" width="300" height="110" rx="12" fill="#fff" stroke="#527393" stroke-width="2"/><text x="185" y="340" font-size="17" font-weight="bold">Apgar documentation</text><text x="185" y="364" font-size="14">At 1 and 5 minutes</text><text x="185" y="386" font-size="14">Repeat if indicated</text><text x="185" y="407" font-size="14">Never delay needed support</text>
<text x="400" y="535" font-size="14">Original schematic for learning. Follow the current neonatal clinical protocol.</text></g></svg>