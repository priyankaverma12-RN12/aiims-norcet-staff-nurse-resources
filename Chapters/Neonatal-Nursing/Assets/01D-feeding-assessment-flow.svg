<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440" role="img" aria-labelledby="t"><title id="t">Neonatal feeding assessment and escalation</title><rect width="800" height="440" fill="#f1f5f9" rx="15"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#17324b"><text x="400" y="32" font-weight="bold" font-size="23">Assess the feed, not just the count</text><rect x="240" y="55" width="320" height="68" rx="10" fill="#dbeafe" stroke="#34669b"/><text x="400" y="80" font-size="17" font-weight="bold">Readiness and stability</text><text x="400" y="103" font-size="14">Breathing, activity, feeding cues</text><path d="M400 123V150H210V170 M400 150H590V170" stroke="#345" fill="none" stroke-width="2"/><rect x="35" y="170" width="350" height="88" rx="10" fill="#dcfce7" stroke="#15803d"/><text x="210" y="196" font-size="17" font-weight="bold">Stable and ready</text><text x="210" y="220" font-size="14">Position, latch and swallowing</text><text x="210" y="242" font-size="14">Observe actual milk transfer</text><rect x="415" y="170" width="350" height="88" rx="10" fill="#fee2e2" stroke="#b91c1c"/><text x="590" y="196" font-size="17" font-weight="bold">Respiratory or swallowing danger</text><text x="590" y="220" font-size="14">Stop unsafe oral feeding</text><text x="590" y="242" font-size="14">Urgent neonatal clinical review</text><path d="M210 258V283" stroke="#345" stroke-width="2"/><rect x="35" y="283" width="350" height="91" rx="10" fill="#fef3c7" stroke="#a16207"/><text x="210" y="307" font-size="17" font-weight="bold">Reassess overall intake</text><text x="210" y="331" font-size="14">Weight, urine, stool and jaundice</text><text x="210" y="353" font-size="14">Escalate poor transfer or dehydration</text><text x="400" y="411" font-size="14">Original schematic. Individual neonatal feeding plan takes precedence.</text></g></svg>