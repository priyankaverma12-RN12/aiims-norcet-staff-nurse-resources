<svg xmlns="http://www.w3.org/2000/svg" width="820" height="330" viewBox="0 0 820 330" role="img" aria-labelledby="t"><title id="t">Neonatal referral transport pathway</title><rect width="820" height="330" rx="12" fill="#f4f8fc"/><g font-family="Arial" text-anchor="middle" fill="#17324b"><text x="410" y="32" font-size="22" font-weight="bold">Neonatal transfer: uninterrupted care</text><rect x="80" y="52" width="660" height="65" rx="9" fill="#dbeafe"/><text x="410" y="76" font-size="17">Before departure: stabilize, pre-alert and prepare</text><text x="410" y="98" font-size="14">Staff, secure equipment, oxygen and power reserve, family</text><path d="M410 117V136" stroke="#456" stroke-width="3"/><rect x="80" y="136" width="660" height="65" rx="9" fill="#fef3c7"/><text x="410" y="160" font-size="17">En route: maintain prescribed support and monitor</text><text x="410" y="182" font-size="14">Assess deterioration and respond through the trained team</text><path d="M410 201V220" stroke="#456" stroke-width="3"/><rect x="80" y="220" width="660" height="65" rx="9" fill="#dcfce7"/><text x="410" y="244" font-size="17">Arrival: structured handover and reassessment</text><text x="410" y="266" font-size="14">Actual treatments, events, interruptions and current condition</text></g></svg>