<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="t desc"><title id="t">Four neonatal heat loss mechanisms</title><desc id="desc">Four panels distinguish evaporation, conduction, convection and radiation with corresponding heat loss and prevention examples.</desc><rect width="800" height="480" rx="14" fill="#f0f6fc"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#142b43"><text x="400" y="35" font-size="25" font-weight="bold">How newborns lose heat</text>
<rect x="24" y="55" width="366" height="185" rx="12" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="207" y="82" font-size="20" font-weight="bold">Evaporation</text><rect x="147" y="146" width="120" height="32" rx="16" fill="#f8cda9"/><path d="M173 144V100 M207 144V100 M241 144V100" stroke="#0284c7" stroke-width="3" stroke-dasharray="5 4"/><path d="M167 111L173 99L179 111 M201 111L207 99L213 111 M235 111L241 99L247 111" fill="#0284c7"/><text x="207" y="204" font-size="14">Wet skin → water vapour</text><text x="207" y="225" font-size="14">Dry term baby and replace wet towel</text>
<rect x="410" y="55" width="366" height="185" rx="12" fill="#ecfdf5" stroke="#047857" stroke-width="2"/><text x="593" y="82" font-size="20" font-weight="bold">Conduction</text><rect x="533" y="113" width="120" height="32" rx="16" fill="#f8cda9"/><rect x="512" y="145" width="162" height="35" rx="5" fill="#94a3b8"/><path d="M575 134V166 M611 134V166" stroke="#b45309" stroke-width="3"/><path d="M569 157L575 169L581 157 M605 157L611 169L617 157" fill="#b45309"/><text x="593" y="204" font-size="14">Direct contact with cold surface</text><text x="593" y="225" font-size="14">Prepare a warm examination surface</text>
<rect x="24" y="254" width="366" height="200" rx="12" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/><text x="207" y="282" font-size="20" font-weight="bold">Convection</text><rect x="147" y="340" width="120" height="32" rx="16" fill="#f8cda9"/><path d="M63 323H330 M63 340H330" stroke="#4f46e5" stroke-width="3" stroke-dasharray="8 4"/><path d="M318 317L331 323L318 329 M318 334L331 340L318 346" fill="#4f46e5"/><text x="207" y="410" font-size="14">Cool moving air removes heat</text><text x="207" y="432" font-size="14">Keep cot away from drafts</text>
<rect x="410" y="254" width="366" height="200" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/><text x="593" y="282" font-size="20" font-weight="bold">Radiation</text><rect x="460" y="340" width="100" height="32" rx="16" fill="#f8cda9"/><rect x="691" y="309" width="48" height="80" rx="3" fill="#94a3b8"/><path d="M568 341L687 323 M568 360L687 372" stroke="#c2410c" stroke-width="3" stroke-dasharray="5 4"/><path d="M676 319L688 323L678 330 M675 364L688 372L675 375" fill="#c2410c"/><text x="593" y="410" font-size="14">Heat moves to cooler objects without contact</text><text x="593" y="432" font-size="14">Keep cot away from cold windows</text></g></svg>