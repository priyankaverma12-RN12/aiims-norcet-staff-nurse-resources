<svg xmlns="http://www.w3.org/2000/svg" width="820" height="360" viewBox="0 0 820 360" role="img" aria-labelledby="t"><title id="t">NOWS functional assessment and care</title><rect width="820" height="360" rx="12" fill="#f4f8fc"/><g font-family="Arial" text-anchor="middle" fill="#17324b"><text x="410" y="32" font-size="22" font-weight="bold">NOWS: function and family-centred support</text><rect x="90" y="50" width="640" height="62" rx="9" fill="#dbeafe"/><text x="410" y="76" font-size="17">Assess exposure, symptoms and other causes</text><text x="410" y="96" font-size="14">Use consistent assessment and clinical observations</text><path d="M410 112V132" stroke="#456" stroke-width="3"/><rect x="90" y="132" width="640" height="62" rx="9" fill="#dcfce7"/><text x="410" y="157" font-size="17">Eat • Sleep • Console</text><text x="410" y="177" font-size="14">Optimize feeding, soothing and safe supported rooming-in</text><path d="M410 194V214" stroke="#456" stroke-width="3"/><rect x="90" y="214" width="640" height="62" rx="9" fill="#fef3c7"/><text x="410" y="239" font-size="17">Persistent impairment: specialist review</text><text x="410" y="259" font-size="14">If prescribed, monitor pharmacotherapy and response</text><path d="M410 276V294" stroke="#456" stroke-width="3"/><text x="410" y="319" font-size="17" font-weight="bold">Individualized discharge and follow-up</text><text x="410" y="339" font-size="13">Escalate acute instability at any stage.</text></g></svg>