<svg xmlns="http://www.w3.org/2000/svg" width="780" height="370" viewBox="0 0 780 370" role="img" aria-labelledby="t"><title id="t">Immediate newborn care priorities</title><rect width="780" height="370" rx="14" fill="#f0f5fa"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#18324a"><text x="390" y="35" font-weight="bold" font-size="23">Immediate newborn care</text><rect x="270" y="55" width="240" height="50" rx="9" fill="#dbeafe" stroke="#34669b"/><text x="390" y="86" font-size="16">Assess breathing and stability</text><path d="M390 105V130H188V150 M390 130H592V150" fill="none" stroke="#345" stroke-width="2"/><rect x="38" y="150" width="300" height="72" rx="9" fill="#fee2e2" stroke="#b91c1c"/><text x="188" y="178" font-weight="bold">Unstable</text><text x="188" y="201" font-size="14">Urgent clinical support, no routine delay</text><rect x="442" y="150" width="300" height="72" rx="9" fill="#dcfce7" stroke="#15803d"/><text x="592" y="178" font-weight="bold">Stable</text><text x="592" y="201" font-size="14">Warmth, contact, observe and feed</text><path d="M592 222V246" stroke="#345" stroke-width="2"/><rect x="442" y="246" width="300" height="76" rx="9" fill="#fef3c7" stroke="#a16207"/><text x="592" y="271" font-weight="bold">Routine preventive care</text><text x="592" y="292" font-size="14">Vitamin K, dry cord care, identity</text><text x="592" y="309" font-size="13">Record actual care and reassess</text><text x="390" y="351" font-size="13">Original learning schematic. Follow the current neonatal clinical protocol.</text></g></svg>