<svg xmlns="http://www.w3.org/2000/svg" width="800" height="330" viewBox="0 0 800 330" role="img" aria-labelledby="t"><title id="t">Preterm brain imaging follow-up</title><rect width="800" height="330" rx="12" fill="#f4f8fc"/><g font-family="Arial" text-anchor="middle" fill="#18324b"><text x="400" y="32" font-size="22" font-weight="bold">IVH surveillance: CPS timing</text><rect x="180" y="55" width="440" height="58" rx="9" fill="#dbeafe"/><text x="400" y="80" font-size="16">Birth at or below 31 weeks + 6 days</text><text x="400" y="100" font-size="14">Routine first HUS: day 4–7</text><path d="M400 113V136H195V155 M400 136H605V155" stroke="#456" stroke-width="3" fill="none"/><rect x="25" y="155" width="340" height="72" rx="9" fill="#dcfce7"/><text x="195" y="180" font-size="16">Uncomplicated course</text><text x="195" y="202" font-size="14">Repeat at 4–6 weeks</text><rect x="435" y="155" width="340" height="72" rx="9" fill="#fee2e2"/><text x="605" y="180" font-size="16">Grade 2+ IVH / white matter injury</text><text x="605" y="202" font-size="14">Repeat in 7–10 days; closer if dilating</text><rect x="85" y="250" width="630" height="54" rx="9" fill="#fef3c7"/><text x="400" y="272" font-size="15">Birth before 26 weeks: also term-equivalent HUS</text><text x="400" y="291" font-size="13">Clinical indications may require earlier or additional scans.</text></g></svg>