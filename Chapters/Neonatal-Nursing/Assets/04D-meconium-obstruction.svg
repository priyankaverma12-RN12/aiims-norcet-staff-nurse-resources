<svg xmlns="http://www.w3.org/2000/svg" width="800" height="350" viewBox="0 0 800 350" role="img" aria-labelledby="t"><title id="t">Meconium airway obstruction comparison</title><rect width="800" height="350" rx="12" fill="#f4f8fc"/><g font-family="Arial" text-anchor="middle" fill="#17324b"><text x="400" y="32" font-size="22" font-weight="bold">Meconium: complete versus partial obstruction</text><rect x="25" y="55" width="360" height="260" rx="10" fill="#fee2e2"/><rect x="415" y="55" width="360" height="260" rx="10" fill="#fef3c7"/><text x="205" y="82" font-size="18" font-weight="bold">Complete blockage</text><text x="595" y="82" font-size="18" font-weight="bold">Partial blockage</text><path d="M205 100V178 M595 100V178" stroke="#7896a9" stroke-width="28"/><rect x="191" y="136" width="28" height="20" rx="3" fill="#776328"/><rect x="581" y="136" width="15" height="20" rx="3" fill="#776328"/><ellipse cx="205" cy="212" rx="57" ry="32" fill="#f8fafc" stroke="#7896a9" stroke-width="8"/><ellipse cx="595" cy="212" rx="93" ry="52" fill="#f8fafc" stroke="#7896a9" stroke-width="8"/><path d="M602 101V175" stroke="#15803d" stroke-width="3"/><path d="M596 164L602 176L608 164" fill="#15803d"/><text x="205" y="274" font-size="14">Distal ventilation lost</text><text x="205" y="294" font-size="14">Atelectasis</text><text x="595" y="282" font-size="14">Gas entry with impaired expiration</text><text x="595" y="302" font-size="14">Air trapping and hyperinflation</text><text x="400" y="337" font-size="13">Simplified learning schematic; actual lung injury is heterogeneous.</text></g></svg>