<svg xmlns="http://www.w3.org/2000/svg" width="800" height="490" viewBox="0 0 800 490" role="img" aria-labelledby="t"><title id="t">Neonatal resuscitation escalation principles</title><rect width="800" height="490" rx="12" fill="#f2f6fb"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#17324b"><text x="400" y="32" font-size="23" font-weight="bold">2025 AHA/AAP neonatal escalation</text><rect x="235" y="54" width="330" height="61" rx="9" fill="#dbeafe" stroke="#34669b"/><text x="400" y="78" font-weight="bold">Indicated assisted ventilation</text><text x="400" y="99" font-size="14">Check chest movement and HR response</text><path d="M400 115V140H205V160 M400 140H595V160" stroke="#345" fill="none" stroke-width="2"/><rect x="35" y="160" width="340" height="74" rx="9" fill="#fee2e2" stroke="#b91c1c"/><text x="205" y="185" font-weight="bold">No effective chest movement</text><text x="205" y="209" font-size="14">Correct ventilation / consider airway</text><rect x="425" y="160" width="340" height="74" rx="9" fill="#fef3c7" stroke="#a16207"/><text x="595" y="185" font-weight="bold">HR below 60/min after 30 s</text><text x="595" y="208" font-size="14">of effective ventilation: compressions</text><path d="M595 234V258" stroke="#345" stroke-width="2"/><rect x="425" y="258" width="340" height="77" rx="9" fill="#fee2e2" stroke="#b91c1c"/><text x="595" y="283" font-weight="bold">HR remains below 60/min</text><text x="595" y="305" font-size="14">after 60 s compressions + ventilation:</text><text x="595" y="323" font-size="14">protocol-guided epinephrine</text><rect x="35" y="278" width="340" height="91" rx="9" fill="#dcfce7" stroke="#15803d"/><text x="205" y="303" font-weight="bold">After stabilization</text><text x="205" y="326" font-size="14">Oxygen titration, glucose, temperature</text><text x="205" y="347" font-size="14">and neurological monitoring</text><text x="400" y="419" font-size="14">Learning schematic only. Not a complete resuscitation algorithm.</text><text x="400" y="441" font-size="14">Use trained personnel and current facility protocol.</text></g></svg>