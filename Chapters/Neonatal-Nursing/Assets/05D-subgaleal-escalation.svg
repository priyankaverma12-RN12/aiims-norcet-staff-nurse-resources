<svg xmlns="http://www.w3.org/2000/svg" width="800" height="330" viewBox="0 0 800 330" role="img" aria-labelledby="t"><title id="t">Subgaleal hemorrhage recognition</title><rect width="800" height="330" rx="12" fill="#f4f8fc"/><g font-family="Arial" text-anchor="middle" fill="#17324b"><text x="400" y="32" font-size="22" font-weight="bold">Subgaleal bleeding: act on clinical concern</text><rect x="160" y="55" width="480" height="58" rx="9" fill="#fef3c7"/><text x="400" y="79" font-size="16">Diffuse fluctuant scalp swelling or systemic signs</text><text x="400" y="99" font-size="14">Instrumented delivery is a risk context</text><path d="M400 113V136" stroke="#456" stroke-width="3"/><rect x="160" y="136" width="480" height="65" rx="9" fill="#fee2e2"/><text x="400" y="160" font-size="16">Urgent neonatal assessment and stabilization</text><text x="400" y="181" font-size="14">Do not wait for hypotension or maximal swelling</text><path d="M400 201V223H195V242 M400 223H605V242" stroke="#456" stroke-width="3" fill="none"/><rect x="25" y="242" width="340" height="64" rx="9" fill="#dbeafe"/><text x="195" y="267" font-size="16">Serial perfusion and scalp assessment</text><text x="195" y="288" font-size="14">Hemoglobin, coagulation and bilirubin</text><rect x="435" y="242" width="340" height="64" rx="9" fill="#dcfce7"/><text x="605" y="267" font-size="16">Critical bleeding team and follow-up</text><text x="605" y="288" font-size="14">Prescribed support and safe transfusion</text></g></svg>