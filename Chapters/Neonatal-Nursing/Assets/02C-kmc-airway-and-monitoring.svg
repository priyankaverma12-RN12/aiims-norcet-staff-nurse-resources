<svg xmlns="http://www.w3.org/2000/svg" width="840" height="450" viewBox="0 0 840 450" role="img" aria-labelledby="title desc"><title id="title">KMC nursing safety pathway</title><desc id="desc">Assess clinical suitability, position and secure infant with visible face, monitor breathing and other observations, escalate deterioration.</desc><rect width="840" height="450" rx="20" fill="#f4f8fc"/><g font-family="Arial,sans-serif" fill="#17324d" text-anchor="middle"><text x="420" y="38" font-size="24" font-weight="bold">KMC: airway and monitoring</text><rect x="170" y="60" width="500" height="65" rx="12" fill="#dceefa" stroke="#48769b"/><text x="420" y="86" font-size="17" font-weight="bold">Assess suitability and prepare team</text><text x="420" y="108" font-size="14">Address shock or respiratory emergencies first</text><path d="M420 125V145" stroke="#48769b" stroke-width="3"/><rect x="170" y="145" width="500" height="75" rx="12" fill="#e2f2e9" stroke="#438568"/><text x="420" y="170" font-size="17" font-weight="bold">Position high; support infant; secure binder</text><text x="420" y="193" font-size="14">Visible face, head to side, slight neck extension</text><text x="420" y="210" font-size="13">Unobstructed nose and mouth; free breathing</text><path d="M420 220V240" stroke="#438568" stroke-width="3"/><rect x="170" y="240" width="500" height="65" rx="12" fill="#dceefa" stroke="#48769b"/><text x="420" y="266" font-size="17" font-weight="bold">Monitor and document actual care</text><text x="420" y="288" font-size="14">Breathing, HR, colour, temperature, SpO2 where possible</text><path d="M420 305V325H215V345M420 325H625V345" fill="none" stroke="#48769b" stroke-width="3"/><rect x="35" y="345" width="360" height="76" rx="12" fill="#e2f2e9" stroke="#438568"/><text x="215" y="370" font-size="17" font-weight="bold">Suitable and comfortable</text><text x="215" y="392" font-size="14">Continue contact and feeding support</text><rect x="445" y="345" width="360" height="76" rx="12" fill="#fbe7df" stroke="#b45437"/><text x="625" y="370" font-size="17" font-weight="bold">Deterioration or airway issue</text><text x="625" y="392" font-size="14">Correct, escalate, reassess before continuing</text></g></svg>
