<svg xmlns="http://www.w3.org/2000/svg" width="800" height="350" viewBox="0 0 800 350" role="img" aria-labelledby="t"><title id="t">Indian NHM ROP screening pathway</title><rect width="800" height="350" fill="#f4f8fc" rx="12"/><g font-family="Arial" text-anchor="middle" fill="#17324b"><text x="400" y="32" font-size="22" font-weight="bold">ROP screening: cited NHM guideline</text><rect x="85" y="52" width="630" height="73" rx="9" fill="#dbeafe"/><text x="400" y="77" font-size="16">Below 34 weeks OR below 2000 g</text><text x="400" y="99" font-size="14">Also 34–36 weeks with risks or other clinician-identified high risk</text><path d="M400 125V145H195V166 M400 145H605V166" stroke="#456" stroke-width="3" fill="none"/><rect x="25" y="166" width="340" height="74" rx="9" fill="#fef3c7"/><text x="195" y="191" font-size="16" font-weight="bold">Below 28 weeks OR below 1200 g</text><text x="195" y="216" font-size="16">First screen at 2–3 weeks</text><rect x="435" y="166" width="340" height="74" rx="9" fill="#dcfce7"/><text x="605" y="191" font-size="16" font-weight="bold">Other eligible infants</text><text x="605" y="216" font-size="16">First screen at 4 weeks</text><path d="M195 240V257H400 M605 240V257H400V270" stroke="#456" stroke-width="3" fill="none"/><rect x="145" y="270" width="510" height="52" rx="9" fill="#e0e7ff"/><text x="400" y="291" font-size="16">Specialist examination and dated follow-up</text><text x="400" y="310" font-size="13">Verify current local protocol and discharge referral</text></g></svg>