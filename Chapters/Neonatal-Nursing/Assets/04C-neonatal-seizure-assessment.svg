<svg xmlns="http://www.w3.org/2000/svg" width="800" height="350" viewBox="0 0 800 350" role="img" aria-labelledby="t"><title id="t">Neonatal seizure assessment and EEG</title><rect width="800" height="350" rx="12" fill="#f4f8fc"/><g font-family="Arial" text-anchor="middle" fill="#17324b"><text x="400" y="31" font-size="22" font-weight="bold">Suspected neonatal seizure</text><rect x="180" y="52" width="440" height="63" rx="9" fill="#fee2e2"/><text x="400" y="77" font-size="16">Assess airway, breathing and circulation</text><text x="400" y="99" font-size="14">Prompt glucose check and indicated support</text><path d="M400 115V137H195V155 M400 137H605V155" stroke="#456" stroke-width="3" fill="none"/><rect x="25" y="155" width="340" height="75" rx="9" fill="#dbeafe"/><text x="195" y="180" font-size="16">Record clinical event</text><text x="195" y="201" font-size="14">Duration, side, vital signs, recovery</text><rect x="435" y="155" width="340" height="75" rx="9" fill="#fef3c7"/><text x="605" y="180" font-size="16">Facilitate EEG and cause workup</text><text x="605" y="201" font-size="14">Metabolic, infectious, structural causes</text><path d="M195 230V252H400 M605 230V252H400V270" stroke="#456" stroke-width="3" fill="none"/><rect x="140" y="270" width="520" height="55" rx="9" fill="#dcfce7"/><text x="400" y="292" font-size="16">Prescribed treatment and monitoring</text><text x="400" y="313" font-size="14">Review electrical and clinical response separately</text></g></svg>