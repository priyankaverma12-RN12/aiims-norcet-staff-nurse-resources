<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="title desc"><title id="title">Foley catheter placement and safe removal</title><desc id="desc">Schematic bladder and urethra with retention balloon entirely inside the bladder, separate urine drainage and inflation ports, and a safe removal sequence. Not to scale.</desc><rect width="780" height="470" rx="18" fill="#f5f8fc"/><g font-family="Arial,sans-serif" fill="#18364b"><text x="390" y="35" text-anchor="middle" font-size="24" font-weight="bold">Foley catheter: position and removal</text><path d="M133 102C108 144 123 225 189 240L189 303H233V240C299 225 314 144 289 102C266 73 156 73 133 102Z" fill="#f9dce1" stroke="#a04b64" stroke-width="3"/><path d="M211 357V139" stroke="#126985" stroke-width="12" fill="none" stroke-linecap="round"/><ellipse cx="211" cy="219" rx="28" ry="18" fill="#cde6f7" stroke="#126985" stroke-width="3"/><path d="M211 303V357H134V394M211 357H290V394" fill="none" stroke="#126985" stroke-width="9" stroke-linejoin="round"/><path d="M211 177H95" stroke="#425c71" stroke-width="2"/><text x="18" y="171" font-size="15">Bladder</text><path d="M239 219H350" stroke="#425c71" stroke-width="2"/><text x="255" y="205" font-size="14">Balloon inside bladder</text><text x="247" y="285" font-size="15">Urethra</text><text x="62" y="420" font-size="15">Urine drainage</text><text x="245" y="420" font-size="15">Balloon port</text><rect x="410" y="73" width="348" height="82" rx="12" fill="#e1ebf8" stroke="#6b91b2"/><text x="584" y="98" text-anchor="middle" font-size="18" font-weight="bold">Before insertion</text><text x="584" y="121" text-anchor="middle" font-size="14">Indication • consent • product • anatomy</text><text x="584" y="139" text-anchor="middle" font-size="14">Asepsis and trained assistance</text><path d="M584 155v23" stroke="#56758d" stroke-width="3"/><rect x="410" y="178" width="348" height="83" rx="12" fill="#fff0d9" stroke="#c4913d"/><text x="584" y="203" text-anchor="middle" font-size="18" font-weight="bold">Before balloon inflation</text><text x="584" y="226" text-anchor="middle" font-size="14">Confirm correct bladder placement</text><text x="584" y="244" text-anchor="middle" font-size="14">Never force against pain or resistance</text><path d="M584 261v23" stroke="#56758d" stroke-width="3"/><rect x="410" y="284" width="348" height="100" rx="12" fill="#e0f3e8" stroke="#5a9b74"/><text x="584" y="310" text-anchor="middle" font-size="18" font-weight="bold">Authorized removal</text><text x="584" y="333" text-anchor="middle" font-size="14">Complete deflation • gentle withdrawal</text><text x="584" y="353" text-anchor="middle" font-size="14">Inspect device • record first void</text><text x="584" y="373" text-anchor="middle" font-size="14">Stop and escalate if resistance</text><text x="390" y="451" text-anchor="middle" font-size="13">Original teaching schematic, not to scale. Follow local clinical protocol.</text></g></svg>
