<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 520" role="img" aria-labelledby="t d"><title id="t">Monitored mobility readiness and exercise types</title><desc id="d">Three range-of-motion types and a graded pathway from assessment through activity and recovery, with a stop and reassess branch for new instability.</desc><rect width="740" height="520" rx="18" fill="#f4f8fb"/><g font-family="Arial,sans-serif" fill="#183849"><text x="370" y="34" text-anchor="middle" font-size="24" font-weight="bold">Exercise type and mobility readiness</text><g fill="#fff" stroke="#568296" stroke-width="2"><rect x="20" y="55" width="220" height="92" rx="10"/><rect x="260" y="55" width="220" height="92" rx="10"/><rect x="500" y="55" width="220" height="92" rx="10"/><rect x="30" y="195" width="480" height="62" rx="10"/><rect x="30" y="278" width="480" height="62" rx="10"/><rect x="30" y="361" width="480" height="62" rx="10"/></g><g text-anchor="middle" font-size="17"><text x="130" y="83" font-weight="bold">Active ROM</text><text x="130" y="112">Patient moves joint</text><text x="130" y="132">without movement help</text><text x="370" y="83" font-weight="bold">Active-assisted ROM</text><text x="370" y="112">Patient effort plus</text><text x="370" y="132">partial assistance</text><text x="610" y="83" font-weight="bold">Passive ROM</text><text x="610" y="112">External force moves</text><text x="610" y="132">the relaxed joint</text><text x="270" y="220" font-weight="bold">Assess current readiness</text><text x="270" y="243">Orders, symptoms, vital signs and team</text><text x="270" y="303" font-weight="bold">Perform tolerated prescribed activity</text><text x="270" y="326">Monitor response and maintain support</text><text x="270" y="386" font-weight="bold">Assess recovery and document</text><text x="270" y="409">Actual dose, help needed and symptoms</text></g><g stroke="#568296" stroke-width="3" fill="none"><path d="M270 257V278M265 270L270 278L275 270M270 340V361M265 353L270 361L275 353"/></g><rect x="536" y="204" width="184" height="208" rx="12" fill="#fff1e5" stroke="#ad5b32" stroke-width="2"/><g font-size="16" text-anchor="middle" fill="#813a20"><text x="628" y="237" font-weight="bold">New instability?</text><text x="628" y="273">Stop or hold</text><text x="628" y="296">progression safely.</text><text x="628" y="331">Assess and</text><text x="628" y="354">escalate per plan.</text><text x="628" y="387">Reassess readiness.</text></g><g stroke="#ad5b32" stroke-width="2" stroke-dasharray="5 4" fill="none"><path d="M510 226H536M510 309H536M510 392H536"/></g><text x="370" y="466" text-anchor="middle" font-size="15">Clinical readiness is individual and dynamic. This is not an independent ICU clearance tool.</text></g></svg>