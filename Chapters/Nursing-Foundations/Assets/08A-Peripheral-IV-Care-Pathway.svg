<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc"><title id="title">Peripheral IV access care pathway</title><desc id="desc">Assess therapy and veins, choose device, insert using trained aseptic technique, secure and inspect, review need, and remove safely.</desc><rect width="900" height="430" rx="16" fill="#f5f8fc"/><g font-family="sans-serif" fill="#17334d"><text x="450" y="38" font-size="25" font-weight="bold" text-anchor="middle">Peripheral IV: protect the vein and the patient</text><g stroke="#567b98" stroke-width="2" fill="#e3eff9"><rect x="24" y="63" width="265" height="108" rx="12"/><rect x="318" y="63" width="265" height="108" rx="12"/><rect x="611" y="63" width="265" height="108" rx="12"/></g><g text-anchor="middle"><text x="156" y="89" font-size="18" font-weight="bold">1. Assess need</text><text x="156" y="116" font-size="16">Therapy, duration, patient</text><text x="156" y="140" font-size="16">preferences and vein health</text><text x="450" y="89" font-size="18" font-weight="bold">2. Select device</text><text x="450" y="116" font-size="16">Suitable site, gauge, length</text><text x="450" y="140" font-size="16">Escalate difficult access</text><text x="743" y="89" font-size="18" font-weight="bold">3. Insert safely</text><text x="743" y="116" font-size="16">Trained clinician, asepsis</text><text x="743" y="140" font-size="16">Verify position and function</text></g><g fill="none" stroke="#567b98" stroke-width="3"><path d="M289 117 H318 l-8 -6 m8 6 l-8 6"/><path d="M583 117 H611 l-8 -6 m8 6 l-8 6"/><path d="M743 171 V199 l-6 -8 m6 8 l6 -8"/></g><g stroke="#58906d" stroke-width="2" fill="#e4f3e9"><rect x="611" y="200" width="265" height="108" rx="12"/><rect x="318" y="200" width="265" height="108" rx="12"/><rect x="24" y="200" width="265" height="108" rx="12"/></g><g text-anchor="middle"><text x="743" y="226" font-size="18" font-weight="bold">4. Secure and maintain</text><text x="743" y="253" font-size="16">Protect site, tubing and skin</text><text x="743" y="277" font-size="16">Check patency as indicated</text><text x="450" y="226" font-size="18" font-weight="bold">5. Review</text><text x="450" y="253" font-size="16">Assess site, symptoms, need</text><text x="450" y="277" font-size="16">Follow local review policy</text><text x="156" y="226" font-size="18" font-weight="bold">6. Remove safely</text><text x="156" y="253" font-size="16">When no longer indicated</text><text x="156" y="277" font-size="16">Check integrity and document</text></g><g fill="none" stroke="#58906d" stroke-width="3"><path d="M611 254 H583 l8 -6 m-8 6 l8 6"/><path d="M318 254 H289 l8 -6 m-8 6 l8 6"/></g><rect x="24" y="332" width="852" height="70" rx="12" fill="#fff0dd" stroke="#b07b35"/><text x="450" y="359" font-size="18" font-weight="bold" text-anchor="middle">Safety stop</text><text x="450" y="385" font-size="16" text-anchor="middle">Unexpected pain, uncertain position, malfunction or leakage → stop use and assess.</text></g></svg>
