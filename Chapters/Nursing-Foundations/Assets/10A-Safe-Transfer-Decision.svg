<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 630" role="img" aria-labelledby="t d">
<title id="t">Safe patient transfer decision pathway</title>
<desc id="d">Assess patient, check suitable equipment and team, complete preparation, perform controlled transfer, assess destination safety. Pause if any check fails.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#315c70"/></marker></defs>
<rect width="720" height="630" rx="20" fill="#f4f8fb"/>
<g font-family="Arial, sans-serif" text-anchor="middle" fill="#183445">
<text x="360" y="32" font-size="24" font-weight="bold">Safe transfer: assessment to completion</text>
<g fill="#fff" stroke="#487789" stroke-width="2">
<rect x="30" y="56" width="490" height="90" rx="12"/>
<rect x="30" y="174" width="490" height="90" rx="12"/>
<rect x="30" y="292" width="490" height="90" rx="12"/>
<rect x="30" y="410" width="490" height="90" rx="12"/>
<rect x="30" y="528" width="490" height="80" rx="12"/>
</g>
<g font-size="19" font-weight="bold"><text x="275" y="83">1. Assess the patient</text><text x="275" y="201">2. Check the equipment</text><text x="275" y="319">3. Prepare the team and space</text><text x="275" y="437">4. Move with control</text><text x="275" y="554">5. Check the destination</text></g>
<g font-size="16"><text x="275" y="109">Ability, alertness, pain and restrictions</text><text x="275" y="130">Choose assistance after assessment</text><text x="275" y="227">Fit, capacity, compatibility and condition</text><text x="275" y="248">Follow device instructions</text><text x="275" y="345">Secure receiving surface, lines and route</text><text x="275" y="366">Agree roles and readiness signal</text><text x="275" y="463">Monitor comfort, stability and attachments</text><text x="275" y="484">Stop if a new risk appears</text><text x="275" y="581">Support, comfort, call bell and handover</text></g>
<g stroke="#315c70" stroke-width="2.6" marker-end="url(#arrow)"><path d="M275 146V170"/><path d="M275 264V288"/><path d="M275 382V406"/><path d="M275 500V524"/></g>
<rect x="540" y="174" width="158" height="208" rx="12" fill="#fff2e9" stroke="#ad532e" stroke-width="2"/>
<g font-size="16" fill="#813a20"><text x="619" y="207" font-weight="bold">Any unsafe</text><text x="619" y="227" font-weight="bold">finding?</text><text x="619" y="263">Pause.</text><text x="619" y="285">Keep patient</text><text x="619" y="305">supported.</text><text x="619" y="332">Reassess and</text><text x="619" y="352">correct plan.</text></g>
<g stroke="#ad532e" stroke-width="2" stroke-dasharray="5 4" fill="none"><path d="M520 101H619V174"/><path d="M520 219H540"/><path d="M520 337H540"/><path d="M520 455H619V382"/></g>
</g></svg>