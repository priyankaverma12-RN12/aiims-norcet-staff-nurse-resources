<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" role="img" aria-labelledby="t d"><title id="t">Continuous bladder irrigation and net output</title><desc id="d">Prescribed sterile irrigant enters through a separate irrigation channel and drains with urine through the drainage channel. The retention balloon has a separate closed inflation channel. Total drainage minus irrigant gives net urinary drainage.</desc><rect width="800" height="390" rx="16" fill="#f7fafc"/><g font-family="Arial,sans-serif" fill="#17324d"><text x="400" y="32" font-size="23" text-anchor="middle" font-weight="bold">Closed irrigation circuit</text><rect x="45" y="65" width="190" height="75" rx="10" fill="#dbeafe" stroke="#5785b3"/><text x="140" y="95" text-anchor="middle" font-size="16">Prescribed sterile saline</text><text x="140" y="119" text-anchor="middle" font-size="15">Irrigant input</text><path d="M140 140V202H310" stroke="#2676a6" stroke-width="5" fill="none"/><path d="M300 194l16 8-16 8" fill="#2676a6"/><path d="M330 122Q400 92 470 122Q500 190 450 231H350Q300 190 330 122Z" fill="#f4c3b0" stroke="#a45a44" stroke-width="3"/><text x="400" y="145" text-anchor="middle" font-size="17">Bladder</text><ellipse cx="400" cy="204" rx="31" ry="13" fill="#a8d5e8" stroke="#2676a6"/><text x="400" y="187" font-size="13" text-anchor="middle">Balloon</text><path d="M390 215V270H225" stroke="#576c7a" stroke-width="5" fill="none"/><rect x="45" y="250" width="180" height="42" rx="8" fill="#e6e9ee" stroke="#728496"/><text x="135" y="277" text-anchor="middle" font-size="15">Balloon port (separate)</text><path d="M410 215V275H600V300" stroke="#23866e" stroke-width="5" fill="none"/><path d="M592 286l8 15 8-15" fill="#23866e"/><rect x="510" y="300" width="180" height="52" rx="10" fill="#ddf4e6" stroke="#23866e"/><text x="600" y="321" text-anchor="middle" font-size="16">Total drainage</text><text x="600" y="342" text-anchor="middle" font-size="13">Bag below bladder</text><rect x="515" y="68" width="245" height="126" rx="10" fill="#fff0d9" stroke="#c69036"/><text x="637" y="94" font-size="17" text-anchor="middle" font-weight="bold">Safety check</text><text x="637" y="120" text-anchor="middle" font-size="14">Pain + outflow less than input?</text><text x="637" y="142" text-anchor="middle" font-size="14">Stop inflow, assess and escalate.</text><text x="637" y="165" text-anchor="middle" font-size="14">Never force irrigation.</text><text x="400" y="378" text-anchor="middle" font-size="16" font-weight="bold">Net drainage = total drainage − irrigant instilled (same interval)</text></g></svg>
