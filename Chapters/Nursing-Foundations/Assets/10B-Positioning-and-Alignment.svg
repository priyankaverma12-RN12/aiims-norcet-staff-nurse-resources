<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d">
<title id="t">Therapeutic positioning: support and angle checks</title>
<desc id="d">Four schematic examples: supine neutral neck, raised backrest measured from horizontal, supported lateral tilt and prone eye protection. Not a procedural positioning instruction.</desc>
<rect width="800" height="520" rx="20" fill="#f5f8fc"/>
<g font-family="Arial,sans-serif" fill="#19394b" text-anchor="middle">
<text x="400" y="34" font-size="24" font-weight="bold">Positioning: check the actual support</text>
<g fill="#fff" stroke="#7195a6" stroke-width="2"><rect x="20" y="58" width="370" height="192" rx="12"/><rect x="410" y="58" width="370" height="192" rx="12"/><rect x="20" y="270" width="370" height="192" rx="12"/><rect x="410" y="270" width="370" height="192" rx="12"/></g>
<g font-size="18" font-weight="bold"><text x="205" y="86">Supine — neutral head support</text><text x="595" y="86">Raised backrest — measured angle</text><text x="205" y="299">Lateral tilt — redistribute load</text><text x="595" y="299">Prone — protect the eyes</text></g>
<g stroke="#54798b" stroke-width="5" stroke-linecap="round" fill="none"><path d="M50 168H360"/><path d="M600 190H750"/><path d="M480 122L600 190"/><path d="M55 401H355"/><path d="M440 401H750"/></g>
<g fill="#a8d0de" stroke="#54798b" stroke-width="2"><rect x="65" y="151" width="53" height="16" rx="5"/><rect x="135" y="139" width="210" height="22" rx="10"/><rect x="113" y="143" width="30" height="17" rx="6"/><circle cx="95" cy="139" r="18"/><path d="M492 101L607 168L730 168L730 188L600 188L482 120Z"/><circle cx="468" cy="112" r="16"/><path d="M70 400L148 354L226 400Z" fill="#e2b87a"/><ellipse cx="202" cy="365" rx="73" ry="25" transform="rotate(25 202 365)"/><rect x="263" y="378" width="66" height="17" rx="6" fill="#e2b87a"/><rect x="498" y="369" width="226" height="25" rx="12"/><ellipse cx="481" cy="370" rx="26" ry="20"/><path d="M451 401V388H469V401M493 401V388H512V401" fill="#e2b87a"/></g>
<path d="M440 190H600" stroke="#54798b" stroke-width="2" stroke-dasharray="5 4" fill="none"/><path d="M560 190 A40 40 0 0 1 565 170" stroke="#bf7231" stroke-width="2.5" fill="none"/><text x="539" y="181" font-size="14">angle</text>
<g font-size="15"><text x="205" y="213">Avoid excessive pillow height.</text><text x="595" y="213">Measure from horizontal, not by guess.</text><text x="205" y="435">Check sacrum and hip contact.</text><text x="595" y="435">No direct eye pressure.</text></g>
<text x="400" y="493" font-size="14">Schematic only. Individual assessment and approved equipment determine safe positioning.</text>
</g></svg>