<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d"><title id="t">Central venous access device comparison</title><desc id="d">Schematic showing a PICC and midline entering an arm vein but ending at different locations, a tunneled catheter and implanted port with central tips. Not a procedural guide.</desc><rect width="900" height="500" rx="16" fill="#f4f8fc"/><g font-family="sans-serif" fill="#17334d"><text x="450" y="35" text-anchor="middle" font-size="24" font-weight="bold">Device identity depends on the tip, not just the entry site</text><rect x="20" y="60" width="860" height="234" rx="12" fill="#e6eff9"/><path d="M80 128 H390 Q470 128 490 195 V250 M80 208 H365" fill="none" stroke="#87b5d7" stroke-width="24" stroke-linecap="round"/><path d="M80 128 H390 Q470 128 490 195 V232" fill="none" stroke="#2a6352" stroke-width="5" stroke-linecap="round"/><path d="M80 208 H292" fill="none" stroke="#b56e25" stroke-width="5" stroke-linecap="round"/><circle cx="490" cy="232" r="7" fill="#2a6352"/><circle cx="292" cy="208" r="7" fill="#b56e25"/><text x="80" y="105" font-size="18" font-weight="bold">PICC: arm entry</text><text x="80" y="191" font-size="18" font-weight="bold">Midline: arm entry</text><text x="315" y="211" font-size="15">Peripheral tip</text><text x="513" y="231" font-size="17">Central tip near SVC–RA junction</text><text x="513" y="253" font-size="15">Actual location must be verified.</text><g fill="#e5f3e9" stroke="#5d8c78"><rect x="20" y="315" width="420" height="125" rx="12"/><rect x="460" y="315" width="420" height="125" rx="12"/></g><text x="230" y="344" text-anchor="middle" font-size="19" font-weight="bold">Tunneled catheter</text><path d="M65 365 H395" stroke="#c89c78" stroke-width="4"/><path d="M95 382 H220 Q250 382 250 402 H375" fill="none" stroke="#2a6352" stroke-width="5"/><text x="230" y="428" font-size="15" text-anchor="middle">Part travels beneath skin to vein.</text><text x="670" y="344" text-anchor="middle" font-size="19" font-weight="bold">Implanted port</text><path d="M495 365 H845" stroke="#c89c78" stroke-width="4"/><rect x="520" y="377" width="48" height="25" rx="8" fill="#6c8eaf"/><path d="M568 390 H805" stroke="#2a6352" stroke-width="5"/><text x="670" y="428" font-size="15" text-anchor="middle">Reservoir and catheter lie under skin.</text><text x="450" y="478" text-anchor="middle" font-size="16">Schematic only. Anatomy, device length and tip targets vary by device and patient.</text></g></svg>
