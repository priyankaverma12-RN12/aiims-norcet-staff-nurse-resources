<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="t d"><title id="t">Urine collection by test type</title><desc id="d">Choose a specimen based on the order. Midstream culture, first-catch NAAT and complete timed urine use different collection pathways. Verify identity, container, handling and timing.</desc><rect width="800" height="460" rx="18" fill="#f7fafc"/><g font-family="Arial,sans-serif" fill="#17324d" text-anchor="middle"><text x="400" y="34" font-size="24" font-weight="bold">Urine specimens: match the test to the collection</text><rect x="225" y="55" width="350" height="52" rx="10" fill="#e0eafb" stroke="#648bb1"/><text x="400" y="86" font-size="17" font-weight="bold">Check order, identity and laboratory instructions</text><path d="M400 107V128H139V147M400 128V147M400 128H661V147" fill="none" stroke="#648099" stroke-width="2"/><rect x="15" y="150" width="248" height="122" rx="10" fill="#e6f3ea" stroke="#609b79"/><text x="139" y="177" font-size="18" font-weight="bold">Midstream culture</text><text x="139" y="204" font-size="14">Sterile container</text><text x="139" y="224" font-size="14">Avoid contact and contamination</text><text x="139" y="244" font-size="14">Prompt transport or preservation</text><rect x="276" y="150" width="248" height="122" rx="10" fill="#e6edf9" stroke="#648bb1"/><text x="400" y="177" font-size="18" font-weight="bold">First-catch NAAT</text><text x="400" y="204" font-size="14">Initial stream for male STI testing</text><text x="400" y="224" font-size="14">Use approved test kit</text><text x="400" y="244" font-size="14">Not the midstream culture method</text><rect x="537" y="150" width="248" height="122" rx="10" fill="#fff0db" stroke="#c4913d"/><text x="661" y="177" font-size="18" font-weight="bold">24-hour collection</text><text x="661" y="204" font-size="14">Discard first void, record time</text><text x="661" y="224" font-size="14">Collect every subsequent void</text><text x="661" y="244" font-size="14">Include final void at same time</text><path d="M139 272V292H400M400 272V316M661 272V292H400" fill="none" stroke="#648099" stroke-width="2"/><rect x="100" y="317" width="600" height="68" rx="10" fill="#e9edf3" stroke="#8a9aaf"/><text x="400" y="343" font-size="18" font-weight="bold">Verify specimen integrity and handover</text><text x="400" y="367" font-size="14">Method • collection time • compatible container • storage • total timed volume</text><text x="400" y="413" font-size="14">Catheter culture: use an approved disinfected sampling port, not the drainage bag.</text><text x="400" y="437" font-size="13">Original teaching diagram. Follow local test-specific instructions.</text></g></svg>
