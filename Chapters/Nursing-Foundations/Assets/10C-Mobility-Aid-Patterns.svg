<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-labelledby="t d"><title id="t">Crutch gait sequences</title><desc id="d">Four-point gait advances four supports individually. Two-point gait advances opposite pairs. Three-point non-weight-bearing gait uses both crutches and the supporting limb. Schematic only.</desc><rect width="760" height="460" rx="18" fill="#f4f8fb"/><g font-family="Arial,sans-serif" fill="#173949"><text x="380" y="35" font-size="25" font-weight="bold" text-anchor="middle">Crutch gait: compare the patterns</text><g font-size="19" font-weight="bold"><text x="30" y="79">Four-point: individual advances</text><text x="30" y="191">Two-point: opposite pairs</text><text x="30" y="303">Three-point: prescribed non-weight-bearing</text></g><g stroke="#477589" stroke-width="2" fill="#fff"><rect x="30" y="93" width="160" height="66" rx="10"/><rect x="210" y="93" width="160" height="66" rx="10"/><rect x="390" y="93" width="160" height="66" rx="10"/><rect x="570" y="93" width="160" height="66" rx="10"/><rect x="30" y="205" width="330" height="66" rx="10"/><rect x="400" y="205" width="330" height="66" rx="10"/><rect x="30" y="317" width="330" height="66" rx="10"/><rect x="400" y="317" width="330" height="66" rx="10"/></g><g font-size="17" text-anchor="middle"><text x="110" y="121">1. Right crutch</text><text x="110" y="144">advance</text><text x="290" y="121">2. Left foot</text><text x="290" y="144">advance</text><text x="470" y="121">3. Left crutch</text><text x="470" y="144">advance</text><text x="650" y="121">4. Right foot</text><text x="650" y="144">advance</text><text x="195" y="232">Right crutch + left foot</text><text x="195" y="252">together</text><text x="565" y="232">Left crutch + right foot</text><text x="565" y="252">together</text><text x="195" y="344">Both crutches advance</text><text x="195" y="365">Affected limb remains unloaded</text><text x="565" y="344">Supporting leg advances</text><text x="565" y="365">with prescribed crutch support</text></g><text x="380" y="414" text-anchor="middle" font-size="15">Example sequences only. Follow the assessed gait and clinician's load restrictions.</text><text x="380" y="437" text-anchor="middle" font-size="15">Do not practise independently until a trained clinician confirms safe technique.</text></g></svg>