<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-labelledby="t d"><title id="t">IV complication response</title><desc id="d">Assess patient, site, tubing and drug. Suspected extravasation needs immediate stopping, no flush and drug-specific action. Mechanical problems and incompatibility need separate assessment.</desc><rect width="900" height="380" rx="14" fill="#f4f8fc"/><g font-family="sans-serif" fill="#19334b" text-anchor="middle"><text x="450" y="35" font-size="24" font-weight="bold">IV complication: assess before resuming delivery</text><rect x="270" y="56" width="360" height="48" rx="10" fill="#dae9f5"/><text x="450" y="86" font-size="18">Patient + site + tubing + drug</text><g stroke="#607e96" fill="none" stroke-width="2"><path d="M450 104 V125 H118 V145 M450 125 H339 V145 M450 125 H561 V145 M450 125 H782 V145"/></g><g stroke="#607e96"><rect x="12" y="145" width="212" height="145" rx="10" fill="#fde5e4"/><rect x="233" y="145" width="212" height="145" rx="10" fill="#fff0d9"/><rect x="455" y="145" width="212" height="145" rx="10" fill="#e4edfa"/><rect x="676" y="145" width="212" height="145" rx="10" fill="#e2f2e8"/></g><g font-size="18" font-weight="bold"><text x="118" y="173">Tissue leakage</text><text x="339" y="173">Phlebitis</text><text x="561" y="173">Dysfunction</text><text x="782" y="173">Incompatibility</text></g><g font-size="15"><text x="118" y="201">Swelling, pain, pallor</text><text x="118" y="225">Suspect extravasation:</text><text x="118" y="249">stop, no flush, retain</text><text x="118" y="273">initially, seek help</text><text x="339" y="201">Warm, tender vein</text><text x="339" y="225">Assess local/systemic signs</text><text x="339" y="249">Review access and drug</text><text x="339" y="273">Remove as indicated</text><text x="561" y="201">Kink, resistance, leak</text><text x="561" y="225">Assess external causes</text><text x="561" y="249">Never force flush</text><text x="561" y="273">Do not advance exposed tip</text><text x="782" y="201">Precipitate or uncertainty</text><text x="782" y="225">Stop affected delivery</text><text x="782" y="249">Verify exact conditions</text><text x="782" y="273">Seek pharmacy guidance</text></g><rect x="12" y="311" width="876" height="52" rx="10" fill="#ffdddd"/><text x="450" y="334" font-size="17" font-weight="bold">Urgent escalation: severe pain, tense swelling, impaired perfusion,</text><text x="450" y="353" font-size="16">sensory change or systemic deterioration</text></g></svg>
