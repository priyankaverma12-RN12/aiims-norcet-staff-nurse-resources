<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300"><rect width="800" height="300" fill="#f4f7fa"/><g font-family="Arial" fill="#203d52" text-anchor="middle"><text x="400" y="35" font-size="23" font-weight="bold">Acute severe ulcerative colitis</text><rect x="140" y="55" width="520" height="43" rx="8" fill="#f7d8d3"/><text x="400" y="82" font-size="17">Frequent bloody stool + systemic toxicity</text><path d="M400 98 V125" stroke="#476f85" stroke-width="3"/><rect x="85" y="125" width="630" height="50" rx="8" fill="#dcecf5"/><text x="400" y="147" font-size="16">Urgent inpatient assessment · infection testing · treatment</text><text x="400" y="166" font-size="14">Monitor stool, blood, vitals, labs and thrombosis risk</text><path d="M400 175 V199" stroke="#476f85" stroke-width="3"/><rect x="85" y="199" width="630" height="55" rx="8" fill="#fff" stroke="#b25a48"/><text x="400" y="222" font-size="16">New distension/toxicity: immediate escalation</text><text x="400" y="242" font-size="15">Inadequate day-3 steroid response: specialist rescue review</text><text x="400" y="282" font-size="13">Clinical decisions depend on individual condition and local pathway.</text></g></svg>