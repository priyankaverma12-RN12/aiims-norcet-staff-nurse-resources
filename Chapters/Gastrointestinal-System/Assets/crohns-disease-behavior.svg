<svg xmlns="http://www.w3.org/2000/svg" width="840" height="290" viewBox="0 0 840 290"><rect width="840" height="290" fill="#f4f7fa"/><g font-family="Arial" fill="#234154" text-anchor="middle"><text x="420" y="34" font-size="24" font-weight="bold">Crohn disease: different bowel behaviors</text><g font-size="16"><rect x="20" y="60" width="254" height="180" rx="10" fill="#fff" stroke="#9a6342"/><text x="147" y="91" font-weight="bold">Inflammatory</text><path d="M40 130 Q90 110 150 130 T254 130 M40 165 Q100 185 150 165 T254 165" stroke="#b96f52" stroke-width="7" fill="none"/><text x="147" y="207">Mural inflammation / edema</text><rect x="293" y="60" width="254" height="180" rx="10" fill="#fff" stroke="#647a93"/><text x="420" y="91" font-weight="bold">Fibrostenotic</text><path d="M313 120 Q380 120 420 146 Q460 120 527 120 M313 180 Q380 180 420 154 Q460 180 527 180" stroke="#647a93" stroke-width="6" fill="none"/><text x="420" y="207">Fixed narrowing</text><rect x="566" y="60" width="254" height="180" rx="10" fill="#fff" stroke="#b45349"/><text x="693" y="91" font-weight="bold">Penetrating</text><path d="M586 122 H800 M586 153 H676 M704 153 H800 M690 148 V187 H742" stroke="#b45349" stroke-width="6" fill="none"/><text x="693" y="221">Fistula / collection</text><text x="420" y="270" font-size="14">Behaviors can coexist; assessment guides treatment.</text></g></g></svg>