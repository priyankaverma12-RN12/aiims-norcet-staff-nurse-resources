<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="t d"><title id="t">Gastroesophageal reflux</title><desc id="d">Food travels downward through the esophagus. Reflux can travel upward across the gastroesophageal junction.</desc><rect width="640" height="360" rx="16" fill="#f6f8fa"/><path d="M252 28 L252 176 Q252 204 277 212 Q224 264 267 309 Q340 346 427 296 Q470 267 455 215 Q442 185 393 188 Q330 191 326 168 L326 28" fill="#f7c4b5" stroke="#7f433c" stroke-width="5"/><path d="M263 179 Q289 192 315 179" fill="none" stroke="#7f433c" stroke-width="7"/><path d="M275 43 V149 M261 137 L275 156 L289 137" fill="none" stroke="#14764a" stroke-width="6"/><path d="M309 248 C300 220 302 190 302 111 M288 124 L302 104 L316 124" fill="none" stroke="#b63b35" stroke-width="6"/><g fill="#243447" font-family="Arial,sans-serif" font-size="18"><text x="36" y="70">Esophagus</text><text x="36" y="105" fill="#14764a">Normal food flow</text><text x="344" y="145" fill="#b63b35">Reflux upward</text><text x="28" y="194">Junction / barrier</text><text x="365" y="275">Stomach</text><text x="36" y="336" font-size="14">Schematic only, not to anatomical scale.</text></g><path d="M153 65 H248 M190 188 H254" stroke="#64748b" stroke-width="2" fill="none"/></svg>