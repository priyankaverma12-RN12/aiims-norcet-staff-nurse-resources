<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330"><rect width="760" height="330" rx="18" fill="#f2f7fa"/><text x="30" y="34" font-family="Arial" font-size="21" font-weight="bold" fill="#17354a">Seizures, Headache, Meningitis &amp; Encephalitis</text><rect x="50" y="52" width="660" height="47" rx="9" fill="#d9e9fa" stroke="#44647b"/><text x="380" y="82" text-anchor="middle" font-family="Arial" font-size="19" fill="#17354a">Seizure starts → note time</text><path d="M380 99 v15 m-5 -5 l5 5 5 -5" stroke="#44647b" stroke-width="2" fill="none"/><rect x="50" y="117" width="660" height="47" rx="9" fill="#e0f0e8" stroke="#44647b"/><text x="380" y="147" text-anchor="middle" font-family="Arial" font-size="19" fill="#17354a">Protect head, remove hazards</text><path d="M380 164 v15 m-5 -5 l5 5 5 -5" stroke="#44647b" stroke-width="2" fill="none"/><rect x="50" y="182" width="660" height="47" rx="9" fill="#d9e9fa" stroke="#44647b"/><text x="380" y="212" text-anchor="middle" font-family="Arial" font-size="19" fill="#17354a">Side position when safe</text><path d="M380 229 v15 m-5 -5 l5 5 5 -5" stroke="#44647b" stroke-width="2" fill="none"/><rect x="50" y="247" width="660" height="47" rx="9" fill="#e0f0e8" stroke="#44647b"/><text x="380" y="277" text-anchor="middle" font-family="Arial" font-size="19" fill="#17354a">5 min or repeated without recovery → emergency</text></svg>