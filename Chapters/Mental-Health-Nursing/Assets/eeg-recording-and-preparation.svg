<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">EEG recording overview</title><desc id="desc">Scalp electrodes sense electrical activity, the recorder amplifies and displays waveforms. Preparation and clinical interpretation are essential.</desc><rect width="800" height="360" rx="16" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#17324d"><text x="400" y="37" text-anchor="middle" font-size="24" font-weight="bold">EEG: recording electrical activity</text><rect x="20" y="64" width="228" height="154" rx="12" fill="#dbeafe" stroke="#2563eb"/><ellipse cx="134" cy="126" rx="45" ry="43" fill="#f7d7b9" stroke="#8b5e3c" stroke-width="2"/><g fill="#2563eb"><circle cx="104" cy="99" r="5"/><circle cx="134" cy="85" r="5"/><circle cx="164" cy="99" r="5"/></g><text x="134" y="192" text-anchor="middle" font-size="17" font-weight="bold">Scalp electrodes</text><path d="M250 140h33" stroke="#475569" stroke-width="3"/><path d="M275 133l10 7-10 7" fill="none" stroke="#475569" stroke-width="3"/><rect x="290" y="64" width="220" height="154" rx="12" fill="#dcfce7" stroke="#15803d"/><rect x="320" y="94" width="160" height="58" rx="5" fill="white" stroke="#15803d"/><text x="400" y="129" text-anchor="middle" font-size="16">Signal recorder</text><text x="400" y="192" text-anchor="middle" font-size="17" font-weight="bold">Record and amplify</text><path d="M512 140h33" stroke="#475569" stroke-width="3"/><path d="M537 133l10 7-10 7" fill="none" stroke="#475569" stroke-width="3"/><rect x="552" y="64" width="228" height="154" rx="12" fill="#fef3c7" stroke="#a16207"/><path d="M572 125q8-28 16 0t16 0t16 0t16 0t16 0t16 0t16 0t16 0t16 0t16 0t16 0" fill="none" stroke="#b45309" stroke-width="2"/><text x="666" y="192" text-anchor="middle" font-size="17" font-weight="bold">Waveform display</text><rect x="20" y="238" width="760" height="86" rx="10" fill="#e2e8f0"/><text x="400" y="267" text-anchor="middle" font-size="17">Clean 