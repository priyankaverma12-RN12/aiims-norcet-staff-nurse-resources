<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 475" role="img" aria-labelledby="t d"><title id="t">Mood, affect, thought and perception distinctions</title><desc id="d">Mood is subjective feeling, affect is observable expression, thought form is the flow, content is belief or idea, illusion misinterprets an existing stimulus, hallucination lacks a corresponding external stimulus.</desc><rect width="840" height="475" rx="22" fill="#f7fafc"/><g font-family="Arial,sans-serif" fill="#17324d" text-anchor="middle"><text x="420" y="39" font-size="23" font-weight="bold">MSE: three exam comparisons</text>
<g stroke-width="1.5"><rect x="35" y="62" width="375" height="112" rx="12" fill="#e0f0ff" stroke="#4a82ae"/><rect x="430" y="62" width="375" height="112" rx="12" fill="#e0f0ff" stroke="#4a82ae"/><rect x="35" y="193" width="375" height="112" rx="12" fill="#fff0db" stroke="#b67525"/><rect x="430" y="193" width="375" height="112" rx="12" fill="#fff0db" stroke="#b67525"/><rect x="35" y="324" width="375" height="112" rx="12" fill="#e2f3e8" stroke="#3e8a59"/><rect x="430" y="324" width="375" height="112" rx="12" fill="#e2f3e8" stroke="#3e8a59"/></g>
<g font-size="20" font-weight="bold"><text x="222" y="94">Mood</text><text x="618" y="94">Affect</text><text x="222" y="225">Thought form</text><text x="618" y="225">Thought content</text><text x="222" y="356">Illusion</text><text x="618" y="356">Hallucination</text></g><g font-size="15"><text x="222" y="120">Patient's own reported feeling</text><text x="222" y="145">Example: "I feel sad."</text><text x="618" y="120">Nurse's observed expression</text><text x="618" y="145">Example: tearful facial expression</text><text x="222" y="251">How thoughts connect and flow</text><text x="222" y="276">Example: sudden thought interruption</text><text x="618" y="251">What the patient thinks or believes</text><text x="618" y="276">Example: an intrusive unwanted idea</text><text x="222" y="382">Real stimulus, mistaken perception</text><text x="222" y="407">Example: coat mistaken for a person</text><text x="618" y="382">No corresponding external stimulus</text><text x="618" y="407">Example: hearing a voice with no source</text></g><text x="420" y="460" font-size="13">Use clinical context and cultural understanding before interpretation.</text></g></svg>