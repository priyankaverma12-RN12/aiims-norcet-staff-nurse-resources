<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img" aria-labelledby="t d"><title id="t">GCS components and neurological assessment</title><desc id="d">Eye response up to four, verbal up to five, motor up to six. Total three to fifteen only when all are testable. Check pupils separately and escalate deterioration.</desc><rect width="800" height="330" rx="16" fill="#f8fafc"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#183153"><text x="400" y="37" font-size="24" font-weight="bold">Glasgow Coma Scale</text><rect x="25" y="63" width="240" height="104" rx="12" fill="#dbeafe" stroke="#2563eb"/><rect x="280" y="63" width="240" height="104" rx="12" fill="#dcfce7" stroke="#15803d"/><rect x="535" y="63" width="240" height="104" rx="12" fill="#fef3c7" stroke="#a16207"/><text x="145" y="96" font-size="20" font-weight="bold">E — Eye</text><text x="145" y="139" font-size="28">1–4</text><text x="400" y="96" font-size="20" font-weight="bold">V — Verbal</text><text x="400" y="139" font-size="28">1–5</text><text x="655" y="96" font-size="20" font-weight="bold">M — Motor</text><text x="655" y="139" font-size="28">1–6</text><rect x="25" y="188" width="750" height="52" rx="10" fill="#e2e8f0"/><text x="400" y="220" font-size="18" font-weight="bold">Total 3–15 only when every component is testable</text><text x="400" y="270" font-size="16">NT = not testable. Record the barrier, not a guessed score.</text><text x="400" y="300" font-size="16" font-weight="bold" fill="#991b1b">Assess pupils separately. Escalate new deterioration.</text></g></svg>