<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 530" role="img" aria-labelledby="title desc">
<title id="title">Mental status examination and clinical safety flow</title><desc id="desc">Observe safety, then appearance, speech and emotion, thought and perception, cognition, insight and judgment. Document objective findings and patient reports, reassess changes.</desc>
<rect width="840" height="530" rx="24" fill="#f4f8fc"/>
<g font-family="Arial,sans-serif" text-anchor="middle" fill="#17324d"><text x="420" y="42" font-size="24" font-weight="bold">Mental Status Examination (MSE)</text><text x="420" y="68" font-size="15">A structured picture of the patient's current mental functioning</text>
<g fill="#ffe4df" stroke="#b53d37" stroke-width="2"><rect x="125" y="87" width="590" height="62" rx="12"/></g><text x="420" y="112" font-size="19" font-weight="bold">First: immediate safety and physical stability</text><text x="420" y="134" font-size="14">New altered consciousness or focal neurological signs? Escalate.</text>
<path d="M420 149v22" stroke="#52677b" stroke-width="3"/><path d="M414 164l6 9 6-9" fill="#52677b"/>
<g fill="#deedf9" stroke="#427aa4"><rect x="40" y="177" width="360" height="73" rx="10"/><rect x="440" y="177" width="360" height="73" rx="10"/><rect x="40" y="265" width="360" height="73" rx="10"/><rect x="440" y="265" width="360" height="73" rx="10"/><rect x="40" y="353" width="360" height="73" rx="10"/><rect x="440" y="353" width="360" height="73" rx="10"/></g>
<g font-size="18" font-weight="bold"><text x="220" y="204">Appearance and behaviour</text><text x="620" y="204">Speech and motor activity</text><text x="220" y="292">Mood and affect</text><text x="620" y="292">Thought and perception</text><text x="220" y="380">Cognition</text><text x="620" y="380">Insight and judgment</text></g>
<g font-size="14"><text x="220" y="228">Observe hygiene, movement, interaction</text><text x="620" y="228">Rate, volume, clarity, activity</text><text x="220" y="316">Reported feeling vs observed expression</text><text x="620" y="316">Flow, beliefs, sensory experiences</text><text x="220" y="404">Attention, orientation, memory</text><text x="620" y="404">Awareness and decision-making</text></g>
<rect x="80" y="447" width="680" height="56" rx="12" fill="#dff2e6" stroke="#398355"/><text x="420" y="471" font-size="18" font-weight="bold">Record observations + patient quotes + action</text><text x="420" y="491" font-size="14">Compare with baseline and reassess when status changes.</text></g></svg>