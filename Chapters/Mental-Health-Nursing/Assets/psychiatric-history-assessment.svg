<svg xmlns="http://www.w3.org/2000/svg" width="800" height="370" viewBox="0 0 800 370" role="img" aria-labelledby="t d"><title id="t">Psychiatric history and assessment</title><desc id="d">History and mental status examination inform physical and safety assessment and nursing care planning.</desc><rect width="800" height="370" rx="16" fill="#f8fafc"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#102a43"><text x="400" y="38" font-size="24" font-weight="bold">Psychiatric assessment</text><rect x="35" y="65" width="340" height="130" rx="12" fill="#dbeafe" stroke="#2563eb"/><rect x="425" y="65" width="340" height="130" rx="12" fill="#dcfce7" stroke="#15803d"/><text x="205" y="95" font-size="20" font-weight="bold">History: journey</text><text x="205" y="125" font-size="17">Onset, course, past treatment</text><text x="205" y="152" font-size="17">Medical, family, personal history</text><text x="205" y="179" font-size="17">Patient and collateral accounts</text><text x="595" y="95" font-size="20" font-weight="bold">MSE: current snapshot</text><text x="595" y="125" font-size="17">Speech, mood, thought</text><text x="595" y="152" font-size="17">Perception and cognition</text><text x="595" y="179" font-size="17">Insight and judgment</text><path d="M205 195 V220 H400 M595 195 V220 H400 V248" fill="none" stroke="#475569" stroke-width="3"/><path d="M392 239 L400 248 L408 239" fill="none" stroke="#475569" stroke-width="3"/><rect x="155" y="250" width="490" height="88" rx="12" fill="#fef3c7" stroke="#b45309"/><text x="400" y="280" font-size="18" font-weight="bold">Physical assessment + immediate safety</text><text x="400" y="311" font-size="17">Document, escalate as needed, plan care</text></g></svg>