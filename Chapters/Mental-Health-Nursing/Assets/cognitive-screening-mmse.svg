<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" role="img" aria-labelledby="t d"><title id="t">MMSE score and interpretation</title><desc id="d">The five conventional MMSE domain groups sum to 30 points. Interpret scores with clinical context and functional assessment.</desc><rect width="800" height="430" rx="16" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#172b4d"><text x="400" y="42" text-anchor="middle" font-size="25" font-weight="bold">MMSE: total 30 points</text><g font-size="17"><text x="35" y="92">Orientation</text><rect x="230" y="70" width="400" height="30" rx="5" fill="#bfdbfe"/><text x="645" y="92" font-weight="bold">10</text><text x="35" y="137">Registration</text><rect x="230" y="115" width="120" height="30" rx="5" fill="#bbf7d0"/><text x="365" y="137" font-weight="bold">3</text><text x="35" y="182">Attention/calculation</text><rect x="230" y="160" width="200" height="30" rx="5" fill="#fde68a"/><text x="445" y="182" font-weight="bold">5</text><text x="35" y="227">Delayed recall</text><rect x="230" y="205" width="120" height="30" rx="5" fill="#c4b5fd"/><text x="365" y="227" font-weight="bold">3</text><text x="35" y="272">Language/construction</text><rect x="230" y="250" width="360" height="30" rx="5" fill="#fecaca"/><text x="605" y="272" font-weight="bold">9</text></g><rect x="35" y="312" width="730" height="82" rx="12" fill="#e2e8f0" stroke="#475569"/><text x="400" y="341" text-anchor="middle" font-size="20" font-weight="bold">A score is a screening finding, not a diagnosis</text><text x="400" y="369" text-anchor="middle" font-size="16">Interpret with education, health, language, baseline and daily function.</text></g></svg>