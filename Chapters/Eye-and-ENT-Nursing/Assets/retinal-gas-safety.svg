<svg xmlns="http://www.w3.org/2000/svg" width="840" height="385" viewBox="0 0 840 385"><rect width="840" height="385" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#172554"><text x="22" y="34" font-weight="bold" font-size="24">Intraocular gas: safe postoperative care</text><text x="22" y="59" font-size="14">Position depends on the retinal break and surgeon's instructions.</text><circle cx="145" cy="180" r="92" fill="#dbeafe" stroke="#475569" stroke-width="3"/><path d="M70 128 Q145 76 220 128 Q204 160 145 160 Q86 160 70 128Z" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><path d="M116 92 Q145 82 174 92" stroke="#be123c" stroke-width="6" fill="none"/><path d="M145 175 V115 M139 124 L145 115 L151 124" stroke="#0369a1" stroke-width="3" fill="none"/><text x="145" y="206" text-anchor="middle" font-size="15" font-weight="bold">Bubble floats up</text><text x="145" y="226" text-anchor="middle" font-size="12">Toward intended area</text><text x="145" y="295" text-anchor="middle" font-size="13">Conceptual model only</text><g transform="translate(280 78)"><rect width="536" height="60" rx="8" fill="#dcfce7" stroke="#64748b"/><text x="14" y="23" font-size="16" font-weight="bold">Position</text><text x="14" y="45" font-size="14">Use the exact prescribed posture</text></g><g transform="translate(280 147)"><rect width="536" height="60" rx="8" fill="#fef3c7" stroke="#64748b"/><text x="14" y="23" font-size="16" font-weight="bold">Altitude</text><text x="14" y="45" font-size="14">No flights or unsafe ascent with gas</text></g><g transform="translate(280 216)"><rect width="536" height="60" rx="8" fill="#fef3c7" stroke="#64748b"/><text x="14" y="23" font-size="16" font-weight="bold">Anaesthesia and analgesia</text><text x="14" y="45" font-size="14">Avoid nitrous oxide while gas remains</text></g><g transform="translate(280 285)"><rect width="536" height="60" rx="8" fill="#fee2e2" stroke="#64748b"/><text x="14" y="23" font-size="16" font-weight="bold">Urgent review</text><text x="14" y="45" font-size="14">New severe pain or worsening vision</text></g><text x="22" y="367" font-size="14">Carry a gas alert and confirm surgeon clearance before flying or high-altitude travel.</text></g></svg>