<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="t d"><title id="t">ROP retinal zones</title><desc id="d">Disc-centered zone I and zone II circles with residual temporal zone III crescent. Fovea is within zone I, at half its radius from disc.</desc><rect width="760" height="420" fill="#f9fafb" rx="15"/><circle cx="270" cy="210" r="170" fill="#f5c5a2" stroke="#674534" stroke-width="2"/><circle cx="230" cy="210" r="130" fill="#f4e0a3" stroke="#9a7331" stroke-width="2"/><circle cx="230" cy="210" r="70" fill="#b9dfd8" stroke="#286e68" stroke-width="2"/><circle cx="230" cy="210" r="8" fill="#fff4dd" stroke="#754b32"/><circle cx="265" cy="210" r="5" fill="#743841"/><g font-family="sans-serif" fill="#223444" font-size="16"><text x="20" y="27" font-size="21" font-weight="bold">ROP location: schematic fundus, not to scale</text><text x="110" y="205">Nasal</text><text x="364" y="210">Temporal</text><text x="198" y="165">Zone I</text><text x="302" y="130">Zone II</text><text x="365" y="272">III</text><text x="475" y="95">Zone I: radius = 2 ×</text><text x="475" y="119">disc–fovea distance</text><text x="475" y="175">Zone II: extends to</text><text x="475" y="199">nasal ora serrata</text><text x="475" y="255">Zone III: remaining</text><text x="475" y="279">temporal crescent</text><text x="181" y="233">Disc</text><text x="269" y="233">Fovea</text><text x="20" y="400">Most posterior disease determines the zone. Stage and plus are recorded separately.</text></g><path d="M230 190 V180 H300 V190 M230 210 H265" stroke="#244d56" fill="none" stroke-width="2"/></svg>