<svg xmlns="http://www.w3.org/2000/svg" width="800" height="385" viewBox="0 0 800 385"><rect width="800" height="385" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#172554" font-size="16"><text x="25" y="33" font-size="24" font-weight="bold">Hyperopia and accommodative esotropia</text><text x="25" y="56" font-size="14">Simplified mechanism in susceptible children, not every hyperopic child.</text><rect x="25" y="80" width="220" height="76" rx="8" fill="#dbeafe" stroke="#2563eb"/><text x="135" y="106" text-anchor="middle" font-weight="bold">Uncorrected hyperopia</text><text x="135" y="132" text-anchor="middle">Extra focusing demand</text><rect x="290" y="80" width="220" height="76" rx="8" fill="#fef3c7" stroke="#b45309"/><text x="400" y="106" text-anchor="middle" font-weight="bold">Accommodation</text><text x="400" y="132" text-anchor="middle">Increased effort</text><rect x="555" y="80" width="220" height="76" rx="8" fill="#fee2e2" stroke="#b91c1c"/><text x="665" y="106" text-anchor="middle" font-weight="bold">Convergence</text><text x="665" y="132" text-anchor="middle">May lead to inward turn</text><path d="M245 118 H290 M510 118 H555" stroke="#475569" stroke-width="3"/><path d="M290 118 l-9 -5 v10z M555 118 l-9 -5 v10z" fill="#475569"/><rect x="25" y="195" width="220" height="74" rx="8" fill="#dcfce7" stroke="#15803d"/><text x="135" y="222" text-anchor="middle" font-weight="bold">Prescribed plus lens</text><text x="135" y="246" text-anchor="middle">Reduces focusing demand</text><rect x="290" y="195" width="220" height="74" rx="8" fill="#dcfce7" stroke="#15803d"/><text x="400" y="222" text-anchor="middle" font-weight="bold">Less accommodative effort</text><text x="400" y="246" text-anchor="middle">Less linked convergence</text><rect x="555" y="195" width="220" height="74" rx="8" fill="#e0f2fe" stroke="#0369a1"/><text x="665" y="222" text-anchor="middle" font-weight="bold">Alignment may improve</text><text x="665" y="246" text-anchor="middle">Continue specialist review</text><path d="M245 232 H290 M510 232 H555" stroke="#475569" stroke-width="3"/><path d="M290 232 l-9 -5 v10z M555 232 l-9 -5 v10z" fill="#475569"/><rect x="25" y="300" width="750" height="57" rx="8" fill="#e2e8f0" stroke="#475569"/><text x="400" y="324" text-anchor="middle" font-weight="bold">Nursing priority: correct prescribed wear, visual development, follow-up</text><text x="400" y="345" text-anchor="middle" font-size="14">Persistent crossing despite correction requires reassessment.</text></g></svg>