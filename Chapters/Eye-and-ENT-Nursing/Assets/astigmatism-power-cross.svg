<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 0 820 400"><rect width="820" height="400" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#172554"><text x="24" y="34" font-size="24" font-weight="bold">Regular astigmatism: principal meridians</text><text x="24" y="60" font-size="15">Illustrative power cross for +1.00 DS / −2.00 DC × 180°</text><circle cx="195" cy="197" r="104" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><path d="M66 197 H324 M195 68 V326" stroke="#334155" stroke-width="3"/><text x="195" y="88" text-anchor="middle" font-size="16">90°</text><text x="326" y="189" font-size="16">180°</text><text x="195" y="349" text-anchor="middle" font-size="18" font-weight="bold">90°: −1.00 D</text><text x="26" y="189" font-size="15">180°:</text><text x="26" y="211" font-size="15">+1.00 D</text><rect x="405" y="90" width="390" height="106" rx="10" fill="#dcfce7" stroke="#15803d"/><text x="425" y="119" font-size="18" font-weight="bold">Along cylinder axis (180°)</text><text x="425" y="150" font-size="17">Sphere only: +1.00 D</text><text x="425" y="175" font-size="15">Cylinder contributes 0 D here.</text><rect x="405" y="221" width="390" height="106" rx="10" fill="#fef3c7" stroke="#b45309"/><text x="425" y="251" font-size="18" font-weight="bold">90° away from cylinder axis</text><text x="425" y="280" font-size="17">Sphere + cylinder = +1 − 2 = −1 D</text><text x="425" y="306" font-size="15">Cylinder contributes its full power.</text><text x="24" y="382" font-size="13">Ideal thin-lens model, not a patient prescription or corneal map.</text></g></svg>