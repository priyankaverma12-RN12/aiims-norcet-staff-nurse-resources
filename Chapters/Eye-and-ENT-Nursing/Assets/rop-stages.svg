<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="t d"><title id="t">ROP stages schematic</title><desc id="d">Five panels depict demarcation line, ridge, extraretinal proliferation, partial detachment and total detachment.</desc><rect width="900" height="330" rx="15" fill="#f9fafb"/><g font-family="sans-serif" fill="#243644"><text x="20" y="30" font-size="21" font-weight="bold">ROP stages at vascular–avascular junction</text><g transform="translate(15 65)"><rect width="166" height="220" rx="10" fill="#fff" stroke="#c3cdd3"/><text x="10" y="25" font-size="18" font-weight="bold">Stage 1</text><path d="M12 170 H154" stroke="#89634e" stroke-width="5"/><path d="M12 145 H154" stroke="#d48a52" stroke-width="12" fill="none"/><path d="M12 138 H75" stroke="#b53644" stroke-width="3"/><path d="M83 128 V158" stroke="#b53644" stroke-width="4" fill="none"/><text x="9" y="197" font-size="13">Line</text></g><g transform="translate(192 65)"><rect width="166" height="220" rx="10" fill="#fff" stroke="#c3cdd3"/><text x="10" y="25" font-size="18" font-weight="bold">Stage 2</text><path d="M12 170 H154" stroke="#89634e" stroke-width="5"/><path d="M12 145 H68 Q83 111 98 145 H154" stroke="#d48a52" stroke-width="12" fill="none"/><path d="M12 138 H75" stroke="#b53644" stroke-width="3"/><path d="M83 115 V145" stroke="#b53644" stroke-width="4" fill="none"/><text x="9" y="197" font-size="13">Raised ridge</text></g><g transform="translate(369 65)"><rect width="166" height="220" rx="10" fill="#fff" stroke="#c3cdd3"/><text x="10" y="25" font-size="18" font-weight="bold">Stage 3</text><path d="M12 170 H154" stroke="#89634e" stroke-width="5"/><path d="M12 145 H68 Q83 110 98 145 H154" stroke="#d48a52" stroke-width="12" fill="none"/><path d="M12 138 H75" stroke="#b53644" stroke-width="3"/><path d="M83 120 L70 92 L85 75 L96 90 M83 120 L105 100 L116 75" stroke="#b53644" stroke-width="4" fill="none"/><text x="9" y="197" font-size="13">New vessels</text></g><g transform="translate(546 65)"><rect width="166" height="220" rx="10" fill="#fff" stroke="#c3cdd3"/><text x="10" y="25" font-size="18" font-weight="bold">Stage 4</text><path d="M12 170 H154" stroke="#89634e" stroke-width="5"/><path d="M12 145 Q70 62 105 145 H154" stroke="#d48a52" stroke-width="12" fill="none"/><path d="M12 138 H75" stroke="#b53644" stroke-width="3"/><path d="" stroke="#b53644" stroke-width="4" fill="none"/><text x="9" y="197" font-size="13">Partial detachment</text></g><g transform="translate(723 65)"><rect width="166" height="220" rx="10" fill="#fff" stroke="#c3cdd3"/><text x="10" y="25" font-size="18" font-weight="bold">Stage 5</text><path d="M12 170 H154" stroke="#89634e" stroke-width="5"/><path d="M12 145 Q83 20 154 145" stroke="#d48a52" stroke-width="12" fill="none"/><path d="M12 138 H75" stroke="#b53644" stroke-width="3"/><path d="" stroke="#b53644" stroke-width="4" fill="none"/><text x="9" y="197" font-size="13">Total detachment</text></g><text x="20" y="313" font-size="14">Conceptual cross-sections only. Stage 4A spares fovea, 4B involves fovea. Stage 5 has ICROP3 subtypes.</text></g></svg>