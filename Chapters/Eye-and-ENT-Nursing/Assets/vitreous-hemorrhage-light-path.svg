<svg xmlns="http://www.w3.org/2000/svg" width="850" height="330" viewBox="0 0 850 330"><rect width="850" height="330" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#172554"><text x="24" y="32" font-size="23" font-weight="bold">Vitreous hemorrhage: why the view becomes hazy</text><text x="24" y="55" font-size="14">Original simplified cross-section, not a diagnostic image</text><g transform="translate(24 70)"><rect width="390" height="235" rx="12" fill="white" stroke="#cbd5e1"/><ellipse cx="200" cy="104" rx="126" ry="84" fill="#e0f2fe" stroke="#64748b" stroke-width="2"/><path d="M85 69 Q48 104 85 139" fill="#c7e8f2" stroke="#64748b" stroke-width="2"/><ellipse cx="116" cy="104" rx="15" ry="37" fill="#fef3c7" stroke="#92400e"/><path d="M293 47 Q351 104 293 161" fill="none" stroke="#ea580c" stroke-width="7"/><path d="M322 100 L355 100 L355 113 L322 113" fill="#fde68a" stroke="#92400e"/><text x="196" y="40" font-size="13" text-anchor="middle">Vitreous cavity</text><text x="115" y="162" font-size="12" text-anchor="middle">Lens</text><text x="307" y="180" font-size="12" text-anchor="middle">Retina</text><path d="M20 104 L290 104" stroke="#0891b2" stroke-width="3"/><path d="M290 104 L281 99 L281 109 Z" fill="#0891b2"/><text x="195" y="204" font-size="17" text-anchor="middle" font-weight="bold">Clear vitreous transmits light</text><text x="195" y="223" font-size="12" text-anchor="middle">Light reaches the retina</text></g><g transform="translate(434 70)"><rect width="390" height="235" rx="12" fill="white" stroke="#cbd5e1"/><ellipse cx="200" cy="104" rx="126" ry="84" fill="#e0f2fe" stroke="#64748b" stroke-width="2"/><path d="M85 69 Q48 104 85 139" fill="#c7e8f2" stroke="#64748b" stroke-width="2"/><ellipse cx="116" cy="104" rx="15" ry="37" fill="#fef3c7" stroke="#92400e"/><path d="M293 47 Q351 104 293 161" fill="none" stroke="#ea580c" stroke-width="7"/><path d="M322 100 L355 100 L355 113 L322 113" fill="#fde68a" stroke="#92400e"/><text x="196" y="40" font-size="13" text-anchor="middle">Vitreous cavity</text><text x="115" y="162" font-size="12" text-anchor="middle">Lens</text><text x="307" y="180" font-size="12" text-anchor="middle">Retina</text><g fill="#991b1b" opacity=".8"><circle cx="165" cy="83" r="6"/><circle cx="200" cy="115" r="6"/><circle cx="244" cy="92" r="6"/><circle cx="183" cy="137" r="6"/><circle cx="259" cy="130" r="6"/><circle cx="213" cy="73" r="6"/><circle cx="147" cy="105" r="6"/><circle cx="279" cy="111" r="6"/><circle cx="219" cy="147" r="6"/><circle cx="170" cy="62" r="6"/></g><path d="M20 104 L151 104 M151 104 L191 76 M151 104 L191 144" stroke="#0891b2" stroke-width="2.5" stroke-dasharray="5 4" fill="none"/><text x="195" y="204" font-size="17" text-anchor="middle" font-weight="bold">Blood scatters and blocks light</text><text x="195" y="223" font-size="12" text-anchor="middle">Retinal examination may be obscured</text></g></g></svg>