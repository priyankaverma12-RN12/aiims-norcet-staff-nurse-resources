<svg xmlns="http://www.w3.org/2000/svg" width="820" height="330" viewBox="0 0 820 330" role="img" aria-labelledby="t d"><title id="t">Normal fovea and epiretinal membrane schematic</title><desc id="d">Normal retinal cross section has a central depression. An epiretinal membrane on the inner retinal surface contracts and produces folds and a shallower pit.</desc><rect width="820" height="330" rx="16" fill="#f8fafc"/><g font-family="sans-serif" font-size="16" fill="#142638"><text x="28" y="35" font-size="21" font-weight="bold">Normal macula</text><text x="430" y="35" font-size="21" font-weight="bold">Epiretinal membrane</text><text x="28" y="68">Vitreous side (inner retina)</text><text x="430" y="68">Vitreous side</text><path d="M35 120 H115 Q150 120 174 156 Q200 196 226 156 Q250 120 285 120 H375 V238 H35Z" fill="#f7c998" stroke="#8f5532" stroke-width="2"/><path d="M35 202 H375 M35 220 H375" stroke="#b96e45" stroke-width="2" fill="none"/><path d="M435 135 Q470 112 500 137 T562 130 T624 138 T686 127 T780 135 V238 H435Z" fill="#f7c998" stroke="#8f5532" stroke-width="2"/><path d="M435 196 Q485 182 530 199 T620 194 T710 200 T780 196 M435 220 H780" fill="none" stroke="#b96e45" stroke-width="2"/><path d="M435 132 Q470 109 500 134 T562 127 T624 135 T686 124 T780 132" stroke="#245d7d" stroke-width="7" fill="none"/><path d="M465 93 H550 M752 93 H667" stroke="#245d7d" stroke-width="3"/><path d="M550 93 l-12 -7 v14Z M667 93 l12 -7 v14Z" fill="#245d7d"/><text x="554" y="91" font-size="13">Pull</text><text x="149" y="185" font-size="13">Foveal pit</text><text x="455" y="165" font-size="14">Surface folds</text><text x="28" y="265">Outer retina / RPE side</text><text x="430" y="265">Outer retina / RPE side</text><line x1="430" y1="291" x2="463" y2="291" stroke="#245d7d" stroke-width="6"/><text x="473" y="296">Surface ERM (not a blood vessel)</text><text x="28" y="312" font-size="13">Original illustration, not to scale. Not a diagnostic scan.</text></g></svg>