<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 330" role="img" aria-labelledby="t"><title id="t">Educational corneal cross sections: surface inflammation and stromal infiltrate</title><rect width="850" height="330" rx="14" fill="#f8fafc"/><g font-family="sans-serif" fill="#203444"><text x="32" y="34" font-size="22" font-weight="bold">Epithelial keratitis</text><text x="450" y="34" font-size="22" font-weight="bold">Stromal keratitis</text><path d="M35 120 Q220 55 400 120 L400 220 Q220 155 35 220Z M450 120 Q635 55 815 120 L815 220 Q635 155 450 220Z" fill="#bbdce8" stroke="#487387" stroke-width="2"/><path d="M35 120 Q220 55 400 120 M450 120 Q635 55 815 120" fill="none" stroke="#407b99" stroke-width="9"/><path d="M35 220 Q220 155 400 220 M450 220 Q635 155 815 220" fill="none" stroke="#28536c" stroke-width="4"/><path d="M185 90 Q220 85 255 90" stroke="#c4443b" stroke-width="10" stroke-linecap="round" fill="none"/><ellipse cx="635" cy="146" rx="64" ry="35" fill="#e1c2a3" stroke="#b27551" stroke-width="2"/><text x="50" y="255" font-size="16">Red: surface epithelial injury</text><text x="460" y="255" font-size="16">Tan: stromal inflammatory focus</text><text x="30" y="285" font-size="15">Blue band = epithelium. Pale blue = stroma. Dark inner line = posterior layers.</text><text x="30" y="310" font-size="14">Not to scale. Appearance alone cannot identify the organism.</text></g></svg>