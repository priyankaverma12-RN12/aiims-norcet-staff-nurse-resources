<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" role="img" aria-labelledby="t d"><title id="t">Lacrimal sac obstruction and DCR bypass</title><desc id="d">Simplified tear flow from puncta through canaliculi into sac. The normal duct drains to inferior nasal meatus. A blocked duct retains fluid and DCR creates a separate sac-to-nasal passage.</desc><rect width="880" height="460" rx="18" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#17304d"><text x="440" y="33" font-size="23" font-weight="bold" text-anchor="middle">Dacryocystitis and DCR</text><rect x="22" y="55" width="408" height="370" rx="14" fill="white" stroke="#c3ceda"/><rect x="450" y="55" width="408" height="370" rx="14" fill="white" stroke="#c3ceda"/><text x="226" y="85" text-anchor="middle" font-size="19" font-weight="bold">Obstructed duct</text><text x="654" y="85" text-anchor="middle" font-size="19" font-weight="bold">After DCR — bypass</text><g stroke-linecap="round" stroke-linejoin="round"><path d="M60 151 Q130 91 196 151 Q130 207 60 151Z" fill="#e6f4fa" stroke="#416881" stroke-width="3"/><circle cx="130" cy="151" r="20" fill="#58988e"/><circle cx="190" cy="144" r="4" fill="#185d86"/><circle cx="190" cy="159" r="4" fill="#185d86"/><path d="M190 144 L220 144 L230 172 M190 159 L213 159 L230 172" fill="none" stroke="#247aa6" stroke-width="5"/><ellipse cx="231" cy="203" rx="22" ry="35" fill="#f8aba1" stroke="#b84335" stroke-width="3"/><path d="M231 238 L231 350 L309 350" fill="none" stroke="#247aa6" stroke-width="8"/><path d="M218 271 L244 297 M244 271 L218 297" stroke="#b84335" stroke-width="6"/><path d="M300 120 Q330 115 350 151 L350 367 L299 367Z" fill="#f1dfcf" stroke="#a68b76" stroke-width="2"/><path d="M231 350 H309" stroke="#247aa6" stroke-width="7"/><text x="56" y="229" font-size="16">Inflamed sac</text><path d="M160 225 L209 208" stroke="#b84335" stroke-width="2"/><text x="61" y="291" font-size="16" fill="#9c3327">Blocked duct</text><path d="M169 286 H216" stroke="#b84335" stroke-width="2"/><text x="270" y="396" font-size="14">Inferior meatus</text><text x="65" y="120" font-size="14">Puncta → canaliculi</text></g><g transform="translate(428 0)" stroke-linecap="round" stroke-linejoin="round"><path d="M60 151 Q130 91 196 151 Q130 207 60 151Z" fill="#e6f4fa" stroke="#416881" stroke-width="3"/><circle cx="130" cy="151" r="20" fill="#58988e"/><circle cx="190" cy="144" r="4" fill="#185d86"/><circle cx="190" cy="159" r="4" fill="#185d86"/><path d="M190 144 L220 144 L230 172 M190 159 L213 159 L230 172" fill="none" stroke="#247aa6" stroke-width="5"/><ellipse cx="231" cy="203" rx="20" ry="34" fill="#c9eafa" stroke="#247aa6" stroke-width="3"/><path d="M231 238 L231 350 L309 350" fill="none" stroke="#94a7b7" stroke-width="7" stroke-dasharray="6 6"/><path d="M218 271 L244 297 M244 271 L218 297" stroke="#b84335" stroke-width="5"/><path d="M300 120 Q330 115 350 151 L350 367 L299 367Z" fill="#f1dfcf" stroke="#a68b76" stroke-width="2"/><path d="M251 203 H327" stroke="#24815c" stroke-width="11"/><path d="M314 193 L327 203 L314 213" fill="none" stroke="#155f45" stroke-width="3"/><text x="62" y="244" font-size="16" fill="#155f45">New sac-to-nose route</text><path d="M207 239 L267 209" stroke="#24815c" stroke-width="2"/><text x="267" y="164" font-size="14">Nasal cavity</text><text x="65" y="120" font-size="14">Puncta → canaliculi</text><text x="55" y="330" font-size="15">Old blocked duct</text><text x="55" y="350" font-size="15">is bypassed</text></g><text x="440" y="448" text-anchor="middle" font-size="14" fill="#52677c">Original schematic · not to scale · not a surgical guide</text></g></svg>
