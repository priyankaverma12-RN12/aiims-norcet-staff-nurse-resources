<svg xmlns="http://www.w3.org/2000/svg" width="820" height="360" viewBox="0 0 820 360"><rect width="820" height="360" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#172554"><text x="24" y="34" font-size="23" font-weight="bold">Presbyopia: near-point change</text><text x="24" y="60" font-size="15">Distance-corrected eyes, simplified model, not to scale</text><g transform="translate(25 85)"><rect width="770" height="108" rx="12" fill="#dbeafe"/><text x="15" y="26" font-weight="bold" font-size="18">Illustrative near point: 25 cm</text><path d="M40 72 H680" stroke="#64748b" stroke-width="2"/><circle cx="40" cy="72" r="12" fill="#0369a1"/><path d="M200 49 V90" stroke="#15803d" stroke-width="4"/><text x="210" y="63" font-size="15">Closest clear object</text><text x="490" y="93" font-size="15">1 / 0.25 = 4 D amplitude</text></g><g transform="translate(25 209)"><rect width="770" height="108" rx="12" fill="#fef3c7"/><text x="15" y="26" font-weight="bold" font-size="18">Illustrative receded near point: 50 cm</text><path d="M40 72 H680" stroke="#64748b" stroke-width="2"/><circle cx="40" cy="72" r="12" fill="#0369a1"/><path d="M360 49 V90" stroke="#b45309" stroke-width="4"/><text x="370" y="62" font-size="15">Closest clear object</text><text x="490" y="93" font-size="15">1 / 0.50 = 2 D amplitude</text></g><text x="24" y="343" font-size="14">Plus near correction reduces task demand. Actual near point varies with the person and test method.</text></g></svg>