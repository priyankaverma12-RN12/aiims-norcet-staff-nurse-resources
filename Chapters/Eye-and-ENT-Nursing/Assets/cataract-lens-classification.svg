<svg xmlns="http://www.w3.org/2000/svg" width="820" height="360" viewBox="0 0 820 360"><rect width="820" height="360" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#172554"><text x="22" y="34" font-size="23" font-weight="bold">Cataract types by lens location</text><text x="22" y="59" font-size="14">Simplified side-view of the natural lens, anterior to the left. Not to scale.</text><g transform="translate(135 172)"><path d="M0 -91 C-88 -81 -88 81 0 91 C88 81 88 -81 0 -91Z" fill="#dbeafe" stroke="#0369a1" stroke-width="3"/><ellipse cx="0" cy="0" rx="34" ry="60" fill="#d97706" opacity=".85"/><path d="M-100 0 H100" stroke="#64748b" stroke-dasharray="4 4" opacity=".7"/><text x="0" y="127" text-anchor="middle" font-size="17" font-weight="bold">Nuclear</text><text x="0" y="150" text-anchor="middle" font-size="13">Central nucleus</text></g><g transform="translate(410 172)"><path d="M0 -91 C-88 -81 -88 81 0 91 C88 81 88 -81 0 -91Z" fill="#dbeafe" stroke="#0369a1" stroke-width="3"/><path d="M-37 -66 L-4 -25 L-25 -72Z M-48 51 L-9 18 L-29 66Z M32 -66 L10 -20 L48 -50Z M39 66 L7 20 L50 47Z" fill="#e7a33e" stroke="#92400e"/><path d="M-100 0 H100" stroke="#64748b" stroke-dasharray="4 4" opacity=".7"/><text x="0" y="127" text-anchor="middle" font-size="17" font-weight="bold">Cortical</text><text x="0" y="150" text-anchor="middle" font-size="13">Peripheral cortex / spokes</text></g><g transform="translate(685 172)"><path d="M0 -91 C-88 -81 -88 81 0 91 C88 81 88 -81 0 -91Z" fill="#dbeafe" stroke="#0369a1" stroke-width="3"/><ellipse cx="54" cy="0" rx="10" ry="34" fill="#d97706" stroke="#92400e"/><path d="M-100 0 H100" stroke="#64748b" stroke-dasharray="4 4" opacity=".7"/><text x="0" y="127" text-anchor="middle" font-size="17" font-weight="bold">Posterior subcapsular</text><text x="0" y="150" text-anchor="middle" font-size="13">Near posterior capsule</text></g><text x="22" y="345" font-size="13">Actual opacities may coexist. Diagnosis requires eye examination.</text></g></svg>