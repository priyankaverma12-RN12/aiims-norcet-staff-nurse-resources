<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360"><rect width="800" height="360" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#172554" font-size="16"><text x="22" y="34" font-weight="bold" font-size="24">Community refractive care: close the referral loop</text><rect x="22" y="65" width="365" height="94" rx="10" fill="#dbeafe" stroke="#64748b"/><text x="204" y="100" text-anchor="middle" font-weight="bold">Screen and document</text><text x="204" y="128" text-anchor="middle" font-size="15">Pass / refer / unable to test</text><rect x="412" y="65" width="365" height="94" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="594" y="100" text-anchor="middle" font-weight="bold">Referral and assessment</text><text x="594" y="128" text-anchor="middle" font-size="15">Check access and attendance</text><rect x="22" y="190" width="365" height="94" rx="10" fill="#dcfce7" stroke="#64748b"/><text x="204" y="225" text-anchor="middle" font-weight="bold">Dispense prescribed correction</text><text x="204" y="253" text-anchor="middle" font-size="15">Verify identity, fit and power</text><rect x="412" y="190" width="365" height="94" rx="10" fill="#fef3c7" stroke="#64748b"/><text x="594" y="225" text-anchor="middle" font-weight="bold">Follow up</text><text x="594" y="253" text-anchor="middle" font-size="15">Check function and remaining need</text><path d="M387 112 H412 M594 159 V177 H204 V190 M387 237 H412" stroke="#334155" stroke-width="3" fill="none"/><path d="M412 112 l-8 -5 v10z M204 190 l-5 -8 h10z M412 237 l-8 -5 v10z" fill="#334155"/><text x="22" y="322" font-size="15">Urgent red flags bypass routine screening and referral queues.</text><text x="22" y="344" font-size="15">Keep individual records secure and count outcomes, not spectacles alone.</text></g></svg>