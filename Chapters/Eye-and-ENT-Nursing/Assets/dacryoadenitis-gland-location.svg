<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" role="img" aria-labelledby="t d"><title id="t">Lacrimal gland enlargement and lateral eyelid droop</title><desc id="d">Two front-view teaching panels compare a normal upper outer lacrimal gland with an enlarged gland producing lateral lid droop and possible downward and inward globe displacement. Nasal side is toward the right in both drawings.</desc><rect width="880" height="450" rx="18" fill="#f5f8fc"/><g font-family="Arial,sans-serif" fill="#19334c"><text x="440" y="35" text-anchor="middle" font-weight="bold" font-size="24">Lacrimal gland: normal and inflamed</text><rect x="20" y="57" width="410" height="350" rx="12" fill="white" stroke="#aabfd1"/><rect x="450" y="57" width="410" height="350" rx="12" fill="white" stroke="#aabfd1"/><text x="225" y="88" text-anchor="middle" font-size="19" font-weight="bold">Normal location</text><text x="655" y="88" text-anchor="middle" font-size="19" font-weight="bold">Dacryoadenitis</text><g><ellipse cx="220" cy="235" rx="133" ry="112" fill="#eef4f8" stroke="#8aa2b4" stroke-width="2"/><path d="M103 227 Q222 142 337 227 Q222 302 103 227Z" fill="white" stroke="#725747" stroke-width="4"/><circle cx="220" cy="227" r="37" fill="#76aca8" stroke="#416d76" stroke-width="2"/><circle cx="220" cy="227" r="17" fill="#263747"/><path d="M104 156 Q93 131 118 120 Q151 112 174 139 Q178 159 150 168 Q122 175 104 156Z" fill="#f4c47b" stroke="#a56e23" stroke-width="2"/><path d="M126 167 L143 183 M145 163 L158 177" stroke="#a56e23" stroke-width="3"/><path d="M119 134 L60 115" stroke="#a56e23" stroke-width="2"/><text x="39" y="110" font-size="14">Gland</text><text x="46" y="374" font-size="15">Outer side</text><text x="304" y="374" font-size="15">Nasal side</text></g><g transform="translate(430 0)"><ellipse cx="220" cy="235" rx="133" ry="112" fill="#eef4f8" stroke="#8aa2b4" stroke-width="2"/><path d="M103 227 C154 257 182 154 242 175 Q302 183 337 227 Q222 302 103 227Z" fill="white" stroke="#725747" stroke-width="4"/><circle cx="241" cy="239" r="37" fill="#76aca8" stroke="#416d76" stroke-width="2"/><circle cx="241" cy="239" r="17" fill="#263747"/><path d="M88 167 Q68 126 111 112 Q162 96 193 136 Q205 168 174 184 Q122 200 88 167Z" fill="#f29f99" stroke="#ae3c32" stroke-width="3"/><path d="M110 182 L133 200 M143 185 L160 201" stroke="#ae3c32" stroke-width="3"/><text x="39" y="106" font-size="14" fill="#a12f2b">Enlarged gland</text><path d="M155 225 L87 295" stroke="#ae3c32" stroke-width="2"/><text x="35" y="318" font-size="15" fill="#a12f2b">Lateral lid droop</text><path d="M240 275 L260 321" stroke="#456b88" stroke-width="2"/><text x="178" y="342" font-size="14">Possible inferomedial shift</text><text x="46" y="374" font-size="15">Outer side</text><text x="304" y="374" font-size="15">Nasal side</text></g><text x="440" y="435" text-anchor="middle" font-size="14" fill="#52677c">Original simplified front-view illustration · not to scale · clinical examination is required</text></g></svg>
