<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" role="img" aria-labelledby="t"><title id="t">Obstructed meibomian gland and surrounding lipogranuloma</title><rect width="820" height="330" rx="12" fill="#f8fafc"/><g font-family="sans-serif" fill="#213745"><text x="25" y="30" font-size="20" font-weight="bold">Chalazion — conceptual upper eyelid section</text><path d="M160 55 Q100 160 160 270 Q260 310 330 270 V55Z" fill="#f4d1bb" stroke="#9b6a56" stroke-width="3"/><path d="M250 65 H320 V270 Q285 292 250 270Z" fill="#dae7ee" stroke="#557888" stroke-width="2"/><path d="M330 55 V270 Q306 291 280 289" stroke="#c26d85" stroke-width="5" fill="none"/><path d="M285 85 V277" stroke="#b78a32" stroke-width="13" stroke-linecap="round"/><g fill="#f3c962" stroke="#a17d34" stroke-width="2"><ellipse cx="266" cy="104" rx="16" ry="12"/><ellipse cx="301" cy="131" rx="16" ry="12"/><ellipse cx="268" cy="162" rx="16" ry="12"/><ellipse cx="302" cy="218" rx="16" ry="12"/></g><ellipse cx="278" cy="192" rx="48" ry="36" fill="#dfae6a" stroke="#a86f3c" stroke-width="3" opacity=".85"/><g fill="#f7e1a8"><circle cx="265" cy="180" r="8"/><circle cx="292" cy="201" r="10"/><circle cx="252" cy="204" r="6"/></g><path d="M273 276 H297" stroke="#b84442" stroke-width="7"/><g fill="none" stroke="#405969" stroke-width="1.5"><path d="M300 90 L445 73 H785"/><path d="M322 192 L445 149 H785"/><path d="M285 276 L445 235 H785"/><path d="M330 255 L445 286 H785"/></g><text x="455" y="66" font-size="15">Meibomian gland within tarsus</text><text x="455" y="141" font-size="16" font-weight="bold">Lipogranulomatous nodule</text><text x="455" y="165" font-size="14">Retained / leaked lipid and inflammation</text><text x="455" y="228" font-size="15">Blocked gland outlet</text><text x="455" y="280" font-size="15">Palpebral conjunctiva</text><text x="25" y="316" font-size="13">Not to scale. Primary chalazion is usually sterile, not an acute pus-filled abscess.</text></g></svg>