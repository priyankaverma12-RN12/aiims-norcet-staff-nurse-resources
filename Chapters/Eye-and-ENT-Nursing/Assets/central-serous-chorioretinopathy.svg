<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" role="img" aria-labelledby="t d"><title id="t">Central serous chorioretinopathy schematic</title><desc id="d">Normal retina and RPE are apposed on the left. A fluid pocket lifts the neural retina above the RPE on the right. Choroid lies beneath the RPE.</desc><rect width="840" height="330" rx="15" fill="#f8fafc"/><g font-family="sans-serif" fill="#193142"><text x="30" y="35" font-size="22" font-weight="bold">Normal macula</text><text x="435" y="35" font-size="22" font-weight="bold">CSC: subretinal fluid</text><rect x="30" y="207" width="365" height="45" fill="#c86a64"/><rect x="435" y="207" width="375" height="45" fill="#c86a64"/><path d="M30 204 H395 M435 204 H810" stroke="#633c35" stroke-width="7"/><path d="M30 135 Q150 135 212 153 Q275 135 395 135 V200 H30Z" fill="#edc38a" stroke="#8c5631" stroke-width="2"/><path d="M435 135 H480 Q545 65 620 65 Q695 65 765 135 H810 V200 H765 Q695 130 620 130 Q545 130 480 200 H435Z" fill="#edc38a" stroke="#8c5631" stroke-width="2"/><path d="M480 200 Q545 130 620 130 Q695 130 765 200Z" fill="#90d0ec" stroke="#226d94" stroke-width="2"/><path d="M620 239 V182" stroke="#226d94" stroke-width="3" stroke-dasharray="5 4"/><path d="M620 175 l-6 11 h12Z" fill="#226d94"/><text x="560" y="173" font-size="16">Fluid pocket</text><text x="48" y="181" font-size="15">Neural retina</text><text x="50" y="235" font-size="16">Choroid</text><text x="450" y="235" font-size="16">Choroid</text><text x="35" y="276" font-size="14">RPE = dark brown boundary</text><text x="435" y="276" font-size="14">Fluid lifts retina above RPE</text><text x="35" y="310" font-size="14">Original educational illustration. No retinal break is required. Not to scale.</text></g></svg>