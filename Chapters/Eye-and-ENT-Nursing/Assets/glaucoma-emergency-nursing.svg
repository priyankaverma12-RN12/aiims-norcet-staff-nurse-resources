<svg xmlns="http://www.w3.org/2000/svg" width="820" height="430" viewBox="0 0 820 430"><rect width="820" height="430" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#172554"><text x="24" y="34" font-size="23" font-weight="bold">Suspected acute angle closure: nursing priorities</text><rect x="28" y="65" width="764" height="54" rx="9" fill="#fee2e2" stroke="#b91c1c"/><text x="410" y="87" text-anchor="middle" font-weight="bold" font-size="17">Sudden painful red eye with visual symptoms</text><text x="410" y="107" text-anchor="middle" font-size="14">Urgent ophthalmic evaluation — do not delay transfer</text><g transform="translate(28 141)"><rect width="764" height="52" rx="8" fill="#dbeafe" stroke="#64748b"/><text x="382" y="21" text-anchor="middle" font-weight="bold" font-size="16">Assess and communicate</text><text x="382" y="40" text-anchor="middle" font-size="14">Vital signs, vision if safe, symptom onset, medicines</text></g><g transform="translate(28 207)"><rect width="764" height="52" rx="8" fill="#fef3c7" stroke="#64748b"/><text x="382" y="21" text-anchor="middle" font-weight="bold" font-size="16">Support prescribed treatment</text><text x="382" y="40" text-anchor="middle" font-size="14">Check contraindications, comfort, vomiting and fluid balance</text></g><g transform="translate(28 273)"><rect width="764" height="52" rx="8" fill="#e0f2fe" stroke="#64748b"/><text x="382" y="21" text-anchor="middle" font-weight="bold" font-size="16">Reassess and prepare for definitive care</text><text x="382" y="40" text-anchor="middle" font-size="14">Track symptoms and ordered IOP checks; confirm mechanism</text></g><g transform="translate(28 339)"><rect width="764" height="52" rx="8" fill="#dcfce7" stroke="#64748b"/><text x="382" y="21" text-anchor="middle" font-weight="bold" font-size="16">Follow up after specialist intervention</text><text x="382" y="40" text-anchor="middle" font-size="14">Fellow eye assessment, treatment adherence and red flags</text></g><path d="M410 119 v14 m-5 -6 l5 6 5 -6" stroke="#475569" stroke-width="2" fill="none"/><path d="M410 193 v14 m-5 -6 l5 6 5 -6" stroke="#475569" stroke-width="2" fill="none"/><path d="M410 259 v14 m-5 -6 l5 6 5 -6" stroke="#475569" stroke-width="2" fill="none"/><path d="M410 325 v14 m-5 -6 l5 6 5 -6" stroke="#475569" stroke-width="2" fill="none"/><text x="28" y="416" font-size="13">Medicines and procedures depend on mechanism, contraindications and clinician orders.</text></g></svg>