<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" role="img" aria-labelledby="title desc"><title id="title">Trichiasis: normal lid margin, abnormal lash contact</title><desc id="desc">Two simplified side views compare a normally outward directed lash and a misdirected lash touching the cornea. Both lid margins retain normal position.</desc><rect width="860" height="420" rx="16" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#172b45"><text x="430" y="36" font-size="24" text-anchor="middle" font-weight="bold">Lash direction and ocular surface</text><rect x="20" y="58" width="400" height="325" rx="14" fill="#fff" stroke="#aab8c8"/><rect x="440" y="58" width="400" height="325" rx="14" fill="#fff" stroke="#aab8c8"/><text x="220" y="92" font-size="21" text-anchor="middle" font-weight="bold">Normal</text><text x="640" y="92" font-size="21" text-anchor="middle" font-weight="bold">Trichiasis</text><g><path d="M280 134 Q156 213 280 322 L350 322 L350 134Z" fill="#e1f3ff" stroke="#87b6d5" stroke-width="3"/><path d="M280 134 Q156 213 280 322" fill="none" stroke="#237ca7" stroke-width="8"/><path d="M60 140 Q120 112 230 136 L250 151 L220 176 Q127 152 60 180Z" fill="#f0b7a5" stroke="#a96052" stroke-width="2"/><path d="M222 167 Q183 188 143 156" fill="none" stroke="#333" stroke-width="6" stroke-linecap="round"/><circle cx="222" cy="167" r="5" fill="#563832"/><path d="M135 170 L100 212" stroke="#667" stroke-width="2"/><text x="40" y="234" font-size="16">Lash points</text><text x="40" y="254" font-size="16">away from eye</text><path d="M260 282 L304 354" stroke="#237ca7" stroke-width="2"/><text x="280" y="371" font-size="15">Cornea</text></g><g transform="translate(420 0)"><path d="M280 134 Q156 213 280 322 L350 322 L350 134Z" fill="#e1f3ff" stroke="#87b6d5" stroke-width="3"/><path d="M280 134 Q156 213 280 322" fill="none" stroke="#237ca7" stroke-width="8"/><path d="M60 140 Q120 112 230 136 L250 151 L220 176 Q127 152 60 180Z" fill="#f0b7a5" stroke="#a96052" stroke-width="2"/><path d="M222 167 Q193 190 219 212" fill="none" stroke="#333" stroke-width="6" stroke-linecap="round"/><circle cx="222" cy="167" r="5" fill="#563832"/><circle cx="219" cy="212" r="10" fill="none" stroke="#b83b34" stroke-width="3"/><path d="M208 219 L112 272" stroke="#b83b34" stroke-width="2"/><text x="40" y="296" font-size="16" fill="#a32e29">Abnormal lash</text><text x="40" y="316" font-size="16" fill="#a32e29">contacts cornea</text><path d="M230 139 L287 113" stroke="#667" stroke-width="2"/><text x="235" y="108" font-size="14">Lid margin normal</text></g><text x="430" y="406" font-size="14" text-anchor="middle" fill="#52677c">Original teaching schematic · not to scale · not a clinical photograph</text></g></svg>
