<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="t d"><title id="t">Vitreomacular adhesion versus traction</title><desc id="d">Two educational cross-sections compare a remaining central vitreous attachment without retinal deformation against an attachment pulling the central retina upward.</desc><rect width="900" height="340" rx="16" fill="#f7fafc"/><g font-family="sans-serif" fill="#172f40"><text x="30" y="34" font-size="22" font-weight="bold">VMA: attachment only</text><text x="470" y="34" font-size="22" font-weight="bold">VMT: attachment + distortion</text><text x="30" y="64" font-size="15">Vitreous side</text><text x="470" y="64" font-size="15">Vitreous side</text><path d="M30 170 H130 Q175 170 195 200 Q220 225 245 200 Q265 170 310 170 H420 V255 H30Z" fill="#eac18f" stroke="#805236" stroke-width="2"/><path d="M470 170 H565 Q605 170 625 134 Q650 92 675 134 Q695 170 735 170 H870 V255 H470Z" fill="#eac18f" stroke="#805236" stroke-width="2"/><path d="M30 100 Q125 100 170 155 Q201 203 220 211 Q239 203 270 155 Q315 100 420 100" fill="none" stroke="#206b93" stroke-width="5"/><path d="M470 95 Q555 95 610 110 Q634 119 650 113 Q666 119 690 110 Q745 95 870 95" fill="none" stroke="#206b93" stroke-width="5"/><path d="M650 113 V77" stroke="#b23930" stroke-width="3"/><path d="M650 72 l-6 12 h12Z" fill="#b23930"/><ellipse cx="650" cy="158" rx="12" ry="20" fill="#f8fafc" stroke="#966140"/><path d="M30 236 H420 M470 236 H870" stroke="#9c6847" stroke-width="3"/><text x="110" y="286" font-size="15">Preserved foveal contour</text><text x="530" y="286" font-size="15">Elevated fovea and cyst-like space</text><path d="M33 315 H63" stroke="#206b93" stroke-width="5"/><text x="72" y="320" font-size="14">Posterior vitreous cortex</text><text x="470" y="320" font-size="14">Not to scale. Not an actual OCT scan.</text></g></svg>