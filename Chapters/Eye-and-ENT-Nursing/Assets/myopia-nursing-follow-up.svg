<svg xmlns="http://www.w3.org/2000/svg" width="780" height="400" viewBox="0 0 780 400"><rect width="780" height="400" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#172554" font-size="16"><text x="24" y="34" font-size="23" font-weight="bold">Childhood myopia: nursing assessment and follow-up</text><rect x="24" y="60" width="220" height="78" rx="10" fill="#dbeafe" stroke="#2563eb"/><text x="134" y="87" text-anchor="middle" font-weight="bold">Screen</text><text x="134" y="109" text-anchor="middle">Monocular acuity</text><text x="134" y="127" text-anchor="middle">History and family risk</text><rect x="280" y="60" width="220" height="78" rx="10" fill="#e0f2fe" stroke="#0369a1"/><text x="390" y="87" text-anchor="middle" font-weight="bold">Refer</text><text x="390" y="109" text-anchor="middle">Refraction and ocular</text><text x="390" y="127" text-anchor="middle">health assessment</text><rect x="536" y="60" width="220" height="78" rx="10" fill="#dcfce7" stroke="#15803d"/><text x="646" y="87" text-anchor="middle" font-weight="bold">Support treatment</text><text x="646" y="109" text-anchor="middle">Prescribed correction</text><text x="646" y="127" text-anchor="middle">Adherence and safety</text><path d="M244 99 H280 M500 99 H536" stroke="#475569" stroke-width="3"/><path d="M280 99 l-9 -5 v10z M536 99 l-9 -5 v10z" fill="#475569"/><rect x="280" y="185" width="476" height="80" rx="10" fill="#fef3c7" stroke="#b45309"/><text x="518" y="210" text-anchor="middle" font-weight="bold">Monitor over time</text><text x="518" y="232" text-anchor="middle">Acuity, comparable refraction, axial length as indicated</text><text x="518" y="250" text-anchor="middle">Side effects, adherence and ocular health</text><path d="M646 138 V185" stroke="#475569" stroke-width="3"/><path d="M646 185 l-5 -9 h10z" fill="#475569"/><rect x="24" y="299" width="732" height="78" rx="10" fill="#fee2e2" stroke="#b91c1c"/><text x="390" y="326" text-anchor="middle" font-weight="bold">Urgent red flags — at any stage</text><text x="390" y="350" text-anchor="middle">Sudden visual loss, flashes/floaters, field shadow, acute central distortion</text><text x="390" y="369" text-anchor="middle">Do not delay urgent ophthalmic assessment for a routine glasses check.</text><path d="M134 138 V299 M518 265 V299" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 5"/></g></svg>