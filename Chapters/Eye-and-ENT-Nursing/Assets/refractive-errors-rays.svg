<svg xmlns="http://www.w3.org/2000/svg" width="860" height="520" viewBox="0 0 860 520"><rect width="860" height="520" fill="#f8fafc"/><g font-family="Arial" fill="#172554"><text x="22" y="30" font-size="23" font-weight="bold">Refractive errors: ray diagrams (not to scale)</text><g transform="translate(18 48)"><text x="0" y="20" font-size="17" font-weight="bold">Normal focus</text><ellipse cx="177" cy="105" rx="100" ry="72" fill="#e0f2fe" stroke="#475569" stroke-width="2"/><path d="M85 72 Q55 105 85 138" fill="#bae6fd" stroke="#0369a1" stroke-width="3"/><ellipse cx="119" cy="105" rx="12" ry="42" fill="#fff" stroke="#334155" stroke-width="2"/><path d="M255 60 Q287 105 255 150" stroke="#be123c" stroke-width="5" fill="none"/><text x="235" y="174" font-size="13">Retina</text><path d="M0 77 H119 L271 105 M0 133 H119 L271 105" stroke="#2563eb" stroke-width="2" fill="none"/><path d="M271 105 L279 105 M271 105 L279 105" stroke="#2563eb" stroke-width="2" fill="none"/><circle cx="271" cy="105" r="4" fill="#1d4ed8"/><text x="0" y="194" font-size="12">Light converges on retina</text></g><g transform="translate(448 48)"><text x="0" y="20" font-size="17" font-weight="bold">Myopia: focus before retina</text><ellipse cx="177" cy="105" rx="100" ry="72" fill="#e0f2fe" stroke="#475569" stroke-width="2"/><path d="M85 72 Q55 105 85 138" fill="#bae6fd" stroke="#0369a1" stroke-width="3"/><ellipse cx="119" cy="105" rx="12" ry="42" fill="#fff" stroke="#334155" stroke-width="2"/><path d="M255 60 Q287 105 255 150" stroke="#be123c" stroke-width="5" fill="none"/><text x="235" y="174" font-size="13">Retina</text><path d="M0 77 H119 L225 105 M0 133 H119 L225 105" stroke="#2563eb" stroke-width="2" fill="none"/><path d="M225 105 L271 121 M225 105 L271 89" stroke="#2563eb" stroke-width="2" fill="none"/><circle cx="225" cy="105" r="4" fill="#1d4ed8"/><text x="0" y="194" font-size="12">Excess power or longer eye</text></g><g transform="translate(18 278)"><text x="0" y="20" font-size="17" font-weight="b