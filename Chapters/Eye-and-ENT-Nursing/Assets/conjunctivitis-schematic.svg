<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" role="img" aria-labelledby="t d"><title id="t">Conjunctiva and conjunctivitis schematic</title><desc id="d">Two frontal eye schematics show normal conjunctiva and diffuse conjunctival redness, with clear cornea and swelling. Not a diagnostic image.</desc><rect width="820" height="320" rx="14" fill="#f8fafc"/><g font-family="sans-serif" fill="#1f3440"><text x="40" y="32" font-size="22" font-weight="bold">Normal eye</text><text x="440" y="32" font-size="22" font-weight="bold">Inflamed conjunctiva</text><path d="M35 144 Q200 20 365 144 Q200 268 35 144Z" fill="#fff" stroke="#694a42" stroke-width="4"/><path d="M435 144 Q600 20 765 144 Q600 268 435 144Z" fill="#f7c8c5" stroke="#694a42" stroke-width="4"/><g fill="none" stroke="#cc454d" stroke-width="3" stroke-linecap="round"><path d="M450 144 Q485 118 535 125 M460 155 Q495 175 540 163 M750 140 Q705 120 664 125 M740 160 Q705 172 663 160 M480 114 L500 136 M704 125 L720 108 M500 170 L490 187 M697 171 L711 189"/></g><circle cx="200" cy="144" r="58" fill="#80b1bf" stroke="#396679" stroke-width="2"/><circle cx="600" cy="144" r="58" fill="#80b1bf" stroke="#396679" stroke-width="2"/><circle cx="200" cy="144" r="24" fill="#253844"/><circle cx="600" cy="144" r="24" fill="#253844"/><path d="M448 166 Q485 210 547 182" fill="none" stroke="#b94c57" stroke-width="8" opacity=".5"/><path d="M83 110 L70 65 H130 M225 100 L260 65 H340 M700 118 L735 60 H788 M485 181 L465 240 H600" stroke="#34495e" fill="none" stroke-width="1.5"/><text x="32" y="59" font-size="14">Bulbar conjunctiva</text><text x="255" y="59" font-size="14">Clear cornea</text><text x="657" y="54" font-size="14">Dilated vessels</text><text x="465" y="259" font-size="14">Possible chemosis</text><text x="35" y="295" font-size="14">Conjunctiva covers visible sclera, not the cornea. Red eye alone does not establish a diagnosis.</text></g></svg>