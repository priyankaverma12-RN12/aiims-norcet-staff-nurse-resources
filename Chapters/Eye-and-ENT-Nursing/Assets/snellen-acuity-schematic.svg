<svg xmlns="http://www.w3.org/2000/svg" width="780" height="330" viewBox="0 0 780 330"><rect width="780" height="330" fill="#f8fafc"/><g font-family="Arial" fill="#172554"><text x="25" y="30" font-size="23" font-weight="bold">Visual acuity: 6/12 explained</text><rect x="40" y="65" width="160" height="190" fill="white" stroke="#334155" stroke-width="2"/><text x="120" y="120" font-size="46" text-anchor="middle">E</text><text x="120" y="165" font-size="32" text-anchor="middle">F P</text><text x="120" y="200" font-size="23" text-anchor="middle">T O Z</text><text x="120" y="229" font-size="16" text-anchor="middle">L P E D</text><circle cx="650" cy="115" r="35" fill="#fed7aa" stroke="#334155" stroke-width="2"/><path d="M612 155 Q650 140 688 155 L715 235 H585Z" fill="#bfdbfe" stroke="#334155"/><rect x="615" y="100" width="24" height="20" fill="#475569"/><circle cx="658" cy="110" r="4"/><path d="M210 175 H575" stroke="#2563eb" stroke-width="3"/><path d="M210 175 l12 -7 v14z M575 175 l-12 -7 v14z" fill="#2563eb"/><text x="390" y="157" text-anchor="middle" font-size="18">6 m test distance</text><text x="390" y="210" text-anchor="middle" font-size="16">Test one eye at a time</text><text x="25" y="285" font-size="18">6/12 = reads at 6 m what standard vision reads at 12 m.</text><text x="25" y="310" font-size="13">Original schematic, not a calibrated eye chart.</text></g></svg>