<svg xmlns="http://www.w3.org/2000/svg" width="850" height="455" viewBox="0 0 850 455"><rect width="850" height="455" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#172554"><text x="24" y="34" font-size="24" font-weight="bold">Glaucoma: two drainage mechanisms</text><text x="24" y="57" font-size="14">Conceptual anterior segment cross-sections. Not to scale.</text><g transform="translate(22 79)"><rect width="390" height="340" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="18" y="28" font-size="19" font-weight="bold">Open angle</text><path d="M55 75 Q195 5 335 75" stroke="#0369a1" stroke-width="9" fill="none"/><text x="195" y="55" font-size="13" text-anchor="middle">Cornea</text><path d="M55 75 L55 205 M335 75 L335 205" stroke="#475569" stroke-width="6"/><path d="M55 88 L78 103 M335 88 L312 103" stroke="#d97706" stroke-width="11"/><ellipse cx="195" cy="207" rx="70" ry="45" fill="#dbeafe" stroke="#64748b" stroke-width="2"/><text x="195" y="211" text-anchor="middle" font-size="14">Lens</text><path d="M58 150 Q112 150 166 160 M332 150 Q278 150 224 160" stroke="#8b5e34" stroke-width="13" fill="none" stroke-linecap="round"/><text x="195" y="116" text-anchor="middle" font-size="14">Anterior chamber</text><path d="M195 183 V136 M195 136 l-5 9 m5 -9 l5 9" stroke="#0284c7" stroke-width="3" fill="none"/><path d="M190 126 L76 99" stroke="#0284c7" stroke-width="3" fill="none"/><path d="M76 99 l12 0 m-12 0 l6 10" stroke="#0284c7" stroke-width="3" fill="none"/><text x="20" y="270" font-size="15" font-weight="bold">Angle remains open</text><text x="20" y="295" font-size="14">Outflow resistance may be elevated.</text><text x="20" y="319" font-size="13">Optic nerve monitoring is essential.</text></g><g transform="translate(442 79)"><rect width="390" height="340" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="18" y="28" font-size="19" font-weight="bold">Angle closure</text><path d="M55 75 Q195 5 335 75" stroke="#0369a1" stroke-width="9" fill="none"/><text x="195" y="55" font-size="13" text-anchor="middle">Cornea</text><path d="M55 75 L55 205 M335 75 L335 205" stroke="#475569" stroke-width="6"/><path d="M55 88 L78 103 M335 88 L312 103" stroke="#d97706" stroke-width="11"/><ellipse cx="195" cy="207" rx="70" ry="45" fill="#dbeafe" stroke="#64748b" stroke-width="2"/><text x="195" y="211" text-anchor="middle" font-size="14">Lens</text><path d="M58 91 Q105 102 166 160 M332 91 Q285 102 224 160" stroke="#8b5e34" stroke-width="13" fill="none" stroke-linecap="round"/><text x="195" y="116" text-anchor="middle" font-size="14">Anterior chamber</text><path d="M195 183 V136 M195 136 l-5 9 m5 -9 l5 9" stroke="#0284c7" stroke-width="3" fill="none"/><path d="M190 126 L95 110" stroke="#0284c7" stroke-width="3" fill="none"/><path d="M85 100 l20 20 m0 -20 l-20 20" stroke="#b91c1c" stroke-width="3" fill="none"/><text x="20" y="270" font-size="15" font-weight="bold">Iris obstructs angle</text><text x="20" y="295" font-size="14">Flow to meshwork can be blocked.</text><text x="20" y="319" font-size="13">Urgent if acute symptomatic closure.</text></g><text x="24" y="440" font-size="13">Orange: trabecular meshwork. Brown: iris. Blue arrow: aqueous passage through pupil toward angle.</text></g></svg>