<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 315" role="img" aria-labelledby="t"><title id="t">Corneal ulcer depth, descemetocele and perforation</title><rect width="900" height="315" rx="12" fill="#f8fafc"/><g font-family="sans-serif" fill="#213746"><text x="25" y="32" font-size="19" font-weight="bold">Stromal ulcer</text><text x="325" y="32" font-size="19" font-weight="bold">Descemetocele</text><text x="625" y="32" font-size="19" font-weight="bold">Perforation</text><path d="M25 95 H120 L150 135 L180 95 H275 V195 H25Z M325 95 H415 L425 195 Q450 135 475 195 L485 95 H575 V195 H475 Q450 135 425 195 H325Z M625 95 H715 L740 195 H625Z M760 195 L785 95 H875 V195Z" fill="#b9dce8" stroke="#487387" stroke-width="2"/><path d="M25 95 H120 M180 95 H275 M325 95 H415 M485 95 H575 M625 95 H715 M785 95 H875" stroke="#32667c" stroke-width="8"/><path d="M25 195 H275 M325 195 H425 Q450 135 475 195 H575 M625 195 H740 M760 195 H875" stroke="#273f59" stroke-width="5" fill="none"/><path d="M120 95 L150 135 L180 95" stroke="#bb4a39" stroke-width="5" fill="none"/><path d="M750 220 V95" stroke="#207da5" stroke-width="4" stroke-dasharray="6 4"/><path d="M750 82 l-7 14 h14Z" fill="#207da5"/><text x="38" y="235" font-size="14">Epithelial defect + stromal loss</text><text x="328" y="235" font-size="14">Fragile remaining Descemet layer</text><text x="628" y="235" font-size="14">Full-thickness defect / aqueous leak</text><text x="25" y="276" font-size="15">Pale blue = stroma. Dark posterior line = Descemet region. Anterior chamber below.</text><text x="25" y="300" font-size="13">Conceptual illustration, not to scale or a diagnostic image.</text></g></svg>