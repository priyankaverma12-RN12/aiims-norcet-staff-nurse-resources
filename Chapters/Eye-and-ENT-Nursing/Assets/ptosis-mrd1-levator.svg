<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" role="img" aria-labelledby="title desc"><title id="title">Ptosis and marginal reflex distance</title><desc id="desc">Two simplified front views with the same pupil and corneal light reflex. The drooping upper lid reduces the distance between its central margin and the reflex.</desc><rect width="860" height="460" rx="20" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#172b45"><text x="430" y="38" text-anchor="middle" font-size="26" font-weight="bold">Upper eyelid position — MRD1</text><rect x="20" y="62" width="400" height="342" rx="15" fill="#fff" stroke="#b7c9db"/><rect x="440" y="62" width="400" height="342" rx="15" fill="#fff" stroke="#b7c9db"/><text x="220" y="99" text-anchor="middle" font-size="22" font-weight="bold">Normal lid height</text><text x="640" y="99" text-anchor="middle" font-size="22" font-weight="bold">Ptosis</text><g><path d="M70 218 Q220 75 370 218 Q220 340 70 218Z" fill="#fff" stroke="#72504b" stroke-width="4"/><circle cx="220" cy="218" r="66" fill="#80b9b0" stroke="#416a70" stroke-width="3"/><circle cx="220" cy="218" r="29" fill="#23364b"/><path d="M70 218 Q220 75 370 218 Q220 44 70 178Z" fill="#edb7a4" stroke="#a86d60" stroke-width="2"/><path d="M70 218 Q220 75 370 218" fill="none" stroke="#72504b" stroke-width="5"/><circle cx="220" cy="218" r="6" fill="white"/><path d="M220 146 V218" stroke="#bd462d" stroke-width="3" stroke-dasharray="5 4"/><path d="M212 155 L220 146 L228 155 M212 209 L220 218 L228 209" fill="none" stroke="#bd462d" stroke-width="2"/><text x="235" y="183" font-size="17" fill="#9c331f">MRD1</text><path d="M228 224 L288 325" stroke="#64748b" stroke-width="2"/><text x="182" y="352" font-size="16">Corneal light reflex</text></g><g transform="translate(420 0)"><path d="M70 218 Q220 75 370 218 Q220 340 70 218Z" fill="#fff" stroke="#72504b" stroke-width="4"/><circle cx="220" cy="218" r="66" fill="#80b9b0" stroke="#416a70" stroke-width="3"/><circle cx="220" cy="218" r="29" fill="#23364b"/><path d="M70 218 Q220 178 370 218 Q220 44 70 178Z" fill="#edb7a4" stroke="#a86d60" stroke-width="2"/><path d="M70 218 Q220 178 370 218" fill="none" stroke="#72504b" stroke-width="5"/><circle cx="220" cy="218" r="6" fill="white"/><path d="M220 198 V218 M213 200 H227 M213 218 H227" stroke="#bd462d" stroke-width="3"/><text x="235" y="212" font-size="17" fill="#9c331f">Reduced MRD1</text><path d="M190 196 L112 146" stroke="#64748b" stroke-width="2"/><text x="46" y="137" font-size="16">Low upper margin</text><text x="220" y="352" text-anchor="middle" font-size="16">Same reflex reference</text></g><text x="430" y="434" text-anchor="middle" font-size="15" fill="#52677c">Original schematic · not to scale · primary gaze, brow relaxed</text></g></svg>
