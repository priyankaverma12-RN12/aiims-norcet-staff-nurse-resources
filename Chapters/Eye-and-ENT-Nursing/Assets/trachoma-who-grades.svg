<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 870 410" role="img" aria-labelledby="t"><title id="t">Conceptual WHO trachoma signs, not a grading photograph</title><rect width="870" height="410" rx="12" fill="#f8fafc"/><g font-family="sans-serif" fill="#24394b"><text x="24" y="30" font-size="20" font-weight="bold">WHO simplified grading — five independent signs</text><g transform="translate(25 55)"><text x="0" y="0" font-size="18" font-weight="bold">TF</text><rect y="15" width="250" height="85" rx="30" fill="#efb4b5" stroke="#ae6a76"/><g fill="#fae0ba" stroke="#bda279"><circle cx="75" cy="45" r="9"/><circle cx="110" cy="43" r="9"/><circle cx="145" cy="46" r="9"/><circle cx="92" cy="75" r="9"/><circle cx="130" cy="72" r="9"/><circle cx="169" cy="73" r="9"/></g><text y="124" font-size="13">≥5 follicles, each ≥0.5 mm</text><text y="142" font-size="13">Central upper tarsal conjunctiva</text></g><g transform="translate(310 55)"><text y="0" font-size="18" font-weight="bold">TI</text><rect y="15" width="250" height="85" rx="30" fill="#d97b86" stroke="#ae5260"/><path d="M18 50 Q58 24 88 53 M195 35 Q215 47 235 52" fill="none" stroke="#9d3745" stroke-width="3"/><text y="124" font-size="13">Thick inflammation obscures</text><text y="142" font-size="13">over half of deep vessels</text></g><g transform="translate(595 55)"><text y="0" font-size="18" font-weight="bold">TS</text><rect y="15" width="250" height="85" rx="30" fill="#efb4b5" stroke="#ae6a76"/><path d="M30 50 Q100 65 210 46 M65 81 L150 71" stroke="#fff5df" stroke-width="9" fill="none"/><text y="124" font-size="13">Visible tarsal scarring</text></g><g transform="translate(25 235)"><text y="0" font-size="18" font-weight="bold">TT</text><path d="M15 48 Q125 -10 235 48 Q125 122 15 48Z" fill="#fff" stroke="#80584e" stroke-width="3"/><circle cx="125" cy="54" r="33" fill="#80aebd"/><circle cx="125" cy="54" r="14" fill="#233846"/><path d="M80 23 Q100 42 119 52 M125 16 Q133 33 141 47" stroke="#47332c" stroke-width="4" fill="none"/><text y="124" font-size="13">Upper lash touches globe</text><text y="142" font-size="13">or evidence of recent epilation</text></g><g transform="translate(310 235)"><text y="0" font-size="18" font-weight="bold">CO</text><path d="M15 48 Q125 -10 235 48 Q125 122 15 48Z" fill="#fff" stroke="#80584e" stroke-width="3"/><circle cx="125" cy="54" r="33" fill="#80aebd"/><circle cx="125" cy="54" r="14" fill="#233846"/><ellipse cx="120" cy="53" rx="25" ry="17" fill="#d7d8db" opacity=".96"/><text y="124" font-size="13">Corneal opacity obscures</text><text y="142" font-size="13">part of pupil border</text></g><g transform="translate(595 245)"><text font-size="17" font-weight="bold">Exam caution</text><text y="27" font-size="14">Signs can coexist.</text><text y="49" font-size="14">Not a fixed stage sequence.</text><text y="71" font-size="14">Not to scale. Trained clinical</text><text y="91" font-size="14">grading required.</text></g></g></svg>