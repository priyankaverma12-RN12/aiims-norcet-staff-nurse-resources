<svg xmlns="http://www.w3.org/2000/svg" width="840" height="410" viewBox="0 0 840 410"><rect width="840" height="410" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#172554"><text x="24" y="34" font-size="23" font-weight="bold">Retinal arterial ischemia: recognize and refer</text><text x="24" y="58" font-size="14">Original conceptual fundus diagrams. Not diagnostic images.</text><g transform="translate(202 182)"><circle r="104" fill="#eaa56f" stroke="#64748b" stroke-width="2"/><circle cx="-56" cy="0" r="19" fill="#f9e4a5"/><circle cx="40" cy="0" r="5" fill="#c98c72"/><path d="M-56 0 Q-15 -35 28 -66 M-56 0 Q-15 35 28 66 M-15 -30 L8 -78 M-15 30 L8 78 M-56 0 Q-38 -55 -63 -85 M-56 0 Q-38 55 -63 85" fill="none" stroke="#b91c1c" stroke-width="4" stroke-linecap="round"/><text x="0" y="133" text-anchor="middle" font-weight="bold" font-size="17">Reference fundus</text><text x="0" y="153" text-anchor="middle" font-size="13">Retinal arteries supply inner retina</text></g><g transform="translate(622 182)"><circle r="104" fill="#f8e6d7" stroke="#64748b" stroke-width="2"/><circle cx="-56" cy="0" r="19" fill="#f9e4a5"/><circle cx="40" cy="0" r="9" fill="#b91c1c"/><path d="M-56 0 Q-15 -35 28 -66 M-56 0 Q-15 35 28 66 M-15 -30 L8 -78 M-15 30 L8 78 M-56 0 Q-38 -55 -63 -85 M-56 0 Q-38 55 -63 85" fill="none" stroke="#b91c1c" stroke-width="2" stroke-linecap="round"/><path d="M54 -12 L91 -48" stroke="#172554"/><text x="100" y="-50" font-size="13" text-anchor="start">Red fovea</text><text x="0" y="133" text-anchor="middle" font-weight="bold" font-size="17">Typical CRAO appearance</text><text x="0" y="153" text-anchor="middle" font-size="13">Pale ischemic retina, red foveal contrast</text></g><rect x="24" y="358" width="792" height="34" rx="6" fill="#fee2e2"/><text x="420" y="380" text-anchor="middle" font-size="15" font-weight="bold">Sudden monocular visual loss → emergency stroke-capable assessment</text></g></svg>