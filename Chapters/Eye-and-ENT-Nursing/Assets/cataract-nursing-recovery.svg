<svg xmlns="http://www.w3.org/2000/svg" width="840" height="350" viewBox="0 0 840 350"><rect width="840" height="350" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#172554"><text x="22" y="35" font-size="23" font-weight="bold">Cataract nursing: safe recovery pathway</text><g transform="translate(22 65)"><rect width="252" height="120" rx="10" fill="#dbeafe" stroke="#64748b"/><text x="126" y="30" text-anchor="middle" font-size="17" font-weight="bold">Before surgery</text><text x="126" y="57" text-anchor="middle" font-size="13">Verify patient, eye and IOL</text><text x="126" y="82" text-anchor="middle" font-size="13">Review medicines and anesthesia</text></g><g transform="translate(294 65)"><rect width="252" height="120" rx="10" fill="#dcfce7" stroke="#64748b"/><text x="126" y="30" text-anchor="middle" font-size="17" font-weight="bold">Recovery and discharge</text><text x="126" y="57" text-anchor="middle" font-size="13">Assess pain, vision, observations</text><text x="126" y="82" text-anchor="middle" font-size="13">Teach prescribed drops and shield</text></g><g transform="translate(566 65)"><rect width="252" height="120" rx="10" fill="#fef3c7" stroke="#64748b"/><text x="126" y="30" text-anchor="middle" font-size="17" font-weight="bold">Follow-up</text><text x="126" y="57" text-anchor="middle" font-size="13">Check healing and function</text><text x="126" y="82" text-anchor="middle" font-size="13">Reinforce individualized instructions</text></g><path d="M274 124 H294 M546 124 H566" stroke="#475569" stroke-width="3"/><path d="M294 124 l-8 -5 v10z M566 124 l-8 -5 v10z" fill="#475569"/><rect x="22" y="215" width="796" height="106" rx="10" fill="#fee2e2" stroke="#b91c1c"/><text x="420" y="245" text-anchor="middle" font-weight="bold" font-size="19">Urgent ophthalmic assessment</text><text x="420" y="271" text-anchor="middle" font-size="16">Worsening vision, increasing pain/redness, new flashes or floaters</text><text x="420" y="296" text-anchor="middle" font-size="14">Do not wait for the routine review. Follow the emergency pathway.</text></g></svg>