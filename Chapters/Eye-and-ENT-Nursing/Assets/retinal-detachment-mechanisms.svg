<svg xmlns="http://www.w3.org/2000/svg" width="870" height="395" viewBox="0 0 870 395"><rect width="870" height="395" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#172554"><text x="22" y="34" font-weight="bold" font-size="24">Retinal detachment: three distinct mechanisms</text><text x="22" y="59" font-size="14">Conceptual cross-section of retinal layers, not to scale. Vitreous lies above the retina.</text><g transform="translate(22 82)"><rect width="266" height="280" rx="10" fill="#fff" stroke="#cbd5e1"/><text x="133" y="30" text-anchor="middle" font-size="16" font-weight="bold">Rhegmatogenous</text><rect x="15" y="190" width="236" height="16" rx="2" fill="#92400e"/><rect x="15" y="206" width="236" height="20" rx="2" fill="#be123c"/><path d="M15 185 Q45 185 69 170 Q133 73 197 170 Q221 185 251 185 L251 190 L15 190Z" fill="#dbeafe"/><path d="M15 185 Q45 185 69 170 Q90 130 110 120 M132 109 Q166 116 197 170 Q221 185 251 185" fill="none" stroke="#eab308" stroke-width="8" stroke-linecap="round"/><path d="M118 53 L121 146 M115 137 L121 146 L127 137" stroke="#0284c7" stroke-width="3" fill="none"/><text x="128" y="71" font-size="12">Break</text><text x="133" y="165" text-anchor="middle" font-size="12">Subretinal space</text><text x="133" y="250" text-anchor="middle" font-size="14">Fluid enters through tear</text></g><g transform="translate(302 82)"><rect width="266" height="280" rx="10" fill="#fff" stroke="#cbd5e1"/><text x="133" y="30" text-anchor="middle" font-size="16" font-weight="bold">Tractional</text><rect x="15" y="190" width="236" height="16" rx="2" fill="#92400e"/><rect x="15" y="206" width="236" height="20" rx="2" fill="#be123c"/><path d="M15 185 Q45 185 69 170 Q133 73 197 170 Q221 185 251 185 L251 190 L15 190Z" fill="#dbeafe"/><path d="M15 185 Q45 185 69 170 Q133 73 197 170 Q221 185 251 185" fill="none" stroke="#eab308" stroke-width="8" stroke-linecap="round"/><path d="M95 80 L133 111 L170 80 M133 111 V60 M127 69 L133 60 L139 69" stroke="#7c3aed" stroke-width="4" fill="none"/><text x="133" y="52" text-anchor="middle" font-size="12">Scar traction</text><text x="133" y="165" text-anchor="middle" font-size="12">Subretinal space</text><text x="133" y="250" text-anchor="middle" font-size="14">Membrane pulls retina</text></g><g transform="translate(582 82)"><rect width="266" height="280" rx="10" fill="#fff" stroke="#cbd5e1"/><text x="133" y="30" text-anchor="middle" font-size="16" font-weight="bold">Exudative</text><rect x="15" y="190" width="236" height="16" rx="2" fill="#92400e"/><rect x="15" y="206" width="236" height="20" rx="2" fill="#be123c"/><path d="M15 185 Q45 185 69 170 Q133 73 197 170 Q221 185 251 185 L251 190 L15 190Z" fill="#dbeafe"/><path d="M15 185 Q45 185 69 170 Q133 73 197 170 Q221 185 251 185" fill="none" stroke="#eab308" stroke-width="8" stroke-linecap="round"/><path d="M104 205 V155 M104 155 l-5 9 m5 -9 l5 9 M158 205 V155 M158 155 l-5 9 m5 -9 l5 9" stroke="#0284c7" stroke-width="3" fill="none"/><text x="133" y="76" text-anchor="middle" font-size="12">No primary break</text><text x="133" y="165" text-anchor="middle" font-size="12">Subretinal space</text><text x="133" y="250" text-anchor="middle" font-size="14">Fluid from leakage</text></g><text x="22" y="383" font-size="13">Yellow: neurosensory retina. Brown: retinal pigment epithelium. Red: choroid. Blue: fluid space.</text></g></svg>