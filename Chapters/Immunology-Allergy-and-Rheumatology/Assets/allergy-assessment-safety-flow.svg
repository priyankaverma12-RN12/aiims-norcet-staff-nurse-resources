<svg xmlns="http://www.w3.org/2000/svg" width="840" height="480" viewBox="0 0 840 480" role="img" aria-labelledby="title desc"><title id="title">Allergy assessment and safety</title><desc id="desc">Assess exposure and symptoms, distinguish stable patients from suspected anaphylaxis, then arrange appropriate assessment or emergency management.</desc><rect width="840" height="480" rx="18" fill="#f4f7fb"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#172b43"><text x="420" y="37" font-size="25" font-weight="bold">Allergy assessment and safety</text><rect x="200" y="65" width="440" height="67" rx="10" fill="#dbeafe" stroke="#2563eb"/><text x="420" y="91" font-size="18" font-weight="bold">Assess exposure, symptoms and timing</text><text x="420" y="114" font-size="15">Document the actual reaction and severity</text><path d="M420 132 V160 M420 160 H219 V181 M420 160 H621 V181" stroke="#475569" stroke-width="3" fill="none"/><path d="M213 173 L219 182 L225 173 M615 173 L621 182 L627 173" stroke="#475569" stroke-width="3" fill="none"/><rect x="34" y="184" width="370" height="86" rx="10" fill="#e0f2fe" stroke="#0369a1"/><text x="219" y="211" font-size="18" font-weight="bold">Stable patient</text><text x="219" y="235" font-size="15">History plus clinically directed testing</text><text x="219" y="254" font-size="15">Avoid known triggers</text><rect x="436" y="184" width="370" height="86" rx="10" fill="#fee2e2" stroke="#b91c1c"/><text x="621" y="211" font-size="18" font-weight="bold">Suspected anaphylaxis</text><text x="621" y="235" font-size="15">Call emergency help and assess ABC</text><text x="621" y="254" font-size="15">IM epinephrine is first-line</text><path d="M219 270 V308 M621 270 V308" stroke="#475569" stroke-width="3"/><path d="M213 300 L219 309 L225 300 M615 300 L621 309 L627 300" stroke="#475569" stroke-width="3" fill="none"/><rect x="34" y="312" width="370" height="99" rx="10" fill="#fff" stroke="#64748b"/><text x="219" y="341" font-size="17" font-weight="bold">Interpret with clinical history</text><text x="219" y="366" font-size="15">Positive IgE alone is not diagnosis</text><text x="219" y="389" font-size="15">Supervised challenge when appropriate</text><rect x="436" y="312" width="370" height="99" rx="10" fill="#fff" stroke="#b91c1c"/><text x="621" y="341" font-size="17" font-weight="bold">Monitor and support circulation</text><text x="621" y="366" font-size="15">Position according to clinical condition</text><text x="621" y="389" font-size="15">Do not delay treatment for tests</text><text x="420" y="451" font-size="15">Follow local emergency protocol and specialist instructions.</text></g></svg>