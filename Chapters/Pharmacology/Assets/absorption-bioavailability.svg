<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 260" role="img" aria-labelledby="t d"><title id="t">Oral absorption and systemic exposure</title><desc id="d">Oral drug release and dissolution precede intestinal uptake and presystemic processing. Systemic exposure follows. Some drug can remain in the lumen or be metabolized before systemic entry.</desc><rect width="780" height="260" rx="12" fill="#f5f8fc"/><g font-family="Arial,sans-serif" fill="#19334b" text-anchor="middle"><text x="390" y="30" font-size="20" font-weight="bold">From oral dose to systemic exposure</text><rect x="12" y="65" width="176" height="60" rx="8" fill="#dcecf8" stroke="#527a9b"/><text x="100" y="100" font-size="13" font-weight="bold">Release / dissolve</text><rect x="205" y="65" width="176" height="60" rx="8" fill="#dcecf8" stroke="#527a9b"/><text x="293" y="100" font-size="13" font-weight="bold">Intestinal uptake</text><rect x="398" y="65" width="176" height="60" rx="8" fill="#dcecf8" stroke="#527a9b"/><text x="486" y="100" font-size="13" font-weight="bold">Presystemic processing</text><rect x="591" y="65" width="176" height="60" rx="8" fill="#dcecf8" stroke="#527a9b"/><text x="679" y="100" font-size="13" font-weight="bold">Systemic circulation</text><path d="M188 95h16" stroke="#315d79" stroke-width="2"/><path d="M199 91l5 4-5 4" fill="none" stroke="#315d79" stroke-width="2"/><path d="M381 95h16" stroke="#315d79" stroke-width="2"/><path d="M392 91l5 4-5 4" fill="none" stroke="#315d79" stroke-width="2"/><path d="M574 95h16" stroke="#315d79" stroke-width="2"/><path d="M585 91l5 4-5 4" fill="none" stroke="#315d79" stroke-width="2"/><text x="285" y="150" font-size="13">Some drug remains in gut</text><text x="485" y="175" font-size="13">Some drug is metabolized before systemic entry</text><text x="390" y="217" font-size="14">AUC describes exposure. Cmax and Tmax describe peak and timing.</text><text x="390" y="239" font-size="13">Schematic only. Absorption is not identical to bioavailability.</text></g></svg>