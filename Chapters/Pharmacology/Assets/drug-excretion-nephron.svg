<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-labelledby="t d"><title id="t">Renal drug handling</title><desc id="d">Free drug filters into tubular fluid, secretion moves drug from blood to lumen, reabsorption returns drug to blood. Remaining drug exits in urine.</desc><rect width="800" height="300" rx="12" fill="#f5f8fc"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#315d79"/></marker></defs><g font-family="Arial,sans-serif" text-anchor="middle" fill="#19334b"><text x="400" y="28" font-size="20" font-weight="bold">Renal drug handling</text><rect x="35" y="55" width="730" height="54" rx="10" fill="#ecd6d6" stroke="#98585b"/><text x="400" y="88" font-size="17">Blood: glomerular and peritubular circulation</text><rect x="35" y="192" width="730" height="52" rx="10" fill="#dcecf8" stroke="#507d9b"/><text x="400" y="223" font-size="17">Tubular lumen → collecting system → urine</text><g stroke="#315d79" stroke-width="2.5" marker-end="url(#a)"><path d="M85 111V188"/><path d="M350 111V188"/><path d="M600 189V113"/></g><g font-size="14"><text x="160" y="152">Filtration</text><text x="425" y="152">Secretion</text><text x="680" y="152">Reabsorption</text><text x="400" y="272">Net excretion = filtered + secreted − reabsorbed</text><text x="400" y="292" font-size="12">Simplified schematic, not a detailed nephron anatomy map.</text></g></g></svg>