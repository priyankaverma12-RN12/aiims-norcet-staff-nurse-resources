<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" role="img" aria-labelledby="t d"><title id="t">Illustrative receptor activity</title><desc id="d">A neutral antagonist leaves basal constitutive receptor activity unchanged, a partial agonist increases activity below the full agonist maximum, a full agonist reaches the reference maximum, and an inverse agonist reduces basal activity. Bars are illustrative, not quantitative drug data.</desc><rect width="820" height="360" rx="12" fill="#f4f8fc"/><g font-family="Arial,sans-serif" fill="#18364b"><text x="410" y="28" text-anchor="middle" font-size="21" font-weight="bold">Receptor activity in one illustrative system</text><path d="M75 60V270H785" stroke="#29485e" stroke-width="1.6" fill="none"/><path d="M75 200H785" stroke="#667b8b" stroke-dasharray="6 5"/><text x="79" y="193" font-size="13">Basal activity</text><g><rect x="112" y="235" width="92" height="35" rx="3" fill="#9972b0"/><text x="158" y="293" text-anchor="middle" font-size="13">Inverse agonist</text><rect x="282" y="200" width="92" height="70" rx="3" fill="#70879a"/><text x="328" y="293" text-anchor="middle" font-size="13">Neutral antagonist</text><rect x="452" y="135" width="92" height="135" rx="3" fill="#3c8e83"/><text x="498" y="293" text-anchor="middle" font-size="13">Partial agonist</text><rect x="622" y="70" width="92" height="200" rx="3" fill="#2875ac"/><text x="668" y="293" text-anchor="middle" font-size="13">Full agonist</text></g><text x="25" y="170" transform="rotate(-90 25 170)" text-anchor="middle" font-size="13">Receptor-mediated response</text><text x="410" y="325" text-anchor="middle" font-size="13">Affinity is binding tendency. Efficacy is ability to generate response.</text><text x="410" y="345" text-anchor="middle" font-size="12">Schematic illustration, not measured drug response or a clinical dose guide.</text></g></svg>