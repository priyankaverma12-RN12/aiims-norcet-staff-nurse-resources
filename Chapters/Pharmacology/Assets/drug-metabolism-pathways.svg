<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-labelledby="t d"><title id="t">Drug metabolism pathways</title><desc id="d">A drug can undergo phase one reactions, direct phase two conjugation, both phases or unchanged elimination. Metabolites may be active, inactive or reactive.</desc><rect width="800" height="300" rx="12" fill="#f5f8fc"/><g font-family="Arial,sans-serif" fill="#19334b" text-anchor="middle"><text x="400" y="30" font-size="20" font-weight="bold">Biotransformation: possible routes</text><rect x="20" y="90" width="160" height="62" rx="8" fill="#e3eff8" stroke="#507d9b"/><text x="100" y="125" font-size="16" font-weight="bold">Parent drug</text><rect x="260" y="60" width="200" height="75" rx="8" fill="#e3eff8" stroke="#507d9b"/><text x="360" y="87" font-size="16" font-weight="bold">Phase I</text><text x="360" y="110" font-size="12">Oxidation / reduction / hydrolysis</text><rect x="550" y="60" width="230" height="75" rx="8" fill="#e3f1e9" stroke="#517b63"/><text x="665" y="88" font-size="16" font-weight="bold">Phase II</text><text x="665" y="111" font-size="13">Conjugation</text><path d="M180 105L260 98m-8-4 8 4-8 5M460 98h90m-8-5 8 5-8 5M180 146L550 146m-8-5 8 5-8 5" stroke="#315d79" stroke-width="2" fill="none"/><text x="370" y="165" font-size="13">Direct Phase II can occur</text><text x="400" y="205" font-size="15">Metabolites may be active, inactive or reactive.</text><text x="400" y="230" font-size="14">Some drugs are eliminated unchanged.</text><text x="400" y="263" font-size="13">These pathways are not a compulsory sequence.</text></g></svg>