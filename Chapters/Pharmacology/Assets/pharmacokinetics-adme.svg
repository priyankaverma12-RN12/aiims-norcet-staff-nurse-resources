<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 190" role="img" aria-labelledby="title desc"><title id="title">ADME drug movement</title><desc id="desc">Absorption into systemic blood, distribution to tissues, metabolism and excretion. IV administration bypasses absorption, and oral first pass can occur before systemic blood.</desc><rect width="800" height="190" rx="12" fill="#f5f8fc"/><g font-family="Arial,sans-serif" font-size="17" text-anchor="middle" fill="#18334a"><text x="400" y="26" font-weight="bold">Pharmacokinetics — ADME</text><rect x="20" y="62" width="175" height="62" rx="10" fill="#dcecf8" stroke="#4d7190"/><text x="107" y="87" font-weight="bold">Absorption</text><text x="107" y="109" font-size="13">Site to blood</text><rect x="215" y="62" width="175" height="62" rx="10" fill="#dcecf8" stroke="#4d7190"/><text x="302" y="87" font-weight="bold">Distribution</text><text x="302" y="109" font-size="13">Blood to tissues</text><rect x="410" y="62" width="175" height="62" rx="10" fill="#dcecf8" stroke="#4d7190"/><text x="497" y="87" font-weight="bold">Metabolism</text><text x="497" y="109" font-size="13">Chemical change</text><rect x="605" y="62" width="175" height="62" rx="10" fill="#dcecf8" stroke="#4d7190"/><text x="692" y="87" font-weight="bold">Excretion</text><text x="692" y="109" font-size="13">Removal</text><text x="400" y="151" font-size="14">Processes can overlap. Oral first pass may precede systemic blood.</text><text x="400" y="172" font-size="14">IV enters blood directly. Distribution and elimination still occur.</text></g></svg>