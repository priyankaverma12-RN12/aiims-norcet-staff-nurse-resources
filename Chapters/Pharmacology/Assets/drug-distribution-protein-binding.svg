<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 310" role="img" aria-labelledby="t d"><title id="t">Reversible protein binding and tissue distribution</title><desc id="d">Plasma contains free drug and reversibly bound drug. Free drug can move between plasma and tissues, subject to perfusion and permeability. Bound drug replenishes the free fraction as equilibrium changes.</desc><rect width="800" height="310" rx="12" fill="#f5f8fc"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#19334b"><text x="400" y="29" font-size="20" font-weight="bold">Drug distribution and reversible binding</text><rect x="25" y="55" width="460" height="170" rx="12" fill="#e3eff8" stroke="#507d9b"/><text x="255" y="80" font-size="17" font-weight="bold">Plasma</text><rect x="45" y="106" width="172" height="70" rx="10" fill="#fff" stroke="#507d9b"/><text x="131" y="131" font-size="15" font-weight="bold">Bound drug</text><text x="131" y="151" font-size="12">Albumin / other protein</text><rect x="306" y="106" width="158" height="70" rx="10" fill="#fff" stroke="#507d9b"/><text x="385" y="146" font-size="15" font-weight="bold">Free drug</text><path d="M220 130h81m-7-5 7 5-7 5M301 153h-81m7-5-7 5 7 5" fill="none" stroke="#315d79" stroke-width="2"/><rect x="548" y="55" width="227" height="170" rx="12" fill="#e3f1e9" stroke="#517b63"/><text x="662" y="80" font-size="17" font-weight="bold">Tissue compartment</text><rect x="567" y="106" width="189" height="70" rx="10" fill="#fff" stroke="#517b63"/><text x="662" y="146" font-size="15">Available drug</text><path d="M467 130h97m-7-5 7 5-7 5M564 153h-97m7-5-7 5 7 5" fill="none" stroke="#315d79" stroke-width="2"/><text x="400" y="253" font-size="14">Perfusion, permeability and tissue affinity influence distribution.</text><text x="400" y="277" font-size="14">Total plasma concentration = bound concentration + free concentration.</text><text x="400" y="297" font-size="12">Conceptual diagram, not a quantitative model.</text></g></svg>