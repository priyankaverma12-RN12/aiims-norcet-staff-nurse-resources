<svg xmlns="http://www.w3.org/2000/svg" width="900" height="530" viewBox="0 0 900 530" role="img" aria-labelledby="title desc"><title id="title">Transfusion reaction clinical differential</title><desc id="desc">Stop suspected reaction and escalate. Fever and shock need hemolysis and sepsis assessment, airway signs prompt anaphylaxis protocol, pulmonary edema requires TACO versus TRALI assessment. Delayed cytopenias and jaundice prompt specialist investigation.</desc><rect width="900" height="530" rx="14" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#172b45" text-anchor="middle"><text x="450" y="36" font-size="23" font-weight="bold">Transfusion reaction: recognize, escalate, investigate</text><rect x="155" y="52" width="590" height="65" rx="10" fill="#fee2e2" stroke="#b45353"/><text x="450" y="78" font-size="17" font-weight="bold">Stop implicated transfusion, assess ABC, call for help</text><text x="450" y="99" font-size="14">Urgent treatment and blood-centre investigation run in parallel</text><path d="M450 117 V142 M155 142 H745 M155 142 V161 M450 142 V161 M745 142 V161" fill="none" stroke="#64748b" stroke-width="2"/><rect x="16" y="161" width="278" height="115" rx="9" fill="#dbeafe" stroke="#64748b"/><text x="155" y="188" font-size="16" font-weight="bold">Fever / rigors / shock</text><text x="155" y="217" font-size="14">Hemolysis, sepsis, FNHTR</text><text x="155" y="244" font-size="14">Do not assume mild fever</text><rect x="311" y="161" width="278" height="115" rx="9" fill="#dbeafe" stroke="#64748b"/><text x="450" y="188" font-size="16" font-weight="bold">Airway / wheeze / shock</text><text x="450" y="217" font-size="14">Consider anaphylaxis</text><text x="450" y="244" font-size="14">IM adrenaline per protocol</text><rect x="606" y="161" width="278" height="115" rx="9" fill="#dbeafe" stroke="#64748b"/><text x="745" y="188" font-size="16" font-weight="bold">Hypoxemia / lung edema</text><text x="745" y="217" font-size="14">Assess TACO versus TRALI</text><text x="745" y="244" font-size="14">Clinical context, fluid balance</text><rect x="311" y="299" width="278" height="62" rx="9" fill="#dcfce7" stroke="#64748b"/><text x="450" y="324" font-size="16" font-weight="bold">Days to weeks later</text><text x="450" y="346" font-size="14">Jaundice, rash, diarrhea, cytopenias</text><path d="M450 361 V382 M225 382 H675 M225 382 V396 M675 382 V396" fill="none" stroke="#64748b" stroke-width="2"/><rect x="80" y="396" width="290" height="62" rx="8" fill="#e2e8f0" stroke="#64748b"/><text x="225" y="421" font-size="15" font-weight="bold">Delayed immune hemolysis</text><text x="225" y="442" font-size="14">Review Hb trend and antibodies</text><rect x="515" y="396" width="320" height="62" rx="8" fill="#e2e8f0" stroke="#64748b"/><text x="675" y="421" font-size="15" font-weight="bold">TA-GVHD / post-transfusion purpura</text><text x="675" y="442" font-size="14">Urgent hematology evaluation</text><text x="450" y="490" font-size="15">Preserve traceable records and notify the transfusion service.</text><text x="450" y="511" font-size="13">Educational differential, not a standalone diagnostic or treatment algorithm.</text></g></svg>
