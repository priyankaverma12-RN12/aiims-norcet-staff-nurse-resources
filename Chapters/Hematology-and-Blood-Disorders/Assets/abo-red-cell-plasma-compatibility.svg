<svg xmlns="http://www.w3.org/2000/svg" width="820" height="460" viewBox="0 0 820 460" role="img" aria-labelledby="title desc"><title id="title">ABO compatibility differs by component</title><desc id="desc">Recipient O receives O red cells and all ABO plasma groups. A receives A or O red cells and A or AB plasma. B receives B or O red cells and B or AB plasma. AB receives all ABO red cell groups and AB plasma. RhD, unexpected antibodies and policy checks are separate.</desc><rect width="820" height="460" rx="16" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#16283c" text-anchor="middle"><text x="410" y="38" font-size="24" font-weight="bold">ABO compatibility: red cells versus plasma</text><text x="410" y="67" font-size="14">Recipient-based chart. ABO-identical is preferred.</text><rect x="22" y="88" width="776" height="42" rx="7" fill="#dbeafe"/><text x="102" y="114" font-size="16" font-weight="bold">Recipient</text><text x="350" y="114" font-size="16" font-weight="bold">Red cell donor groups</text><text x="657" y="114" font-size="16" font-weight="bold">Plasma donor groups</text><rect x="22" y="142" width="776" height="42" rx="5" fill="#ffffff"/><text x="102" y="169" font-size="20" font-weight="bold">O</text><text x="350" y="169" font-size="18">O</text><text x="657" y="169" font-size="18">O, A, B, AB</text><rect x="22" y="192" width="776" height="42" rx="5" fill="#e8edf3"/><text x="102" y="219" font-size="20" font-weight="bold">A</text><text x="350" y="219" font-size="18">A, O</text><text x="657" y="219" font-size="18">A, AB</text><rect x="22" y="242" width="776" height="42" rx="5" fill="#ffffff"/><text x="102" y="269" font-size="20" font-weight="bold">B</text><text x="350" y="269" font-size="18">B, O</text><text x="657" y="269" font-size="18">B, AB</text><rect x="22" y="292" width="776" height="42" rx="5" fill="#e8edf3"/><text x="102" y="319" font-size="20" font-weight="bold">AB</text><text x="350" y="319" font-size="18">AB, A, B, O</text><text x="657" y="319" font-size="18">AB</text><text x="235" y="369" font-size="15" font-weight="bold">Recipient antibodies → donor cells</text><text x="590" y="369" font-size="15" font-weight="bold">Donor antibodies → recipient cells</text><text x="410" y="403" font-size="15">Check RhD, other antibodies, special product and local policy.</text><text x="410" y="429" font-size="14">Not a release algorithm. Rare phenotypes and emergency protocols are exceptions.</text></g></svg>
