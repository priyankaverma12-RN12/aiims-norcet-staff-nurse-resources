<svg xmlns="http://www.w3.org/2000/svg" width="900" height="490" viewBox="0 0 900 490" role="img" aria-labelledby="title desc"><title id="title">Anticoagulant targets and reversal principles</title><desc id="desc">Warfarin reduces functional vitamin K dependent factors. UFH and LMWH enhance antithrombin. Direct Xa inhibitors target factor Xa and dabigatran targets thrombin. Reversal requires specialist assessment.</desc><rect width="900" height="490" rx="12" fill="#f8fafc"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#172b45"><text x="450" y="36" font-size="24" font-weight="bold">Anticoagulant targets and reversal</text><rect x="315" y="60" width="270" height="48" rx="8" fill="#dbeafe" stroke="#64748b"/><text x="450" y="90" font-size="17" font-weight="bold">Factor Xa</text><path d="M450 108 V134" stroke="#64748b" stroke-width="2"/><rect x="315" y="134" width="270" height="48" rx="8" fill="#dbeafe" stroke="#64748b"/><text x="450" y="164" font-size="17" font-weight="bold">Thrombin (IIa)</text><path d="M450 182 V208" stroke="#64748b" stroke-width="2"/><rect x="315" y="208" width="270" height="48" rx="8" fill="#dcfce7" stroke="#64748b"/><text x="450" y="237" font-size="17" font-weight="bold">Fibrin formation</text><rect x="20" y="60" width="260" height="96" rx="8" fill="#fef3c7" stroke="#64748b"/><text x="150" y="85" font-size="16" font-weight="bold">Warfarin</text><text x="150" y="109" font-size="14">Less functional II, VII, IX, X</text><text x="150" y="135" font-size="13">Vitamin K / PCC when indicated</text><rect x="20" y="170" width="260" height="96" rx="8" fill="#e0f2fe" stroke="#64748b"/><text x="150" y="195" font-size="16" font-weight="bold">UFH / LMWH</text><text x="150" y="219" font-size="14">Enhance antithrombin</text><text x="150" y="245" font-size="13">Protamine: LMWH partial</text><rect x="620" y="60" width="260" height="96" rx="8" fill="#ede9fe" stroke="#64748b"/><text x="750" y="85" font-size="16" font-weight="bold">Direct Xa inhibitors</text><text x="750" y="109" font-size="14">Apixaban, rivaroxaban, edoxaban</text><text x="750" y="135" font-size="13">Current local reversal protocol</text><rect x="620" y="170" width="260" height="96" rx="8" fill="#ede9fe" stroke="#64748b"/><text x="750" y="195" font-size="16" font-weight="bold">Dabigatran</text><text x="750" y="219" font-size="14">Direct thrombin inhibitor</text><text x="750" y="245" font-size="13">Idarucizumab if indicated</text><path d="M280 108 H310 M280 212 L310 160 M280 199 L310 85 M620 108 L590 85 M620 212 L590 160" fill="none" stroke="#64748b" stroke-width="2"/><rect x="45" y="290" width="810" height="80" rx="8" fill="#fff" stroke="#64748b"/><text x="450" y="316" font-size="16" font-weight="bold">Monitor the patient and the correct assay</text><text x="450" y="339" font-size="14">UFH: local aPTT / anti-Xa. Warfarin: indication-specific INR.</text><text x="450" y="358" font-size="14">LMWH / DOACs: renal function, CBC, bleeding, interactions and prescribed regimen.</text><rect x="45" y="391" width="810" height="65" rx="8" fill="#fee2e2" stroke="#b45353"/><text x="450" y="415" font-size="15" font-weight="bold">Major bleeding: urgent assessment, source control and escalation</text><text x="450" y="439" font-size="14">Reversal depends on drug, last dose, severity, risks and local authorization.</text><text x="450" y="476" font-size="13">Educational comparison, not a dosing algorithm.</text></g></svg>
