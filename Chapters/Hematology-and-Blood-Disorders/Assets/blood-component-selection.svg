<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="title desc"><title id="title">Blood component selection</title><desc id="desc">Four distinct component purposes and three special modifications. All selection requires indication, compatibility and blood-centre verification.</desc><rect width="800" height="420" fill="#f8fafc" rx="12"/><g font-family="Arial,sans-serif" fill="#172b42"><text x="400" y="37" font-size="23" text-anchor="middle" font-weight="bold">Blood component selection</text><rect x="250" y="54" width="300" height="44" rx="8" fill="#dbeafe" stroke="#31588b"/><text x="400" y="82" text-anchor="middle" font-size="16">Clinical indication + blood centre</text><g fill="none" stroke="#64748b" stroke-width="2"><path d="M400 98 V119 H105 V143 M400 119 H300 V143 M400 119 H500 V143 M400 119 H695 V143"/></g><g text-anchor="middle" font-size="14"><rect x="17" y="143" width="176" height="80" rx="8" fill="#fee2e2" stroke="#a84848"/><text x="105" y="169" font-weight="bold">Red cells</text><text x="105" y="193">Oxygen delivery</text><text x="105" y="210">when indicated</text><rect x="212" y="143" width="176" height="80" rx="8" fill="#fef3c7" stroke="#a87925"/><text x="300" y="169" font-weight="bold">Platelets</text><text x="300" y="193">Platelet-related</text><text x="300" y="210">bleeding risk</text><rect x="412" y="143" width="176" height="80" rx="8" fill="#e0f2fe" stroke="#3882a1"/><text x="500" y="169" font-weight="bold">Plasma</text><text x="500" y="193">Multiple clotting</text><text x="500" y="210">factor support</text><rect x="607" y="143" width="176" height="80" rx="8" fill="#ede9fe" stroke="#7054a7"/><text x="695" y="169" font-weight="bold">Cryoprecipitate</text><text x="695" y="193">Fibrinogen</text><text x="695" y="210">replacement</text></g><text x="400" y="255" text-anchor="middle" font-size="17" font-weight="bold">Selected special modifications</text><g text-anchor="middle" font-size="14"><rect x="35" y="272" width="225" height="62" rx="8" fill="#ffffff" stroke="#64748b"/><text x="147" y="294" font-weight="bold">Washed red cells</text><text x="147" y="315">Reduce residual plasma proteins</text><rect x="287" y="272" width="225" height="62" rx="8" fill="#ffffff" stroke="#64748b"/><text x="399" y="294" font-weight="bold">Leukoreduction</text><text x="399" y="315">Reduce donor white cells</text><rect x="539" y="272" width="225" height="62" rx="8" fill="#ffffff" stroke="#64748b"/><text x="651" y="294" font-weight="bold">Irradiation</text><text x="651" y="315">Prevent donor T-cell proliferation</text></g><text x="400" y="369" font-size="15" text-anchor="middle" font-weight="bold">Check final product identity, modification, expiry and local protocol.</text><text x="400" y="393" font-size="13" text-anchor="middle">Concept diagram, not a prescribing algorithm.</text></g></svg>
