<svg xmlns="http://www.w3.org/2000/svg" width="840" height="500" viewBox="0 0 840 500" role="img" aria-labelledby="title desc"><title id="title">Safe transfusion administration workflow</title><desc id="desc">Confirm readiness and consent, verify unit and equipment, observe each component, document and reconcile completion. Four hours from removal in the cited Indian standard. Stop and escalate if a safety concern appears.</desc><rect width="840" height="500" rx="12" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#163047" text-anchor="middle"><text x="420" y="37" font-size="24" font-weight="bold">Safe transfusion administration</text><rect x="100" y="60" width="640" height="68" rx="9" fill="#dbeafe" stroke="#64748b"/><text x="420" y="85" font-size="18" font-weight="bold">1. Before collection</text><text x="420" y="108" font-size="15">Order, consent, access and monitoring ready</text><path d="M420 128 V148 l-7 -7 m7 7 l7 -7" fill="none" stroke="#64748b" stroke-width="2"/><rect x="100" y="151" width="640" height="68" rx="9" fill="#e2e8f0" stroke="#64748b"/><text x="420" y="176" font-size="18" font-weight="bold">2. Before connection</text><text x="420" y="199" font-size="15">Patient-unit match, integrity, expiry, approved set</text><path d="M420 219 V239 l-7 -7 m7 7 l7 -7" fill="none" stroke="#64748b" stroke-width="2"/><rect x="100" y="242" width="640" height="68" rx="9" fill="#dbeafe" stroke="#64748b"/><text x="420" y="267" font-size="18" font-weight="bold">3. During every component</text><text x="420" y="290" font-size="15">Early close observation, authorized rate, time limit</text><path d="M420 310 V330 l-7 -7 m7 7 l7 -7" fill="none" stroke="#64748b" stroke-width="2"/><rect x="100" y="333" width="640" height="68" rx="9" fill="#e2e8f0" stroke="#64748b"/><text x="420" y="358" font-size="18" font-weight="bold">4. At completion</text><text x="420" y="381" font-size="15">Actual volume, times, donation ID and disposition</text><rect x="45" y="432" width="750" height="47" rx="8" fill="#fee2e2" stroke="#b45353"/><text x="420" y="451" font-size="15" font-weight="bold">Safety concern? Hold or stop as appropriate, assess and escalate.</text><text x="420" y="470" font-size="13">Indian section 11.4.4: complete within 4 h of removal. Follow earlier expiry and local policy.</text></g></svg>
