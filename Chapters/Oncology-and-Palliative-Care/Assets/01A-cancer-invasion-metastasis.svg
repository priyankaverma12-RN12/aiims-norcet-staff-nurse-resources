<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-labelledby="title desc">
<title id="title">Epithelial confinement, invasion and metastasis</title><desc id="desc">Three panels show abnormal cells above an intact basement membrane, malignant cells invading stroma, and spread through a vessel to distant tissue. Not all tumors follow this simplified sequence.</desc>
<rect width="900" height="380" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#172554"><text x="450" y="30" font-size="21" text-anchor="middle" font-weight="bold">Cancer cell spread: a simplified schematic</text>
<g stroke="#cbd5e1" fill="#fff"><rect x="15" y="49" width="280" height="280" rx="12"/><rect x="310" y="49" width="280" height="280" rx="12"/><rect x="605" y="49" width="280" height="280" rx="12"/></g>
<g font-size="16" font-weight="bold" text-anchor="middle"><text x="155" y="75">1. Confined lesion</text><text x="450" y="75">2. Local invasion</text><text x="745" y="75">3. Distant spread</text></g>
<g fill="#dbeafe"><rect x="35" y="97" width="240" height="65" rx="5"/><rect x="330" y="97" width="240" height="65" rx="5"/><rect x="625" y="250" width="240" height="40" rx="5"/></g>
<g fill="#fca5a5" stroke="#9f1239" stroke-width="2"><circle cx="75" cy="128" r="16"/><circle cx="112" cy="128" r="16"/><circle cx="149" cy="128" r="16"/><circle cx="186" cy="128" r="16"/><circle cx="223" cy="128" r="16"/><circle cx="369" cy="128" r="16"/><circle cx="408" cy="128" r="16"/><circle cx="447" cy="128" r="16"/><circle cx="486" cy="128" r="16"/><circle cx="525" cy="128" r="16"/><circle cx="450" cy="190" r="15"/><circle cx="470" cy="221" r="15"/><circle cx="661" cy="151" r="14"/><circle cx="747" cy="270" r="13"/><circle cx="776" cy="270" r="13"/></g>
<g stroke="#1d4ed8" stroke-width="5"><path d="M35 166H275"/><path d="M330 166H430 M466 166H570"/></g>
<g font-size="13" text-anchor="middle"><text x="155" y="188">Intact basement membrane</text><text x="155" y="226">Underlying stroma</text><text x="450" y="255">Cells cross the boundary</text><text x="450" y="276">into underlying tissue</text></g>
<rect x="625" y="126" width="240" height="50" rx="25" fill="none" stroke="#dc2626" stroke-width="3"/><path d="M686 151H838" stroke="#dc2626" stroke-width="3"/><path d="M838 151l-12 -7v14z" fill="#dc2626"/><path d="M808 178Q805 216 776 246" fill="none" stroke="#475569" stroke-width="3"/><path d="M776 246l3 -13 9 9z" fill="#475569"/><g font-size="13" text-anchor="middle"><text x="745" y="112">Blood or lymphatic route</text><text x="745" y="312">Possible distant deposit</text></g>
<text x="450" y="355" font-size="13" text-anchor="middle">Concept illustration only. Local invasion does not prove distant metastasis.</text></g></svg>