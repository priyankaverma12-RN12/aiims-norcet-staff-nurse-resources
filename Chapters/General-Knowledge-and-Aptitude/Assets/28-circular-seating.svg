<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 365" role="img" aria-labelledby="t d"><title id="t">Eight equally spaced circular seats numbered clockwise</title><desc id="d">Seat 1 at top, seat 3 right, seat 5 bottom, seat 7 left. A person at seat 1 facing centre has personal left toward seat 2 and right toward seat 8. Facing out reverses the two directions. Seats 1 and 5 are opposite.</desc><rect width="560" height="365" rx="12" fill="#fff"/><circle cx="180" cy="180" r="80" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><path d="M180 95V265" stroke="#64748b" stroke-width="2" stroke-dasharray="5 5"/><g font-family="sans-serif" font-size="15" fill="#172554"><circle cx="180" cy="75" r="17" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="180" y="80" text-anchor="middle">1</text><circle cx="254.24621202458746" cy="105.75378797541251" r="17" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="254.24621202458746" y="110.75378797541251" text-anchor="middle">2</text><circle cx="285" cy="180" r="17" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="285" y="185" text-anchor="middle">3</text><circle cx="254.2462120245875" cy="254.24621202458746" r="17" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="254.2462120245875" y="259.24621202458746" text-anchor="middle">4</text><circle cx="180" cy="285" r="17" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="180" y="290" text-anchor="middle">5</text><circle cx="105.75378797541252" cy="254.24621202458752" r="17" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="105.75378797541252" y="259.2462120245875" text-anchor="middle">6</text><circle cx="75" cy="180.00000000000003" r="17" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="75" y="185.00000000000003" text-anchor="middle">7</text><circle cx="105.7537879754125" cy="105.75378797541252" r="17" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="105.7537879754125" y="110.75378797541252" text-anchor="middle">8</text><text x="180" y="185" text-anchor="middle">Centre</text><text x="180" y="27" text-anchor="middle" font-weight="bold">Clockwise numbering</text><path d="M206 51 Q245 59 260 90" stroke="#15803d" stroke-width="3" fill="none"/><path d="M260 90l-12-4 9-8z" fill="#15803d"/><text x="330" y="85" font-weight="bold">At seat 1</text><text x="330" y="112">Facing centre ↓</text><text x="330" y="138">Left → seat 2</text><text x="330" y="164">Right → seat 8</text><text x="330" y="205">Facing outside ↑</text><text x="330" y="231">Right → seat 2</text><text x="330" y="257">Left → seat 8</text><text x="330" y="301">Opposite: 1 and 5</text><text x="180" y="335" text-anchor="middle">8 seats: opposite is 4 steps away</text></g></svg>