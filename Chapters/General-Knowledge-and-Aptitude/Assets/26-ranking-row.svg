<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" aria-labelledby="t d"><title id="t">Rank from both ends</title><desc id="d">Nine positions. P is fourth from left and sixth from right, total four plus six minus one equals nine.</desc><rect width="720" height="260" rx="12" fill="white"/><g font-family="sans-serif" fill="#172554" font-size="19"><text x="360" y="29" text-anchor="middle" font-weight="bold">Fixed row: 9 people</text><text x="36" y="59">Left</text><text x="668" y="59" text-anchor="end">Right</text><rect x="36" y="78" width="56" height="58" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/><text x="64" y="112" text-anchor="middle">1</text><text x="64" y="155" font-size="13" text-anchor="middle">1</text><rect x="108" y="78" width="56" height="58" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/><text x="136" y="112" text-anchor="middle">2</text><text x="136" y="155" font-size="13" text-anchor="middle">2</text><rect x="180" y="78" width="56" height="58" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/><text x="208" y="112" text-anchor="middle">3</text><text x="208" y="155" font-size="13" text-anchor="middle">3</text><rect x="252" y="78" width="56" height="58" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="280" y="112" text-anchor="middle">P</text><text x="280" y="155" font-size="13" text-anchor="middle">4</text><rect x="324" y="78" width="56" height="58" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/><text x="352" y="112" text-anchor="middle">5</text><text x="352" y="155" font-size="13" text-anchor="middle">5</text><rect x="396" y="78" width="56" height="58" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/><text x="424" y="112" text-anchor="middle">6</text><text x="424" y="155" font-size="13" text-anchor="middle">6</text><rect x="468" y="78" width="56" height="58" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/><text x="496" y="112" text-anchor="middle">7</text><text x="496" y="155" font-size="13" text-anchor="middle">7</text><rect x="540" y="78" width="56" height="58" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/><text x="568" y="112" text-anchor="middle">8</text><text x="568" y="155" font-size="13" text-anchor="middle">8</text><rect x="612" y="78" width="56" height="58" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/><text x="640" y="112" text-anchor="middle">9</text><text x="640" y="155" font-size="13" text-anchor="middle">9</text><path d="M36 175H308M308 175H668" fill="none" stroke="#334155" stroke-width="2"/><text x="172" y="198" text-anchor="middle" font-size="15">4 from left (includes P)</text><text x="487" y="198" text-anchor="middle" font-size="15">6 from right (includes P)</text><text x="360" y="238" font-weight="bold" text-anchor="middle">Total = 4 + 6 − 1 = 9</text></g></svg>