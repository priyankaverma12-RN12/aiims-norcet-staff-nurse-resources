<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" role="img" aria-labelledby="title desc"><title id="title">Four categorical relationships</title><desc id="desc">All A are B: nested circles. No A are B: disjoint circles. Some A are B: witness in overlap. Some A are not B: witness outside B.</desc><rect width="720" height="390" rx="12" fill="#ffffff"/><g font-family="sans-serif" font-size="17" fill="#182a40"><text x="20" y="27" font-weight="bold">All A are B</text><text x="380" y="27" font-weight="bold">No A are B</text><text x="20" y="218" font-weight="bold">Some A are B</text><text x="380" y="218" font-weight="bold">Some A are not B</text></g><g stroke-width="2.5"><circle cx="175" cy="105" r="69" fill="#dbeafe" stroke="#2563eb"/><circle cx="151" cy="112" r="39" fill="#dcfce7" stroke="#15803d"/><circle cx="463" cy="105" r="55" fill="#dcfce7" stroke="#15803d"/><circle cx="614" cy="105" r="55" fill="#dbeafe" stroke="#2563eb"/><circle cx="135" cy="305" r="59" fill="#dcfce7" stroke="#15803d" fill-opacity=".7"/><circle cx="212" cy="305" r="59" fill="#dbeafe" stroke="#2563eb" fill-opacity=".6"/><circle cx="495" cy="305" r="59" fill="#dcfce7" stroke="#15803d" fill-opacity=".7"/><circle cx="572" cy="305" r="59" fill="#dbeafe" stroke="#2563eb" fill-opacity=".6"/></g><g font-family="sans-serif" font-size="17" fill="#182a40" text-anchor="middle"><text x="151" y="119">A</text><text x="213" y="81">B</text><text x="463" y="111">A</text><text x="614" y="111">B</text><text x="105" y="281">A</text><text x="240" y="281">B</text><text x="465" y="281">A</text><text x="600" y="281">B</text></g><g stroke="#be123c" stroke-width="4" stroke-linecap="round"><path d="M167 299l13 13m0-13l-13 13"/><path d="M458 304l13 13m0-13l-13 13"/></g><g font-family="sans-serif" font-size="12" fill="#334155"><text x="20" y="184">No existence implied by universal statements.</text><text x="380" y="184">The two categories cannot overlap.</text><text x="20" y="379">X = at least one member in the overlap.</text><text x="380" y="379">X = at least one A member outside B.</text></g></svg>