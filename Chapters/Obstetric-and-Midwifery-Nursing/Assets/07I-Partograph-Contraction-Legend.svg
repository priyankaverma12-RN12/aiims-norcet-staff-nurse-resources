<svg xmlns="http://www.w3.org/2000/svg" width="680" height="250" viewBox="0 0 680 250" role="img" aria-label="Three contractions with duration 15, 30 and 50 seconds"><defs><pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="1.4" fill="#20354d"/></pattern><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" x2="0" y1="0" y2="8" stroke="#20354d" stroke-width="3"/></pattern></defs><rect width="680" height="250" fill="white"/><g font-family="Arial,sans-serif" fill="#182c43" font-size="14"><text x="22" y="28" font-size="19" font-weight="bold">Contraction notation: one 10-minute observation</text><rect x="40" y="55" width="52" height="32" fill="url(#dots)" stroke="#263b50"/><text x="105" y="76">Under 20 s (15 s)</text><rect x="40" y="100" width="52" height="32" fill="url(#hatch)" stroke="#263b50"/><text x="105" y="121">20–40 s (30 s)</text><rect x="40" y="145" width="52" height="32" fill="#20354d" stroke="#263b50"/><text x="105" y="166">Over 40 s (50 s)</text><text x="420" y="48">Worked column</text><rect x="454" y="58" width="48" height="29" fill="white" stroke="#263b50"/><text x="443" y="77" text-anchor="end">5</text><rect x="454" y="87" width="48" height="29" fill="white" stroke="#263b50"/><text x="443" y="106" text-anchor="end">4</text><rect x="454" y="116" width="48" height="29" fill="#20354d" stroke="#263b50"/><text x="443" y="135" text-anchor="end">3</text><rect x="454" y="145" width="48" height="29" fill="url(#hatch)" stroke="#263b50"/><text x="443" y="164" text-anchor="end">2</text><rect x="454" y="174" width="48" height="29" fill="url(#dots)" stroke="#263b50"/><text x="443" y="193" text-anchor="end">1</text><text x="22" y="224">3 filled boxes = 3 contractions. Shading encodes duration, not intensity.</text></g></svg>