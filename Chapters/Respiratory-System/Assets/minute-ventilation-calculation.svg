<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 560" role="img" aria-labelledby="title desc"><title id="title">Minute Ventilation: Formula + Example</title><desc id="desc">Check units: 1000 mL = 1 L; percentage denominator is original value</desc><rect width="1020" height="560" rx="26" fill="#F7FAFC"/><text x="44" y="62" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#18334A">Minute Ventilation: Formula + Example</text><text x="44" y="89" font-family="Arial,sans-serif" font-size="15" fill="#526D7D">Check units: 1000 mL = 1 L; percentage denominator is original value</text><rect x="66" y="142" width="885" height="110" rx="14" fill="#DCEEF9" stroke="#CAD9E2" stroke-width="1.5"/><text x="505" y="192" text-anchor="middle" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#18334A">MV  =  RR  ×  TV</text><text x="505" y="230" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#18334A">Minute ventilation = breaths/min × mL/breath</text><rect x="66" y="285" width="430" height="164" rx="14" fill="#DDF4EC" stroke="#CAD9E2" stroke-width="1.5"/><text x="281" y="328" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#18334A">RR 15 / min</text><text x="281" y="368" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#18334A">TV 400 mL</text><text x="281" y="413" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#18334A">15 × 400 = 6000 mL/min</text><rect x="521" y="285" width="430" height="164" rx="14" fill="#FCEDCF" stroke="#CAD9E2" stroke-width="1.5"/><text x="736" y="328" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#18334A">Percentage ↑</text><text x="736" y="368" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#18334A">(New − Old) / Old × 100</text><text x="736" y="413" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#18334A">6 to 9 L/min = 50%</text><text x="44" y="542" font-family="Arial,sans-serif" font-size="14" fill="#4B697A">AIIMS NORCET • HP Staff Nurse  |  Original revision diagram</text></svg>