<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440"><rect width="720" height="440" rx="16" fill="#f8fafc"/><g font-family="sans-serif" fill="#182638" text-anchor="middle"><text x="360" y="30" font-size="21" font-weight="bold">Peak flow zones (% of personal best)</text><g font-size="17" font-weight="bold"><rect x="25" y="48" width="210" height="70" rx="8" fill="#166534"/><rect x="255" y="48" width="210" height="70" rx="8" fill="#facc15"/><rect x="485" y="48" width="210" height="70" rx="8" fill="#b91c1c"/><text x="130" y="75" fill="white">Green: 80–100%</text><text x="130" y="98" fill="white" font-size="13">Generally controlled</text><text x="360" y="75">Yellow: 50–&lt;80%</text><text x="360" y="98" font-size="13">Caution / action plan</text><text x="590" y="75" fill="white">Red: &lt;50%</text><text x="590" y="98" fill="white" font-size="13">Urgent action</text></g><text x="360" y="140" font-size="13">Personal best 400; current 160 L/min = 40% (red)</text><text x="360" y="179" font-size="20" font-weight="bold">Cor pulmonale — mechanism</text><g fill="#e0e7ff" stroke="#64748b"><rect x="155" y="191" width="410" height="34" rx="8"/><rect x="155" y="242" width="410" height="34" rx="8"/><rect x="155" y="293" width="410" height="34" rx="8"/><rect x="155" y="344" width="410" height="34" rx="8"/><rect x="155" y="395" width="410" height="34" rx="8"/></g><g font-size="15"><text x="360" y="213">Chronic lung disease → hypoxia</text><text x="360" y="264">Pulmonary vasoconstriction</text><text x="360" y="315">Pulmonary hypertension</text><text x="360" y="366">Right ventricular overload</text><text x="360" y="417" font-weight="bold">Cor pulmonale</text></g><g stroke="#475569" stroke-width="2" fill="none"><path d="M360 225V240l-5-5m5 5 5-5M360 276v15l-5-5m5 5 5-5M360 327v15l-5-5m5 5 5-5M360 378v15l-5-5m5 5 5-5"/></g></g></svg>