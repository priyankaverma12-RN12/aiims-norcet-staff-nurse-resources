<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 560" role="img" aria-labelledby="title desc"><title id="title">ABG Basics: pH First → CO2 or HCO3</title><desc id="desc">Only basic uncompensated teaching patterns. Clinical ABGs require fuller interpretation</desc><rect width="1020" height="560" rx="26" fill="#F7FAFC"/><text x="44" y="62" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#18334A">ABG Basics: pH First → CO2 or HCO3</text><text x="44" y="89" font-family="Arial,sans-serif" font-size="15" fill="#526D7D">Only basic uncompensated teaching patterns. Clinical ABGs require fuller interpretation</text><rect x="56" y="124" width="906" height="66" rx="14" fill="#DCEEF9" stroke="#CAD9E2" stroke-width="1.5"/><text x="509" y="166" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#18334A">Step 1: pH &lt; 7.35 = Acidic   |   pH &gt; 7.45 = Alkaline</text><rect x="55" y="220" width="440" height="117" rx="14" fill="#FAE5EC" stroke="#CAD9E2" stroke-width="1.5"/><rect x="524" y="220" width="440" height="117" rx="14" fill="#DDF4EC" stroke="#CAD9E2" stroke-width="1.5"/><text x="275" y="260" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#18334A">pH LOW + PaCO2 HIGH</text><text x="275" y="302" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#18334A">Respiratory ACIDOSIS</text><text x="744" y="260" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#18334A">pH HIGH + PaCO2 LOW</text><text x="744" y="302" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#18334A">Respiratory ALKALOSIS</text><rect x="55" y="359" width="440" height="117" rx="14" fill="#FCEDCF" stroke="#CAD9E2" stroke-width="1.5"/><rect x="524" y="359" width="440" height="117" rx="14" fill="#ECE4F8" stroke="#CAD9E2" stroke-width="1.5"/><text x="275" y="401" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#18334A">pH LOW + HCO3 LOW</text><text x="275" y="443" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#18334A">Metabolic ACIDOSIS</text><text x="744" y="401" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#18334A">pH HIGH + HCO3 HIGH</text><text x="744" y="443" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#18334A">Metabolic ALKALOSIS</text><text x="44" y="542" font-family="Arial,sans-serif" font-size="14" fill="#4B697A">AIIMS NORCET • HP Staff Nurse  |  Original revision diagram</text></svg>