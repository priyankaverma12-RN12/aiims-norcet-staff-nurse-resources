<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 560" role="img" aria-labelledby="title desc"><title id="title">Breath Sounds: Fast Recognition</title><desc id="desc">Descriptions are learning associations, not recordings or stand-alone diagnoses</desc><rect width="1020" height="560" rx="26" fill="#F7FAFC"/><text x="44" y="62" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#18334A">Breath Sounds: Fast Recognition</text><text x="44" y="89" font-family="Arial,sans-serif" font-size="15" fill="#526D7D">Descriptions are learning associations, not recordings or stand-alone diagnoses</text><rect x="53" y="118" width="445" height="113" rx="14" fill="#DDF4EC" stroke="#CAD9E2" stroke-width="1.5"/><text x="273" y="159" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#18334A">VESICULAR</text><text x="273" y="196" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#18334A">Soft • normal periphery</text><rect x="518" y="118" width="445" height="113" rx="14" fill="#DCEEF9" stroke="#CAD9E2" stroke-width="1.5"/><text x="738" y="159" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#18334A">WHEEZE</text><text x="738" y="196" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#18334A">Musical whistle • narrowed airway</text><rect x="53" y="253" width="445" height="113" rx="14" fill="#FCEDCF" stroke="#CAD9E2" stroke-width="1.5"/><text x="273" y="294" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#18334A">CRACKLES</text><text x="273" y="331" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#18334A">Brief popping sounds</text><rect x="518" y="253" width="445" height="113" rx="14" fill="#ECE4F8" stroke="#CAD9E2" stroke-width="1.5"/><text x="738" y="294" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#18334A">RHONCHI</text><text x="738" y="331" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#18334A">Low snoring / coarse sound</text><rect x="53" y="388" width="445" height="113" rx="14" fill="#FAE5EC" stroke="#CAD9E2" stroke-width="1.5"/><text x="273" y="429" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#18334A">STRIDOR</text><text x="273" y="466" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#18334A">Harsh upper airway • urgent</text><rect x="518" y="388" width="445" height="113" rx="14" fill="#DDF4EC" stroke="#CAD9E2" stroke-width="1.5"/><text x="738" y="429" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#18334A">PLEURAL RUB</text><text x="738" y="466" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#18334A">Grating / rubbing</text><text x="44" y="542" font-family="Arial,sans-serif" font-size="14" fill="#4B697A">AIIMS NORCET • HP Staff Nurse  |  Original revision diagram</text></svg>