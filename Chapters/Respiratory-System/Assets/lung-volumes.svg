<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 530" role="img" aria-labelledby="t"><title id="t">Lung volumes and capacities</title><rect width="900" height="530" rx="22" fill="#f5f9fc"/><text x="44" y="52" font-family="Arial" font-size="27" font-weight="700" fill="#1b405c">Lung volumes — conceptual stack</text><text x="44" y="80" font-family="Arial" font-size="15" fill="#486b80">Approximate teaching example, not measured for a patient</text><g font-family="Arial" text-anchor="middle" fill="#173954"><rect x="270" y="109" width="337" height="174" rx="9" fill="#b3d5e8"/><text x="439" y="194" font-size="26" font-weight="700">IRV</text><text x="439" y="221" font-size="19">3000 mL</text><rect x="270" y="284" width="337" height="45" fill="#a5ddce"/><text x="439" y="313" font-size="20" font-weight="700">TV 500 mL</text><rect x="270" y="330" width="337" height="66" fill="#f6d39e"/><text x="439" y="359" font-size="22" font-weight="700">ERV</text><text x="439" y="382" font-size="17">1100 mL</text><rect x="270" y="397" width="337" height="95" rx="7" fill="#d3bfea"/><text x="439" y="440" font-size="24" font-weight="700">RV</text><text x="439" y="466" font-size="17">1200 mL</text></g><g stroke="#507c95" stroke-width="3" fill="none"><path d="M252 109 h-18 v220 h18"/><path d="M625 330 h18 v162 h-18"/><path d="M650 109 h19 v383 h-19"/></g><g font-family="Arial" fill="#204761" font-size="19" font-weight="700"><text x="165" y="220">IC</text><text x="679" y="412">FRC</text><text x="690" y="295">TLC</text></g><g font-family="Arial" fill="#4a6a7e" font-size="14"><text x="44" y="507">IC = IRV + TV</text><text x="289" y="507">FRC = ERV + RV</text><text x="585" y="507">TLC = IC + FRC</text></g></svg>
