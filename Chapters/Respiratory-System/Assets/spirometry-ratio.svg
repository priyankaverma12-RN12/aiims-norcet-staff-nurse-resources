<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 560" role="img" aria-labelledby="title desc"><title id="title">Spirometry: FEV1 / FVC (Example)</title><desc id="desc">Schematic curve for explaining terms; 70% example is not a universal diagnostic cutoff</desc><rect width="1020" height="560" rx="26" fill="#F7FAFC"/><text x="44" y="62" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#18334A">Spirometry: FEV1 / FVC (Example)</text><text x="44" y="89" font-family="Arial,sans-serif" font-size="15" fill="#526D7D">Schematic curve for explaining terms; 70% example is not a universal diagnostic cutoff</text><rect x="56" y="112" width="906" height="348" rx="14" fill="#EDF5FA" stroke="#CAD9E2" stroke-width="1.5"/><path d="M180 400 L840 400" fill="none" stroke="#526B80" stroke-width="3" stroke-linecap="round"/><path d="M180 400 L180 158" fill="none" stroke="#526B80" stroke-width="3" stroke-linecap="round"/><text x="510" y="448" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#18334A">Time after forced exhalation (seconds)</text><text x="86" y="258" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#18334A">Volume</text><path d="M180 400 C215 350 265 289 340 260 C440 219 535 199 833 199" stroke="#378C88" stroke-width="7" fill="none"/><path d="M340 400 L340 260" fill="none" stroke="#B87742" stroke-width="3" stroke-linecap="round"/><text x="339" y="426" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#18334A">1 sec</text><text x="430" y="184" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#18334A">FVC: final plateau (3.0 L)</text><text x="354" y="286" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#18334A">FEV1 at first second = 2.1 L</text><text x="507" y="490" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#18334A">FEV1/FVC × 100 = 2.1/3.0 × 100 = 70%</text><text x="44" y="542" font-family="Arial,sans-serif" font-size="14" fill="#4B697A">AIIMS NORCET • HP Staff Nurse  |  Original revision diagram</text></svg>