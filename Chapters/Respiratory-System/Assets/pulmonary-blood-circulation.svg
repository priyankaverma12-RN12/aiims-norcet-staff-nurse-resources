<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 560" role="img" aria-labelledby="title desc"><title id="title">Pulmonary Circulation: Heart ↔ Lungs</title><desc id="desc">RV → pulmonary arteries → lung capillaries → pulmonary veins → LA</desc><rect width="1020" height="560" rx="26" fill="#F7FAFC"/><text x="44" y="62" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#18334A">Pulmonary Circulation: Heart ↔ Lungs</text><text x="44" y="89" font-family="Arial,sans-serif" font-size="15" fill="#526D7D">RV → pulmonary arteries → lung capillaries → pulmonary veins → LA</text><rect x="56" y="163" width="225" height="195" rx="14" fill="#DCEEF9" stroke="#CAD9E2" stroke-width="1.5"/><rect x="397" y="163" width="225" height="195" rx="14" fill="#DDF4EC" stroke="#CAD9E2" stroke-width="1.5"/><rect x="737" y="163" width="225" height="195" rx="14" fill="#FAE5EC" stroke="#CAD9E2" stroke-width="1.5"/><text x="169" y="223" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#18334A">RIGHT</text><text x="169" y="253" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#18334A">VENTRICLE</text><text x="169" y="297" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#18334A">Deoxygenated blood</text><text x="510" y="223" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#18334A">LUNGS</text><text x="510" y="265" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#18334A">O2 added / CO2 out</text><text x="850" y="222" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#18334A">LEFT ATRIUM</text><text x="850" y="267" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#18334A">Oxygenated blood</text><path d="M281 250 L395 250" fill="none" stroke="#4081B7" stroke-width="4" stroke-linecap="round"/><path d="M386 243 L395 250 L386 257" fill="none" stroke="#4081B7" stroke-width="3"/><path d="M623 250 L735 250" fill="none" stroke="#B34F64" stroke-width="4" stroke-linecap="round"/><path d="M726 243 L735 250 L726 257" fill="none" stroke="#B34F64" stroke-width="3"/><text x="338" y="218" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#18334A">PULMONARY</text><text x="338" y="239" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#18334A">ARTERY</text><text x="681" y="218" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#18334A">PULMONARY</text><text x="681" y="239" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#18334A">VEINS</text><rect x="170" y="394" width="680" height="65" rx="14" fill="#FFFFFF" stroke="#CAD9E2" stroke-width="1.5"/><text x="509" y="423" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="600" fill="#18334A">Artery = away from heart  •  Vein = toward heart</text><text x="509" y="446" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#18334A">Names depend on direction, not blood oxygen level</text><text x="44" y="542" font-family="Arial,sans-serif" font-size="14" fill="#4B697A">AIIMS NORCET • HP Staff Nurse  |  Original revision diagram</text></svg>