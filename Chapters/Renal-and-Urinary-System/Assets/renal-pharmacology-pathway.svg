<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img" aria-label="Renal medication safety pathway"><rect width="800" height="330" rx="12" fill="#f8fafc"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#18344c"><text x="400" y="30" font-size="22" font-weight="bold">Renal medication safety — before and after each change</text><rect x="45" y="48" width="710" height="48" rx="8" fill="#dbeafe"/><text x="400" y="69" font-size="17" font-weight="bold">Indication • medication reconciliation • kidney function trend</text><text x="400" y="86" font-size="13">Check weight, volume status, electrolytes and dialysis modality</text><path d="M400 96 V115 M200 115 H600 M200 115 V131 M600 115 V131" stroke="#475569" stroke-width="3" fill="none"/><rect x="25" y="131" width="350" height="72" rx="8" fill="#dcfce7"/><text x="200" y="155" font-size="17" font-weight="bold">Prescribed kidney-protective agents</text><text x="200" y="176" font-size="14">ACEi / ARB • SGLT2i • selected MRA</text><text x="200" y="192" font-size="12">Monitor benefit and adverse effects</text><rect x="425" y="131" width="350" height="72" rx="8" fill="#fee2e2"/><text x="600" y="155" font-size="17" font-weight="bold">Renally cleared or high-risk drugs</text><text x="600" y="176" font-size="14">Verify dose, interval, levels and timing</text><text x="600" y="192" font-size="12">Review AKI, interactions and dialysis removal</text><path d="M200 203 V222 H600 V203 M400 222 V240" stroke="#475569" stroke-width="3" fill="none"/><rect x="45" y="240" width="710" height="70" rx="8" fill="#fef3c7"/><text x="400" y="264" font-size="17" font-weight="bold">Monitor symptoms, BP, creatinine, K and drug-specific tests</text><text x="400" y="284" font-size="14">Escalate suspected toxicity • clarify changes with prescriber/pharmacist</text><text x="400" y="300" font-size="13">Document hold/restart plan and teach-back</text></g></svg>