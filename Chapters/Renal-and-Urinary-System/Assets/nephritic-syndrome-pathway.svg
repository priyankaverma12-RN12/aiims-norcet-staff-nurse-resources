<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-label="Nephritic syndrome mechanism and assessment"><rect width="760" height="320" rx="12" fill="#f8fafc"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#19384c"><text x="380" y="28" font-size="22" font-weight="bold">Nephritic syndrome: two consequences of glomerular injury</text><rect x="150" y="46" width="460" height="38" rx="7" fill="#fee2e2"/><text x="380" y="70" font-size="17" font-weight="bold">Inflamed glomerular capillaries</text><path d="M380 84 V102 M185 102 H575 M185 102 V121 M575 102 V121" fill="none" stroke="#475569" stroke-width="3"/><rect x="15" y="121" width="340" height="72" rx="8" fill="#fef3c7"/><text x="185" y="145" font-size="16" font-weight="bold">Barrier damage</text><text x="185" y="165" font-size="14">Dysmorphic RBCs • variable proteinuria</text><text x="185" y="183" font-size="13">Active urinary sediment</text><rect x="405" y="121" width="340" height="72" rx="8" fill="#dbeafe"/><text x="575" y="145" font-size="16" font-weight="bold">Reduced filtration / sodium retention</text><text x="575" y="165" font-size="14">Oliguria • edema • hypertension</text><text x="575" y="183" font-size="13">Risk of AKI and congestion</text><path d="M185 193 V215 H575 V193 M380 215 V233" stroke="#475569" stroke-width="3" fill="none"/><rect x="40" y="233" width="680" height="64" rx="8" fill="#dcfce7"/><text x="380" y="255" font-size="16" font-weight="bold">Assess urine, renal trend, BP, volume and systemic clues together</text><text x="380" y="278" font-size="13">Escalate red flags • investigate cause • monitor response and follow-up</text></g></svg>