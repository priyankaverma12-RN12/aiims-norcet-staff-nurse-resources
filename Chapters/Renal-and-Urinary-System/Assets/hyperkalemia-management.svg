<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-label="Hyperkalemia management principles"><rect width="760" height="330" rx="12" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#18334c" text-anchor="middle"><text x="380" y="32" font-size="23" font-weight="bold">Hyperkalemia: protect, shift, remove, reassess</text><rect x="30" y="53" width="700" height="53" rx="8" fill="#fee2e2"/><text x="380" y="75" font-size="17" font-weight="bold">Urgent clinical assessment + ECG + potassium confirmation</text><text x="380" y="95" font-size="14">Do not delay emergency care for repeat sample if unstable</text><path d="M380 106 V127 M140 127 H620 M140 127 V144 M380 127 V144 M620 127 V144" stroke="#475569" stroke-width="3" fill="none"/><rect x="25" y="144" width="230" height="105" rx="8" fill="#fce7d5"/><rect x="265" y="144" width="230" height="105" rx="8" fill="#dbeafe"/><rect x="505" y="144" width="230" height="105" rx="8" fill="#dcfce7"/><g font-size="17" font-weight="bold"><text x="140" y="170">Protect heart</text><text x="380" y="170">Shift into cells</text><text x="620" y="170">Remove from body</text></g><g font-size="14"><text x="140" y="196">Prescribed IV calcium</text><text x="140" y="219">Does not lower K</text><text x="380" y="196">Insulin-glucose</text><text x="380" y="219">Adjunct beta-2 agonist</text><text x="620" y="196">Dialysis / binders</text><text x="620" y="219">Selected renal excretion</text></g><path d="M140 249 V264 H620 V249 M380 264 V278" stroke="#475569" stroke-width="3" fill="none"/><rect x="30" y="278" width="700" height="40" rx="8" fill="#e0e7ff"/><text x="380" y="303" font-size="16" font-weight="bold">Repeat K, ECG and glucose checks • prevent recurrence</text></g></svg>