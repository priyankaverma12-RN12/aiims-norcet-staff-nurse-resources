<svg xmlns="http://www.w3.org/2000/svg" width="920" height="670" viewBox="0 0 920 670" role="img" aria-labelledby="title desc">
<title id="title">Asymptomatic bacteriuria clinical decision pathway</title><desc id="desc">Assess symptoms and severity, then consider pregnancy, mucosal-trauma urologic surgery, evidence gaps and stewardship.</desc>
<defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker></defs>
<rect width="920" height="670" rx="18" fill="#f8fafc"/>
<g font-family="Arial,sans-serif" text-anchor="middle" fill="#172033"><text x="460" y="38" font-size="26" font-weight="bold">ASB: culture result is not a treatment indication</text><text x="460" y="65" font-size="15">Assess the patient, not only the laboratory report</text>
<g stroke-width="1.5"><rect x="260" y="90" width="400" height="62" rx="10" fill="#dbeafe" stroke="#3b82f6"/><rect x="260" y="187" width="400" height="66" rx="10" fill="#fff7ed" stroke="#ea580c"/><rect x="20" y="292" width="245" height="112" rx="10" fill="#fee2e2" stroke="#dc2626"/><rect x="345" y="292" width="490" height="72" rx="10" fill="#dbeafe" stroke="#3b82f6"/><rect x="345" y="406" width="235" height="120" rx="10" fill="#dcfce7" stroke="#16a34a"/><rect x="600" y="406" width="280" height="120" rx="10" fill="#f1f5f9" stroke="#64748b"/><rect x="20" y="558" width="860" height="77" rx="10" fill="#fef3c7" stroke="#d97706"/></g>
<g font-size="17" font-weight="bold"><text x="460" y="116">Clinically obtained positive urine culture</text><text x="460" y="214">Attributable symptoms or systemic signs?</text><text x="142" y="321">Possible symptomatic UTI</text><text x="590" y="320">No attributable symptoms</text><text x="462" y="435">Treatment exceptions</text><text x="740" y="435">Most other stable groups</text><text x="450" y="584">Special assessment / evidence gaps</text></g>
<g font-size="14"><text x="460" y="139">Review collection method and quantitative count</text><text x="460" y="238">Include atypical signs in spinal cord injury</text><text x="142" y="344">Assess severity and source.</text><text x="142" y="366">Escalate instability urgently.</text><text x="142" y="387">Follow symptomatic UTI pathway.</text><text x="590" y="343">Check ASB definition and procedural context</text><text x="462" y="459">Pregnancy</text><text x="462" y="481">Mucosa-breaching urologic surgery</text><text x="462" y="503">Clinician-directed targeted care</text><text x="740" y="459">Avoid routine screening/treatment</text><text x="740" y="481">Assess new symptoms promptly</text><text x="740" y="503">Preserve standard prophylaxis if indicated</text><text x="450" y="606">Early kidney transplant • catheter removal • persistent urease producers (stone evaluation)</text><text x="450" y="623">GBS pregnancy findings require separate labour prophylaxis planning</text></g>
<g fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arr)"><path d="M460 152V187"/><path d="M260 220H142V292"/><path d="M660 220H590V292"/><path d="M590 364V384H462V406"/><path d="M590 384H740V406"/></g><text x="194" y="210" font-size="13" font-weight="bold">YES</text><text x="704" y="208" font-size="13" font-weight="bold">NO</text><text x="460" y="655" font-size="13" fill="#475569">Original educational diagram • IDSA 2019, EAU and ACOG guidance • not a prescribing algorithm</text></g></svg>
