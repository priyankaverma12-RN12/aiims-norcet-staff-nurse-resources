<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 365" role="img" aria-label="Three mechanisms of acute kidney injury"><rect width="760" height="365" rx="14" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#17324c" text-anchor="middle"><text x="380" y="34" font-size="23" font-weight="bold">Acute kidney injury: where is the problem?</text><g stroke="#64748b"><rect x="20" y="65" width="230" height="185" rx="12" fill="#fce9d3"/><rect x="265" y="65" width="230" height="185" rx="12" fill="#fee2e2"/><rect x="510" y="65" width="230" height="185" rx="12" fill="#dbeafe"/></g><g font-weight="bold" font-size="19"><text x="135" y="95">Prerenal</text><text x="380" y="95">Intrinsic renal</text><text x="625" y="95">Postrenal</text></g><g font-size="15"><text x="135" y="124">Reduced effective perfusion</text><text x="135" y="153">Blood loss / dehydration</text><text x="135" y="176">Shock / low cardiac output</text><text x="135" y="220">Treat perfusion cause</text><text x="380" y="124">Injury within kidney tissue</text><text x="380" y="153">Tubular injury / nephritis</text><text x="380" y="176">Nephrotoxic exposure</text><text x="380" y="220">Treat specific injury</text><text x="625" y="124">Obstructed urine outflow</text><text x="625" y="153">Bladder outlet obstruction</text><text x="625" y="176">Bilateral ureteric obstruction</text><text x="625" y="220">Urgent relief when indicated</text></g><path d="M135 250 V273 H625 V250 M380 250 V289" fill="none" stroke="#64748b" stroke-width="3"/><rect x="58" y="289" width="644" height="54" rx="10" fill="#e0f2e9" stroke="#64748b"/><text x="380" y="312" font-size="16" font-weight="bold">Reduced excretory function: assess fluid, electrolytes and acid-base</text><text x="380" y="331" font-size="14">More than one mechanism may coexist.</text></g></svg>