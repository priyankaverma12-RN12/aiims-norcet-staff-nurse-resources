<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" role="img" aria-label="Urine formation: follow the fluid"><rect width="760" height="540" rx="16" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#102b43"><text x="380" y="32" text-anchor="middle" font-size="23" font-weight="bold">Urine formation: follow the fluid</text><rect x="35" y="48" width="690" height="66" rx="10" fill="#e3f3ee" stroke="#8297aa"/><text x="380" y="74" text-anchor="middle" font-size="18" font-weight="bold">Glomerular filtration</text><text x="380" y="96" text-anchor="middle" font-size="15">Blood plasma → Bowman's space. Cells and most proteins stay in blood.</text><path d="M380 114 v19 m-6 -7 l6 7 6 -7" fill="none" stroke="#42647c" stroke-width="2.5"/><rect x="35" y="140" width="690" height="66" rx="10" fill="#e8f0fa" stroke="#8297aa"/><text x="380" y="166" text-anchor="middle" font-size="18" font-weight="bold">Proximal tubule</text><text x="380" y="188" text-anchor="middle" font-size="15">Most filtered water and sodium return to blood. Glucose is recovered.</text><path d="M380 206 v19 m-6 -7 l6 7 6 -7" fill="none" stroke="#42647c" stroke-width="2.5"/><rect x="35" y="232" width="690" height="66" rx="10" fill="#e3f3ee" stroke="#8297aa"/><text x="380" y="258" text-anchor="middle" font-size="18" font-weight="bold">Loop of Henle</text><text x="380" y="280" text-anchor="middle" font-size="15">Descending limb: water out. Thick ascending limb: salt out, no water.</text><path d="M380 298 v19 m-6 -7 l6 7 6 -7" fill="none" stroke="#42647c" stroke-width="2.5"/><rect x="35" y="324" width="690" height="66" rx="10" fill="#e8f0fa" stroke="#8297aa"/><text x="380" y="350" text-anchor="middle" font-size="18" font-weight="bold">Distal tubule and collecting duct</text><text x="380" y="372" text-anchor="middle" font-size="15">Fine adjustment of sodium, potassium, acid and water. ADH controls water.</text><path d="M380 390 v19 m-6 -7 l6 7 6 -7" fill="none" stroke="#42647c" stroke-width="2.5"/><rect x="35" y="416" width="690" height="66" rx="10" fill="#e3f3ee" stroke="#8297aa"/><text x="380" y="442" text-anchor="middle" font-size="18" font-weight="bold">Excretion</text><text x="380" y="464" text-anchor="middle" font-size="15">Final urine → papilla → calyces → renal pelvis → ureter → bladder.</text></g></svg>