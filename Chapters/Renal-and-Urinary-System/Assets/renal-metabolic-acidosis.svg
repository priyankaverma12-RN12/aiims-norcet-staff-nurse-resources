<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 320" role="img" aria-label="Renal metabolic acidosis decision pathway"><rect width="780" height="320" rx="12" fill="#f8fafc"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#16354b"><text x="390" y="30" font-size="22" font-weight="bold">Metabolic acidosis: renal assessment</text><rect x="90" y="48" width="600" height="52" rx="8" fill="#dbeafe"/><text x="390" y="70" font-size="16" font-weight="bold">Confirm metabolic process • Na − (Cl + HCO₃)</text><text x="390" y="89" font-size="14">Interpret anion gap with albumin and laboratory range</text><path d="M390 100 V120 M195 120 H585 M195 120 V137 M585 120 V137" stroke="#475569" stroke-width="3" fill="none"/><rect x="18" y="137" width="354" height="77" rx="8" fill="#fee2e2"/><rect x="408" y="137" width="354" height="77" rx="8" fill="#dcfce7"/><text x="195" y="160" font-size="17" font-weight="bold">High anion gap</text><text x="195" y="181" font-size="14">Retained anions, lactate, ketones</text><text x="195" y="199" font-size="14">Investigate additional causes</text><text x="585" y="160" font-size="17" font-weight="bold">Normal anion gap</text><text x="585" y="181" font-size="14">RTA, CKD, GI bicarbonate loss</text><text x="585" y="199" font-size="14">Urine studies with limitations</text><path d="M195 214 V232 H585 V214 M390 232 V247" stroke="#475569" stroke-width="3" fill="none"/><rect x="50" y="247" width="680" height="58" rx="8" fill="#e0e7ff"/><text x="390" y="270" font-size="16" font-weight="bold">Expected PaCO₂ = 1.5 × HCO₃ + 8 ± 2</text><text x="390" y="291" font-size="14">Above expected: respiratory acidosis • below: respiratory alkalosis</text></g></svg>