<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 342" role="img" aria-label="Infection-related glomerulonephritis pathway"><rect width="800" height="342" rx="12" fill="#f8fafc"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#18344c"><text x="400" y="30" font-size="22" font-weight="bold">Postinfectious glomerulonephritis</text><rect x="110" y="48" width="580" height="42" rx="8" fill="#dbeafe"/><text x="400" y="74" font-size="16" font-weight="bold">Antecedent nephritogenic infection → immune response</text><path d="M400 90 V109" stroke="#475569" stroke-width="3"/><rect x="110" y="109" width="580" height="47" rx="8" fill="#fee2e2"/><text x="400" y="130" font-size="16" font-weight="bold">Immune deposits and complement activation</text><text x="400" y="146" font-size="13">Glomerular capillary inflammation</text><path d="M400 156 V175 M202 175 H598 M202 175 V191 M598 175 V191" stroke="#475569" stroke-width="3" fill="none"/><rect x="25" y="191" width="354" height="65" rx="8" fill="#fef3c7"/><text x="202" y="216" font-size="17" font-weight="bold">Barrier injury</text><text x="202" y="237" font-size="14">Hematuria and variable proteinuria</text><rect x="421" y="191" width="354" height="65" rx="8" fill="#e0e7ff"/><text x="598" y="216" font-size="17" font-weight="bold">Filtration may decrease</text><text x="598" y="237" font-size="14">Salt / water retention, edema, high BP</text><path d="M202 256 V273 H598 V256 M400 273 V286" stroke="#475569" stroke-width="3" fill="none"/><rect x="25" y="286" width="750" height="42" rx="8" fill="#dcfce7"/><text x="400" y="304" font-size="15" font-weight="bold">Supportive care • treat active infection / eradicate residual GAS as indicated</text><text x="400" y="320" font-size="12">Follow renal function, urine, BP and complement • refer atypical / severe cases</text></g></svg>