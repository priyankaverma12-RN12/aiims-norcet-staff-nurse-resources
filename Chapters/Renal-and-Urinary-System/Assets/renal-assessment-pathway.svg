<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-label="Renal assessment and diagnostic pathway"><rect width="760" height="440" rx="12" fill="#f7fafc"/><g font-family="Arial,sans-serif" fill="#18334c"><text x="380" y="34" font-size="23" font-weight="bold" text-anchor="middle">Renal assessment: three complementary checks</text><rect x="25" y="65" width="710" height="75" rx="10" fill="#dbeafe" stroke="#64748b"/><text x="380" y="91" text-anchor="middle" font-size="19" font-weight="bold">Bedside assessment</text><text x="380" y="118" text-anchor="middle" font-size="15">Vitals • fluid balance • weight • symptoms • bladder assessment</text><path d="M380 140 V170 M145 170 H615 M145 170 V195 M380 170 V195 M615 170 V195" stroke="#64748b" stroke-width="3" fill="none"/><g stroke="#64748b"><rect x="25" y="195" width="230" height="130" rx="10" fill="#e0f2e9"/><rect x="265" y="195" width="230" height="130" rx="10" fill="#fce9d6"/><rect x="505" y="195" width="230" height="130" rx="10" fill="#e7e4fa"/></g><g font-size="16" text-anchor="middle"><text x="140" y="224" font-weight="bold">Urine</text><text x="140" y="251">Dipstick + microscopy</text><text x="140" y="276">ACR / culture</text><text x="140" y="300">Correct specimen</text><text x="380" y="224" font-weight="bold">Blood</text><text x="380" y="251">Creatinine / eGFR</text><text x="380" y="276">Urea, electrolytes</text><text x="380" y="300">CBC / albumin</text><text x="620" y="224" font-weight="bold">Structure</text><text x="620" y="251">Ultrasound / CT</text><text x="620" y="276">Cystoscopy</text><text x="620" y="300">Biopsy when indicated</text></g><path d="M140 325 V346 H620 V325 M380 325 V365" stroke="#64748b" stroke-width="3" fill="none"/><rect x="110" y="365" width="540" height="52" rx="10" fill="#dbeafe" stroke="#64748b"/><text x="380" y="396" text-anchor="middle" font-size="17" font-weight="bold">Interpret together • trend changes • escalate red flags</text></g></svg>