<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 350" role="img" aria-label="Individualized renal nutrition assessment pathway"><rect width="840" height="350" rx="12" fill="#f8fafc"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#19384c"><text x="420" y="29" font-size="22" font-weight="bold">Renal nutrition: assess before restricting</text><rect x="70" y="45" width="700" height="55" rx="8" fill="#dbeafe"/><text x="420" y="67" font-size="17" font-weight="bold">CKD stage, dialysis modality, intake, weight and lab trends</text><text x="420" y="87" font-size="14">Review appetite, comorbidities, medications and food access</text><path d="M420 100 V118 M215 118 H625 M215 118 V135 M625 118 V135" stroke="#475569" stroke-width="3" fill="none"/><rect x="25" y="135" width="380" height="72" rx="8" fill="#dcfce7"/><text x="215" y="159" font-size="17" font-weight="bold">Stable non-dialysis G3–G5</text><text x="215" y="180" font-size="15">KDIGO 2024: 0.8 g protein/kg/day</text><text x="215" y="196" font-size="12">Avoid unsupervised severe protein restriction</text><rect x="435" y="135" width="380" height="72" rx="8" fill="#e0e7ff"/><text x="625" y="159" font-size="17" font-weight="bold">Stable maintenance HD or PD</text><text x="625" y="180" font-size="15">KDOQI 2020: 1.0–1.2 g/kg/day</text><text x="625" y="196" font-size="12">Account for dialysis-related nutrient losses</text><path d="M215 207 V226 H625 V207 M420 226 V243" stroke="#475569" stroke-width="3" fill="none"/><rect x="50" y="243" width="740" height="83" rx="8" fill="#fef3c7"/><text x="420" y="266" font-size="17" font-weight="bold">Individualize calories, sodium, potassium, phosphate and fluid</text><text x="420" y="289" font-size="14">Avoid excessive restrictions in frailty, malnutrition or acute illness</text><text x="420" y="309" font-size="14">Dietitian plan → teach-back → reassess intake, labs and nutrition</text></g></svg>