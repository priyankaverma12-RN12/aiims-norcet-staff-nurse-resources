<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 632" role="img" aria-label="RAAS: response to reduced renal perfusion"><rect width="760" height="632" rx="16" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#102b43"><text x="380" y="32" text-anchor="middle" font-size="23" font-weight="bold">RAAS: response to reduced renal perfusion</text><rect x="35" y="48" width="690" height="66" rx="10" fill="#e3f3ee" stroke="#8297aa"/><text x="380" y="74" text-anchor="middle" font-size="18" font-weight="bold">Low renal perfusion / low tubular NaCl / sympathetic stimulus</text><text x="380" y="96" text-anchor="middle" font-size="15">Granular cells of kidney release renin.</text><path d="M380 114 v19 m-6 -7 l6 7 6 -7" fill="none" stroke="#42647c" stroke-width="2.5"/><rect x="35" y="140" width="690" height="66" rx="10" fill="#e8f0fa" stroke="#8297aa"/><text x="380" y="166" text-anchor="middle" font-size="18" font-weight="bold">Renin + liver angiotensinogen</text><text x="380" y="188" text-anchor="middle" font-size="15">Renin cleaves angiotensinogen to angiotensin I.</text><path d="M380 206 v19 m-6 -7 l6 7 6 -7" fill="none" stroke="#42647c" stroke-width="2.5"/><rect x="35" y="232" width="690" height="66" rx="10" fill="#e3f3ee" stroke="#8297aa"/><text x="380" y="258" text-anchor="middle" font-size="18" font-weight="bold">ACE converts angiotensin I to angiotensin II</text><text x="380" y="280" text-anchor="middle" font-size="15">ACE is present in vascular endothelium, including the lungs.</text><path d="M380 298 v19 m-6 -7 l6 7 6 -7" fill="none" stroke="#42647c" stroke-width="2.5"/><rect x="35" y="324" width="690" height="66" rx="10" fill="#e8f0fa" stroke="#8297aa"/><text x="380" y="350" text-anchor="middle" font-size="18" font-weight="bold">Angiotensin II</text><text x="380" y="372" text-anchor="middle" font-size="15">Vasoconstriction, thirst, aldosterone release and support for ADH release.</text><path d="M380 390 v19 m-6 -7 l6 7 6 -7" fill="none" stroke="#42647c" stroke-width="2.5"/><rect x="35" y="416" width="690" height="66" rx="10" fill="#e3f3ee" stroke="#8297aa"/><text x="380" y="442" text-anchor="middle" font-size="18" font-weight="bold">Aldosterone from adrenal cortex</text><text x="380" y="464" text-anchor="middle" font-size="15">Increases sodium retention and potassium secretion in distal nephron.</text><path d="M380 482 v19 m-6 -7 l6 7 6 -7" fill="none" stroke="#42647c" stroke-width="2.5"/><rect x="35" y="508" width="690" height="66" rx="10" fill="#e8f0fa" stroke="#8297aa"/><text x="380" y="534" text-anchor="middle" font-size="18" font-weight="bold">Result</text><text x="380" y="556" text-anchor="middle" font-size="15">Supports effective circulating volume and blood pressure.</text></g></svg>