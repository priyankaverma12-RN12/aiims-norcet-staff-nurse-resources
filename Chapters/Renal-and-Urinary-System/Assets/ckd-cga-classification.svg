<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" role="img" aria-label="CKD GFR and albuminuria classification"><rect width="760" height="410" rx="14" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#18334c"><text x="380" y="32" text-anchor="middle" font-size="23" font-weight="bold">CKD: classify by cause, GFR and albuminuria</text><text x="24" y="65" font-size="15">GFR in mL/min/1.73 m²</text><text x="372" y="65" font-size="15">Urine ACR in mg/g</text><rect x="24" y="79" width="314" height="33" rx="5" fill="#dcfce7"/><text x="38" y="101" font-size="17" font-weight="bold">G1</text><text x="137" y="101" font-size="17">≥90</text><rect x="24" y="119" width="314" height="33" rx="5" fill="#dcfce7"/><text x="38" y="141" font-size="17" font-weight="bold">G2</text><text x="137" y="141" font-size="17">60–89</text><rect x="24" y="159" width="314" height="33" rx="5" fill="#fef3c7"/><text x="38" y="181" font-size="17" font-weight="bold">G3a</text><text x="137" y="181" font-size="17">45–59</text><rect x="24" y="199" width="314" height="33" rx="5" fill="#fed7aa"/><text x="38" y="221" font-size="17" font-weight="bold">G3b</text><text x="137" y="221" font-size="17">30–44</text><rect x="24" y="239" width="314" height="33" rx="5" fill="#fecaca"/><text x="38" y="261" font-size="17" font-weight="bold">G4</text><text x="137" y="261" font-size="17">15–29</text><rect x="24" y="279" width="314" height="33" rx="5" fill="#fecaca"/><text x="38" y="301" font-size="17" font-weight="bold">G5</text><text x="137" y="301" font-size="17">&lt;15</text><rect x="372" y="79" width="364" height="46" rx="5" fill="#dcfce7"/><text x="386" y="109" font-size="18" font-weight="bold">A1</text><text x="490" y="109" font-size="18">&lt;30</text><rect x="372" y="136" width="364" height="46" rx="5" fill="#fef3c7"/><text x="386" y="166" font-size="18" font-weight="bold">A2</text><text x="490" y="166" font-size="18">30–300</text><rect x="372" y="193" width="364" height="46" rx="5" fill="#fecaca"/><text x="386" y="223" font-size="18" font-weight="bold">A3</text><text x="490" y="223" font-size="18">&gt;300</text><text x="372" y="274" font-size="15">Example: diabetes + G3b + A3</text><text x="372" y="297" font-size="15">Higher albuminuria may increase risk.</text><rect x="24" y="330" width="712" height="58" rx="8" fill="#e0e7ff"/><text x="380" y="353" text-anchor="middle" font-size="16" font-weight="bold">Establish chronicity (at least 3 months).</text><text x="380" y="376" text-anchor="middle" font-size="15">G1 or G2 alone does not establish CKD without kidney damage.</text></g></svg>