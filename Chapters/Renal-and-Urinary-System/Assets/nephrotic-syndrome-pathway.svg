<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 365" role="img" aria-label="Nephrotic syndrome consequences of protein loss"><rect width="800" height="365" rx="12" fill="#f8fafc"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#19384c"><text x="400" y="29" font-size="22" font-weight="bold">Nephrotic syndrome: protein leak and systemic consequences</text><rect x="110" y="45" width="580" height="43" rx="8" fill="#dbeafe"/><text x="400" y="72" font-size="17" font-weight="bold">Glomerular filtration barrier injury → urinary protein loss</text><path d="M400 88 V108 M130 108 H670 M130 108 V126 M400 108 V126 M670 108 V126" stroke="#475569" stroke-width="3" fill="none"/><rect x="10" y="126" width="240" height="92" rx="8" fill="#fef3c7"/><text x="130" y="150" font-size="16" font-weight="bold">Albumin loss</text><text x="130" y="172" font-size="13">Low plasma oncotic pressure</text><text x="130" y="190" font-size="13">+ renal sodium retention</text><text x="130" y="207" font-size="13">Edema, variable circulating volume</text><rect x="280" y="126" width="240" height="92" rx="8" fill="#e0e7ff"/><text x="400" y="150" font-size="16" font-weight="bold">Altered lipid metabolism</text><text x="400" y="174" font-size="13">Lipid synthesis / clearance changes</text><text x="400" y="195" font-size="13">Hyperlipidemia and lipiduria</text><rect x="550" y="126" width="240" height="92" rx="8" fill="#fee2e2"/><text x="670" y="150" font-size="16" font-weight="bold">Other protein losses</text><text x="670" y="173" font-size="13">Altered immune / coagulation balance</text><text x="670" y="194" font-size="13">Infection and thrombosis risk</text><path d="M130 218 V239 H670 V218 M400 239 V258" stroke="#475569" stroke-width="3" fill="none"/><rect x="38" y="258" width="724" height="82" rx="8" fill="#dcfce7"/><text x="400" y="282" font-size="17" font-weight="bold">Nursing assessment and specialist-directed treatment</text><text x="400" y="304" font-size="14">Protein trend, albumin, renal function, perfusion, BP and complications</text><text x="400" y="324" font-size="13">Individualized fluid care • cause-specific therapy • education • relapse follow-up</text></g></svg>