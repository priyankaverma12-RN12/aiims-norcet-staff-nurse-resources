<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-label="CKD mineral bone disorder feedback pathway"><rect width="800" height="380" rx="12" fill="#f8fafc"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#18344c"><text x="400" y="30" font-size="22" font-weight="bold">CKD-MBD: mineral regulation and bone consequences</text><rect x="220" y="48" width="360" height="42" rx="8" fill="#dbeafe"/><text x="400" y="74" font-size="17" font-weight="bold">Declining kidney function</text><path d="M400 90 V108 M205 108 H595 M205 108 V124 M595 108 V124" stroke="#475569" stroke-width="3" fill="none"/><rect x="25" y="124" width="360" height="68" rx="8" fill="#fee2e2"/><text x="205" y="149" font-size="17" font-weight="bold">Phosphate retention tendency</text><text x="205" y="172" font-size="14">FGF23 and PTH may rise before serum P rises</text><rect x="415" y="124" width="360" height="68" rx="8" fill="#e0e7ff"/><text x="595" y="149" font-size="17" font-weight="bold">Reduced calcitriol production</text><text x="595" y="172" font-size="14">Less intestinal calcium absorption</text><path d="M205 192 V212 H595 V192 M400 212 V229" stroke="#475569" stroke-width="3" fill="none"/><rect x="190" y="229" width="420" height="45" rx="8" fill="#fef3c7"/><text x="400" y="257" font-size="17" font-weight="bold">Secondary hyperparathyroidism may develop</text><path d="M400 274 V290 M205 290 H595 M205 290 V305 M595 290 V305" stroke="#475569" stroke-width="3" fill="none"/><rect x="25" y="305" width="360" height="58" rx="8" fill="#dcfce7"/><text x="205" y="328" font-size="16" font-weight="bold">Abnormal bone turnover / fragility</text><text x="205" y="348" font-size="13">High or low turnover, mineralization defects</text><rect x="415" y="305" width="360" height="58" rx="8" fill="#fee2e2"/><text x="595" y="328" font-size="16" font-weight="bold">Vascular / valvular calcification risk</text><text x="595" y="348" font-size="13">Multifactorial, not simply caused by PTH</text></g></svg>