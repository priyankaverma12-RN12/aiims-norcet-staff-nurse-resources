<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 350" role="img" aria-label="Renal anemia mechanisms and treatment pathway"><rect width="820" height="350" rx="12" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#18344c" text-anchor="middle"><text x="410" y="30" font-size="23" font-weight="bold">CKD anemia — why RBC production falls</text><rect x="30" y="48" width="360" height="75" rx="8" fill="#dbeafe"/><text x="210" y="73" font-size="17" font-weight="bold">Damaged kidney</text><text x="210" y="96" font-size="15">Reduced appropriate EPO response</text><rect x="430" y="48" width="360" height="75" rx="8" fill="#fee2e2"/><text x="610" y="73" font-size="17" font-weight="bold">Inflammation and iron loss</text><text x="610" y="96" font-size="15">Less iron available to bone marrow</text><path d="M210 123 V143 H610 V123 M410 143 V161" stroke="#475569" stroke-width="3" fill="none"/><rect x="100" y="161" width="620" height="49" rx="8" fill="#fef3c7"/><text x="410" y="191" font-size="18" font-weight="bold">Reduced effective erythropoiesis → low hemoglobin</text><path d="M410 210 V232" stroke="#475569" stroke-width="3"/><rect x="35" y="232" width="750" height="96" rx="8" fill="#dcfce7"/><text x="410" y="254" font-size="17" font-weight="bold">Assess CBC, reticulocytes, ferritin, TSAT and causes</text><text x="410" y="278" font-size="15">Treat reversible causes • prescribed iron • individualized ESA</text><text x="410" y="300" font-size="14">Selected HIF-PHI alternative • transfusion only if indicated</text><text x="410" y="319" font-size="13">Monitor symptoms, Hb trend, BP, iron status and adverse effects</text></g></svg>