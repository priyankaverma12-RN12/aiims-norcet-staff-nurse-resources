<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 630" role="img" aria-labelledby="title desc"><title id="title">IgA nephropathy: from immune complexes to nursing follow-up</title><desc id="desc">Abnormal IgA-containing immune complexes accumulate in the mesangium, injuring glomerular filters. Blood and protein may leak into urine. Monitoring includes urine protein, kidney function and blood pressure.</desc><rect width="760" height="630" rx="18" fill="#f5f8fc"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="380" y="42" font-size="26" font-weight="bold" fill="#173653">IgA nephropathy: disease pathway</text><g stroke="#32718e" stroke-width="2" fill="#fff"><rect x="125" y="70" width="510" height="64" rx="12"/><rect x="125" y="174" width="510" height="64" rx="12"/><rect x="125" y="278" width="510" height="64" rx="12"/></g><g font-size="19" fill="#173653"><text x="380" y="97">Abnormal IgA-containing immune complexes</text><text x="380" y="119" font-size="15">Immune proteins combine and circulate</text><text x="380" y="201">Mesangial deposition and inflammation</text><text x="380" y="223" font-size="15">Glomerular supporting tissue is affected</text><text x="380" y="305">Injury to the glomerular filter</text><text x="380" y="327" font-size="15">Blood and protein may enter the urine</text></g><g fill="#32718e"><path d="M376 134h8v26h9l-13 14-13-14h9z"/><path d="M376 238h8v26h9l-13 14-13-14h9z"/></g><path d="M380 342v26H190v18m190-18h190v18" stroke="#32718e" stroke-width="3" fill="none"/><g fill="#e5eff7" stroke="#32718e" stroke-width="2"><rect x="25" y="386" width="330" height="75" rx="12"/><rect x="405" y="386" width="330" height="75" rx="12"/></g><g font-size="18" fill="#173653"><text x="190" y="415">Hematuria / proteinuria</text><text x="190" y="439" font-size="15">Visible or microscopic findings</text><text x="570" y="415">Possible nephron loss</text><text x="570" y="439" font-size="15">Hypertension and falling eGFR</text></g><path d="M190 461v25h190m190-25v25H380v20" stroke="#32718e" stroke-width="3" fill="none"/><rect x="100" y="506" width="560" height="92" rx="12" fill="#e1f0e9" stroke="#287653" stroke-width="2"/><text x="380" y="536" font-size="20" font-weight="bold" fill="#20583c">Nursing surveillance and follow-up</text><text x="380" y="560" font-size="16" fill="#20583c">Blood pressure · urine protein · creatinine/eGFR</text><text x="380" y="582" font-size="16" fill="#20583c">Symptoms · medicine safety · specialist review</text></g></svg>
