<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 365" role="img" aria-label="RPGN immunopathology and urgent assessment"><rect width="780" height="365" rx="12" fill="#f8fafc"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#17364b"><text x="390" y="30" font-size="22" font-weight="bold">RPGN: rapid glomerular injury</text><rect x="80" y="48" width="620" height="52" rx="8" fill="#fee2e2"/><text x="390" y="70" font-size="17" font-weight="bold">Capillary injury → fibrin in Bowman space</text><text x="390" y="89" font-size="14">Cellular crescents can compress the glomerular tuft</text><path d="M390 100 V120 M130 120 H650 M130 120 V137 M390 120 V137 M650 120 V137" stroke="#475569" stroke-width="3" fill="none"/><rect x="12" y="137" width="236" height="91" rx="8" fill="#dbeafe"/><rect x="272" y="137" width="236" height="91" rx="8" fill="#fef3c7"/><rect x="532" y="137" width="236" height="91" rx="8" fill="#dcfce7"/><g font-size="16" font-weight="bold"><text x="130" y="161">Anti-GBM</text><text x="390" y="161">Immune-complex</text><text x="650" y="161">Pauci-immune</text></g><g font-size="14"><text x="130" y="185">Linear IgG staining</text><text x="130" y="208">Lung involvement possible</text><text x="390" y="185">Granular deposits</text><text x="390" y="208">Cause-specific treatment</text><text x="650" y="185">Few/no deposits</text><text x="650" y="208">Often ANCA-associated</text></g><path d="M130 228 V245 H650 V228 M390 245 V263" stroke="#475569" stroke-width="3" fill="none"/><rect x="40" y="263" width="700" height="80" rx="8" fill="#e0e7ff"/><text x="390" y="286" font-size="17" font-weight="bold">Urgent nephrology evaluation</text><text x="390" y="309" font-size="14">Serial creatinine, urine, serology, biopsy and respiratory assessment</text><text x="390" y="329" font-size="14">Treat the cause and monitor infection, bleeding and organ function</text></g></svg>