<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 430" role="img" aria-labelledby="t d"><title id="t">Pyelonephritis and infected obstruction</title><desc id="d">Bacteria may ascend from bladder through ureter to renal pelvis and parenchyma. A stone can obstruct drainage. Urgent assessment, effective antibiotics and decompression when indicated provide source control.</desc><rect width="840" height="430" rx="16" fill="#f7fafc"/><g font-family="Arial,sans-serif" fill="#17324d"><text x="420" y="35" text-anchor="middle" font-size="24" font-weight="bold">Ascending infection and source control</text><path d="M235 65C155 37 96 106 113 180C125 231 188 227 210 184C225 153 201 134 238 118C268 101 266 79 235 65Z" fill="#e9a49b" stroke="#ad4f46" stroke-width="3"/><path d="M211 113Q176 130 190 153L229 145L253 153L268 188" fill="none" stroke="#fff1bc" stroke-width="17" stroke-linecap="round"/><text x="90" y="62" font-size="15">Kidney tissue</text><path d="M95 66L130 101" stroke="#49627b" stroke-width="2"/><text x="284" y="108" font-size="15">Renal pelvis</text><path d="M280 113L239 136" stroke="#49627b" stroke-width="2"/><path d="M268 188Q284 224 254 271L244 320" fill="none" stroke="#d2a851" stroke-width="13"/><path d="M230 318Q172 311 168 354Q174 397 236 399Q302 395 303 350Q299 311 244 318Z" fill="#f8d9ae" stroke="#b38648" stroke-width="3"/><text x="235" y="367" text-anchor="middle" font-size="17">Bladder</text><path d="M244 306L260 259L269 215" fill="none" stroke="#b83d38" stroke-width="5" stroke-dasharray="7 6"/><path d="M258 222L269 205L278 222" fill="#b83d38"/><text x="45" y="272" font-size="15">Ascending bacteria</text><path d="M180 268L251 260" stroke="#b83d38" stroke-width="2"/><circle cx="270" cy="224" r="11" fill="#795634" stroke="#4b3521" stroke-width="2"/><text x="297" y="225" font-size="15">Possible stone</text><path d="M285 224L293 224" stroke="#4b3521" stroke-width="2"/><rect x="435" y="63" width="365" height="88" rx="12" fill="#e6f0fb" stroke="#7d9fc5"/><text x="455" y="90" font-size="19" font-weight="bold">Assess the upper tract</text><text x="455" y="117" font-size="15">Urine culture, vitals, renal function</text><text x="455" y="138" font-size="15">Imaging for obstruction or complication</text><rect x="435" y="171" width="365" height="87" rx="12" fill="#fff0de" stroke="#d79b4e"/><text x="455" y="198" font-size="19" font-weight="bold">Infected obstruction?</text><text x="455" y="224" font-size="15">Urgent urology and antimicrobial care</text><text x="455" y="245" font-size="15">Decompression when indicated</text><rect x="435" y="278" width="365" height="98" rx="12" fill="#e0f3e8" stroke="#5c9b7b"/><text x="455" y="305" font-size="19" font-weight="bold">Review recovery</text><text x="455" y="331" font-size="15">Culture-directed effective therapy</text><text x="455" y="352" font-size="15">Monitor symptoms, output and safety</text><path d="M617 151v20M617 258v20" stroke="#526d82" stroke-width="3"/><text x="420" y="418" text-anchor="middle" font-size="13">Original conceptual diagram, not to scale. Treatment follows clinical protocol.</text></g></svg>
