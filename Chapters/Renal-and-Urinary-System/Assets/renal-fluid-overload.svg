<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" role="img" aria-label="Fluid overload and dialysis balance"><rect width="720" height="310" rx="12" fill="#f8fafc"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#18334c"><text x="360" y="30" font-size="22" font-weight="bold">Renal fluid overload: assess and remove safely</text><rect x="20" y="52" width="680" height="50" rx="8" fill="#dbeafe"/><text x="360" y="73" font-size="16" font-weight="bold">Sodium and water retention</text><text x="360" y="92" font-size="14">Inadequate excretion relative to intake</text><path d="M360 102 V121 M125 121 H595 M125 121 V138 M360 121 V138 M595 121 V138" stroke="#475569" stroke-width="3" fill="none"/><rect x="20" y="138" width="210" height="68" rx="8" fill="#e0e7ff"/><rect x="255" y="138" width="210" height="68" rx="8" fill="#fee2e2"/><rect x="490" y="138" width="210" height="68" rx="8" fill="#dcfce7"/><g font-size="16" font-weight="bold"><text x="125" y="162">Venous congestion</text><text x="360" y="162">Pulmonary edema</text><text x="595" y="162">Peripheral edema</text></g><g font-size="13"><text x="125" y="184">Raised filling pressure</text><text x="360" y="184">Impaired gas exchange</text><text x="595" y="184">Interstitial fluid</text></g><path d="M125 206 V224 H595 V206 M360 224 V240" stroke="#475569" stroke-width="3" fill="none"/><rect x="20" y="240" width="680" height="50" rx="8" fill="#fef3c7"/><text x="360" y="260" font-size="16" font-weight="bold">Individual fluid plan + prescribed removal + reassessment</text><text x="360" y="279" font-size="14">Avoid both residual congestion and excessive fluid removal.</text></g></svg>