<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 500" role="img"><title>Cardiac cycle • left ventricular pressure-volume loop</title><desc>Schematic: observe which valve opens and which closes at each corner.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6 Z" fill="#475569"/></marker></defs><rect width="840" height="500" rx="18" fill="white"/><rect x="1" y="1" width="838" height="498" rx="18" fill="none" stroke="#cbd5e1"/><rect x="26" y="25" width="8" height="56" rx="4" fill="#0f766e"/><text x="47" y="49" fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start">Cardiac cycle • left ventricular pressure-volume loop</text><text x="47" y="76" fill="#475569" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Schematic: observe which valve opens and which closes at each corner.</text><path d="M95 110 V405 H480" fill="none" stroke="#17324d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="90" y="102" fill="#17324d" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start">Pressure</text><text x="292" y="439" fill="#17324d" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">LV volume →</text><path d="M185 367 Q285 390 405 360 V177 C368 112 256 105 185 160 V367" fill="none" stroke="#0f766e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M254 378 L342 373" stroke="#0f766e" stroke-width="3" fill="none"  marker-end="url(#arrow)"/><path d="M405 315 L405 231" stroke="#0f766e" stroke-width="3" fill="none"  marker-end="url(#arrow)"/><path d="M350 134 L265 126" stroke="#0f766e" stroke-width="3" fill="none"  marker-end="url(#arrow)"/><path d="M185 234 L185 320" stroke="#0f766e" stroke-width="3" fill="none"  marker-end="url(#arrow)"/><text x="181" y="392" fill="#17324d" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">ESV</text><text x="408" y="392" fill="#17324d" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">EDV</text><rect x="500" y="112" width="300" height="65" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><text x="650" y="139" fill="#17324d" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">1  Mitral opens</text><text x="650" y="162" fill="#17324d" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle">Ventricular filling</text><rect x="500" y="189" width="300" height="65" rx="12" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.5"/><text x="650" y="216" fill="#17324d" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">2  Mitral closes (S1)</text><text x="650" y="239" fill="#17324d" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle">Isovolumetric contraction</text><rect x="500" y="266" width="300" height="65" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/><text x="650" y="293" fill="#17324d" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">3  Aortic opens</text><text x="650" y="316" fill="#17324d" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle">Ventricular ejection</text><rect x="500" y="343" width="300" height="65" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/><text x="650" y="370" fill="#17324d" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">4  Aortic closes (S2)</text><text x="650" y="393" fill="#17324d" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle">Isovolumetric relaxation</text><text x="290" y="412" fill="#0f766e" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">← Stroke volume →</text><text x="420" y="485" fill="#475569" font-family="Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle">Original nursing study schematic • not to scale</text></svg>