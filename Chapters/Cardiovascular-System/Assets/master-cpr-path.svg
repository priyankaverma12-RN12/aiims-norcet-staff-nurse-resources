<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 430" role="img"><title>Adult cardiac arrest: rhythm decision</title><desc>High-yield overview, not a replacement for full ACLS protocol.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6 Z" fill="#475569"/></marker></defs><rect width="840" height="430" rx="18" fill="white"/><rect x="1" y="1" width="838" height="428" rx="18" fill="none" stroke="#cbd5e1"/><rect x="26" y="25" width="8" height="56" rx="4" fill="#0f766e"/><text x="47" y="49" fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start">Adult cardiac arrest: rhythm decision</text><text x="47" y="76" fill="#475569" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">High-yield overview, not a replacement for full ACLS protocol.</text><rect x="257" y="103" width="326" height="64" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="420" y="129.5" fill="#17324d" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">No definite pulse</text><text x="420" y="152.5" fill="#17324d" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle">Activate help + CPR</text><path d="M420 167 L420 198" stroke="#17324d" stroke-width="3" fill="none"  marker-end="url(#arrow)"/><rect x="270" y="199" width="300" height="52" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/><text x="420" y="231" fill="#17324d" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Rhythm check</text><path d="M270 225 H204 V271" fill="none" stroke="#b91c1c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M570 225 H636 V271" fill="none" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="40" y="271" width="328" height="67" rx="12" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.5"/><text x="204" y="299" fill="#b91c1c" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">VF / pulseless VT</text><text x="204" y="322" fill="#b91c1c" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle">Defibrillate + resume CPR</text><rect x="472" y="271" width="328" height="67" rx="12" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/><text x="636" y="299" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Asystole / PEA</text><text x="636" y="322" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle">CPR + early epinephrine</text><path d="M204 338 V363 H418" fill="none" stroke="#b91c1c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M636 338 V363 H422" fill="none" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="420" y="389" fill="#17324d" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Reassess rhythm • reversible causes • post-ROSC care if pulse returns</text><text x="420" y="415" fill="#475569" font-family="Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle">Original nursing study schematic • not to scale</text></svg>