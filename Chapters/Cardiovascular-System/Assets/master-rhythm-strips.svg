<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 470" role="img"><title>Recognize four common ECG patterns</title><desc>Illustrative waveforms, not diagnostic recordings.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6 Z" fill="#475569"/></marker></defs><rect width="840" height="470" rx="18" fill="white"/><rect x="1" y="1" width="838" height="468" rx="18" fill="none" stroke="#cbd5e1"/><rect x="26" y="25" width="8" height="56" rx="4" fill="#0f766e"/><text x="47" y="49" fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start">Recognize four common ECG patterns</text><text x="47" y="76" fill="#475569" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Illustrative waveforms, not diagnostic recordings.</text><text x="31" y="123" fill="#17324d" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start">Sinus rhythm</text><rect x="190" y="102" width="619" height="58" rx="7" fill="#fff7f7" stroke="#fecaca" stroke-width="1.5"/><path d="M204 136 h8 q7 -13 14 0 h7 l4 7 l7 -27 l8 33 l6 -13 h8 q12 -20 25 0 h10 M359 136 h8 q7 -13 14 0 h7 l4 7 l7 -27 l8 33 l6 -13 h8 q12 -20 25 0 h10 M514 136 h8 q7 -13 14 0 h7 l4 7 l7 -27 l8 33 l6 -13 h8 q12 -20 25 0 h10 M669 136 h8 q7 -13 14 0 h7 l4 7 l7 -27 l8 33 l6 -13 h8 q12 -20 25 0 h10" fill="none" stroke="#b91c1c" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" /><text x="198" y="179" fill="#475569" font-family="Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">Regular P before each narrow QRS.</text><text x="31" y="211" fill="#17324d" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start">Atrial fibrillation</text><rect x="190" y="190" width="619" height="58" rx="7" fill="#fff7f7" stroke="#fecaca" stroke-width="1.5"/><path d="M200 224 l10 -3 10 5 10 -6 8 4 7 -22 8 3