" text-anchor="start">Chaotic electrical activity; no effective pulse.</text><text x="420" y="455" fill="#475569" font-family="Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle">Original nursing study schematic • not to scale</text></svg>