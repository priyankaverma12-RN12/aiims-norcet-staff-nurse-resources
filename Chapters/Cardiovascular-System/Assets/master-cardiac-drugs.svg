<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 480" role="img"><title>Cardiac drug classes: what to monitor</title><desc>English medical terms and common nursing safety checks.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6 Z" fill="#475569"/></marker></defs><rect width="840" height="480" rx="18" fill="white"/><rect x="1" y="1" width="838" height="478" rx="18" fill="none" stroke="#cbd5e1"/><rect x="26" y="25" width="8" height="56" rx="4" fill="#0f766e"/><text x="47" y="49" fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start">Cardiac drug classes: what to monitor</text><text x="47" y="76" fill="#475569" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">English medical terms and common nursing safety checks.</text><rect x="38" y="104" width="374" height="98" rx="12" fill="#f0fdfa" stroke="#cbd5e1" stroke-width="1.5"/><text x="225" y="130" fill="#17324d" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Beta blocker</text><text x="225" y="156" fill="#0f766e" font-family="Arial, sans-serif" font-size="16" font-weight="600" text-anchor="middle">HR and BP</text><text x="225" y="181" fill="#475569" font-family="Arial, sans-serif" font-size="14" font-weight="500" text-anchor="middle">Bradycardia</text><rect x="428" y="104" width="374" height="98" rx="12" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1.5"/><text x="615" y="130" fill="#17324d" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Nitrate</text><text x="615" y="156" fill="#0f766e" font-family="Arial, sans-serif" font-size="16" font-weight="600" text-anchor="middle">BP and symptoms</text><text x="615" y="181" fill="#475569" font-family="Arial, sans-serif" font-size="14" font-weight="500" text-anchor="middle">PDE5 interaction</text><rect x="38" y="216" width="374" height="98" rx="12" fill="#f0fdfa" stroke="#cbd5e1" stroke-width="1.5"/><text x="225" y="242" fill="#17324d" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Loop diuretic</text><text x="225" y="268" fill="#0f766e" font-family="Arial, sans-serif" font-size="16" font-weight="600" text-anchor="middle">K, Mg, weight</text><text x="225" y="293" fill="#475569" font-family="Arial, sans-serif" font-size="14" font-weight="500" text-anchor="middle">Volume depletion</text><rect x="428" y="216" width="374" height="98" rx="12" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1.5"/><text x="615" y="242" fill="#17324d" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">ACEI / ARB / ARNI</text><text x="615" y="268" fill="#0f766e" font-family="Arial, sans-serif" font-size="16" font-weight="600" text-anchor="middle">K, renal, BP</text><text x="615" y="293" fill="#475569" font-family="Arial, sans-serif" font-size="14" font-weight="500" text-anchor="middle">Hyperkalemia</text><rect x="38" y="328" width="374" height="98" rx="12" fill="#f0fdfa" stroke="#cbd5e1" stroke-width="1.5"/><text x="225" y="354" fill="#17324d" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Digoxin</text><text x="225" y="380" fill="#0f766e" font-family="Arial, sans-serif" font-size="16" font-weight="600" text-anchor="middle">Pulse, K, renal</text><text x="225" y="405" fill="#475569" font-family="Arial, sans-serif" font-size="14" font-weight="500" text-anchor="middle">Toxicity / arrhythmia</text><rect x="428" y="328" width="374" height="98" rx="12" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1.5"/><text x="615" y="354" fill="#17324d" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Anticoagulant</text><text x="615" y="380" fill="#0f766e" font-family="Arial, sans-serif" font-size="16" font-weight="600" text-anchor="middle">Bleeding, labs as ordered</text><text x="6