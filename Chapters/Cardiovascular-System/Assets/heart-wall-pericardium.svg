<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350"><rect width="100%" height="100%" fill="#f8fafc"/><g font-family="Arial,sans-serif" font-size="17" fill="#172b43"><text x="25" y="30" font-size="22" font-weight="bold">Heart wall and coverings — outside to inside</text><rect x="28" y="48" width="275" height="34" rx="3" fill="#94a3b8"/><path d="M303 65 H340" stroke="#64748b"/><text x="350" y="71">Fibrous pericardium</text><rect x="28" y="85" width="275" height="24" rx="3" fill="#b8c7d8"/><path d="M303 97 H340" stroke="#64748b"/><text x="350" y="103">Parietal serous layer</text><rect x="28" y="112" width="275" height="38" rx="3" fill="#bfdbfe"/><path d="M303 131 H340" stroke="#64748b"/><text x="350" y="137">Pericardial cavity (15–50 mL)</text><rect x="28" y="153" width="275" height="24" rx="3" fill="#f5c76b"/><path d="M303 165 H340" stroke="#64748b"/><text x="350" y="171">Epicardium / visceral layer</text><rect x="28" y="180" width="275" height="92" rx="3" fill="#d47777"/><path d="M303 226 H340" stroke="#64748b"/><text x="350" y="232">Myocardium</text><rect x="28" y="275" width="275" height="20" rx="3" fill="#f4b9b4"/><path d="M303 285 H340" stroke="#64748b"/><text x="350" y="291">Endocardium</text><rect x="28" y="298" width="275" height="26" rx="3" fill="#fde8e7"/><path d="M303 311 H340" stroke="#64748b"/><text x="350" y="317">Heart chamber</text></g></svg>