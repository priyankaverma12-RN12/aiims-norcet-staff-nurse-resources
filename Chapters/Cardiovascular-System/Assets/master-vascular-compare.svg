<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 415" role="img"><title>Arterial versus venous leg disease</title><desc>Typical exam patterns; individual findings can overlap.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6 Z" fill="#475569"/></marker></defs><rect width="840" height="415" rx="18" fill="white"/><rect x="1" y="1" width="838" height="413" rx="18" fill="none" stroke="#cbd5e1"/><rect x="26" y="25" width="8" height="56" rx="4" fill="#0f766e"/><text x="47" y="49" fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start">Arterial versus venous leg disease</text><text x="47" y="76" fill="#475569" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Typical exam patterns; individual findings can overlap.</text><rect x="40" y="105" width="365" height="58" rx="12" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.5"/><text x="222.5" y="128.5" fill="#b91c1c" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">ARTERIAL (PAD)</text><text x="222.5" y="151.5" fill="#b91c1c" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle">Reduced delivery</text><rect x="435" y="105" width="365" height="58" rx="12" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/><text x="617.5" y="128.5" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">VENOUS INSUFFICIENCY</text><text x="617.5" y="151.5" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle">Poor return</text><path d="M130 184 H250 L232 285 H300 Q329 285 329 302 Q329 316 290 316 H152Z" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><path d="M540 184 H660 L654 285 H704 Q740 287 740 304 Q740 321 697 321 H546Z" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><circle cx="310" cy="300" r="9" fill="#991b1b"/><ellipse cx="571" cy="278" rx="18" ry="11" fill="#92400e"/><path d="M185 196 V263" fill="none" stroke="#b91c1c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M605 270 V199" fill="none" stroke="#1d4ed8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="220" y="345" fill="#475569" font-family="Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Cool • weak pulses • distal ulcers</text><text x="620" y="345" fill="#475569" font-family="Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Edema • pigmentation • gaiter ulcers</text><text x="420" y="388" fill="#17324d" font-family="Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Do not massage a suspected DVT or apply tight compression to acute ischemia.</text><text x="420" y="400" fill="#475569" font-family="Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle">Original nursing study schematic • not to scale</text></svg>