<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 430" role="img"><title>Four types of shock</title><desc>Think about volume, pump, vascular tone and obstruction.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6 Z" fill="#475569"/></marker></defs><rect width="840" height="430" rx="18" fill="white"/><rect x="1" y="1" width="838" height="428" rx="18" fill="none" stroke="#cbd5e1"/><rect x="26" y="25" width="8" height="56" rx="4" fill="#0f766e"/><text x="47" y="49" fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start">Four types of shock</text><text x="47" y="76" fill="#475569" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Think about volume, pump, vascular tone and obstruction.</text><rect x="35" y="105" width="370" height="125" rx="12" fill="#fef3c7" stroke="#94a3b8" stroke-width="1.5"/><text x="220" y="135" fill="#17324d" font-family="Arial, sans-serif" font-size="23" font-weight="700" text-anchor="middle">Hypovolemic</text><text x="220" y="167" fill="#17324d" font-family="Arial, sans-serif" font-size="18" font-weight="600" text-anchor="middle">Low circulating volume</text><text x="220" y="196" fill="#475569" font-family="Arial, sans-serif" font-size="16" font-weight="500" text-anchor="middle">Bleeding / fluid loss</text><rect x="425" y="105" width="370" height="125" rx="12" fill="#fee2e2" stroke="#94a3b8" stroke-width="1.5"/><text x="610" y="135" fill="#17324d" font-family="Arial, sans-serif" font-size="23" font-weight="700" text-anchor="middle">Cardiogenic</text><text x="610" y="167" fill="#17324d" font-family="Arial, sans-serif" font-size="18" font-weight="600" text-anchor="middle">Pump failure</text><text x="610" y="196" fill="#475569" font-family="Arial, sans-serif" font-size="16" font-weight="500" text-anchor="middle">MI / severe HF</text><rect x="35" y="250" width="370" height="125" rx="12" fill="#ccfbf1" stroke="#94a3b8" stroke-width="1.5"/><text x="220" y="280" fill="#17324d" font-family="Arial, sans-serif" font-size="23" font-weight="700" text-anchor="middle">Distributive</text><text x="220" y="312" fill="#17324d" font-family="Arial, sans-serif" font-size="18" font-weight="600" text-anchor="middle">Loss of vascular tone</text><text x="220" y="341" fill="#475569" font-family="Arial, sans-serif" font-size="16" font-weight="500" text-anchor="middle">Sepsis / anaphylaxis</text><rect x="425" y="250" width="370" height="125" rx="12" fill="#dbeafe" stroke="#94a3b8" stroke-width="1.5"/><text x="610" y="280" fill="#17324d" font-family="Arial, sans-serif" font-size="23" font-weight="700" text-anchor="middle">Obstructive</text><text x="610" y="312" fill="#17324d" font-family="Arial, sans-serif" font-size="18" font-weight="600" text-anchor="middle">Blocked flow or filling</text><text x="610" y="341" fill="#475569" font-family="Arial, sans-serif" font-size="16" font-weight="500" text-anchor="middle">PE / tamponade</text><text x="420" y="404" fill="#17324d" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Priority: ABC, urgent escalation, identify cause, reassess tissue perfusion.</text><text x="420" y="415" fill="#475569" font-family="Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle">Original nursing study schematic • not to scale</text></svg>