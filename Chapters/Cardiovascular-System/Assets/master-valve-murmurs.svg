<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 430" role="img"><title>Valve murmurs: systole or diastole?</title><desc>S1 to S2 = ventricular systole; S2 to next S1 = diastole.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6 Z" fill="#475569"/></marker></defs><rect width="840" height="430" rx="18" fill="white"/><rect x="1" y="1" width="838" height="428" rx="18" fill="none" stroke="#cbd5e1"/><rect x="26" y="25" width="8" height="56" rx="4" fill="#0f766e"/><text x="47" y="49" fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start">Valve murmurs: systole or diastole?</text><text x="47" y="76" fill="#475569" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">S1 to S2 = ventricular systole; S2 to next S1 = diastole.</text><rect x="190" y="110" width="285" height="42" rx="12" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5"/><rect x="475" y="110" width="315" height="42" rx="12" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/><text x="332" y="137" fill="#17324d" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">SYSTOLE</text><text x="631" y="137" fill="#17324d" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">DIASTOLE</text><line x1="190" y1="104" x2="190" y2="368" stroke="#64748b" stroke-dasharray="5 5"/><text x="190" y="97" fill="#17324d" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">S1</text><line x1="475" y1="104" x2="475" y2="368" stroke="#64748b" stroke-dasharray="5 5"/><text x="475" y="97" fill="#17324d" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">S2</text><line x1="790" y1="104" x2="790" y2="368" stroke="#64748b" stroke-dasharray="5 5"/><text x="790" y="97" fill="#17324d" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">S1</text><text x="25" y="196" fill="#17324d" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start">Aortic stenosis</text><path d="M207 190 Q315 144 458 190 Q315 234 207 190" fill="#f59e0b" opacity=".75"/><text x="25" y="251" fill="#17324d" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start">Mitral regurg.</text><rect x="205" y="231" width="255" height="28" rx="3" fill="#f59e0b" stroke="#d97706" stroke-width="1.5"/><text x="25" y="306" fill="#17324d" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start">Aortic regurg.</text><path d="M492 277 L760 300 L492 323 Z" fill="#60a5fa"/><text x="25" y="361" fill="#17324d" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start">Mitral stenosis</text><path d="M530 355 Q590 332 650 355 Q720 323 770 355 Q710 382 650 355 Q590 375 530 355" fill="#60a5fa" opacity=".8"/><text x="420" y="402" fill="#475569" font-family="Arial, sans-serif" font-size="14" font-weight="500" text-anchor="middle">Classic schematic contours; real intensity and timing vary.</text><text x="420" y="415" fill="#475569" font-family="Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle">Original nursing study schematic • not to scale</text></svg>