<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330"><rect width="100%" height="100%" fill="#f8fafc"/><g font-family="Arial,sans-serif" font-size="16" fill="#19324a"><text x="25" y="30" font-size="22" font-weight="bold">Valve states: filling vs ejection</text><text x="35" y="75" font-weight="bold">Ventricular filling</text><rect x="35" y="100" width="320" height="55" rx="9" fill="#d8f1db" stroke="#64748b"/><text x="195" y="132.5" text-anchor="middle">AV valves: OPEN</text><rect x="35" y="175" width="320" height="55" rx="9" fill="#fbd8d8" stroke="#64748b"/><text x="195" y="207.5" text-anchor="middle">Semilunar: CLOSED</text><text x="400" y="75" font-weight="bold">Ventricular ejection</text><rect x="400" y="100" width="320" height="55" rx="9" fill="#fbd8d8" stroke="#64748b"/><text x="560" y="132.5" text-anchor="middle">AV valves: CLOSED</text><rect x="400" y="175" width="320" height="55" rx="9" fill="#d8f1db" stroke="#64748b"/><text x="560" y="207.5" text-anchor="middle">Semilunar: OPEN</text><text x="35" y="290">Isovolumetric contraction and relaxation: all four valves closed.</text></g></svg>