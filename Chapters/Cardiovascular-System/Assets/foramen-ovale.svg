<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330"><rect width="100%" height="100%" fill="#f8fafc"/><g font-family="Arial,sans-serif" font-size="16" fill="#19324a"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#475569"/></marker></defs><text x="25" y="30" font-size="22" font-weight="bold">Foramen ovale: fetal passage and adult remnant</text><rect x="35" y="95" width="145" height="90" rx="9" fill="#cde5fa" stroke="#64748b"/><text x="107.5" y="145" text-anchor="middle">RA</text><rect x="240" y="95" width="145" height="90" rx="9" fill="#fbd8d8" stroke="#64748b"/><text x="312.5" y="145" text-anchor="middle">LA</text><path d="M180 140 L240 140" stroke="#475569" stroke-width="2" marker-end="url(#arr)" fill="none"/><text x="210" y="80" text-anchor="middle">Fetal opening</text><rect x="430" y="95" width="145" height="90" rx="9" fill="#cde5fa" stroke="#64748b"/><text x="502.5" y="145" text-anchor="middle">RA</text><rect x="585" y="95" width="145" height="90" rx="9" fill="#fbd8d8" stroke="#64748b"/><text x="657.5" y="145" text-anchor="middle">LA</text><path d="M580 93V188" stroke="#64748b" stroke-width="5"/><ellipse cx="572" cy="140" rx="7" ry="19" fill="#8796a6"/><text x="580" y="215" text-anchor="middle">Fossa ovalis (depression)</text><text x="35" y="270">After birth: lung flow increases → LA pressure exceeds RA → flap closes.</text><text x="35" y="300">Anatomical fusion can occur later; incomplete fusion = PFO.</text></g></svg>