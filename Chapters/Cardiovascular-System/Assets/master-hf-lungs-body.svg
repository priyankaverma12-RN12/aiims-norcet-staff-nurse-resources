<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 435" role="img"><title>Heart failure: backward congestion</title><desc>Left-sided and right-sided failure may coexist.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6 Z" fill="#475569"/></marker></defs><rect width="840" height="435" rx="18" fill="white"/><rect x="1" y="1" width="838" height="433" rx="18" fill="none" stroke="#cbd5e1"/><rect x="26" y="25" width="8" height="56" rx="4" fill="#0f766e"/><text x="47" y="49" fill="#17324d" font-family="Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start">Heart failure: backward congestion</text><text x="47" y="76" fill="#475569" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Left-sided and right-sided failure may coexist.</text><rect x="45" y="105" width="350" height="55" rx="12" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.5"/><text x="220" y="138.5" fill="#b91c1c" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">LEFT HEART FAILURE</text><rect x="445" y="105" width="350" height="55" rx="12" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/><text x="620" y="138.5" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">RIGHT HEART FAILURE</text><path d="M220 160 V190" fill="none" stroke="#b91c1c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M620 160 V190" fill="none" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M205 193 C160 168 115 220 119 279 C120 311 158 315 200 291 L205 193 M235 193 C280 168 325 220 321 279 C320 311 282 315 240 291Z" fill="#fecaca" stroke="#b91c1c" stroke-width="2"/><path d="M220 187 V245 M220 215 L177 257 M220 215 L263 257" stroke="#64748b" stroke-width="5" fill="none"/><circle cx="620" cy="207" r="24" fill="#bfdbfe" stroke="#1d4ed8"/><path d="M585 242 Q620 229 655 242 L674 295 H649 L649 317 H631 L620 281 L609 317 H591 V295 H566Z" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><ellipse cx="599" cy="310" rx="21" ry="9" fill="#93c5fd"/><ellipse cx="642" cy="310" rx="21" ry="9" fill="#93c5fd"/><text x="220" y="337" fill="#b91c1c" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Pulmonary congestion</text><text x="220" y="361" fill="#475569" font-family="Arial, sans-serif" font-size="15" font-weight="500" text-anchor="middle">Dyspnea • orthopnea • crackles</text><text x="620" y="337" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Systemic venous congestion</text><text x="620" y="361" fill="#475569" font-family="Arial, sans-serif" font-size="15" font-weight="500" text-anchor="middle">Raised JVP • edema • ascites</text><text x="420" y="402" fill="#17324d" font-family="Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Forward failure: reduced tissue perfusion → fatigue, oliguria, cold extremities</text><text x="420" y="420" fill="#475569" font-family="Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle">Original nursing study schematic • not to scale</text></svg>