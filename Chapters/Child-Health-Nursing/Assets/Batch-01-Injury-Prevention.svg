<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" role="img" aria-labelledby="t d"><title id="t">Childhood injury prevention layers</title><desc id="d">Identify age-specific hazards, remove or separate hazards, supervise actively, and prepare caregivers to respond.</desc><rect width="760" height="340" fill="#fff"/><g font-family="Arial,sans-serif" fill="#17354a" text-anchor="middle"><text x="380" y="36" font-size="23" font-weight="bold">Prevent injuries before they occur</text><g stroke="#3d7480" stroke-width="2"><rect x="30" y="65" width="700" height="52" rx="10" fill="#e5f3f3"/><rect x="70" y="132" width="620" height="52" rx="10" fill="#e9eff7"/><rect x="110" y="199" width="540" height="52" rx="10" fill="#e5f3f3"/><rect x="150" y="266" width="460" height="52" rx="10" fill="#fff0db"/></g><g font-size="17" font-weight="bold"><text x="380" y="87">1. Anticipate the developmental risk</text><text x="380" y="154">2. Remove or isolate the hazard</text><text x="380" y="221">3. Provide active supervision</text><text x="380" y="288">4. Prepare and check understanding</text></g><g font-size="13"><text x="380" y="106">Rolling, reaching, climbing, exploring and road exposure</text><text x="380" y="173">Secure medicines, fuels, furniture and water access</text><text x="380" y="240">Near water, during feeding and during play</text><text x="380" y="307">Emergency contacts, clear plan and teach-back</text></g></g></svg>