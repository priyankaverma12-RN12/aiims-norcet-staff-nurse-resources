<svg xmlns="http://www.w3.org/2000/svg" width="860" height="410" viewBox="0 0 860 410" role="img" aria-labelledby="title"><title id="title">Intussusception nursing pathway</title><rect width="860" height="410" fill="#f8fafc"/><text x="430" y="43" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#12344a">Intussusception — clinical reasoning</text><rect x="85" y="65" width="690" height="55" rx="10" fill="#e6eef9" stroke="#305c75"/><text x="430" y="99" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#12344a">Telescoping bowel</text><path d="M430 120 v19 l-6 -7 m6 7 l6 -7" fill="none" stroke="#305c75" stroke-width="2"/><rect x="85" y="147" width="690" height="55" rx="10" fill="#e1f2ee" stroke="#305c75"/><text x="430" y="181" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#12344a">Intermittent pain / pallor</text><path d="M430 202 v19 l-6 -7 m6 7 l6 -7" fill="none" stroke="#305c75" stroke-width="2"/><rect x="85" y="229" width="690" height="55" rx="10" fill="#e6eef9" stroke="#305c75"/><text x="430" y="263" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#12344a">Urgent ultrasound + surgical review</text><path d="M430 284 v19 l-6 -7 m6 7 l6 -7" fill="none" stroke="#305c75" stroke-width="2"/><rect x="85" y="311" width="690" height="55" rx="10" fill="#e1f2ee" stroke="#305c75"/><text x="430" y="345" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#12344a">Reduction if eligible; surgery if indicated</text><text x="430" y="400" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#405668">Educational schematic • Individual clinical orders take precedence</text></svg>
