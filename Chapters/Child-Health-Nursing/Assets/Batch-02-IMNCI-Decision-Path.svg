<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d"><title id="t">IMNCI health-worker decision sequence</title><desc id="d">General danger sign check, urgent action where indicated, classification, treatment, follow-up and preventive review.</desc><rect width="960" height="420" fill="#ffffff"/><g font-family="Arial,sans-serif" fill="#172d41"><text x="40" y="48" font-size="28" font-weight="700">IMNCI: assess first, classify next</text><rect x="40" y="76" width="880" height="58" rx="12" fill="#eaf3fb" stroke="#35576e" stroke-width="1.5"/><text x="60" y="111" font-size="22" font-weight="700">1  General danger signs and immediate clinical urgency</text><path d="M480 134v15H250v16 M244 157l6 8 6-8 M480 149H710v16 M704 157l6 8 6-8" fill="none" stroke="#35576e" stroke-width="3"/><rect x="40" y="170" width="420" height="85" rx="12" fill="#ffe9e5" stroke="#35576e" stroke-width="1.5"/><text x="58" y="204" font-size="20" font-weight="700">Severe / referral classification</text><text x="58" y="231" font-size="18" font-weight="400">Urgent support and prompt referral</text><rect x="500" y="170" width="420" height="85" rx="12" fill="#e5f4e9" stroke="#35576e" stroke-width="1.5"/><text x="518" y="204" font-size="20" font-weight="700">Nonsevere classification</text><text x="518" y="231" font-size="18" font-weight="400">Use the role-specific treatment chart</text><path d="M710 255v26H480v17 M474 290l6 8 6-8" fill="none" stroke="#35576e" stroke-width="3"/><rect x="40" y="304" width="880" height="76" rx="12" fill="#f4f5f7" stroke="#35576e" stroke-width="1.5"/><text x="60" y="335" font-size="21" font-weight="700">2  Nonurgent care: reassess, counsel and arrange follow-up</text><text x="60" y="361" font-size="18" font-weight="400">New danger signs need immediate review. Never delay urgent referral.</text></g></svg>
