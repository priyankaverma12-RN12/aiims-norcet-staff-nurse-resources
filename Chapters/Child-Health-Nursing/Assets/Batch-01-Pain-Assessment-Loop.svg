<svg xmlns="http://www.w3.org/2000/svg" width="760" height="370" viewBox="0 0 760 370" role="img" aria-labelledby="t d"><title id="t">Pediatric pain assessment and reassessment loop</title><desc id="d">Choose an appropriate validated tool, assess pain, act and reassess, document and escalate if indicated. Urgent deterioration requires immediate escalation.</desc><rect width="760" height="370" fill="#fff"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#17354a"><text x="380" y="32" font-size="23" font-weight="bold">Pediatric pain: assess, act, reassess</text><g stroke="#417b86" stroke-width="2" fill="#edf7f7"><rect x="25" y="65" width="330" height="79" rx="10"/><rect x="405" y="65" width="330" height="79" rx="10"/><rect x="405" y="190" width="330" height="79" rx="10"/><rect x="25" y="190" width="330" height="79" rx="10"/></g><g font-size="17" font-weight="bold"><text x="190" y="91">Choose an appropriate tool</text><text x="570" y="91">Assess and record baseline</text><text x="570" y="216">Intervene safely</text><text x="190" y="216">Reassess and document</text></g><g font-size="14"><text x="190" y="115">Self-report if reliable, otherwise</text><text x="190" y="132">validated behavioral tool</text><text x="570" y="115">Site, score, behavior, function</text><text x="570" y="132">and caregiver observations</text><text x="570" y="240">Comfort and prescribed treatment</text><text x="570" y="257">with safety monitoring</text><text x="190" y="240">Same tool if appropriate, record</text><text x="190" y="257">response and adverse effects</text></g><g stroke="#417b86" stroke-width="2" fill="none"><path d="M355 104h49m-10-6 10 6-10 6 M570 144v45m-6-10 6 10 6-10 M405 230h-49m10-6-10 6 10 6 M190 190v-45m-6 10 6-10 6 10"/></g><rect x="40" y="300" width="680" height="45" rx="10" fill="#fff0db"/><text x="380" y="327" font-size="15" font-weight="bold">Urgent clinical deterioration → immediate assessment and escalation</text></g></svg>