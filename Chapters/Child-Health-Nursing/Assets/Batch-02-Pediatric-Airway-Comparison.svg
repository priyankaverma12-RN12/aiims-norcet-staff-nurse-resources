<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d"><title id="t">Croup, bronchiolitis and distal TEF</title><desc id="d">Simplified upper airway swelling, small-airway narrowing and a blind esophageal pouch with a distal fistula. Not a procedural diagram.</desc><rect width="960" height="420" fill="#ffffff"/><g font-family="Arial,sans-serif" fill="#172d41"><text x="40" y="48" font-size="28" font-weight="700">Three pediatric respiratory patterns</text><rect x="40" y="77" width="280" height="301" rx="12" fill="#f4f8fb" stroke="#35576e" stroke-width="1.5"/><text x="56" y="108" font-size="22" font-weight="700">Croup</text><text x="56" y="321" font-size="17" font-weight="700">Upper airway edema</text><text x="56" y="347" font-size="13" font-weight="400">Bark, hoarseness, stridor</text><rect x="340" y="77" width="280" height="301" rx="12" fill="#f4f8fb" stroke="#35576e" stroke-width="1.5"/><text x="356" y="108" font-size="22" font-weight="700">Bronchiolitis</text><text x="356" y="321" font-size="17" font-weight="700">Small airway edema / mucus</text><text x="356" y="347" font-size="13" font-weight="400">Wheeze, crackles, feeding difficulty</text><rect x="640" y="77" width="280" height="301" rx="12" fill="#f4f8fb" stroke="#35576e" stroke-width="1.5"/><text x="656" y="108" font-size="22" font-weight="700">EA + distal TEF</text><text x="656" y="321" font-size="17" font-weight="700">Blind upper esophageal pouch</text><text x="656" y="347" font-size="13" font-weight="400">Distal esophagus joins trachea</text><path d="M145 130v45q22 15 22 40v70M195 130v45q-22 15-22 40v70" fill="none" stroke="#35576e" stroke-width="8" stroke-linecap="round"/><path d="M149 179l16 21M191 179l-16 21" stroke="#d76953" stroke-width="11" stroke-linecap="round"/><path d="M480 130v65m0 0l-70 85m70-85l70 85m-70-85v85" stroke="#35576e" stroke-width="16" stroke-linecap="round" fill="none"/><path d="M429 258l-15 18M480 251v26M530 258l15 18" stroke="#d76953" stroke-