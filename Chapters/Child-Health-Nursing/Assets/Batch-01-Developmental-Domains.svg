<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" role="img" aria-labelledby="t d"><title id="t">Developmental surveillance domains</title><desc id="d">Four domains are observed together and followed by screening, assessment or referral when concerns arise.</desc><rect width="760" height="390" fill="#fff"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#17354a"><text x="380" y="35" font-size="23" font-weight="bold">Developmental surveillance</text><g stroke="#417b86" fill="#edf7f7" stroke-width="2"><rect x="25" y="72" width="165" height="90" rx="10"/><rect x="207" y="72" width="165" height="90" rx="10"/><rect x="389" y="72" width="165" height="90" rx="10"/><rect x="571" y="72" width="165" height="90" rx="10"/></g><g font-size="16" font-weight="bold"><text x="107" y="103">Movement</text><text x="289" y="103">Language</text><text x="471" y="103">Cognitive</text><text x="653" y="103">Social/emotional</text></g><g font-size="14"><text x="107" y="133">Gross + fine motor</text><text x="289" y="133">Listening + speech</text><text x="471" y="133">Learning + solving</text><text x="653" y="133">Interaction + play</text></g><g stroke="#417b86" stroke-width="2" fill="none"><path d="M107 162V190H380V216 M289 162V190 M471 162V190H380 M653 162V190H471"/><path d="M374 208l6 9 6-9"/></g><rect x="160" y="217" width="440" height="62" rx="10" fill="#dbe9f2"/><text x="380" y="242" font-size="17" font-weight="bold">Ask, observe, document, listen to family</text><text x="380" y="264" font-size="14">Milestone checklist is not a diagnostic test</text><path d="M380 279v25m-6-8 6 9 6-9" stroke="#417b86" stroke-width="2" fill="none"/><rect x="160" y="306" width="440" height="57" rx="10" fill="#fff0db"/><text x="380" y="329" font-size="16" font-weight="bold">Concern or lost skill?</text><text x="380" y="350" font-size="14">Timely screening, clinical assessment and referral</text></g></svg>