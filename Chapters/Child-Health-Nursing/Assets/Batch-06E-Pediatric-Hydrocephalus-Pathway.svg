<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title"><title id="title">Pediatric Hydrocephalus clinical reasoning</title><rect width="960" height="430" fill="#ffffff"/><g font-family="Arial,sans-serif" fill="#18334a"><text x="480" y="42" text-anchor="middle" font-size="25" font-weight="700">Pediatric Hydrocephalus — nursing pathway</text><rect x="90" y="65" width="780" height="54" rx="10" fill="#eaf3fb" stroke="#42667d"/><text x="480" y="99" text-anchor="middle" font-size="19">Age-specific head growth and neurological signs</text><path d="M480 119v24m-7-9 7 9 7-9" fill="none" stroke="#42667d" stroke-width="3"/><rect x="90" y="148" width="780" height="54" rx="10" fill="#e5f4e9" stroke="#42667d"/><text x="480" y="182" text-anchor="middle" font-size="19">Imaging and cause-specific CSF pathway</text><path d="M480 202v24m-7-9 7 9 7-9" fill="none" stroke="#42667d" stroke-width="3"/><rect x="90" y="231" width="780" height="54" rx="10" fill="#eaf3fb" stroke="#42667d"/><text x="480" y="265" text-anchor="middle" font-size="19">Shunt or ETV under specialist plan</text><path d="M480 285v24m-7-9 7 9 7-9" fill="none" stroke="#42667d" stroke-width="3"/><rect x="90" y="314" width="780" height="54" rx="10" fill="#e5f4e9" stroke="#42667d"/><text x="480" y="348" text-anchor="middle" font-size="19">Monitor device, symptoms and development</text><text x="480" y="407" text-anchor="middle" font-size="15">Original educational schematic • Follow individualized specialist orders.</text></g></svg>
