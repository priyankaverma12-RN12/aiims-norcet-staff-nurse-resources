<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d"><title id="t">Pediatric vaccination session safety</title><desc id="d">Four safety stages: eligibility, preparation, administration, observation and reporting.</desc><rect width="960" height="420" fill="#ffffff"/><g font-family="Arial,sans-serif" fill="#172d41"><text x="40" y="48" font-size="28" font-weight="700">UIP: safe vaccination session</text><rect x="40" y="76" width="880" height="61" rx="12" fill="#eaf3fb" stroke="#35576e" stroke-width="1.5"/><text x="58" y="101" font-size="20" font-weight="700">1  Eligibility</text><text x="310" y="101" font-size="18" font-weight="400">Age, records, intervals, contraindications</text><path d="M480 137v16" stroke="#35576e" stroke-width="2"/><rect x="40" y="153" width="880" height="61" rx="12" fill="#e5f4e9" stroke="#35576e" stroke-width="1.5"/><text x="58" y="178" font-size="20" font-weight="700">2  Preparation</text><text x="310" y="178" font-size="18" font-weight="400">Correct product, matched diluent, expiry</text><path d="M480 214v16" stroke="#35576e" stroke-width="2"/><rect x="40" y="230" width="880" height="61" rx="12" fill="#fff1d8" stroke="#35576e" stroke-width="1.5"/><text x="58" y="255" font-size="20" font-weight="700">3  Administration</text><text x="310" y="255" font-size="18" font-weight="400">Correct dose, route and site; record</text><path d="M480 291v16" stroke="#35576e" stroke-width="2"/><rect x="40" y="307" width="880" height="61" rx="12" fill="#ffe9e5" stroke="#35576e" stroke-width="1.5"/><text x="58" y="332" font-size="20" font-weight="700">4  After the dose</text><text x="310" y="332" font-size="18" font-weight="400">Observe, counsel, report suspected AEFI</text><text x="40" y="403" font-size="16" font-weight="400">Use the current local schedule, product instructions and emergency protocol.</text></g></svg>
