<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="t d"><title id="t">RBSK 2.0 closed-loop pediatric referral</title><desc id="d">Screening leads to appropriate referral, evaluation, intervention and a documented return plan with family follow-up. Urgent illness requires immediate clinical escalation.</desc><rect width="960" height="440" fill="#fff"/><g font-family="Arial,sans-serif" fill="#18334a"><text x="40" y="42" font-size="27" font-weight="700">RBSK 2.0: continuity beyond screening</text><rect x="40" y="68" width="880" height="58" rx="10" fill="#fff0df" stroke="#a66022"/><text x="60" y="92" font-size="18" font-weight="700">Urgent clinical concern?</text><text x="60" y="114" font-size="16">Escalate immediately by clinical need. Do not wait for routine programme processing.</text><rect x="40" y="157" width="264" height="85" rx="10" fill="#eaf3fb" stroke="#42667d"/><text x="55" y="185" font-size="20" font-weight="700">1. Identify concern</text><text x="55" y="210" font-size="15">Record findings and arrange</text><text x="55" y="230" font-size="15">an appropriate referral.</text><rect x="348" y="157" width="264" height="85" rx="10" fill="#e5f4e9" stroke="#42667d"/><text x="363" y="185" font-size="20" font-weight="700">2. Evaluate at DEIC</text><text x="363" y="210" font-size="15">Confirm needs and coordinate</text><text x="363" y="230" font-size="15">individualized services.</text><rect x="656" y="157" width="264" height="85" rx="10" fill="#eaf3fb" stroke="#42667d"/><text x="671" y="185" font-size="20" font-weight="700">3. Link specialist care</text><text x="671" y="210" font-size="15">When indicated, arrange</text><text x="671" y="230" font-size="15">higher-level care.</text><path d="M304 200h44m-9-7 9 7-9 7M612 200h44m-9-7 9 7-9 7M788 242v48h-80m9-7-9 7 9 7M480 242v48m-7-9 7 9 7-9" fill="none" stroke="#42667d" stroke-width="3"/><rect x="252" y="290" width="456" height="84" rx="10" fill="#f2ecfa" stroke="#42667d"/><text x="272" y="317" font-size="20" font-weight="700">4. Close the referral loop</text><text x="272" y="342" font-size="16">Document treatment and follow-up. Support family</text><text x="272" y="362" font-size="16">home activities and trace missed reviews.</text><path d="M252 332H171v-90m-7 9 7-9 7 9" fill="none" stroke="#42667d" stroke-width="3" stroke-dasharray="7 5"/><text x="40" y="410" font-size="16">Original learning schematic. Use authorized local pathways and individual clinical needs.</text></g></svg>
