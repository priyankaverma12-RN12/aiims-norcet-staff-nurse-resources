<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc"><title id="title">Lower-limb amputation levels</title><desc id="desc">Schematic leg showing hip disarticulation, transfemoral, knee disarticulation, transtibial and Syme ankle disarticulation. Not to scale.</desc><rect width="720" height="420" rx="16" fill="#f6f8fb"/><g font-family="Arial,sans-serif" fill="#17334b"><text x="24" y="34" font-size="22" font-weight="bold">Lower-limb amputation levels</text><text x="24" y="57" font-size="13">Teaching schematic • not to scale</text><path d="M85 80 Q65 104 86 130 L108 151 L119 235 L111 251 L120 347 L114 369 Q117 389 169 387 L192 379 Q194 369 165 365 L149 350 L151 255 L140 235 L159 150 Q178 113 156 80Z" fill="#dbeafe" stroke="#456b8c" stroke-width="2"/><circle cx="125" cy="120" r="10" fill="#fff" stroke="#456b8c"/><circle cx="135" cy="243" r="9" fill="#fff" stroke="#456b8c"/><circle cx="134" cy="352" r="7" fill="#fff" stroke="#456b8c"/><g stroke="#af4050" stroke-width="2" stroke-dasharray="6 4"><path d="M75 120H240"/><path d="M95 185H240"/><path d="M102 243H240"/><path d="M109 300H240"/><path d="M110 352H240"/></g><g font-size="16"><text x="254" y="125">Hip disarticulation — hip joint</text><text x="254" y="190">Transfemoral — above knee</text><text x="254" y="248">Knee disarticulation — knee joint</text><text x="254" y="305">Transtibial — below knee</text><text x="254" y="357">Syme — ankle joint</text><text x="254" y="378" font-size="12">Viable heel pad retained for distal coverage</text></g></g></svg>