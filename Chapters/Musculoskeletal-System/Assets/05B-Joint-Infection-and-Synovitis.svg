<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-label="Septic arthritis and synovitis assessment"><rect width="760" height="330" rx="14" fill="#f5f8fa"/><g font-family="Arial,sans-serif" fill="#17334b"><text x="28" y="33" font-size="22" font-weight="bold">A swollen joint: separate mechanism from cause</text><rect x="225" y="53" width="310" height="45" rx="9" fill="#e0edf5" stroke="#55778c"/><text x="380" y="81" text-anchor="middle" font-size="17">Pain, swelling, limited movement</text><path d="M380 98 V119 H190 V139 M380 119 H570 V139" fill="none" stroke="#55778c" stroke-width="2"/><rect x="24" y="139" width="332" height="143" rx="10" fill="#fff1ef" stroke="#c46a60"/><rect x="404" y="139" width="332" height="143" rx="10" fill="#eef5ff" stroke="#7396bf"/><text x="42" y="166" font-size="18" font-weight="bold">Suspected infection</text><text x="422" y="166" font-size="18" font-weight="bold">Other synovial inflammation</text><g font-size="14"><text x="42" y="194">Urgent assessment and aspiration</text><text x="42" y="217">Culture, cell count, crystal analysis</text><text x="42" y="240">Antibiotics and drainage as indicated</text><text x="422" y="194">Reactive, autoimmune, crystal, blood</text><text x="422" y="217">Determine cause and disease activity</text><text x="422" y="240">Injection only when appropriate</text></g><text x="380" y="310" text-anchor="middle" font-size="14" font-weight="bold">Crystals or absent fever do not exclude infection.</text></g></svg>