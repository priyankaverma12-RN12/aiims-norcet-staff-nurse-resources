<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 370" role="img" aria-labelledby="title desc"><title id="title">Sprain, strain and contusion</title><desc id="desc">Original schematic comparing ligament injury, muscle or tendon injury, and blunt impact injury. Not a diagnostic tool.</desc><rect width="780" height="370" rx="16" fill="#f6f8fb"/><g font-family="Arial,sans-serif" fill="#163144"><text x="390" y="33" text-anchor="middle" font-size="22" font-weight="bold">Soft-tissue injuries: primary structures</text><text x="390" y="56" text-anchor="middle" font-size="13">Schematic comparison, not to scale</text><rect x="20" y="78" width="240" height="232" rx="12" fill="#fff" stroke="#b1c3d0"/><text x="140" y="108" text-anchor="middle" font-size="18" font-weight="bold">Sprain</text><rect x="56" y="137" width="62" height="94" rx="16" fill="#dfcfaa" stroke="#8f7950"/><rect x="162" y="137" width="62" height="94" rx="16" fill="#dfcfaa" stroke="#8f7950"/><path d="M118 167 L136 174 L131 184 L152 190 L162 187" fill="none" stroke="#ba4055" stroke-width="9"/><text x="140" y="262" text-anchor="middle" font-size="16" font-weight="bold">Ligament</text><text x="140" y="284" text-anchor="middle" font-size="12">Joint stabilizer injury</text><rect x="270" y="78" width="240" height="232" rx="12" fill="#fff" stroke="#b1c3d0"/><text x="390" y="108" text-anchor="middle" font-size="18" font-weight="bold">Strain</text><path d="M296 181 Q345 131 382 173 L389 185 L397 173 Q435 131 484 181 Q434 228 397 194 L389 185 L382 194 Q345 228 296 181Z" fill="#e3a2a8" stroke="#a84c56" stroke-width="2"/><path d="M389 164v42" stroke="#a8324e" stroke-width="3" stroke-dasharray="5 4"/><text x="390" y="262" text-anchor="middle" font-size="16" font-weight="bold">Muscle / tendon</text><text x="390" y="284" text-anchor="middle" font-size="12">Force-transmitting tissue injury</text><rect x="520" y="78" width="240" height="232" rx="12" fill="#fff" stroke="#b1c3d0"/><text x="640" y="108" text-anchor="middle" font-size="18" font-weight="bold">Contusion</text><rect x="550" y="142" width="180" height="82" rx="22" fill="#e3a2a8" stroke="#a84c56"/><ellipse cx="640" cy="184" rx="41" ry="30" fill="#8d567f" opacity=".75"/><path d="M640 120v34m-8-10 8 10 8-10" stroke="#394c60" stroke-width="4" fill="none"/><text x="640" y="262" text-anchor="middle" font-size="16" font-weight="bold">Soft tissue</text><text x="640" y="284" text-anchor="middle" font-size="12">Direct impact and bleeding</text><text x="390" y="344" text-anchor="middle" font-size="14">Injuries may coexist. Clinical assessment determines severity and treatment.</text></g></svg>