<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 260" role="img" aria-labelledby="t d"><title id="t">Secondary fracture healing</title><desc id="d">Four schematic phases from hematoma to remodeling; timing overlaps and varies.</desc><rect width="820" height="260" fill="#fff"/><g font-family="Arial,sans-serif" fill="#162d3c"><text x="410" y="32" text-anchor="middle" font-size="22" font-weight="bold">Secondary fracture healing (schematic)</text><rect x="20" y="57" width="180" height="150" rx="12" fill="#edf4f8" stroke="#9db3c3"/><path d="M35 103 H94 L101 113 L94 124 H35Z M185 103 H126 L119 113 L126 124 H185Z" fill="#ead6aa" stroke="#8b7353"/><ellipse cx="110" cy="113" rx="20" ry="20" fill="#b94d5c" opacity=".85"/><text x="110" y="172" text-anchor="middle" font-size="17" font-weight="bold">Hematoma</text><text x="110" y="190" text-anchor="middle" font-size="12">Clot + inflammation</text><rect x="220" y="57" width="180" height="150" rx="12" fill="#edf4f8" stroke="#9db3c3"/><path d="M235 103 H294 L301 113 L294 124 H235Z M385 103 H326 L319 113 L326 124 H385Z" fill="#ead6aa" stroke="#8b7353"/><ellipse cx="310" cy="113" rx="26" ry="25" fill="#77a9a4" opacity=".85"/><text x="310" y="172" text-anchor="middle" font-size="17" font-weight="bold">Soft callus</text><text x="310" y="190" text-anchor="middle" font-size="12">Fibrocartilage bridge</text><rect x="420" y="57" width="180" height="150" rx="12" fill="#edf4f8" stroke="#9db3c3"/><path d="M435 103 H494 L501 113 L494 124 H435Z M585 103 H526 L519 113 L526 124 H585Z" fill="#ead6aa" stroke="#8b7353"/><ellipse cx="510" cy="113" rx="30" ry="24" fill="#d5b77b" opacity=".85"/><text x="510" y="172" text-anchor="middle" font-size="17" font-weight="bold">Hard callus</text><text x="510" y="190" text-anchor="middle" font-size="12">Mineralized bridge</text><rect x="620" y="57" width="180" height="150" rx="12" fill="#edf4f8" stroke="#9db3c3"/><path d="M635 103 H694 L701 113 L694 124 H635Z M785 103 H726 L719 113 L726 124 H785Z" fill="#ead6aa" stroke="#8b7353"/><rect x="692" y="103" width="36" height="21" fill="#ead6aa"/><text x="710" y="172" text-anchor="middle" font-size="17" font-weight="bold">Remodeling</text><text x="710" y="190" text-anchor="middle" font-size="12">Shape and strength adapt</text><text x="410" y="240" text-anchor="middle" font-size="14">Stages overlap; fixation stability, blood supply and patient factors affect healing.</text></g></svg>