<svg xmlns="http://www.w3.org/2000/svg" width="760" height="410" viewBox="0 0 760 410" role="img" aria-labelledby="title desc">
<title id="title">Orthosis nursing assessment loop</title><desc id="desc">Four-step nursing loop: verify prescription, inspect fit and skin, assess function and circulation, escalate changes.</desc><rect width="760" height="410" fill="#f8fafc"/>
<g font-family="Arial,sans-serif" fill="#163047"><text x="30" y="38" font-size="24" font-weight="bold">Orthosis nursing assessment loop</text><text x="30" y="62" font-size="14">Device-specific orders guide every step</text>
<g stroke="#94a3b8" stroke-width="2"><rect x="30" y="96" width="330" height="100" rx="12" fill="#e0f2fe"/><rect x="400" y="96" width="330" height="100" rx="12" fill="#dcfce7"/><rect x="400" y="238" width="330" height="100" rx="12" fill="#fef3c7"/><rect x="30" y="238" width="330" height="100" rx="12" fill="#fee2e2"/></g>
<g font-size="18" font-weight="bold"><text x="48" y="125">1  Verify prescription</text><text x="418" y="125">2  Inspect fit and skin</text><text x="418" y="267">3  Reassess function</text><text x="48" y="267">4  Escalate changes</text></g>
<g font-size="14"><text x="48" y="150">Side, joint, angle, wear plan</text><text x="48" y="171">Weight-bearing instructions</text><text x="418" y="150">Pressure points and strap position</text><text x="418" y="171">Device integrity and alignment</text><text x="418" y="292">Distal neurovascular findings</text><text x="418" y="313">Safe mobility and prescribed use</text><text x="48" y="292">New pain, numbness or skin injury</text><text x="48" y="313">Arrange prompt clinical review</text></g>
<g stroke="#475569" stroke-width="3" fill="none"><path d="M365 146 H391"/><path d="M565 201 V229"/><path d="M395 288 H369"/><path d="M195 233 V205"/></g><g fill="#475569"><path d="M391 146 l-10 -6 v12 z"/><path d="M565 229 l-6 -10 h12 z"/><path d="M369 288 l10 -6 v12 z"/><path d="M195 205 l-6 10 h12 z"/></g><text x="30" y="380" font-size="14">Do not independently reshape or change prescribed immobilization.</text></g></svg>