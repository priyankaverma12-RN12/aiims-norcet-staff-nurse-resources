<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-label="Paget disease versus osteomalacia"><rect width="760" height="320" rx="14" fill="#f5f8fa"/><g font-family="Arial,sans-serif" fill="#17334b"><text x="28" y="34" font-size="22" font-weight="bold">Two different bone mechanisms</text><rect x="24" y="55" width="346" height="225" rx="12" fill="#fff" stroke="#8ca5b5"/><rect x="390" y="55" width="346" height="225" rx="12" fill="#fff" stroke="#8ca5b5"/><text x="42" y="84" font-size="18" font-weight="bold">Paget disease</text><text x="408" y="84" font-size="18" font-weight="bold">Osteomalacia</text><g font-size="15"><text x="42" y="115">Increased, disorganized remodeling</text><text x="42" y="144">Resorption and formation are abnormal</text><text x="42" y="173">Bone may enlarge and weaken</text><text x="42" y="202">ALP may rise with active disease</text><text x="408" y="115">Defective mineralization of osteoid</text><text x="408" y="144">Vitamin D or phosphate disorders</text><text x="408" y="173">Bone pain, weakness, pseudofractures</text><text x="408" y="202">Investigate cause before treatment</text></g><rect x="42" y="225" width="310" height="34" rx="6" fill="#e0edf5"/><rect x="408" y="225" width="310" height="34" rx="6" fill="#e2f2e8"/><text x="55" y="247" font-size="14">Treatment targets active disease and pain</text><text x="421" y="247" font-size="14">Treatment corrects the mineral defect</text><text x="28" y="301" font-size="12">Concept diagram, not a diagnostic algorithm.</text></g></svg>