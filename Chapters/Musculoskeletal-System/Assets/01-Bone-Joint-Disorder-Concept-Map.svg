<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" role="img" aria-labelledby="t d"><title id="t">Bone and joint disorder comparison</title><desc id="d">Osteoporosis, osteomalacia, osteoarthritis, rheumatoid arthritis, osteomyelitis and septic arthritis compared by primary disease mechanism.</desc><rect width="820" height="380" fill="#fff"/><g font-family="Arial,sans-serif" fill="#163144"><text x="410" y="34" text-anchor="middle" font-size="22" font-weight="bold">Bone and joint disorders: key mechanisms</text><rect x="18" y="62" width="252" height="120" rx="12" fill="#eef3fb" stroke="#8da4b3"/><text x="144" y="92" text-anchor="middle" font-size="17" font-weight="bold">Osteoporosis</text><text x="144" y="122" text-anchor="middle" font-size="14">Reduced bone strength</text><text x="144" y="146" text-anchor="middle" font-size="13">Fragility fracture risk</text><rect x="284" y="62" width="252" height="120" rx="12" fill="#eef3fb" stroke="#8da4b3"/><text x="410" y="92" text-anchor="middle" font-size="17" font-weight="bold">Osteomalacia</text><text x="410" y="122" text-anchor="middle" font-size="14">Defective mineralization</text><text x="410" y="146" text-anchor="middle" font-size="13">Bone pain / weakness</text><rect x="550" y="62" width="252" height="120" rx="12" fill="#eef6f2" stroke="#8da4b3"/><text x="676" y="92" text-anchor="middle" font-size="17" font-weight="bold">Osteoarthritis</text><text x="676" y="122" text-anchor="middle" font-size="14">Whole-joint degeneration</text><text x="676" y="146" text-anchor="middle" font-size="13">Mechanical pain pattern</text><rect x="18" y="198" width="252" height="120" rx="12" fill="#eef6f2" stroke="#8da4b3"/><text x="144" y="228" text-anchor="middle" font-size="17" font-weight="bold">Rheumatoid arthritis</text><text x="144" y="258" text-anchor="middle" font-size="14">Immune-mediated synovitis</text><text x="144" y="282" text-anchor="middle" font-size="13">Persistent inflammation</text><rect x="284" y="198" width="252" height="120" rx="12" fill="#f9efed" stroke="#8da4b3"/><text x="410" y="228" text-anchor="middle" font-size="17" font-weight="bold">Osteomyelitis</text><text x="410" y="258" text-anchor="middle" font-size="14">Infection within bone</text><text x="410" y="282" text-anchor="middle" font-size="13">Deep pain / source control</text><rect x="550" y="198" width="252" height="120" rx="12" fill="#f9efed" stroke="#8da4b3"/><text x="676" y="228" text-anchor="middle" font-size="17" font-weight="bold">Septic arthritis</text><text x="676" y="258" text-anchor="middle" font-size="14">Infection within joint</text><text x="676" y="282" text-anchor="middle" font-size="13">Urgent aspiration / treatment</text><text x="410" y="351" text-anchor="middle" font-size="14">Illustrative comparison, not a diagnostic algorithm.</text></g></svg>