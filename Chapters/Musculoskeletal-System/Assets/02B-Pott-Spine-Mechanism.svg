<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="title desc"><title id="title">Pott disease mechanism</title><desc id="desc">Tuberculosis infection in vertebrae can cause bone destruction, collapse and possible spinal instability or neural compression. Not inevitable.</desc><rect width="720" height="380" rx="16" fill="#f6f8fb"/><g font-family="Arial,sans-serif" fill="#183449"><text x="24" y="34" font-size="22" font-weight="bold">Pott disease: possible progression</text><text x="24" y="56" font-size="13">Teaching schematic • not to scale</text><g fill="#dbeafe" stroke="#527493"><rect x="28" y="92" width="192" height="68" rx="10"/><rect x="264" y="92" width="192" height="68" rx="10"/><rect x="500" y="92" width="192" height="68" rx="10"/></g><g font-size="15" text-anchor="middle"><text x="124" y="118">Vertebral TB</text><text x="124" y="139">infection</text><text x="360" y="118">Bone destruction</text><text x="360" y="139">± abscess</text><text x="596" y="118">Possible collapse</text><text x="596" y="139">and instability</text></g><g stroke="#527493" stroke-width="2" fill="none"><path d="M220 126H264m-10-6 10 6-10 6M456 126H500m-10-6 10 6-10 6M596 160V206H360V226m-6-10 6 10 6-10"/></g><rect x="146" y="226" width="428" height="92" rx="12" fill="#fee2e2" stroke="#ae4657"/><text x="360" y="251" text-anchor="middle" font-size="16" font-weight="bold">Urgent assessment if neurologic deficit</text><text x="360" y="275" text-anchor="middle" font-size="14">New weakness • sensory change • sphincter symptoms</text><text x="360" y="298" text-anchor="middle" font-size="14">Escalate promptly, protect spine as advised</text><text x="24" y="350" font-size="13">Progression varies. Diagnosis and treatment are specialist directed.</text></g></svg>