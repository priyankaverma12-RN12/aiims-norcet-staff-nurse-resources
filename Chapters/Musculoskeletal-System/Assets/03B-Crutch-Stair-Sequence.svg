<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340" role="img" aria-labelledby="title desc"><title id="title">Protected stair sequence with crutches</title><desc id="desc">Educational summary of clinician-taught partial weight bearing step-to stair sequence. Not instructions for an unassessed patient.</desc><rect width="780" height="340" rx="16" fill="#f6f8fb"/><g font-family="Arial,sans-serif" fill="#17334b"><text x="390" y="34" text-anchor="middle" font-size="21" font-weight="bold">Protected step-to stair sequence (PWB)</text><text x="390" y="58" text-anchor="middle" font-size="13">For patients cleared and trained by their therapy team</text><rect x="25" y="80" width="350" height="195" rx="12" fill="#dcefe7" stroke="#9bb5c6"/><text x="200" y="111" text-anchor="middle" font-size="17" font-weight="bold">ASCEND</text><circle cx="68" cy="146" r="15" fill="#355b77"/><text x="68" y="151" text-anchor="middle" font-size="13" fill="white">1</text><text x="95" y="151" font-size="15">Unaffected leg leads</text><circle cx="68" cy="193" r="15" fill="#355b77"/><text x="68" y="198" text-anchor="middle" font-size="13" fill="white">2</text><text x="95" y="198" font-size="15">Affected leg follows</text><circle cx="68" cy="240" r="15" fill="#355b77"/><text x="68" y="245" text-anchor="middle" font-size="13" fill="white">3</text><text x="95" y="245" font-size="15">Aid joins as taught</text><rect x="410" y="80" width="350" height="195" rx="12" fill="#e1edf9" stroke="#9bb5c6"/><text x="585" y="111" text-anchor="middle" font-size="17" font-weight="bold">DESCEND</text><circle cx="453" cy="146" r="15" fill="#355b77"/><text x="453" y="151" text-anchor="middle" font-size="13" fill="white">1</text><text x="480" y="151" font-size="15">Aid to lower step</text><circle cx="453" cy="193" r="15" fill="#355b77"/><text x="453" y="198" text-anchor="middle" font-size="13" fill="white">2</text><text x="480" y="198" font-size="15">Affected leg follows</text><circle cx="453" cy="240" r="15" fill="#355b77"/><text x="453" y="245" text-anchor="middle" font-size="13" fill="white">3</text><text x="480" y="245" font-size="15">Unaffected leg follows</text><text x="390" y="298" text-anchor="middle" font-size="13">Use a secure rail where appropriate, follow the prescribed limb load.</text><text x="390" y="320" text-anchor="middle" font-size="13">NWB requires a different taught technique: keep the affected limb unloaded.</text></g></svg>