<svg xmlns="http://www.w3.org/2000/svg" width="720" height="365" viewBox="0 0 720 365" role="img" aria-labelledby="t d"><title id="t">Adult CPR quality</title><desc id="d">Compression rate, depth, recoil, pauses and ventilation are separate quality measures. Educational diagram.</desc><rect width="720" height="365" rx="16" fill="#f8fafc"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#172554"><text x="360" y="35" font-size="22" font-weight="bold">Adult CPR quality: assess together</text><rect x="238" y="64" width="244" height="60" rx="10" fill="#dbeafe" stroke="#2563eb"/><text x="360" y="89" font-size="17" font-weight="bold">Effective circulation</text><text x="360" y="109" font-size="13">Avoid preventable interruptions</text><path d="M360 124v25H120v19M360 149v19M360 149h240v19" stroke="#475569" stroke-width="2" fill="none"/><g fill="#e0e7ff" stroke="#4338ca"><rect x="20" y="168" width="200" height="68" rx="9"/><rect x="260" y="168" width="200" height="68" rx="9"/><rect x="500" y="168" width="200" height="68" rx="9"/></g><text x="120" y="193" font-size="16" font-weight="bold">Rate</text><text x="120" y="216" font-size="14">100–120/min</text><text x="360" y="193" font-size="16" font-weight="bold">Depth</text><text x="360" y="216" font-size="14">About 5 cm, avoid &gt;6 cm</text><text x="600" y="193" font-size="16" font-weight="bold">Recoil</text><text x="600" y="216" font-size="14">Full release between pushes</text><rect x="70" y="260" width="275" height="65" rx="9" fill="#dcfce7" stroke="#15803d"/><rect x="375" y="260" width="275" height="65" rx="9" fill="#dcfce7" stroke="#15803d"/><text x="207" y="285" font-size="16" font-weight="bold">Short pauses</text><text x="207" y="306" font-size="13">Coordinate team tasks</text><text x="512" y="285" font-size="16" font-weight="bold">Ventilation</text><text x="512" y="306" font-size="13">Avoid too little or too much</text><text x="360" y="349" font-size="12">Educational reminder, not a complete resuscitation algorithm.</text></g></svg>