<svg xmlns="http://www.w3.org/2000/svg" width="720" height="350" viewBox="0 0 720 350" role="img" aria-labelledby="t d"><title id="t">Poisoning care: assess and reassess</title><desc id="d">Six elements of safe clinical toxicology care</desc><rect width="720" height="350" rx="16" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#172554" text-anchor="middle"><text x="360" y="37" font-size="22" font-weight="bold">Poisoning care: assess and reassess</text><rect x="20" y="62" width="330" height="65" rx="9" fill="#dbeafe" stroke="#2563eb"/><text x="185" y="87" font-size="16" font-weight="bold">Safety</text><text x="185" y="109" font-size="13">Protect staff and patient</text><rect x="370" y="62" width="330" height="65" rx="9" fill="#dcfce7" stroke="#15803d"/><text x="535" y="87" font-size="16" font-weight="bold">Exposure history</text><text x="535" y="109" font-size="13">Identify route, time and product</text><rect x="20" y="145" width="330" height="65" rx="9" fill="#dbeafe" stroke="#2563eb"/><text x="185" y="170" font-size="16" font-weight="bold">Support</text><text x="185" y="192" font-size="13">Airway, breathing and circulation</text><rect x="370" y="145" width="330" height="65" rx="9" fill="#dcfce7" stroke="#15803d"/><text x="535" y="170" font-size="16" font-weight="bold">Consultation</text><text x="535" y="192" font-size="13">Toxin-specific professional advice</text><rect x="20" y="228" width="330" height="65" rx="9" fill="#dbeafe" stroke="#2563eb"/><text x="185" y="253" font-size="16" font-weight="bold">Monitoring</text><text x="185" y="275" font-size="13">Detect persistent or recurrent toxicity</text><rect x="370" y="228" width="330" height="65" rx="9" fill="#dcfce7" stroke="#15803d"/><text x="535" y="253" font-size="16" font-weight="bold">Recovery</text><text x="535" y="275" font-size="13">Education and follow-up</text><text x="360" y="333" font-size="12">Learning overview only. Follow authorized clinical protocols.</text></g></svg>