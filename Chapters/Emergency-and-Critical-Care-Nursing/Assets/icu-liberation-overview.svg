<svg xmlns="http://www.w3.org/2000/svg" width="720" height="350" viewBox="0 0 720 350" role="img" aria-labelledby="t d"><title id="t">ICU Liberation: A–F</title><desc id="d">Six ICU liberation elements</desc><rect width="720" height="350" rx="16" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#172554" text-anchor="middle"><text x="360" y="37" font-size="22" font-weight="bold">ICU Liberation: A–F</text><rect x="20" y="62" width="330" height="65" rx="9" fill="#dbeafe" stroke="#2563eb"/><text x="185" y="87" font-size="16" font-weight="bold">A — Pain</text><text x="185" y="109" font-size="13">Assess and manage</text><rect x="370" y="62" width="330" height="65" rx="9" fill="#dcfce7" stroke="#15803d"/><text x="535" y="87" font-size="16" font-weight="bold">B — Trials</text><text x="535" y="109" font-size="13">Coordinate awakening and breathing</text><rect x="20" y="145" width="330" height="65" rx="9" fill="#dbeafe" stroke="#2563eb"/><text x="185" y="170" font-size="16" font-weight="bold">C — Sedation</text><text x="185" y="192" font-size="13">Individualize analgesia and sedation</text><rect x="370" y="145" width="330" height="65" rx="9" fill="#dcfce7" stroke="#15803d"/><text x="535" y="170" font-size="16" font-weight="bold">D — Delirium</text><text x="535" y="192" font-size="13">Assess and prevent modifiable risks</text><rect x="20" y="228" width="330" height="65" rx="9" fill="#dbeafe" stroke="#2563eb"/><text x="185" y="253" font-size="16" font-weight="bold">E — Mobility</text><text x="185" y="275" font-size="13">Screen for safe activity</text><rect x="370" y="228" width="330" height="65" rx="9" fill="#dcfce7" stroke="#15803d"/><text x="535" y="253" font-size="16" font-weight="bold">F — Family</text><text x="535" y="275" font-size="13">Respect patient preferences</text><text x="360" y="333" font-size="12">Learning overview only. Follow authorized clinical protocols.</text></g></svg>