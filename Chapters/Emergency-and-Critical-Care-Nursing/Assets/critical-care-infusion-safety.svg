<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img" aria-labelledby="t d"><title id="t">Infusion delivery safety</title><desc id="d">Check order, programming, physical delivery path and patient response.</desc><rect width="720" height="330" rx="12" fill="#f8fafc"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#172554"><text x="360" y="32" font-size="22" font-weight="bold">Safe infusion: four linked checks</text><rect x="20" y="55" width="330" height="85" rx="9" fill="#dbeafe" stroke="#475569"/><text x="185" y="83" font-size="17" font-weight="bold">Authorized order</text><text x="185" y="110" font-size="13">Dose, unit and concentration</text><rect x="370" y="55" width="330" height="85" rx="9" fill="#dcfce7" stroke="#475569"/><text x="535" y="83" font-size="17" font-weight="bold">Pump programming</text><text x="535" y="110" font-size="13">Profile, drug library and limits</text><rect x="20" y="155" width="330" height="85" rx="9" fill="#dbeafe" stroke="#475569"/><text x="185" y="183" font-size="17" font-weight="bold">Physical delivery</text><text x="185" y="210" font-size="13">Tubing, compatible setup and flow</text><rect x="370" y="155" width="330" height="85" rx="9" fill="#dcfce7" stroke="#475569"/><text x="535" y="183" font-size="17" font-weight="bold">Patient response</text><text x="535" y="210" font-size="13">Assess effects and actual delivery</text><text x="360" y="267" font-size="15" font-weight="bold">A correct display alone does not verify drug delivery.</text><text x="360" y="310" font-size="12">Educational overview, not a device operating procedure.</text></g></svg>