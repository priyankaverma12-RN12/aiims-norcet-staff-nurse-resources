<svg xmlns="http://www.w3.org/2000/svg" width="900" height="580" viewBox="0 0 900 580" role="img" aria-labelledby="title desc"><title id="title">Adult ALS decision overview</title><desc id="desc">Educational overview distinguishing shockable and nonshockable arrest priorities and monitoring.</desc><rect width="900" height="580" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#18354a" text-anchor="middle"><text x="450" y="40" font-size="25" font-weight="bold">Adult ALS: rhythm and timing</text><rect x="270" y="67" width="360" height="64" rx="12" fill="#dbeafe" stroke="#315b87"/><text x="450" y="92" font-size="18" font-weight="bold">Recognized cardiac arrest</text><text x="450" y="116" font-size="15">High-quality CPR + rhythm assessment</text><path d="M450 131 V157 H220 V180 M450 157 H680 V180" fill="none" stroke="#315b87" stroke-width="3"/><rect x="40" y="180" width="360" height="130" rx="12" fill="#e0f2fe" stroke="#315b87"/><text x="220" y="209" font-size="20" font-weight="bold">VF / pulseless VT</text><text x="220" y="238" font-size="16">Prioritize initial defibrillation</text><text x="220" y="262" font-size="16">Epinephrine after initial shocks fail</text><text x="220" y="286" font-size="15">Consider antiarrhythmic if resistant</text><rect x="500" y="180" width="360" height="130" rx="12" fill="#fef3c7" stroke="#927341"/><text x="680" y="209" font-size="20" font-weight="bold">Asystole / PEA</text><text x="680" y="238" font-size="16">No indicated defibrillation</text><text x="680" y="262" font-size="16">Epinephrine as soon as feasible</text><text x="680" y="286" font-size="15">Investigate reversible causes</text><path d="M220 310 V340 H450 M680 310 V340 H450 V362" fill="none" stroke="#315b87" stroke-width="3"/><rect x="145" y="362" width="610" height="115" rx="12" fill="#e2e8f0" stroke="#64748b"/><text x="450" y="392" font-size="19" font-weight="bold">Shared priorities</text><text x="450" y="418" font-size="16">Minimize interruptions • IV first, IO if needed</text><text x="450" y="442" font-size="16">Capnography and clinical assessment</text><text x="450" y="466" font-size="15">Reassess rhythm and reversible causes</text><text x="450" y="522" font-size="15">Educational decision overview, not a complete treatment algorithm.</text><text x="450" y="548" font-size="14">Source: AHA Adult Advanced Life Support, 2025</text></g></svg>