<svg xmlns="http://www.w3.org/2000/svg" width="720" height="350" viewBox="0 0 720 350" role="img" aria-labelledby="t d"><title id="t">Emergency medico-legal responsibilities</title><desc id="d">Prompt care, legal reporting, consent, privacy and accountable documentation.</desc><rect width="720" height="350" rx="14" fill="#f8fafc"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#172554"><text x="360" y="33" font-size="22" font-weight="bold">Emergency care and legal safeguards</text><rect x="160" y="56" width="400" height="55" rx="9" fill="#fee2e2" stroke="#b91c1c"/><text x="360" y="79" font-size="17" font-weight="bold">Prompt indicated clinical care</text><text x="360" y="98" font-size="12">Do not delay for procedural paperwork</text><path d="M360 111v23H180v16M360 134h180v16" fill="none" stroke="#475569" stroke-width="2"/><rect x="20" y="150" width="320" height="91" rx="9" fill="#dbeafe" stroke="#2563eb"/><text x="180" y="175" font-size="16" font-weight="bold">Consent and dignity</text><text x="180" y="195" font-size="13">Procedure-specific decisions</text><text x="180" y="215" font-size="13">Privacy and child-sensitive safeguards</text><rect x="380" y="150" width="320" height="91" rx="9" fill="#dcfce7" stroke="#15803d"/><text x="540" y="175" font-size="16" font-weight="bold">Legal process</text><text x="540" y="195" font-size="13">Applicable reporting duty</text><text x="540" y="215" font-size="13">Good Samaritan rights</text><path d="M180 241v20h360v-20M360 261v13" fill="none" stroke="#475569" stroke-width="2"/><rect x="110" y="274" width="500" height="47" rx="9" fill="#e0e7ff" stroke="#4338ca"/><text x="360" y="295" font-size="15" font-weight="bold">Objective records and authorized custody</text><text x="360" y="312" font-size="12">Traceable decisions and handovers</text><text x="360" y="340" font-size="11">Educational overview, not a complete legal protocol.</text></g></svg>