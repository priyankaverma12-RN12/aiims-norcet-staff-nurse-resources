<svg xmlns="http://www.w3.org/2000/svg" width="720" height="365" viewBox="0 0 720 365" role="img" aria-labelledby="t d"><title id="t">ABCDE and SBAR</title><desc id="d">Assess five domains, treat threats, reassess and communicate.</desc><rect width="720" height="365" rx="16" fill="#f8fafc"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#172554"><text x="360" y="38" font-size="22" font-weight="bold">Emergency assessment and communication</text><rect x="15" y="75" width="126" height="74" rx="10" fill="#dbeafe" stroke="#2563eb"/><text x="78" y="105" font-size="20" font-weight="bold">A</text><text x="78" y="130" font-size="13">Airway</text><rect x="156" y="75" width="126" height="74" rx="10" fill="#dbeafe" stroke="#2563eb"/><text x="219" y="105" font-size="20" font-weight="bold">B</text><text x="219" y="130" font-size="13">Breathing</text><rect x="297" y="75" width="126" height="74" rx="10" fill="#dbeafe" stroke="#2563eb"/><text x="360" y="105" font-size="20" font-weight="bold">C</text><text x="360" y="130" font-size="13">Circulation</text><rect x="438" y="75" width="126" height="74" rx="10" fill="#dbeafe" stroke="#2563eb"/><text x="501" y="105" font-size="20" font-weight="bold">D</text><text x="501" y="130" font-size="13">Disability</text><rect x="579" y="75" width="126" height="74" rx="10" fill="#dbeafe" stroke="#2563eb"/><text x="642" y="105" font-size="20" font-weight="bold">E</text><text x="642" y="130" font-size="13">Exposure</text><path d="M360 149v30" stroke="#475569" stroke-width="2"/><rect x="145" y="179" width="430" height="54" rx="10" fill="#fee2e2" stroke="#b91c1c"/><text x="360" y="201" font-size="16" font-weight="bold">Treat urgent threats and call for help</text><text x="360" y="220" font-size="13">Reassess the patient and response</text><path d="M145 206H8V60H360V75M360 233v27" stroke="#475569" stroke-width="2" fill="none"/><rect x="145" y="260" width="430" height="65" rx="10" fill="#dcfce7" stroke="#15803d"/><text x="360" y="285" font-size="17" font-weight="bold">SBAR handover</text><text x="360" y="306" font-size="13">Situation • Background • Assessment • Recommendation</text><text x="360" y="350" font-size="12">Educational summary, not a complete clinical algorithm.</text></g></svg>