<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" role="img" aria-labelledby="t d"><title id="t">Critical care recovery pathway</title><desc id="d">Transition readiness, transfer, rehabilitation and functional review.</desc><rect width="720" height="340" rx="12" fill="#f8fafc"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#172554"><text x="360" y="32" font-size="22" font-weight="bold">ICU recovery: four checkpoints</text><rect x="75" y="52" width="570" height="56" rx="9" fill="#dbeafe" stroke="#475569"/><text x="360" y="75" font-size="16" font-weight="bold">1. Before transfer</text><text x="360" y="95" font-size="13">Review risk and ward capability</text><rect x="75" y="120" width="570" height="56" rx="9" fill="#dcfce7" stroke="#475569"/><text x="360" y="143" font-size="16" font-weight="bold">2. On the ward</text><text x="360" y="163" font-size="13">Update goals and clarify responsibility</text><rect x="75" y="188" width="570" height="56" rx="9" fill="#dbeafe" stroke="#475569"/><text x="360" y="211" font-size="16" font-weight="bold">3. Hospital discharge</text><text x="360" y="231" font-size="13">Arrange ongoing care and own summary</text><rect x="75" y="256" width="570" height="56" rx="9" fill="#dcfce7" stroke="#475569"/><text x="360" y="279" font-size="16" font-weight="bold">4. Follow-up</text><text x="360" y="299" font-size="13">Review function across recovery domains</text><text x="360" y="334" font-size="11">Educational overview • individualized clinical plan applies</text></g></svg>