<svg xmlns="http://www.w3.org/2000/svg" width="720" height="390" viewBox="0 0 720 390" role="img" aria-labelledby="t d"><title id="t">Adult sepsis decision overview</title><desc id="d">Early recognition, time-sensitive antimicrobials and source control, individualized perfusion management, reassessment and recovery.</desc><rect width="720" height="390" rx="16" fill="#f8fafc"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#172554"><text x="360" y="35" font-size="22" font-weight="bold">Sepsis: infection and perfusion together</text><rect x="160" y="56" width="400" height="54" rx="10" fill="#dbeafe" stroke="#2563eb"/><text x="360" y="79" font-size="16" font-weight="bold">Suspect infection + organ dysfunction</text><text x="360" y="98" font-size="12">Screen, assess, activate appropriate help</text><path d="M360 110v24H180v16M360 134h180v16" fill="none" stroke="#475569" stroke-width="2"/><rect x="20" y="150" width="320" height="110" rx="10" fill="#fee2e2" stroke="#b91c1c"/><text x="180" y="178" font-size="16" font-weight="bold">Control infection</text><text x="180" y="202" font-size="13">Cultures without avoidable delay</text><text x="180" y="222" font-size="13">Timely ordered antimicrobials</text><text x="180" y="242" font-size="13">Evaluate source control</text><rect x="380" y="150" width="320" height="110" rx="10" fill="#dcfce7" stroke="#15803d"/><text x="540" y="178" font-size="16" font-weight="bold">Support perfusion</text><text x="540" y="202" font-size="13">Individualized fluid resuscitation</text><text x="540" y="222" font-size="13">Vasopressors as indicated</text><text x="540" y="242" font-size="13">Monitor organ response</text><path d="M180 260v22h360v-22M360 282v12" fill="none" stroke="#475569" stroke-width="2"/><rect x="120" y="294" width="480" height="55" rx="10" fill="#e0e7ff" stroke="#4338ca"/><text x="360" y="316" font-size="15" font-weight="bold">Reassess and plan recovery</text><text x="360" y="337" font-size="13">Adjust treatment, assess complications and new impairments</text><text x="360" y="373" font-size="12">Educational overview only. Follow the full local sepsis protocol.</text></g></svg>