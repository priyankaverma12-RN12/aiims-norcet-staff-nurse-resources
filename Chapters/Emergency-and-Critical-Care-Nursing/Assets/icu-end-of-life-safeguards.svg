<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img" aria-labelledby="t d"><title id="t">ICU family communication and legal safeguards</title><desc id="d">Separate clinical discussions, patient preferences, legal review and ongoing support.</desc><rect width="720" height="330" rx="12" fill="#f8fafc"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#172554"><text x="360" y="33" font-size="22" font-weight="bold">End-of-life care: coordinated responsibilities</text><rect x="20" y="55" width="330" height="85" rx="9" fill="#dbeafe" stroke="#475569"/><text x="185" y="83" font-size="17" font-weight="bold">Clinical discussion</text><text x="185" y="109" font-size="12">Explain prognosis and uncertainty</text><rect x="370" y="55" width="330" height="85" rx="9" fill="#dcfce7" stroke="#475569"/><text x="535" y="83" font-size="17" font-weight="bold">Patient preferences</text><text x="535" y="109" font-size="12">Check informed wishes and documentation</text><rect x="20" y="155" width="330" height="85" rx="9" fill="#dbeafe" stroke="#475569"/><text x="185" y="183" font-size="17" font-weight="bold">Legal safeguards</text><text x="185" y="209" font-size="12">Refer to authorized decision process</text><rect x="370" y="155" width="330" height="85" rx="9" fill="#dcfce7" stroke="#475569"/><text x="535" y="183" font-size="17" font-weight="bold">Family support</text><text x="535" y="209" font-size="12">Listen, invite questions, provide information</text><text x="360" y="270" font-size="14" font-weight="bold">Nursing support continues throughout.</text><text x="360" y="310" font-size="12">Education only — not a legal authorization or treatment algorithm.</text></g></svg>