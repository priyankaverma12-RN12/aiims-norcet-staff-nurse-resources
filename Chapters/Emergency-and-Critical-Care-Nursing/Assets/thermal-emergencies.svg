<svg xmlns="http://www.w3.org/2000/svg" width="720" height="350" viewBox="0 0 720 350" role="img" aria-labelledby="t d"><title id="t">Thermal emergencies</title><desc id="d">Heat stroke requires rapid active cooling, hypothermia requires protection and rewarming, frostbite is local injury.</desc><rect width="720" height="350" rx="16" fill="#f8fafc"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#172554"><text x="360" y="35" font-size="22" font-weight="bold">Temperature emergencies: different priorities</text><rect x="20" y="60" width="330" height="184" rx="12" fill="#fee2e2" stroke="#b91c1c"/><rect x="370" y="60" width="330" height="184" rx="12" fill="#dbeafe" stroke="#2563eb"/><text x="185" y="89" font-size="18" font-weight="bold" fill="#991b1b">HEAT STROKE</text><text x="185" y="119" font-size="14">Heat stress + altered mental status</text><text x="185" y="143" font-size="14">Activate emergency response</text><text x="185" y="167" font-size="14">Rapid active cooling</text><text x="185" y="191" font-size="14">Monitor airway and core temperature</text><text x="185" y="217" font-size="13">Continue organ assessment</text><text x="535" y="89" font-size="18" font-weight="bold" fill="#1e40af">HYPOTHERMIA</text><text x="535" y="119" font-size="14">Core temperature below 35°C</text><text x="535" y="143" font-size="14">Prevent further heat loss</text><text x="535" y="167" font-size="14">Gentle handling and monitoring</text><text x="535" y="191" font-size="14">Severity-guided rewarming</text><text x="535" y="217" font-size="13">Core first if systemic compromise</text><rect x="90" y="264" width="540" height="49" rx="9" fill="#e0e7ff" stroke="#4338ca"/><text x="360" y="285" font-size="15" font-weight="bold">Local frostbite is not the same as systemic hypothermia</text><text x="360" y="303" font-size="12">Protect frozen tissue and avoid refreezing</text><text x="360" y="337" font-size="12">Educational overview, not a clinical treatment algorithm.</text></g></svg>