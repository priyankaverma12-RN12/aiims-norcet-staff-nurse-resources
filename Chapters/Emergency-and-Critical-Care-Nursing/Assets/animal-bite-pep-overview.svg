<svg xmlns="http://www.w3.org/2000/svg" width="720" height="350" viewBox="0 0 720 350" role="img" aria-labelledby="t d"><title id="t">Rabies exposure assessment</title><desc id="d">Assess exposure, prior vaccine and immune status, then arrange indicated prophylaxis and wound care.</desc><rect width="720" height="350" rx="14" fill="#f8fafc"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#172554"><text x="360" y="34" font-size="22" font-weight="bold">Rabies: classify exposure and assess history</text><rect x="15" y="65" width="220" height="73" rx="8" fill="#dcfce7" stroke="#15803d"/><text x="125" y="92" font-size="17" font-weight="bold">Category I</text><text x="125" y="116" font-size="12">Intact skin contact</text><rect x="250" y="65" width="220" height="73" rx="8" fill="#fef3c7" stroke="#a16207"/><text x="360" y="92" font-size="17" font-weight="bold">Category II</text><text x="360" y="116" font-size="12">Minor nonbleeding injury</text><rect x="485" y="65" width="220" height="73" rx="8" fill="#fee2e2" stroke="#b91c1c"/><text x="595" y="92" font-size="17" font-weight="bold">Category III</text><text x="595" y="116" font-size="12">Transdermal or mucosal exposure</text><path d="M125 138v25h235M360 138v43M595 138v25H360" fill="none" stroke="#475569" stroke-width="2"/><rect x="110" y="181" width="500" height="60" rx="9" fill="#dbeafe" stroke="#2563eb"/><text x="360" y="204" font-size="16" font-weight="bold">Review previous vaccine and immune status</text><text x="360" y="224" font-size="13">Use current clinical protocol for indicated PEP</text><path d="M360 241v20" stroke="#475569" stroke-width="2"/><rect x="110" y="261" width="500" height="50" rx="8" fill="#e0e7ff" stroke="#4338ca"/><text x="360" y="282" font-size="15" font-weight="bold">Assess wound complications and follow-up</text><text x="360" y="299" font-size="12">Tetanus and bacterial infection are separate considerations</text><text x="360" y="336" font-size="12">Learning overview only. Not a complete PEP algorithm.</text></g></svg>