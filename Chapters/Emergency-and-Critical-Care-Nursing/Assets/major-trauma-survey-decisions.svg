<svg xmlns="http://www.w3.org/2000/svg" width="720" height="350" viewBox="0 0 720 350" role="img" aria-labelledby="t d"><title id="t">Major trauma survey priorities</title><desc id="d">Identify life threats, guide haemorrhage control and perform detailed survey when stable.</desc><rect width="720" height="350" rx="14" fill="#f8fafc"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#172554"><text x="360" y="33" font-size="22" font-weight="bold">Major trauma: survey and reassess</text><rect x="150" y="54" width="420" height="55" rx="9" fill="#fee2e2" stroke="#b91c1c"/><text x="360" y="77" font-size="17" font-weight="bold">Primary survey and urgent treatment</text><text x="360" y="97" font-size="12">Identify threats and coordinate bleeding control</text><path d="M360 109v23H180v15M360 132h180v15" fill="none" stroke="#475569" stroke-width="2"/><rect x="20" y="147" width="320" height="78" rx="9" fill="#fef3c7" stroke="#a16207"/><text x="180" y="172" font-size="16" font-weight="bold">Ongoing instability</text><text x="180" y="193" font-size="13">Urgent intervention and reassessment</text><text x="180" y="211" font-size="12">Limit avoidable imaging delays</text><rect x="380" y="147" width="320" height="78" rx="9" fill="#dcfce7" stroke="#15803d"/><text x="540" y="172" font-size="16" font-weight="bold">Adequately stable</text><text x="540" y="193" font-size="13">Detailed survey and indicated imaging</text><text x="540" y="211" font-size="12">AMPLE history and specific findings</text><path d="M180 225v25h360v-25M360 250v17" fill="none" stroke="#475569" stroke-width="2"/><rect x="100" y="267" width="520" height="49" rx="9" fill="#dbeafe" stroke="#2563eb"/><text x="360" y="289" font-size="16" font-weight="bold">Reassess after intervention or deterioration</text><text x="360" y="306" font-size="12">Use the complete trauma protocol and trained team</text><text x="360" y="339" font-size="12">Learning overview, not a complete trauma algorithm.</text></g></svg>