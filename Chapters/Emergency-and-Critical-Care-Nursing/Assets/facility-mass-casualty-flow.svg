<svg xmlns="http://www.w3.org/2000/svg" width="720" height="415" viewBox="0 0 720 415" role="img" aria-labelledby="t d"><title id="t">Facility mass casualty zones</title><desc id="d">Educational overview of triage, red yellow and green zones, reassessment and separate supportive care designation.</desc><rect width="720" height="415" rx="16" fill="#f8fafc"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#172554"><text x="360" y="35" font-size="22" font-weight="bold">Facility surge: organized care zones</text><rect x="215" y="58" width="290" height="52" rx="9" fill="#dbeafe" stroke="#2563eb"/><text x="360" y="80" font-size="15" font-weight="bold">Activated facility triage</text><text x="360" y="98" font-size="12">All arrivals assessed</text><path d="M360 110v27H120v19M360 137v19M360 137h240v19" stroke="#475569" stroke-width="2" fill="none"/><rect x="15" y="156" width="210" height="70" rx="9" fill="#fee2e2" stroke="#b91c1c"/><rect x="255" y="156" width="210" height="70" rx="9" fill="#fef3c7" stroke="#a16207"/><rect x="495" y="156" width="210" height="70" rx="9" fill="#dcfce7" stroke="#15803d"/><text x="120" y="181" font-size="17" font-weight="bold">RED</text><text x="120" y="204" font-size="13">Immediate interventions</text><text x="360" y="181" font-size="17" font-weight="bold">YELLOW</text><text x="360" y="204" font-size="13">Treatment and monitoring</text><text x="600" y="181" font-size="17" font-weight="bold">GREEN</text><text x="600" y="204" font-size="13">Assess walking patients</text><path d="M120 226v27" stroke="#475569" stroke-width="2"/><rect x="15" y="253" width="210" height="63" rx="9" fill="#dbeafe" stroke="#1d4ed8"/><text x="120" y="277" font-size="16" font-weight="bold">BLUE</text><text x="120" y="297" font-size="11">Senior clinician decision</text><rect x="255" y="253" width="210" height="63" rx="9" fill="#e5e7eb" stroke="#64748b"/><text x="360" y="277" font-size="16" font-weight="bold">GREY</text><text x="360" y="297" font-size="11">Local declaration protocol</text><rect x="495" y="253" width="210" height="63" rx="9" fill="#ede9fe" stroke="#6d28d9"/><text x="600" y="277" font-size="15" font-weight="bold">Reassess</text><text x="600" y="297" font-size="12">Update acuity and location</text><rect x="85" y="338" width="550" height="45" rx="9" fill="#e0e7ff" stroke="#4338ca"/><text x="360" y="356" font-size="14" font-weight="bold">Coordinate staff, supplies and patient flow</text><text x="360" y="373" font-size="12">Maintain appropriate care as resources change</text><text x="360" y="402" font-size="11">Learning summary only. Use the complete local incident triage protocol.</text></g></svg>