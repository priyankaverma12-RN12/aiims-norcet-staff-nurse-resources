<svg xmlns="http://www.w3.org/2000/svg" width="720" height="370" viewBox="0 0 720 370" role="img" aria-labelledby="t d"><title id="t">Safe trauma transfer</title><desc id="d">Confirm destination, prepare patient and team, maintain care during transport, then hand over safely.</desc><rect width="720" height="370" rx="16" fill="#f8fafc"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#172554"><text x="360" y="36" font-size="22" font-weight="bold">Safe transfer: continuity of care</text><rect x="165" y="60" width="390" height="53" rx="10" fill="#dbeafe" stroke="#2563eb"/><text x="360" y="81" font-size="16" font-weight="bold">1. Decide</text><text x="360" y="101" font-size="13">Capability and acceptance</text><path d="M360 113v19m-5-6 5 6 5-6" stroke="#475569" stroke-width="2" fill="none"/><rect x="165" y="132" width="390" height="53" rx="10" fill="#dcfce7" stroke="#15803d"/><text x="360" y="153" font-size="16" font-weight="bold">2. Prepare</text><text x="360" y="173" font-size="13">Patient, team and reserves</text><path d="M360 185v19m-5-6 5 6 5-6" stroke="#475569" stroke-width="2" fill="none"/><rect x="165" y="204" width="390" height="53" rx="10" fill="#dbeafe" stroke="#2563eb"/><text x="360" y="225" font-size="16" font-weight="bold">3. Transport</text><text x="360" y="245" font-size="13">Monitor and respond</text><path d="M360 257v19m-5-6 5 6 5-6" stroke="#475569" stroke-width="2" fill="none"/><rect x="165" y="276" width="390" height="53" rx="10" fill="#dcfce7" stroke="#15803d"/><text x="360" y="297" font-size="16" font-weight="bold">4. Arrive</text><text x="360" y="317" font-size="13">Handover and continuity</text><text x="360" y="354" font-size="12">Reassess when condition changes. Follow the clinical transfer protocol.</text></g></svg>