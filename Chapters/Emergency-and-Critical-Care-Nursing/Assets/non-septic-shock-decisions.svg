<svg xmlns="http://www.w3.org/2000/svg" width="720" height="350" viewBox="0 0 720 350" role="img" aria-labelledby="t d"><title id="t">Non-septic shock mechanisms</title><desc id="d">Compare low volume, pump failure, obstruction and loss of vascular tone. Mixed mechanisms can coexist.</desc><rect width="720" height="350" rx="14" fill="#f8fafc"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#172554"><text x="360" y="33" font-size="22" font-weight="bold">Shock: identify the mechanism</text><rect x="20" y="56" width="330" height="90" rx="10" fill="#fee2e2" stroke="#b91c1c"/><text x="185" y="82" font-size="17" font-weight="bold">Hypovolemic</text><text x="185" y="105" font-size="13">Reduced circulating volume</text><text x="185" y="125" font-size="12">See major trauma and bleeding care</text><rect x="370" y="56" width="330" height="90" rx="10" fill="#dbeafe" stroke="#2563eb"/><text x="535" y="82" font-size="17" font-weight="bold">Cardiogenic</text><text x="535" y="105" font-size="13">Inadequate pump performance</text><text x="535" y="125" font-size="12">Assess ventricular phenotype</text><rect x="20" y="165" width="330" height="90" rx="10" fill="#fef3c7" stroke="#a16207"/><text x="185" y="191" font-size="17" font-weight="bold">Obstructive</text><text x="185" y="214" font-size="13">Impeded circulation</text><text x="185" y="234" font-size="12">Example: high-risk pulmonary embolism</text><rect x="370" y="165" width="330" height="90" rx="10" fill="#dcfce7" stroke="#15803d"/><text x="535" y="191" font-size="17" font-weight="bold">Distributive</text><text x="535" y="214" font-size="13">Altered vascular tone or distribution</text><text x="535" y="234" font-size="12">Examples: anaphylaxis, neurogenic shock</text><rect x="82" y="274" width="556" height="44" rx="9" fill="#e0e7ff" stroke="#4338ca"/><text x="360" y="293" font-size="15" font-weight="bold">Mixed mechanisms can coexist</text><text x="360" y="309" font-size="12">Reassess tissue perfusion and treatment response</text><text x="360" y="338" font-size="11">Educational comparison, not a treatment algorithm.</text></g></svg>