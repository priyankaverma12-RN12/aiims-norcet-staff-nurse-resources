<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="t d"><title id="t">Advanced ICU monitoring</title><desc id="d">Illustrative pressure waveforms for adequate, underdamped and overdamped systems, plus perfusion assessment reminders.</desc><rect width="720" height="360" rx="14" fill="#f8fafc"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#172554"><text x="360" y="33" font-size="22" font-weight="bold">Pressure waveform quality</text><g stroke="#cbd5e1" fill="#ffffff"><rect x="15" y="57" width="220" height="165" rx="8"/><rect x="250" y="57" width="220" height="165" rx="8"/><rect x="485" y="57" width="220" height="165" rx="8"/></g><g font-size="15" font-weight="bold"><text x="125" y="82">Adequate response</text><text x="360" y="82">Underdamping</text><text x="595" y="82">Overdamping</text></g><g fill="none" stroke-width="3" stroke-linejoin="round"><path d="M28 171L44 171Q54 100 66 110L91 143L100 135L108 148L127 171L143 171Q153 100 165 110L190 143L199 135L207 148L222 171" stroke="#15803d"/><path d="M263 180L280 180L291 96L301 129L309 112L318 150L327 135L336 176L347 180L365 180L376 96L386 129L394 112L403 150L412 135L421 176L457 180" stroke="#b45309"/><path d="M498 170Q510 170 520 154Q535 131 548 150Q566 170 582 170Q594 170 604 154Q619 131 632 150Q650 170 692 170" stroke="#2563eb"/></g><g font-size="12"><text x="125" y="205">Recognizable contour</text><text x="360" y="205">Exaggerated oscillation</text><text x="595" y="205">Blunted contour</text></g><rect x="80" y="241" width="560" height="71" rx="10" fill="#e0e7ff" stroke="#4338ca"/><text x="360" y="264" font-size="16" font-weight="bold">Check patient, zero, reference and waveform</text><text x="360" y="285" font-size="13">Interpret pressure together with flow and organ function</text><text x="360" y="302" font-size="12">IAP trends: standardized method and concurrent organ assessment</text><text x="360" y="338" font-size="12">Schematic waveforms only, not patient tracings or a procedure protocol.</text></g></svg>