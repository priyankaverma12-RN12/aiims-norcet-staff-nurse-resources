<svg xmlns="http://www.w3.org/2000/svg" width="720" height="390" viewBox="0 0 720 390" role="img" aria-labelledby="t d"><title id="t">Snakebite nursing care overview</title><desc id="d">Safe first aid, assessment of neurotoxic and coagulation signs, indicated antivenom and continuing monitoring.</desc><rect width="720" height="390" rx="16" fill="#f8fafc"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#172554"><text x="360" y="34" font-size="22" font-weight="bold">Snakebite: assess evolving effects</text><rect x="140" y="55" width="440" height="56" rx="10" fill="#dbeafe" stroke="#2563eb"/><text x="360" y="78" font-size="16" font-weight="bold">Safe first aid and urgent referral</text><text x="360" y="98" font-size="13">Immobilize without constriction</text><path d="M360 111v24H120v14M360 135v14M360 135h240v14" stroke="#475569" stroke-width="2" fill="none"/><rect x="20" y="149" width="200" height="86" rx="10" fill="#fee2e2" stroke="#b91c1c"/><rect x="260" y="149" width="200" height="86" rx="10" fill="#fef3c7" stroke="#a16207"/><rect x="500" y="149" width="200" height="86" rx="10" fill="#dcfce7" stroke="#15803d"/><text x="120" y="174" font-size="16" font-weight="bold">Neurotoxicity</text><text x="120" y="197" font-size="13">Bulbar weakness</text><text x="120" y="217" font-size="13">Breathing support</text><text x="360" y="174" font-size="16" font-weight="bold">Coagulation</text><text x="360" y="197" font-size="13">Bleeding and tests</text><text x="360" y="217" font-size="13">Repeat if evolving</text><text x="600" y="174" font-size="16" font-weight="bold">Local and renal</text><text x="600" y="197" font-size="13">Swelling and injury</text><text x="600" y="217" font-size="13">Monitor urine trends</text><path d="M120 235v22H600v-22M360 235v35" stroke="#475569" stroke-width="2" fill="none"/><rect x="110" y="270" width="500" height="66" rx="10" fill="#e0e7ff" stroke="#4338ca"/><text x="360" y="293" font-size="16" font-weight="bold">Indicated antivenom and supportive care</text><text x="360" y="314" font-size="13">Watch for infusion reactions and reassess recovery</text><text x="360" y="366" font-size="12">Learning summary only. Use current local clinical protocols.</text></g></svg>