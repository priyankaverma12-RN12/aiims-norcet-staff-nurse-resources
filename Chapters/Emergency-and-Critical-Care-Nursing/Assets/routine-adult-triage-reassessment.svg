<svg xmlns="http://www.w3.org/2000/svg" width="720" height="410" viewBox="0 0 720 410" role="img" aria-labelledby="title desc"><title id="title">Routine triage and reassessment</title><desc id="desc">Assess urgency, route by category, reassess and escalate if condition changes. Simplified educational illustration, not a triage algorithm.</desc><rect width="720" height="410" rx="16" fill="#f8fafc"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#172554"><text x="360" y="34" font-size="21" font-weight="bold">Routine triage: urgency can change</text><rect x="235" y="54" width="250" height="49" rx="9" fill="#dbeafe" stroke="#2563eb"/><text x="360" y="75" font-size="15">Trained clinical assessment</text><text x="360" y="94" font-size="12">Check signs and clinical concern</text><path d="M360 103v30H125v18M360 133v18M360 133h235v18" stroke="#475569" stroke-width="2" fill="none"/><rect x="20" y="151" width="210" height="79" rx="10" fill="#fee2e2" stroke="#b91c1c"/><rect x="255" y="151" width="210" height="79" rx="10" fill="#fef3c7" stroke="#a16207"/><rect x="490" y="151" width="210" height="79" rx="10" fill="#dcfce7" stroke="#15803d"/><text x="125" y="177" font-size="18" font-weight="bold" fill="#991b1b">RED</text><text x="125" y="201" font-size="14">Immediate care</text><text x="360" y="177" font-size="18" font-weight="bold" fill="#854d0e">YELLOW</text><text x="360" y="201" font-size="14">Timely assessment</text><text x="595" y="177" font-size="18" font-weight="bold" fill="#166534">GREEN</text><text x="595" y="201" font-size="14">May wait with monitoring</text><path d="M125 230v35h235M360 230v35M595 230v35H360M360 265v20" stroke="#475569" stroke-width="2" fill="none"/><rect x="168" y="285" width="384" height="55" rx="9" fill="#e0e7ff" stroke="#4338ca"/><text x="360" y="306" font-size="15" font-weight="bold">Reassess and document</text><text x="360" y="326" font-size="13">Escalate new signs or clinical concern</text><path d="M168 313H12V78H235" stroke="#4338ca" stroke-width="2" fill="none" stroke-dasharray="5 4"/><path d="M235 78l-10-5v10z" fill="#4338ca"/><text x="360" y="380" font-size="12">Learning illustration only. Use the complete local triage tool.</text></g></svg>