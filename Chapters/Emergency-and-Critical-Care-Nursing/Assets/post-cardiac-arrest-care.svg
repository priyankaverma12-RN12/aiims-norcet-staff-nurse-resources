<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="title desc"><title id="title">Post-cardiac arrest priorities</title><desc id="desc">Six coordinated care priorities following ROSC, with physiological targets and recovery considerations.</desc><rect width="900" height="620" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#18354a" text-anchor="middle"><text x="450" y="42" font-size="25" font-weight="bold">ROSC: protect organs and assess the cause</text><rect x="40" y="75" width="395" height="130" rx="12" fill="#e0f2fe" stroke="#315b87"/><text x="237" y="104" font-size="19" font-weight="bold">Oxygen and ventilation</text><text x="237" y="133" font-size="16">Reliable SpO2: 90–98%</text><text x="237" y="157" font-size="16">PaCO2 generally 35–45 mm Hg</text><text x="237" y="181" font-size="14">Confirm arterial measurements</text><rect x="465" y="75" width="395" height="130" rx="12" fill="#e0f2fe" stroke="#315b87"/><text x="662" y="104" font-size="19" font-weight="bold">Perfusion and cause</text><text x="662" y="133" font-size="16">MAP at least 65 mm Hg</text><text x="662" y="157" font-size="16">Early 12-lead ECG</text><text x="662" y="181" font-size="14">Coronary pathway according to findings</text><rect x="40" y="225" width="395" height="130" rx="12" fill="#fef3c7" stroke="#927341"/><text x="237" y="254" font-size="19" font-weight="bold">Temperature control</text><text x="237" y="283" font-size="16">Unresponsive: 32–37.5 °C</text><text x="237" y="307" font-size="16">At least 36 h is reasonable</text><text x="237" y="331" font-size="14">Protocol-based monitoring</text><rect x="465" y="225" width="395" height="130" rx="12" fill="#fef3c7" stroke="#927341"/><text x="662" y="254" font-size="19" font-weight="bold">Neurological assessment</text><text x="662" y="283" font-size="16">EEG for myoclonus / seizures</text><text x="662" y="307" font-size="16">Avoid premature prognosis</text><text x="662" y="331" font-size="14">Multimodal assessment, clear confounders</text><rect x="40" y="375" width="395" height="130" rx="12" fill="#e2e8f0" stroke="#64748b"/><text x="237" y="404" font-size="19" font-weight="bold">Metabolic care</text><text x="237" y="433" font-size="16">Avoid glucose extremes</text><text x="237" y="457" font-size="16">Monitor response and complications</text><text x="237" y="481" font-size="14">Individualize support</text><rect x="465" y="375" width="395" height="130" rx="12" fill="#e2e8f0" stroke="#64748b"/><text x="662" y="404" font-size="19" font-weight="bold">Recovery and discharge</text><text x="662" y="433" font-size="16">Patient and caregiver support</text><text x="662" y="457" font-size="16">Rehabilitation and follow-up</text><text x="662" y="481" font-size="14">Shared individualized plan</text><text x="450" y="552" font-size="15">Educational overview — not a complete clinical protocol.</text><text x="450" y="580" font-size="14">Source: AHA Post-Cardiac Arrest Care, 2025</text></g></svg>