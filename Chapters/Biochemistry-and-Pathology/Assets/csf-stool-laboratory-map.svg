<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="t d"><title id="t">CSF and stool laboratory test pathways</title><desc id="d">CSF uses cells and chemistry, specialized assays and paired samples. Stool uses occult blood, malabsorption tests and parasite examination.</desc><rect width="800" height="420" rx="18" fill="#f6f8fc"/><g font-family="Arial,sans-serif" fill="#15324d" text-anchor="middle"><text x="400" y="34" font-size="22" font-weight="bold">Clinical pathology: match specimen to test</text><g stroke="#316080" stroke-width="2"><rect x="35" y="55" width="345" height="48" rx="10" fill="#d9eaf8"/><rect x="420" y="55" width="345" height="48" rx="10" fill="#e3efdf"/></g><g font-weight="bold" font-size="18"><text x="207" y="85">CSF</text><text x="592" y="85">Stool</text></g><g fill="#fff" stroke="#6b8090" stroke-width="1.5"><rect x="35" y="132" width="345" height="74" rx="8"/><rect x="35" y="222" width="345" height="74" rx="8"/><rect x="420" y="132" width="345" height="74" rx="8"/><rect x="420" y="222" width="345" height="74" rx="8"/><rect x="155" y="331" width="490" height="60" rx="9" fill="#e9eef4"/></g><g font-size="15"><text x="207" y="155" font-weight="bold">Cell count and chemistry</text><text x="207" y="178">Differential, protein, glucose ratio</text><text x="207" y="197">Age and blood contamination matter</text><text x="207" y="245" font-weight="bold">Targeted assays</text><text x="207" y="268">Culture / PCR / cytology / IgG bands</text><text x="207" y="287">Paired serum when indicated</text><text x="592" y="155" font-weight="bold">Biochemistry</text><text x="592" y="178">FIT, elastase, fat, electrolytes</text><text x="592" y="197">Correct collection and consistency</text><text x="592" y="245" font-weight="bold">Parasite investigation</text><text x="592" y="268">Fresh wet mount, concentration, stain</text><text x="592" y="287">PCR-compatible preservation</text><text x="400" y="356" font-weight="bold">Interpret with clinical context</text><text x="400" y="378">Single negative or positive result is not definitive</text></g><g stroke="#316080" stroke-width="2" fill="none"><path d="M207 103 V132 M207 206 V222 M592 103 V132 M592 206 V222 M207 296 V314 H400 V331 M592 296 V314 H400"/></g></g></svg>