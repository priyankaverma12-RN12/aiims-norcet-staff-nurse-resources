<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 425" role="img" aria-labelledby="title desc"><title id="title">Cell injury and biomarker interpretation</title><desc id="desc">Stress can produce adaptation, reversible injury or irreversible injury. Biomarker results require clinical context and assay review.</desc><rect width="900" height="425" rx="18" fill="#f7fafc"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#48606e"/></marker></defs><g font-family="sans-serif" fill="#182e3c" text-anchor="middle"><text x="450" y="35" font-size="25" font-weight="bold">Cell injury and biomarker reasoning</text><rect x="320" y="56" width="260" height="50" rx="9" fill="#dbe9f8"/><text x="450" y="86" font-size="18">Cellular stress</text><g font-size="16"><rect x="25" y="151" width="255" height="75" rx="10" fill="#e4f2e5"/><text x="152" y="178" font-weight="bold">Adaptation</text><text x="152" y="201" font-size="14">Size, number or phenotype</text><rect x="322" y="151" width="255" height="75" rx="10" fill="#fff0cf"/><text x="449" y="178" font-weight="bold">Reversible injury</text><text x="449" y="201" font-size="14">Early ATP / ion-pump changes</text><rect x="620" y="151" width="255" height="75" rx="10" fill="#fbe0e0"/><text x="747" y="178" font-weight="bold">Irreversible injury</text><text x="747" y="201" font-size="14">Severe cellular damage</text><rect x="25" y="279" width="255" height="89" rx="10" fill="#e3eaf5"/><text x="152" y="306" font-weight="bold">Biomarker change</text><text x="152" y="330" font-size="14">Tissue release or altered</text><text x="152" y="349" font-size="14">production / clearance</text><rect x="322" y="279" width="255" height="89" rx="10" fill="#e3eaf5"/><text x="449" y="306" font-weight="bold">Check the sample</text><text x="449" y="330" font-size="14">Timing, interference,</text><text x="449" y="349" font-size="14">method and trends</text><rect x="620" y="279" width="255" height="89" rx="10" fill="#e4f2e5"/><text x="747" y="306" font-weight="bold">Clinical correlation</text><text x="747" y="330" font-size="14">Symptoms, examination,</text><text x="747" y="349" font-size="14">other investigations</text></g></g><g stroke="#48606e" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M450 106v18H152v23"/><path d="M450 124v23"/><path d="M450 124h297v23"/><path d="M577 188h39"/><path d="M280 323h38"/><path d="M577 323h39"/></g><text x="450" y="402" font-size="13" text-anchor="middle" fill="#48606e" font-family="sans-serif">Branches are possible responses, not mandatory sequential stages.</text></svg>