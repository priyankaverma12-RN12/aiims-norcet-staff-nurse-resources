<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" role="img" aria-labelledby="title desc"><title id="title">Diagnostic specimen routing</title><desc id="desc">The required study determines the correct specimen pathway. Routine histology uses validated fixation. Frozen section uses immediate fresh transport. Viable-cell and specialized studies need laboratory-specific conditions.</desc><rect width="900" height="390" rx="20" fill="#f8fafc"/><g font-family="sans-serif" fill="#172b3a" text-anchor="middle"><text x="450" y="40" font-size="25" font-weight="bold">Diagnostic specimen routing</text><rect x="260" y="60" width="380" height="62" rx="10" fill="#dde9f7"/><text x="450" y="85" font-size="18" font-weight="bold">Confirm requested study first</text><text x="450" y="106" font-size="14">Identity • site • orientation • timing • lab protocol</text><rect x="25" y="185" width="260" height="115" rx="12" fill="#e4f3e7"/><text x="155" y="214" font-size="18" font-weight="bold">Routine histology</text><text x="155" y="240" font-size="15">Validated fixative</text><text x="155" y="262" font-size="15">Preserve tissue architecture</text><text x="155" y="282" font-size="14">Permanent sections</text><rect x="320" y="185" width="260" height="115" rx="12" fill="#e4eefb"/><text x="450" y="214" font-size="18" font-weight="bold">Frozen section</text><text x="450" y="240" font-size="15">Fresh, prompt transport</text><text x="450" y="262" font-size="15">Prearrange with pathology</text><text x="450" y="282" font-size="14">Rapid intraoperative assessment</text><rect x="615" y="185" width="260" height="115" rx="12" fill="#f8ebd8"/><text x="745" y="214" font-size="18" font-weight="bold">Specialized studies</text><text x="745" y="240" font-size="15">Laboratory-specific medium</text><text x="745" y="262" font-size="15">Flow / IF / EM / cytogenetics</text><text x="745" y="282" font-size="14">Do not assume routine formalin</text><text x="450" y="345" font-size="16" font-weight="bold">Handle according to local validated procedures.</text></g><g fill="none" stroke="#456070" stroke-width="2"><path d="M450 122v25H155v34m-6 -8 6 8 6 -8M450 147v34m-6 -8 6 8 6 -8M450 147H745v34m-6 -8 6 8 6 -8"/></g></svg>