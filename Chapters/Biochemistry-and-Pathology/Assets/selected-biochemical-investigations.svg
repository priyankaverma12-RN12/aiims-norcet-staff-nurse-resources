<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" role="img" aria-labelledby="t d"><title id="t">Compare glucose challenge protocols</title><desc id="d">Three different named pregnancy test protocols are shown: ADA two-step, ADA one-step, and NHM India operational pathway. Tests are not interchangeable. Reference ranges are distinguished from decision thresholds.</desc><rect width="960" height="490" rx="16" fill="#f8fafc"/><g font-family="sans-serif" fill="#183344" text-anchor="middle"><text x="480" y="36" font-size="24" font-weight="bold">Glucose challenge: identify the named protocol</text><g font-size="16"><rect x="24" y="62" width="288" height="58" rx="10" fill="#deebf9"/><text x="168" y="87" font-size="18" font-weight="bold">ADA two-step</text><text x="168" y="107" font-size="13">Named screening and diagnostic sequence</text><rect x="336" y="62" width="288" height="58" rx="10" fill="#e1f0e2"/><text x="480" y="87" font-size="18" font-weight="bold">ADA one-step</text><text x="480" y="107" font-size="13">Fasting diagnostic test</text><rect x="648" y="62" width="288" height="58" rx="10" fill="#f9ecd5"/><text x="792" y="87" font-size="18" font-weight="bold">NHM India (2018)</text><text x="792" y="107" font-size="13">Operational single-step pathway</text><rect x="24" y="150" width="288" height="75" rx="10" fill="#e8f0fa"/><text x="168" y="179">50-g nonfasting GLT</text><text x="168" y="202" font-size="14">1-hour screening sample</text><rect x="24" y="253" width="288" height="96" rx="10" fill="#e8f0fa"/><text x="168" y="278" font-size="15">If screen positive: 100-g fasting</text><text x="168" y="301" font-size="14">Fasting / 1 / 2 / 3-hour samples</text><text x="168" y="325" font-size="14">Specified diagnostic rules</text><rect x="336" y="150" width="288" height="199" rx="10" fill="#eaf4eb"/><text x="480" y="187">75-g fasting OGTT</text><text x="480" y="216" font-size="15">Fasting: 92 mg/dL</text><text x="480" y="241" font-size="15">1 hour: 180 mg/dL</text><text x="480" y="266" font-size="15">2 hours: 153 mg/dL</text><text x="480" y="310" font-size="14">One qualifying value</text><rect x="648" y="150" width="288" height="199" rx="10" fill="#fcf1df"/><text x="792" y="187">75-g oral load</text><text x="792" y="216" font-size="15">Irrespective of last meal</text><text x="792" y="241" font-size="15">2-hour value</text><text x="792" y="266" font-size="15">Flowchart: ≥140 mg/dL</text><text x="792" y="310" font-size="14">Use approved local programme</text></g><rect x="24" y="382" width="912" height="70" rx="10" fill="#e5e9f1"/><text x="480" y="410" font-size="17" font-weight="bold">Never exchange thresholds between different loads and sampling protocols.</text><text x="480" y="434" font-size="14">Reference interval ≠ diagnostic decision limit ≠ critical alert limit.</text><text x="480" y="473" font-size="12">Teaching summary, not an independent clinical protocol.</text></g><g stroke="#506c7d" fill="none" stroke-width="2"><path d="M168 120v25m-5-7 5 7 5-7M168 225v23m-5-7 5 7 5-7M480 120v25m-5-7 5 7 5-7M792 120v25m-5-7 5 7 5-7"/></g></svg>