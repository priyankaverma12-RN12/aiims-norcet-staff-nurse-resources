<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">Three circulatory pathology mechanisms</title><desc id="desc">Gangrene is tissue necrosis from ischemia or infection. Shock is insufficient tissue oxygen delivery or use. Edema reflects filtration and clearance imbalance.</desc><rect width="900" height="420" rx="18" fill="#f8fafc"/><g font-family="sans-serif" text-anchor="middle" fill="#1c303e"><text x="450" y="37" font-size="25" font-weight="bold">Circulation and tissue pathology</text><g font-size="17"><rect x="22" y="66" width="272" height="55" rx="9" fill="#f8dedc"/><text x="158" y="100" font-weight="bold">Gangrene</text><rect x="314" y="66" width="272" height="55" rx="9" fill="#ffeccf"/><text x="450" y="100" font-weight="bold">Shock</text><rect x="606" y="66" width="272" height="55" rx="9" fill="#dfeaf8"/><text x="742" y="100" font-weight="bold">Edema</text><rect x="22" y="155" width="272" height="78" rx="9" fill="#f8dedc"/><text x="158" y="184">Ischemia or infection</text><text x="158" y="209">Nonviable tissue</text><rect x="314" y="155" width="272" height="78" rx="9" fill="#ffeccf"/><text x="450" y="184">Oxygen supply or use</text><text x="450" y="209">Fails to meet demand</text><rect x="606" y="155" width="272" height="78" rx="9" fill="#dfeaf8"/><text x="742" y="184">Filtration exceeds</text><text x="742" y="209">Fluid clearance</text><rect x="22" y="275" width="272" height="85" rx="9" fill="#f8dedc"/><text x="158" y="304">Dry / wet / gas patterns</text><text x="158" y="330" font-size="14">Assess perfusion and infection</text><rect x="314" y="275" width="272" height="85" rx="9" fill="#ffeccf"/><text x="450" y="304">Cell and organ dysfunction</text><text x="450" y="330" font-size="14">Assess more than pressure alone</text><rect x="606" y="275" width="272" height="85" rx="9" fill="#dfeaf8"/><text x="742" y="304">Interstitial accumulation</text><text x="742" y="330" font-size="14">Assess cause and distribution</text></g><text x="450" y="394" font-size="14">Mechanisms can coexist. Clinical deterioration requires urgent assessment.</text></g><g stroke="#47606e" stroke-width="2" fill="none"><path d="M158 121v29m-5 -7 5 7 5 -7M450 121v29m-5 -7 5 7 5 -7M742 121v29m-5 -7 5 7 5 -7M158 233v37m-5 -7 5 7 5 -7M450 233v37m-5 -7 5 7 5 -7M742 233v37m-5 -7 5 7 5 -7"/></g></svg>