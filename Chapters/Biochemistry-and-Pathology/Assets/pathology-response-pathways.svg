<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="title desc"><title id="title">Inflammation, repair and thrombus pathways</title><desc id="desc">Three separate teaching pathways. Inflammation proceeds from injury to recruitment and resolution or chronic injury. Repair phases overlap. A thrombus can propagate, dissolve, organize or embolize.</desc><rect width="900" height="480" rx="18" fill="#f7fafc"/><g font-family="sans-serif" fill="#172b3a"><text x="30" y="35" font-size="25" font-weight="bold">General pathology: response pathways</text><text x="30" y="82" font-size="18" font-weight="bold">Inflammation</text><g font-size="15" text-anchor="middle"><rect x="30" y="98" width="165" height="64" rx="9" fill="#fde8e8"/><text x="112" y="124">Injury / microbial</text><text x="112" y="145">signals</text><rect x="235" y="98" width="180" height="64" rx="9" fill="#fde8e8"/><text x="325" y="124">Vascular leak</text><text x="325" y="145">and recruitment</text><rect x="455" y="98" width="180" height="64" rx="9" fill="#e1f2e6"/><text x="545" y="124">Clear trigger</text><text x="545" y="145">and resolve</text><rect x="675" y="98" width="190" height="64" rx="9" fill="#f8e7cb"/><text x="770" y="124">Or persistent injury</text><text x="770" y="145">and chronic response</text></g><text x="30" y="214" font-size="18" font-weight="bold">Wound repair (overlapping phases)</text><g font-size="15" text-anchor="middle"><rect x="30" y="230" width="180" height="65" rx="9" fill="#d8ebf7"/><text x="120" y="256">Hemostasis</text><text x="120" y="277">Fibrin scaffold</text><rect x="245" y="230" width="180" height="65" rx="9" fill="#fde8e8"/><text x="335" y="256">Inflammation</text><text x="335" y="277">Clear debris</text><rect x="460" y="230" width="180" height="65" rx="9" fill="#e1f2e6"/><text x="550" y="256">Proliferation</text><text x="550" y="277">Matrix and vessels</text><rect x="675" y="230" width="190" height="65" rx="9" fill="#e3e2f6"/><text x="770" y="256">Remodeling</text><text x="770" y="277">Scar maturation</text></g><text x="30" y="347" font-size="18" font-weight="bold">Possible thrombus outcomes (not a sequence)</text><g font-size="15" text-anchor="middle"><rect x="30" y="368" width="180" height="70" rx="9" fill="#f8e7cb"/><text x="120" y="396">Propagation</text><text x="120" y="417">Clot grows</text><rect x="245" y="368" width="180" height="70" rx="9" fill="#e1f2e6"/><text x="335" y="396">Dissolution</text><text x="335" y="417">Fibrin breakdown</text><rect x="460" y="368" width="180" height="70" rx="9" fill="#d8ebf7"/><text x="550" y="396">Organization</text><text x="550" y="417">Possible channels</text><rect x="675" y="368" width="190" height="70" rx="9" fill="#fde8e8"/><text x="770" y="396">Embolization</text><text x="770" y="417">Distant obstruction</text></g></g><g stroke="#456070" stroke-width="2" fill="none"><path d="M195 130h35m-8 -5 8 5 -8 5M415 130h35m-8 -5 8 5 -8 5M210 263h30m-8 -5 8 5 -8 5M425 263h30m-8 -5 8 5 -8 5M640 263h30m-8 -5 8 5 -8 5"/></g></svg>