<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="t d"><title id="t">Clinical assay interpretation framework</title><desc id="d">Three examples distinguish enzyme activity from protein mass, chemistry total carbon dioxide from gas-calculated bicarbonate, and organ injury markers from functional and analytical influences.</desc><rect width="960" height="470" rx="16" fill="#f8fafc"/><g font-family="sans-serif" fill="#17313f" text-anchor="middle"><text x="480" y="38" font-size="24" font-weight="bold">Clinical assay interpretation: what is measured?</text><g font-size="16"><rect x="24" y="66" width="288" height="62" rx="10" fill="#dbe9f9"/><text x="168" y="92" font-size="18" font-weight="bold">Enzymology</text><text x="168" y="113" font-size="14">Catalytic activity vs protein mass</text><rect x="336" y="66" width="288" height="62" rx="10" fill="#f7e7ca"/><text x="480" y="92" font-size="18" font-weight="bold">Acid-base</text><text x="480" y="113" font-size="14">Measured vs calculated analytes</text><rect x="648" y="66" width="288" height="62" rx="10" fill="#dff1e2"/><text x="792" y="92" font-size="18" font-weight="bold">Organ tests</text><text x="792" y="113" font-size="14">Injury vs function vs clearance</text><rect x="24" y="158" width="288" height="118" rx="10" fill="#e8f0fa"/><text x="168" y="184" font-weight="bold">Assay conditions</text><text x="168" y="209" font-size="14">Kinetic rate and linear range</text><text x="168" y="231" font-size="14">Temperature, cofactors</text><text x="168" y="253" font-size="14">Macroenzyme interference</text><rect x="336" y="158" width="288" height="118" rx="10" fill="#fbf0dd"/><text x="480" y="184" font-weight="bold">Sample and method</text><text x="480" y="209" font-size="14">Chemistry: total CO₂</text><text x="480" y="231" font-size="14">Blood gas: pH, PCO₂ → HCO₃</text><text x="480" y="253" font-size="14">Air, dilution, delay, lipemia</text><rect x="648" y="158" width="288" height="118" rx="10" fill="#e9f4e9"/><text x="792" y="184" font-weight="bold">Biological context</text><text x="792" y="209" font-size="14">Creatinine / cystatin C</text><text x="792" y="231" font-size="14">Liver enzymes / synthesis</text><text x="792" y="253" font-size="14">Thyroid immunoassay effects</text></g><rect x="185" y="325" width="590" height="92" rx="12" fill="#e4e9f3"/><text x="480" y="355" font-size="19" font-weight="bold">Integrate the actual clinical context</text><text x="480" y="380" font-size="15">Check method, specimen quality, timing and trends.</text><text x="480" y="401" font-size="15">Escalate critical findings and clarify discordance with the lab.</text><text x="480" y="447" font-size="13">Teaching diagram, not a standalone diagnostic or treatment algorithm.</text></g><g stroke="#526b78" stroke-width="2" fill="none"><path d="M168 128v26m-5 -7 5 7 5 -7M480 128v26m-5 -7 5 7 5 -7M792 128v26m-5 -7 5 7 5 -7M168 276v24h312v21M480 276v45M792 276v24H480m-5 14 5 7 5 -7"/></g></svg>