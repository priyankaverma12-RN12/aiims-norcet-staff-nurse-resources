<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" role="img" aria-labelledby="title desc"><title id="title">Integrated metabolic pathways</title><desc id="desc">Glucose undergoes glycolysis to pyruvate, which can form lactate or acetyl-CoA. Fatty acids yield acetyl-CoA. Amino acid carbon skeletons enter metabolic pathways and nitrogen enters the hepatic urea cycle.</desc><rect width="960" height="530" rx="18" fill="#f8fafc"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#47606e"/></marker></defs><g font-family="sans-serif" fill="#172b3a" text-anchor="middle"><text x="480" y="36" font-size="25" font-weight="bold">Integrated metabolism: energy and nitrogen</text><g font-size="16"><rect x="35" y="65" width="250" height="60" rx="9" fill="#dcebf9"/><text x="160" y="92" font-weight="bold">Glucose</text><text x="160" y="112">Cytosolic glycolysis</text><rect x="355" y="65" width="250" height="60" rx="9" fill="#fce7ce"/><text x="480" y="92" font-weight="bold">Fatty acids</text><text x="480" y="112">Mitochondrial beta-oxidation</text><rect x="675" y="65" width="250" height="60" rx="9" fill="#e2f1de"/><text x="800" y="92" font-weight="bold">Amino acids</text><text x="800" y="112">Separate carbon and nitrogen</text><rect x="35" y="172" width="250" height="55" rx="9" fill="#dcebf9"/><text x="160" y="205">Pyruvate</text><rect x="355" y="172" width="250" height="55" rx="9" fill="#fce7ce"/><text x="480" y="205">Acetyl-CoA</text><rect x="675" y="172" width="250" height="55" rx="9" fill="#e2f1de"/><text x="800" y="196">Carbon skeletons</text><text x="800" y="215" font-size="13">Pathway depends on amino acid</text><rect x="35" y="281" width="250" height="65" rx="9" fill="#dcebf9"/><text x="160" y="308">Lactate</text><text x="160" y="328" font-size="14">NAD+ regeneration</text><rect x="355" y="281" width="250" height="65" rx="9" fill="#e7e2f8"/><text x="480" y="307">TCA cycle and respiratory chain</text><text x="480" y="328" font-size="14">ATP production with oxygen</text><rect x="675" y="281" width="250" height="65" rx="9" fill="#e2f1de"/><text x="800" y="307">Nitrogen transport</text><text x="800" y="328" font-size="14">Glutamine / alanine</text><rect x="355" y="400" width="250" height="60" rx="9" fill="#fce7ce"/><text x="480" y="427">Hepatic ketone production</text><text x="480" y="448" font-size="14">Selected fasting states</text><rect x="675" y="400" width="250" height="60" rx="9" fill="#e2f1de"/><text x="800" y="427">Hepatic urea cycle</text><text x="800" y="448" font-size="14">Urea excreted by kidney</text></g></g><g stroke="#47606e" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M160 125v42"/><path d="M480 125v42"/><path d="M800 125v42"/><path d="M285 200h65"/><path d="M160 227v49"/><path d="M480 227v49"/><path d="M605 312h38v-112h27" marker-end="none"/><path d="M675 200h-65"/><path d="M925 95h18v218h-13"/><path d="M800 346v49"/><path d="M605 200h25v230h-20"/></g><text x="35" y="499" font-family="sans-serif" font-size="13" fill="#47606e">Simplified teaching map. Not all amino acids enter through acetyl-CoA.</text></svg>