<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" role="img" aria-labelledby="title desc"><title id="title">Bilirubin pathway and serum protein fractions</title><desc id="desc">Heme is converted to biliverdin and bilirubin, transported to liver on albumin, conjugated and excreted in bile. Schematic protein electrophoresis trace shows albumin, alpha, beta and gamma regions, not a clinical sample.</desc><rect width="920" height="440" rx="18" fill="#f8fafc"/><g font-family="sans-serif" fill="#203542"><text x="460" y="35" font-size="25" text-anchor="middle" font-weight="bold">Clinical biochemistry: two core pathways</text><text x="24" y="65" font-size="17" font-weight="bold">Heme catabolism</text><g text-anchor="middle" font-size="15"><rect x="24" y="82" width="157" height="70" rx="9" fill="#e2ebfa"/><text x="102" y="110">Heme</text><text x="102" y="132" font-size="13">Oxygenase</text><rect x="203" y="82" width="157" height="70" rx="9" fill="#dff0dd"/><text x="281" y="110">Biliverdin</text><text x="281" y="132" font-size="13">Reductase</text><rect x="382" y="82" width="157" height="70" rx="9" fill="#fff0c7"/><text x="460" y="110">Unconjugated</text><text x="460" y="132">bilirubin</text><rect x="561" y="82" width="157" height="70" rx="9" fill="#fff0c7"/><text x="639" y="110">Hepatic UGT1A1</text><text x="639" y="132">Conjugation</text><rect x="740" y="82" width="157" height="70" rx="9" fill="#e2f1de"/><text x="818" y="110">Biliary export</text><text x="818" y="132">MRP2</text></g><text x="24" y="193" font-size="17" font-weight="bold">Serum protein electrophoresis — illustrative pattern</text><path d="M35 354H890M35 354V214" stroke="#5e7180" stroke-width="1.5" fill="none"/><path d="M40 352 C70 352 87 345 105 335 C135 320 139 218 162 218 C185 218 188 342 210 349 C237 352 248 319 268 319 C288 319 298 350 318 350 C344 350 355 294 382 294 C410 294 416 350 438 350 C472 350 484 306 505 306 C527 306 535 346 555 346 C577 346 584 318 604 318 C624 318 634 348 650 348 C682 348 710 309 758 307 C809 305 834 346 884 352" fill="#dbe8f5" stroke="#386b92" stroke-width="3"/><g font-size="14" text-anchor="middle"><text x="162" y="378">Albumin</text><text x="268" y="378">Alpha-1</text><text x="382" y="378">Alpha-2</text><text x="550" y="378">Beta</text><text x="758" y="378">Gamma</text></g><text x="460" y="411" font-size="13" text-anchor="middle">Schematic only. Relative peaks and fractions vary with platform and specimen.</text></g><g stroke="#4c6573" stroke-width="2" fill="none"><path d="M181 117h18m-6 -5 6 5 -6 5M360 117h18m-6 -5 6 5 -6 5M539 117h18m-6 -5 6 5 -6 5M718 117h18m-6 -5 6 5 -6 5"/></g></svg>