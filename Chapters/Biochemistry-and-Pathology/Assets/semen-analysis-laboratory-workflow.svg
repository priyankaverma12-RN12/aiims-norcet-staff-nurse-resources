<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title desc"><title id="title">Semen analysis laboratory workflow</title><desc id="desc">Collection quality leads to macroscopic and microscopic examination and contextual interpretation.</desc><rect width="760" height="400" rx="18" fill="#f5f8fc"/><g font-family="Arial,sans-serif" fill="#18324a"><text x="380" y="35" font-size="22" font-weight="bold" text-anchor="middle">Semen analysis: laboratory workflow</text><g stroke="#315c7d" stroke-width="2" fill="#e5eff9"><rect x="180" y="57" width="400" height="59" rx="10"/><rect x="30" y="151" width="330" height="102" rx="10"/><rect x="400" y="151" width="330" height="102" rx="10"/><rect x="180" y="292" width="400" height="79" rx="10"/></g><g font-size="16" text-anchor="middle"><text x="380" y="82" font-weight="bold">Collection and acceptance</text><text x="380" y="103">Time, abstinence, completeness</text><text x="195" y="177" font-weight="bold">Macroscopic</text><text x="195" y="200">Volume, liquefaction, viscosity</text><text x="195" y="222">pH at standardized time</text><text x="565" y="177" font-weight="bold">Microscopic</text><text x="565" y="200">Concentration, motility, morphology</text><text x="565" y="222">Vitality where indicated</text><text x="380" y="318" font-weight="bold">Interpret together</text><text x="380" y="340">Total sperm = concentration × volume</text><text x="380" y="359">Reference percentile is not a fertility diagnosis</text></g><g fill="none" stroke="#315c7d" stroke-width="2.5"><path d="M380 116 V132 H195 V151"/><path d="M380 132 H565 V151"/><path d="M195 253 V270 H380 V292"/><path d="M565 253 V270 H380"/></g></g></svg>