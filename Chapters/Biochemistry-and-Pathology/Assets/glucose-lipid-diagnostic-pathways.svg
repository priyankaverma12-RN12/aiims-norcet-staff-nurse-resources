<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 465" role="img" aria-labelledby="t d"><title id="t">Glucose and lipid laboratory reasoning</title><desc id="d">Glucose interpretation depends on collection, analytical method and clinical context. Lipid profiles estimate different cholesterol fractions and apoB provides additional particle information.</desc><rect width="960" height="465" rx="16" fill="#f8fafc"/><g font-family="sans-serif" fill="#183140" text-anchor="middle"><text x="480" y="36" font-size="24" font-weight="bold">Glucose and lipid laboratory reasoning</text><text x="480" y="70" font-size="18" font-weight="bold">Glucose: avoid preanalytical and assay errors</text><g font-size="16"><rect x="30" y="91" width="280" height="88" rx="10" fill="#dfeaf8"/><text x="170" y="119" font-weight="bold">Collect</text><text x="170" y="143" font-size="14">Correct tube, time and separation</text><text x="170" y="163" font-size="14">Limit continued glycolysis</text><rect x="340" y="91" width="280" height="88" rx="10" fill="#dfeaf8"/><text x="480" y="119" font-weight="bold">Measure</text><text x="480" y="143" font-size="14">Enzymatic laboratory method</text><text x="480" y="163" font-size="14">Check method-specific interference</text><rect x="650" y="91" width="280" height="88" rx="10" fill="#e0f1e3"/><text x="790" y="119" font-weight="bold">Interpret</text><text x="790" y="143" font-size="14">Clinical context and confirmation</text><text x="790" y="163" font-size="14">A1c limitations if RBCs altered</text></g><text x="480" y="234" font-size="18" font-weight="bold">Lipid profile: cholesterol mass versus particle marker</text><rect x="30" y="255" width="900" height="56" rx="10" fill="#f1e8d4"/><rect x="30" y="255" width="210" height="56" rx="10" fill="#dbe9f9"/><text x="135" y="288" font-size="16">HDL-C</text><text x="585" y="288" font-size="16">Non-HDL-C = total cholesterol − HDL-C</text><rect x="30" y="340" width="435" height="78" rx="10" fill="#e4ebf4"/><text x="248" y="368" font-size="17" font-weight="bold">LDL-C</text><text x="248" y="393" font-size="14">Cholesterol concentration, method-dependent</text><rect x="495" y="340" width="435" height="78" rx="10" fill="#e0f1e3"/><text x="712" y="368" font-size="17" font-weight="bold">ApoB</text><text x="712" y="393" font-size="14">Additional atherogenic particle information</text><text x="480" y="447" font-size="13">Illustrative only. Not a quantitative patient lipid distribution.</text></g><g stroke="#4b6674" stroke-width="2" fill="none"><path d="M310 135h25m-6 -5 6 5 -6 5M620 135h25m-6 -5 6 5 -6 5"/></g></svg>