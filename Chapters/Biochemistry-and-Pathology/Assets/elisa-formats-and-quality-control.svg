<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" role="img" aria-labelledby="t d"><title id="t">ELISA format comparison and quality control</title><desc id="d">Four labeled assay designs show direct and indirect detection, capture and detection antibodies in sandwich ELISA, and competition for antibody sites. Signal direction depends on the assay architecture.</desc><rect width="960" height="510" rx="16" fill="#f8fafc"/><g font-family="sans-serif" fill="#183344" text-anchor="middle"><text x="480" y="37" font-size="25" font-weight="bold">ELISA: identify the assay design first</text><g font-size="17"><rect x="20" y="64" width="215" height="258" rx="11" fill="#dcebf9"/><text x="127" y="93" font-weight="bold">Direct</text><rect x="35" y="265" width="185" height="12" rx="4" fill="#6c879b"/><ellipse cx="127" cy="244" rx="25" ry="15" fill="#efc16a"/><path d="M127 229v-44m0 0-23-24m23 24 23-24" stroke="#285878" stroke-width="7" fill="none" stroke-linecap="round"/><circle cx="127" cy="148" r="12" fill="#29916b"/><text x="127" y="115" font-size="13">Labelled primary</text><text x="127" y="303" font-size="14">Immobilized antigen</text><rect x="255" y="64" width="215" height="258" rx="11" fill="#e5eef9"/><text x="362" y="93" font-weight="bold">Indirect</text><rect x="270" y="265" width="185" height="12" rx="4" fill="#6c879b"/><ellipse cx="362" cy="244" rx="25" ry="15" fill="#efc16a"/><path d="M362 229v-31m0 0-20-20m20 20 20-20" stroke="#285878" stroke-width="7" fill="none" stroke-linecap="round"/><path d="M362 172v-29m0 0-18-18m18 18 18-18" stroke="#825aa6" stroke-width="7" fill="none" stroke-linecap="round"/><circle cx="362" cy="111" r="10" fill="#29916b"/><text x="362" y="303" font-size="14">Patient antibody target</text><rect x="490" y="64" width="215" height="258" rx="11" fill="#e3f0e4"/><text x="597" y="93" font-weight="bold">Sandwich</text><rect x="505" y="265" width="185" height="12" rx="4" fill="#6c879b"/><path d="M597 265v-36m0 0-21-21m21 21 21-21" stroke="#285878" stroke-width="7" fill="none" stroke-linecap="round"/><ellipse cx="597" cy="192" rx="32" ry="16" fill="#efc16a"/><path d="M597 175v-35m0 0-20-20m20 20 20-20" stroke="#825aa6" stroke-width="7" fill="none" stroke-linecap="round"/><circle cx="597" cy="110" r="10" fill="#29916b"/><text x="597" y="303" font-size="14">Two accessible epitopes</text><rect x="725" y="64" width="215" height="258" rx="11" fill="#fbecd5"/><text x="832" y="93" font-weight="bold">Competitive</text><rect x="740" y="265" width="185" height="12" rx="4" fill="#6c879b"/><path d="M832 265v-36m0 0-23-23m23 23 23-23" stroke="#285878" stroke-width="7" fill="none" stroke-linecap="round"/><ellipse cx="807" cy="183" rx="19" ry="14" fill="#efc16a"/><ellipse cx="867" cy="148" rx="19" ry="14" fill="#efc16a"/><circle cx="884" cy="128" r="10" fill="#29916b"/><text x="832" y="119" font-size="12">Compete for limited sites</text><text x="832" y="303" font-size="14">Specified inverse signal</text></g><rect x="24" y="348" width="912" height="110" rx="12" fill="#e5e9f1"/><text x="480" y="378" font-size="19" font-weight="bold">Quality control before patient interpretation</text><text x="480" y="406" font-size="15">Blocking · washing · calibrators · positive and negative controls</text><text x="480" y="432" font-size="15">Check reportable range, hook effect, cross-reactivity and recovery.</text><text x="480" y="484" font-size="13">Schematic teaching drawing. Green circles indicate enzyme reporter, not a fixed protocol.</text></g></svg>