<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" role="img" aria-labelledby="t d"><title id="t">ELISA format comparison and quality control</title><desc id="d">Four assay architectures are shown as labeled sequences of antigen, antibody and reporter interactions. Competitive signal direction depends on the specified design.</desc><rect width="960" height="510" rx="16" fill="#f8fafc"/><g font-family="sans-serif" fill="#183344" text-anchor="middle"><text x="480" y="36" font-size="25" font-weight="bold">ELISA: identify the assay design first</text><g font-size="16"><rect x="20" y="60" width="215" height="272" rx="11" fill="#e5eef9"/><text x="127" y="88" font-size="18" font-weight="bold">Direct</text><rect x="33" y="105" width="189" height="55" rx="7" fill="#f2dca9"/><text x="127" y="137">Immobilized antigen</text><rect x="33" y="185" width="189" height="60" rx="7" fill="#c6dce9"/><text x="127" y="209" font-size="14">Enzyme-labelled</text><text x="127" y="228" font-size="14">primary antibody</text><text x="127" y="276" font-size="14">Substrate signal</text><text x="127" y="310" font-size="13">Antigen detection</text><rect x="255" y="60" width="215" height="272" rx="11" fill="#e5eef9"/><text x="362" y="88" font-size="18" font-weight="bold">Indirect</text><rect x="268" y="105" width="189" height="43" rx="7" fill="#f2dca9"/><text x="362" y="132" font-size="14">Coated antigen</text><rect x="268" y="162" width="189" height="43" rx="7" fill="#c6dce9"/><text x="362" y="189" font-size="14">Patient antibody</text><rect x="268" y="219" width="189" height="43" rx="7" fill="#ded1eb"/><text x="362" y="246" font-size="13">Labelled anti-human Ig</text><text x="362" y="288" font-size="14">Substrate signal</text><text x="362" y="310" font-size="13">Antibody detection</text><rect x="490" y="60" width="215" height="272" rx="11" fill="#e3f0e4"/><text x="597" y="88" font-size="18" font-weight="bold">Sandwich</text><rect x="503" y="105" width="189" height="43" rx="7" fill="#c6dce9"/><text x="597" y="132" font-size="14">Capture antibody</text><rect x="503" y="162" width="189" height="43" rx="7" fill="#f2dca9"/><text x="597" y="189" font-size="14">Sample antigen</text><rect x="503" y="219" width="189" height="43" rx="7" fill="#ded1eb"/><text x="597" y="246" font-size="13">Detection antibody system</text><text x="597" y="288" font-size="14">Substrate signal</text><text x="597" y="310" font-size="13">Accessible distinct epitopes</text><rect x="725" y="60" width="215" height="272" rx="11" fill="#fbecd5"/><text x="832" y="88" font-size="18" font-weight="bold">Competitive</text><rect x="738" y="105" width="189" height="67" rx="7" fill="#f2dca9"/><text x="832" y="129" font-size="14">Sample antigen +</text><text x="832" y="149" font-size="14">labelled antigen</text><rect x="738" y="190" width="189" height="58" rx="7" fill="#c6dce9"/><text x="832" y="214" font-size="14">Limited antibody</text><text x="832" y="233" font-size="14">binding sites</text><text x="832" y="275" font-size="13">Bound label readout</text><text x="832" y="310" font-size="13">More sample: less signal</text></g><rect x="24" y="353" width="912" height="110" rx="12" fill="#e5e9f1"/><text x="480" y="383" font-size="19" font-weight="bold">Quality control before patient interpretation</text><text x="480" y="410" font-size="15">Blocking · washing · calibrators · positive and negative controls</text><text x="480" y="436" font-size="15">Check reportable range, hook effect, cross-reactivity and recovery.</text><text x="480" y="486" font-size="13">Conceptual sequence only. Actual timing, reagents and signal depend on the validated assay.</text></g><g stroke="#506c7d" fill="none" stroke-width="2"><path d="M127 160v20m-5-7 5 7 5-7M127 245v15m-5-6 5 6 5-6M362 148v10m-4-5 4 5 4-5M362 205v10m-4-5 4 5 4-5M597 148v10m-4-5 4 5 4-5M597 205v10m-4-5 4 5 4-5M832 172v14m-4-5 4 5 4-5"/></g></svg>