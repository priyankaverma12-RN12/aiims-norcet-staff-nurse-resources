<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-labelledby="t d"><title id="t">Serous and synovial fluid analytical pathways</title><desc id="d">Pleural fluid ratios and pH, peritoneal PMN and chemistry, joint fluid cells and crystals require contextual interpretation.</desc><rect width="900" height="460" rx="18" fill="#f6f8fc"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#17344a"><text x="450" y="34" font-size="23" font-weight="bold">Body fluid laboratory interpretation</text><g stroke="#537890" stroke-width="1.5"><rect x="25" y="58" width="270" height="50" rx="9" fill="#d7e8f7"/><rect x="315" y="58" width="270" height="50" rx="9" fill="#e0eddc"/><rect x="605" y="58" width="270" height="50" rx="9" fill="#f3e6d3"/><rect x="25" y="137" width="270" height="146" rx="9" fill="white"/><rect x="315" y="137" width="270" height="146" rx="9" fill="white"/><rect x="605" y="137" width="270" height="146" rx="9" fill="white"/><rect x="145" y="344" width="610" height="85" rx="10" fill="#e9eef4"/></g><g font-size="18" font-weight="bold"><text x="160" y="90">Pleural fluid</text><text x="450" y="90">Peritoneal fluid</text><text x="740" y="90">Synovial fluid</text></g><g font-size="15"><text x="160" y="164" font-weight="bold">Light criteria</text><text x="160" y="186">Paired serum protein / LDH</text><text x="160" y="208">pH: avoid air and anesthetic</text><text x="160" y="230">Lipids, hematocrit, ADA</text><text x="160" y="254">Classify, then evaluate cause</text><text x="450" y="164" font-weight="bold">Absolute PMN count</text><text x="450" y="186">Cell count × PMN fraction</text><text x="450" y="208">Culture and targeted chemistry</text><text x="450" y="230">Amylase, bilirubin, creatinine</text><text x="450" y="254">Assess possible infection / leak</text><text x="740" y="164" font-weight="bold">Cell count and culture</text><text x="740" y="186">Viscosity and crystals</text><text x="740" y="208">Urate: negative birefringence</text><text x="740" y="230">CPPD: weak positive</text><text x="740" y="254">Crystals do not exclude infection</text><text x="450" y="371" font-weight="bold">Test-specific collection and validated methods</text><text x="450" y="395">Interpret with patient findings, paired specimens where needed,</text><text x="450" y="415">and appropriate microbiological or imaging evidence.</text></g><g fill="none" stroke="#537890" stroke-width="2"><path d="M160 108 V137 M450 108 V137 M740 108 V137 M160 283 V312 H450 V344 M450 283 V344 M740 283 V312 H450"/></g></g></svg>