<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" role="img" aria-labelledby="title desc">
<title id="title">Statistical test selection overview</title><desc id="desc">Select a test by outcome type, group dependence, number of groups and assumptions. Continuous paired scores use a paired t test under suitable assumptions, independent two groups Welch t, three or more groups ANOVA. Categorical paired binary data use McNemar, independent tables use chi-square or Fisher exact.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker></defs>
<rect width="940" height="650" rx="18" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#172554" text-anchor="middle">
<text x="470" y="37" font-size="23" font-weight="bold">Choose a statistical test from the design</text>
<rect x="300" y="62" width="340" height="54" rx="12" fill="#dbeafe" stroke="#2563eb"/><text x="470" y="95" font-size="18" font-weight="bold">What is the outcome type?</text>
<g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M470 116V137H239V155"/><path d="M470 116V137H702V155"/></g>
<rect x="40" y="155" width="398" height="50" rx="10" fill="#e0f2fe" stroke="#0284c7"/><text x="239" y="185" font-size="18" font-weight="bold">Numerical or ordinal outcome</text>
<rect x="503" y="155" width="398" height="50" rx="10" fill="#dcfce7" stroke="#16a34a"/><text x="702" y="185" font-size="18" font-weight="bold">Categorical outcome</text>
<g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M239 205V225H135V244"/><path d="M239 205V225H343V244"/><path d="M702 205V225H598V244"/><path d="M702 205V225H806V244"/></g>
<g font-size="16" font-weight="bold"><rect x="40" y="244" width="190" height="50" rx="9" fill="#fff" stroke="#94a3b8"/><text x="135" y="275">Paired</text><rect x="248" y="244" width="190" height="50" rx="9" fill="#fff" stroke="#94a3b8"/><text x="343" y="275">Independent</text><rect x="503" y="244" width="190" height="50" rx="9" fill="#fff" stroke="#94a3b8"/><text x="598" y="275">Paired binary</text><rect x="711" y="244" width="190" height="50" rx="9" fill="#fff" stroke="#94a3b8"/><text x="806" y="275">Independent</text></g>
<g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M135 294V315"/><path d="M343 294V315"/><path d="M598 294V315"/><path d="M806 294V315"/></g>
<g font-size="14"><rect x="40" y="315" width="190" height="177" rx="10" fill="#eff6ff" stroke="#93c5fd"/><text x="135" y="343" font-weight="bold">Two linked scores</text><text x="135" y="369">Paired t test</text><text x="135" y="390">if differences satisfy</text><text x="135" y="411">assumptions</text><text x="135" y="447">Wilcoxon signed-rank</text><text x="135" y="468">if appropriate</text>
<rect x="248" y="315" width="190" height="177" rx="10" fill="#eff6ff" stroke="#93c5fd"/><text x="343" y="343" font-weight="bold">Two groups</text><text x="343" y="366">Welch t or rank test</text><text x="343" y="401" font-weight="bold">Three or more groups</text><text x="343" y="425">ANOVA or suitable</text><text x="343" y="446">alternative</text><text x="343" y="469">Check assumptions</text>
<rect x="503" y="315" width="190" height="177" rx="10" fill="#f0fdf4" stroke="#86efac"/><text x="598" y="344" font-weight="bold">Two time points</text><text x="598" y="374">McNemar test</text><text x="598" y="399">Focus on pairs that</text><text x="598" y="421">change category</text><text x="598" y="460">Use exact version if</text><text x="598" y="480">discordance is sparse</text>
<rect x="711" y="315" width="190" height="177" rx="10" fill="#f0fdf4" stroke="#86efac"/><text x="806" y="344" font-weight="bold">Contingency table</text><text x="806" y="374">Chi-square when</text><text x="806" y="395">counts are adequate</text><text x="806" y="434">Fisher exact for a</text><text x="806" y="455">sparse 2 × 2 table</text></g>
<rect x="40" y="525" width="861" height="86" rx="12" fill="#fff7ed" stroke="#ea580c"/><text x="470" y="551" font-size="16" font-weight="bold">Before interpreting: check sampling, independence, distribution and model assumptions.</text><text x="470" y="576" font-size="15">Report the effect size and uncertainty. Statistical significance is not clinical importance.</text><text x="470" y="597" font-size="13">Educational overview only. Repeated measures, clustering and covariates may need other models.</text></g></svg>
