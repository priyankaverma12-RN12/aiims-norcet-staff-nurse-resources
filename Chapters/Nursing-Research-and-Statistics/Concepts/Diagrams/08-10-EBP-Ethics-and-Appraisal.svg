<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 645" role="img" aria-labelledby="title desc">
<title id="title">Evidence-based nursing decision and research governance</title><desc id="desc">A cycle from ask, acquire, appraise, apply and assess, surrounded by patient values, clinical expertise and trustworthy evidence. Separate research ethics and reporting safeguards.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker></defs>
<rect width="940" height="645" rx="18" fill="#f8fafc"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#172554">
<text x="470" y="35" font-size="23" font-weight="bold">Evidence-based nursing: a continuing decision cycle</text>
<g font-size="16" font-weight="bold"><rect x="28" y="67" width="168" height="94" rx="12" fill="#dbeafe" stroke="#2563eb"/><text x="112" y="95">1. Ask</text><text x="112" y="120" font-size="14" font-weight="normal">Define the question</text><text x="112" y="141" font-size="14" font-weight="normal">PICO / PICOT</text>
<rect x="207" y="67" width="168" height="94" rx="12" fill="#dbeafe" stroke="#2563eb"/><text x="291" y="95">2. Acquire</text><text x="291" y="120" font-size="14" font-weight="normal">Search trusted</text><text x="291" y="141" font-size="14" font-weight="normal">sources</text>
<rect x="386" y="67" width="168" height="94" rx="12" fill="#dbeafe" stroke="#2563eb"/><text x="470" y="95">3. Appraise</text><text x="470" y="120" font-size="14" font-weight="normal">Bias, certainty,</text><text x="470" y="141" font-size="14" font-weight="normal">applicability</text>
<rect x="565" y="67" width="168" height="94" rx="12" fill="#dbeafe" stroke="#2563eb"/><text x="649" y="95">4. Apply</text><text x="649" y="120" font-size="14" font-weight="normal">Shared choice and</text><text x="649" y="141" font-size="14" font-weight="normal">safe implementation</text>
<rect x="744" y="67" width="168" height="94" rx="12" fill="#dbeafe" stroke="#2563eb"/><text x="828" y="95">5. Assess</text><text x="828" y="120" font-size="14" font-weight="normal">Outcomes, harms,</text><text x="828" y="141" font-size="14" font-weight="normal">sustainability</text></g>
<g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M196 114H207"/><path d="M375 114H386"/><path d="M554 114H565"/><path d="M733 114H744"/><path d="M828 161V193H112V161"/></g>
<text x="470" y="218" font-size="14">Reassess and revise the question as evidence and patient needs change.</text>
<rect x="28" y="242" width="884" height="102" rx="14" fill="#ecfdf5" stroke="#059669"/><text x="470" y="269" font-size="18" font-weight="bold">Integrate all three inputs at the point of care</text>
<g font-size="15"><text x="183" y="307" font-weight="bold">Best available evidence</text><text x="470" y="307" font-weight="bold">Clinical expertise</text><text x="756" y="307" font-weight="bold">Patient values and context</text></g>
<rect x="28" y="370" width="432" height="225" rx="14" fill="#fff7ed" stroke="#ea580c"/><text x="244" y="402" font-size="18" font-weight="bold">If conducting research</text><g font-size="15"><text x="244" y="433">Scientific justification and risk minimization</text><text x="244" y="459">Required independent ethics review</text><text x="244" y="485">Voluntary informed consent or lawful exception</text><text x="244" y="511">Privacy and participant safety</text><text x="244" y="537">Adverse event and injury safeguards</text><text x="244" y="568" font-size="13">Check applicable Indian rules and protocol.</text></g>
<rect x="480" y="370" width="432" height="225" rx="14" fill="#f3e8ff" stroke="#9333ea"/><text x="696" y="402" font-size="18" font-weight="bold">If appraising or reporting research</text><g font-size="15"><text x="696" y="433">Identify design and matching guideline</text><text x="696" y="459">Evaluate missing data and bias</text><text x="696" y="485">Report effect size and uncertainty</text><text x="696" y="511">Declare interests, contributions and limitations</text><text x="696" y="537">Preserve integrity and confidentiality</text><text x="696" y="568" font-size="13">A completed checklist does not prove validity.</text></g></g></svg>
