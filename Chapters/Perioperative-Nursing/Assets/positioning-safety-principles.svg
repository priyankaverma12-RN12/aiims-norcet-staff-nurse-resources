<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" role="img" aria-labelledby="t d"><title id="t">Positioning safety principles</title><desc id="d">Three checkpoints for planning, supported positioning and reassessment.</desc><rect width="680" height="340" fill="#f6fafb"/><g font-family="system-ui,sans-serif" text-anchor="middle"><text x="340" y="38" font-size="23" font-weight="700" fill="#173c48">Positioning safety</text><g fill="#e0f1ee" stroke="#35665d" stroke-width="2"><rect x="20" y="70" width="200" height="210" rx="12"/><rect x="240" y="70" width="200" height="210" rx="12"/><rect x="460" y="70" width="200" height="210" rx="12"/></g><g fill="#173c48" font-size="18" font-weight="700"><text x="120" y="103">PLAN</text><text x="340" y="103">SUPPORT</text><text x="560" y="103">RECHECK</text></g><g fill="#173c48" font-size="14"><text x="120" y="141">Baseline mobility</text><text x="120" y="165">Skin and sensation</text><text x="120" y="189">Procedure needs</text><text x="120" y="213">Suitable equipment</text><text x="340" y="141">Neutral alignment</text><text x="340" y="165">Pressure redistribution</text><text x="340" y="189">No avoidable stretch</text><text x="340" y="213">Secure patient</text><text x="560" y="141">After movement</text><text x="560" y="165">Limb and skin status</text><text x="560" y="189">Lines and airway</text><text x="560" y="213">Document changes</text></g><g stroke="#35665d" stroke-width="2.5" fill="none"><path d="M222 176h16m-6-5 6 5-6 5"/><path d="M442 176h16m-6-5 6 5-6 5"/></g><text x="340" y="310" font-size="14" fill="#31505b">Original concept diagram. Tailor positioning to patient and surgical plan.</text></g></svg>