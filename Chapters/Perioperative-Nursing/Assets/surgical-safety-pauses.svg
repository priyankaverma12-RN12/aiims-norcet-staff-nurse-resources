<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="title desc"><title id="title">Three surgical safety pauses</title><desc id="desc">Sign in before anesthesia, time out before incision, sign out before departure from operating room.</desc><rect width="720" height="330" fill="#f5f9fa"/><g font-family="system-ui,sans-serif" text-anchor="middle"><text x="360" y="36" font-size="24" font-weight="700" fill="#173c48">Surgical safety pauses</text><g fill="#e1f1ef" stroke="#31665d" stroke-width="2"><rect x="20" y="65" width="210" height="225" rx="14"/><rect x="255" y="65" width="210" height="225" rx="14"/><rect x="490" y="65" width="210" height="225" rx="14"/></g><g fill="#173c48" font-size="19" font-weight="700"><text x="125" y="100">SIGN IN</text><text x="360" y="100">TIME OUT</text><text x="595" y="100">SIGN OUT</text></g><g fill="#173c48" font-size="15"><text x="125" y="131">Before anesthesia</text><text x="360" y="131">Before incision</text><text x="595" y="131">Before OR departure</text><text x="125" y="166">Identity and consent</text><text x="125" y="191">Airway and allergies</text><text x="125" y="216">Monitoring readiness</text><text x="125" y="241">Blood loss preparation</text><text x="360" y="166">Shared team pause</text><text x="360" y="191">Critical steps</text><text x="360" y="216">Sterility and imaging</text><text x="360" y="241">Prophylaxis check</text><text x="595" y="166">Actual operation</text><text x="595" y="191">Counts and specimens</text><text x="595" y="216">Equipment concerns</text><text x="595" y="241">Recovery handover</text></g><g stroke="#31665d" stroke-width="3" fill="none"><path d="M232 177h21m-7-6 7 6-7 6"/><path d="M467 177h21m-7-6 7 6-7 6"/></g><text x="360" y="315" font-size="14" fill="#31505b">Original learning diagram, not a substitute for the complete checklist.</text></g></svg>