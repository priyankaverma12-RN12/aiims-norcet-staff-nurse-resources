name: Nursing Study Hub PR regression
on:
  pull_request:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/nursing-study-website-pr.yml'
permissions:
  contents: read
concurrency:
  group: nursing-study-website-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Check scripts and regression units
        run: |
          for script in media titles study-ui build-metrics app progress routine quiz; do
            node --check "website/$script.js" 2>/dev/null || { test "$script" = build-metrics && node --check website/build-metrics.cjs; }
          done
          for test in media titles progress routine quiz; do
            node "website/$test.test.cjs"
          done
          python -m py_compile website/browser-smoke.py
      - name: Install browser dependencies
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Build candidate catalog and metrics
        run: python website/build-site-data.py
      - name: Browser integration at desktop and mobile widths
        run: python website/browser-smoke.py
