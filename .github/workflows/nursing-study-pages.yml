name: Deploy Nursing Study Hub
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'Chapters/**'
      - 'Assets/**'
      - '.github/workflows/nursing-study-pages.yml'
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: nursing-study-pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Check website scripts and parser
        run: |
          node --check website/media.js
          node website/media.test.cjs
          node --check website/titles.js
          node website/titles.test.cjs
          node --check website/study-ui.js
          node --check website/build-metrics.cjs
          node --check website/app.js
          node --check website/progress.js
          node website/progress.test.cjs
          node --check website/routine.js
          node website/routine.test.cjs
          node --check website/quiz.js
          node website/quiz.test.cjs
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Audit source links and build image fallback catalog
        run: python website/build-site-data.py
      - name: Browser integration gate
        run: python website/browser-smoke.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: website
      - name: Confirm Pages artifact is visible to deployment API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 12); do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" --jq '.artifacts[] | select(.name == "github-pages" and .expired == false) | .id' | grep -E '^[0-9]+$'; then
              echo "Pages artifact is visible."
              exit 0
            fi
            echo "Artifact lookup attempt $attempt: not yet visible."
            sleep 5
          done
          echo "::error::Pages artifact is not visible to the workflow token."
          exit 1
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published homepage
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          test -n "$SITE_URL"
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 5 --max-time 30 "$SITE_URL" -o /tmp/nursing-home.html
          grep -F 'Nursing Study Hub' /tmp/nursing-home.html
          echo "Verified published homepage: $SITE_URL"

      - name: Verify published metrics and study UI
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python website/published-smoke.py
