name: Deploy Nursing Study Hub
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/nursing-study-pages.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: nursing-study-pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Check website scripts and parser
        run: |
          node --check website/app.js
          node --check website/quiz.js
          node website/quiz.test.cjs
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Browser integration gate
        run: python website/browser-smoke.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: website
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published homepage
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          test -n "$SITE_URL"
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 5 --max-time 30 "$SITE_URL" -o /tmp/nursing-home.html
          grep -F 'Nursing Study Hub' /tmp/nursing-home.html
          echo "Verified published homepage: $SITE_URL"
