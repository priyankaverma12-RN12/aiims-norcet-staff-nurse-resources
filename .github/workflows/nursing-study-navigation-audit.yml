name: Nursing Study navigation validation
on:
  pull_request:
    branches: [main]
    paths:
      - 'README.md'
      - 'Chapters/**/*.md'
      - 'website/**'
      - '.github/workflows/nursing-study-navigation-audit.yml'
  push:
    branches: [ux/readme-navigation-audit-20261127]
permissions:
  contents: read
jobs:
  navigation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: JavaScript syntax and regression checks
        run: |
          node --check website/media.js
          node website/media.test.cjs
          node --check website/study-ui.js
          node --check website/titles.js
          node website/titles.test.cjs
          node --check website/build-metrics.cjs
          node --check website/app.js
          node --check website/quiz.js
          node website/quiz.test.cjs
          node --check website/progress.js
          node website/progress.test.cjs
          node --check website/routine.js
          node website/routine.test.cjs
      - name: Browser test dependencies
        run: |
          python -m pip install playwright==1.56.0 markdown-it-py==3.0.0
          python -m playwright install --with-deps chromium
      - name: Build source inventory and media cache
        run: python website/build-site-data.py
      - name: Inventory navigation files and candidate fragment targets
        run: python website/navigation-audit.py
      - name: Test checked-out navigation at three widths
        run: python website/navigation-smoke.py
      - name: Full reader and quiz integration gate
        run: python website/browser-smoke.py
      - name: Enforce local navigation quality gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          audit = json.loads(Path('website/navigation-audit.json').read_text(encoding='utf-8'))
          keys = ('missing_local_paths', 'possible_missing_fragments', 'unchecked_fragments', 'malformed_urls')
          failures = {key: len(audit[key]) for key in keys if audit[key]}
          if failures:
              raise SystemExit(f'Navigation audit requires review: {failures}')
          print('Local navigation quality gate passed; external URL relevance is a separate review.')
          PY
      - name: Upload source audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navigation-source-audit
          path: |
            website/source-audit.json
            website/navigation-audit.json
          if-no-files-found: ignore
