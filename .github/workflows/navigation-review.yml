name: Review study navigation
on:
  pull_request:
    branches: [main]
    paths:
      - 'README.md'
      - 'Chapters/**'
      - 'website/**'
      - '.github/workflows/navigation-review.yml'
permissions:
  contents: read
jobs:
  navigation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Verify navigation audit and website parser
        run: |
          python website/audit-navigation.py --self-test
          python website/audit-navigation.py
          node --check website/app.js
          node --check website/media.js
          node website/media.test.cjs
          node --check website/quiz.js
          node website/quiz.test.cjs
      - name: Upload static navigation inventory
        uses: actions/upload-artifact@v4
        with:
          name: navigation-audit
          path: website/navigation-audit.json
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Build checkout catalog
        run: python website/build-site-data.py
      - name: Test desktop and mobile against the pull request sources
        env:
          NURSING_TEST_LOCAL_SOURCE: "1"
        run: python website/browser-smoke.py
      - name: Upload source and visual audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-audit
          path: website/source-audit.json
          if-no-files-found: warn
