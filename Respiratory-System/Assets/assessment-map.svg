<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 265" role="img" aria-labelledby="t"><title id="t">IPPA respiratory assessment sequence</title><rect width="920" height="265" rx="24" fill="#f5f9fc"/><text x="460" y="49" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#19425c">Respiratory assessment • IPPA</text><g font-family="Arial" text-anchor="middle" font-size="19"><rect x="25" y="98" width="195" height="107" rx="16" fill="#cce4ee"/><text x="122" y="140" font-weight="700" fill="#21435a">INSPECTION</text><text x="122" y="174" font-size="15" fill="#355d74">Look</text><rect x="252" y="98" width="195" height="107" rx="16" fill="#cce9dc"/><text x="350" y="140" font-weight="700" fill="#21435a">PALPATION</text><text x="350" y="174" font-size="15" fill="#355d74">Feel</text><rect x="479" y="98" width="195" height="107" rx="16" fill="#f5e2b9"/><text x="576" y="140" font-weight="700" fill="#21435a">PERCUSSION</text><text x="576" y="174" font-size="15" fill="#355d74">Tap</text><rect x="706" y="98" width="190" height="107" rx="16" fill="#e2d5ef"/><text x="801" y="140" font-weight="700" fill="#21435a">AUSCULTATION</text><text x="801" y="174" font-size="15" fill="#355d74">Listen</text></g><g stroke="#5e8095" stroke-width="4" fill="none"><path d="M222 152 H249"/><path d="M239 144 L249 152 L239 160"/><path d="M449 152 H476"/><path d="M466 144 L476 152 L466 160"/><path d="M676 152 H703"/><path d="M693 144 L703 152 L693 160"/></g><text x="460" y="242" text-anchor="middle" font-family="Arial" font-size="14" fill="#44677c">Compare both sides and combine findings; no single sign confirms a diagnosis.</text></svg>
